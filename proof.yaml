project:
    name: cssomnom
    specs:
        - path: specs/stakeholder
          prefix: STK-REQ
          type: stakeholder
        - path: specs/system
          prefix: SYS-REQ
          type: system
          parent_spec: specs/stakeholder
        - path: specs/software
          prefix: SW-REQ
          type: subsystem
          parent_spec: specs/system
        - path: specs/integration
          prefix: INT-REQ
          type: integration
          parent_spec: specs/system
          cross_component: true
    id_format:
        pattern: '{prefix}-{date:YYMMDD}-{rand:4}'
        auto_increment: false
    default_assurance_level: C
    signals:
        defaults: auto
    verification_scope:
        include:
            - src/**
            # Autolink (source_native) filters the annotation walk by this
            # include list. tests/ and docs/ must be in-scope so Verifies:
            # and Documents: are discovered; completeness.production_include
            # stays src/** so orphan/MC/DC still treat only production code.
            - tests/**
            - README.md
            - docs/**
            # Spec-level // MCDC [known-issue] tripwires on failing overlay
            # reproducers. Not production code; code_mcdc exclude_paths drops them.
            - proof/reproducers/**
        completeness:
            production_include:
                - src/**
            production_exclude:
                - '**/*_test.go'
                - '**/testdata/**'
                # Omitted-root scan: these top-level trees contain .ts/.js but are
                # not production. Name each root so verification_scope_complete
                # does not treat them as missing production_include.
                - tests/**
                - dist/**
                - scripts/**
                - fuzz/**
                - proof/**
                # Vendored upstream checkouts (csswg-drafts spec sources,
                # web-platform-tests fixtures, csstree/postcss/lightningcss
                # reference parsers). Reference material for differential
                # conformance and spec lookup — never shipped, never built
                # into dist/, no cssomnom requirements trace INTO these
                # sources; wpt tooling reqs (SYS-REQ-260823-*) verify via
                # expected-red tripwire reproducers under proof/reproducers/,
                # not via annotations in submodule trees.
                - submodules/**
            rationale: production_include is src/** only (the cssomnom library). lint.exclude is src/data/gen/** (generated tables). tests/** is the unit/WPT harness (verification_scope.include for autolink Verifies only). dist/ is tsup build output. scripts/ is codegen, WPT runner, and CI tooling. fuzz/ is the optional css-fuzz corpus driver. proof/ holds overlay reproducers, evidence manifests, and System Truth Layer YAML — not library code. docs/ and README.md are documentation sources, not production. submodules/ holds vendored W3C spec sources and third-party reference parsers used read-only for differential conformance and spec lookup; nothing there is built, shipped, or traced as cssomnom production. Those roots are intentionally out of the MC/DC and orphan production universe.
    checks:
        slow_tests:
            enabled: true
        code_mcdc:
            advisory: false
            min_statement_percent: 100
            min_decision_percent: 100
            min_condition_percent: 100
            languages:
                ts:
                    test_command: node
            targets:
                - id: cssomnom-src
                  enabled: true
                  language: ts
                  runner: node
                  js_glob: 'src/**/*.ts'
                  scope: ./src
                  exclude_paths:
                    - src/data/gen/**
                    - '**/*.test.ts'
                    - proof/reproducers/**
                    - scripts/**
        property_fixtures_exist:
            enabled: true
        flip_fixtures_exist:
            enabled: true
        fixture_staleness_clean:
            enabled: true
        code_signal_obligations_reviewed:
            enabled: true
        code_signal_unbindable:
            enabled: true
        change_evidence_complete:
            enabled: true
        plan_of_record_current:
            enabled: true
        no_authored_change_surface_reviewed:
            enabled: true
        description_grammar_enumeration_complete:
            enabled: true
        spec_lint_mediation_contract_contradicted:
            enabled: true
        mcdc_coverage:
            # EGCP unique-cause SAT (JS-then-JS IME: bad_dictionary=F,
            # duplicate_js_register=T, register_throws=T) is a valid
            # satisfying assignment; FLIP covering uses T,T,T for throws.
            max_stale_witness_lines: 1
        # security_surface_covered left disabled. Hunt (2026-08-21) with
        # --set enabled=true found scripts/wpt/node/run.ts egress (WPT
        # runner), not CSS url() in src/**. scripts/ is tooling, not
        # production_include. DeFi/TVL/signal_fixtures stay off: this
        # repo has none of those artifacts.
        # security_surface_covered:
        #     enabled: false
        # ThreatProfile adoption (Phase 2 full): mirrors
        # proof/surfaces/threat-surface.yaml (schema_version 1). Family names
        # and statuses are copied verbatim from its oracle_families list;
        # each contract_ref anchor points at text that literally greps in
        # docs/threat-surface.md (§7 narrative, or its schema-v1 tunings
        # note), and armed families resolve at manifest load (L4 hard gate).
        # Deferrals are limited to tracked vectors so closure nags remain
        # honest; a deferral whose reason cites an artifact carries the
        # supporting detail line.
        threat_surface:
            profile:
                artifact_kind: library
                languages: [typescript]
                recovery_posture: mixed
                transformation_boundaries:
                    - text -> tokens -> AST -> CSSOM -> cssText
            oracle_families:
                - family: 'WPT recorded-expectation differential (regression oracle)'
                  status: armed
                  contract_ref: 'docs/threat-surface.md#WPT recorded-expectation differential'
                - family: 'Serializer fixpoint/idempotence (metamorphic)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#Serializer fixpoint'
                - family: 'Sync-vs-streaming tokenizer equivalence (differential)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#Sync-vs-streaming tokenizer equivalence'
                - family: 'Posture-consistency triage (same malformed text across ingestion surfaces)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#posture-consistency triage'
                - family: 'Grammar-table-driven rejection completeness (data-driven differential)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#grammar-table-driven rejection completeness'
                - family: 'Shorthand<->longhand expansion equivalence (relational)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#shorthand↔longhand expansion equivalence'
                # This family's name does not occur in docs/threat-surface.md
                # yet; the §7 heading is the resolvable equivalence-contract
                # section until the doc grows the per-family narrative.
                - family: 'Case-folding metamorphic relation (ASCII case-insensitive keywords)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#Armed oracle families & equivalence contracts'
                - family: 'Selector forgiveness boundary (invalid-selector containment)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#selector forgiveness containment'
                - family: 'Token-conservation partition invariant (metamorphic)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#token-conservation partition invariant'
                - family: 'Grammar-table valid-subset sampling (data-driven differential)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#grammar-table valid-subset sampling'
                - family: 'Identifier-escape round-trip relation (relational)'
                  status: proposed
                  contract_ref: 'docs/threat-surface.md#identifier-escape round-trip relation'
            na_reasons: []
            deferrals:
                - vector_id: V-RELATIVE-COLOR-ENGINE
                  reason: blocked on computed-value surface unlock (product decision pending); tracked as vector
                  until: 2026-12-31
                # "P1/P2" reworded to "the P1 and P2 hunt waves": the slash form
                # matches the artifact-citation regex and would demand a detail
                # quote for a citation that names no real artifact.
                - vector_id: V-MEDIA-DEFAULT-ENV-DRIFT
                  reason: P3 environment-posture lane; scheduled behind the P1 and P2 hunt waves
                  until: 2026-10-31
                - vector_id: V-TYPED-OM-COMPUTED-UNITS
                  reason: 'blocked on public-surface unlock: computedStyleMap wired only in src/browser-entry.ts, not exported by src/index.ts (docs/proof-escape-ki-122-123.md appendix A.1)'
                  detail: 'Unlock condition: export computedStyleMap from src/index.ts OR accept fixed-root font-size approximation decision; then 67-row computed-unit mass + 4-step canonicalization legs become implementable headless.'
                  until: 2026-12-31
            campaign_closure: true
            warn_after_days: 0
    known_issue_text_hygiene:
        ste100:
            enabled: true
            restricted_terms:
                - fretish
                - mcdc
                - scrutineer
                - reqproof
    requirements_text_hygiene:
        ste100:
            enabled: true
            hedge_words:
                - may be
                - might
                - possibly
                - it is believed
                - appears to
            restricted_terms:
                - fretish
                - mcdc
                - scrutineer
                - reqproof

    approval:
        agent_autonomous_for:
            all: true
    trace_policy:
        mode: source_native
    commands:
        # This agent PATH has Node 24 + npm, not a pnpm shim (corepack cannot
        # write /usr/bin/pnpm on a read-only FS). npm run forwards to the
        # package.json scripts; tests.node.command is the MC/DC evidence job.
        build: npm run build
        test: npm run test:node
        lint: npm run lint
        tests:
            node:
                language: ts
                # Scoped to tests/, not a quoted glob and not a bare
                # directory. Node 24 `--test tests` treats `tests` as a
                # file (ERR_UNSUPPORTED_DIR_IMPORT). `tests/**/*.test.ts`
                # has glob magic so Node 24 expands it; POSIX sh does not
                # (no globstar). Cwd is the package root: patched proof
                # walks up from target.scope (./src) to package.json.
                command: node --test --test-reporter=dot tests/**/*.test.ts
            # Known-issue tripwire lanes (ki-101..ki-105 evidence profiles).
            # Each binds exactly one expected-red node:test reproducer from
            # proof/reproducers/ via --experimental-strip-types (Node 24 runs
            # TS directly). Declared `expected: fail`: tests_pass verifies
            # they DO fail while the KI is open (a green run would be flagged
            # as a regression — remove the lane or flip the expectation when
            # `proof known-issue capture` observes the fix) and a confirmed-red
            # tripwire never counts toward product-suite red.
            ki-101-tripwire:
                language: ts
                command: node --experimental-strip-types --test proof/reproducers/KI-101-keyframe-parent-links-overlay-260822.ts
                expected: fail
                reason: open known issue tripwire — see KI-101
            ki-102-tripwire:
                language: ts
                command: node --experimental-strip-types --test proof/reproducers/KI-102-counter-style-setter-cssText-overlay-260822.ts
                expected: fail
                reason: open known issue tripwire — see KI-102
            ki-103-tripwire:
                language: ts
                command: node --experimental-strip-types --test proof/reproducers/KI-103-keyframes-append-trailing-garbage-overlay-260822.ts
                expected: fail
                reason: open known issue tripwire — see KI-103
            ki-104-tripwire:
                language: ts
                command: node --experimental-strip-types --test proof/reproducers/KI-104-keyframes-forbidden-declarations-overlay-260822.ts
                expected: fail
                reason: open known issue tripwire — see KI-104
            ki-105-tripwire:
                language: ts
                command: node --experimental-strip-types --test proof/reproducers/KI-105-stylesheet-invalid-display-overlay-260822.ts
                expected: fail
                reason: open known issue tripwire — see KI-105
        # Opt-in DoS fuzz lane (proof audit --fuzz / evidence_type: fuzz).
        # Not on default tests_pass. Runs the annotated cssomnom css-fuzz
        # file, including `deep nesting gate against cssomnom` and
        # `StreamingTokenizer deep-chunk appendChunk+getTokens does not throw`.
        fuzz: node --test --test-reporter=dot tests/css-fuzz-cssomnom.test.ts
    description: Spec-compliant CSS Object Model (CSSOM) and Typed OM parser in pure TypeScript
    catalog:
        version: 1.10.0
    # Overlay catalog class used by SYS-REQ-260821-H3BD / KI-7 (offline parse
    # never fetches). Adopted so catalog_completeness does not treat
    # proof/catalog/domain/no_external_io_on_parse.yaml as an orphan.
    obligation_classes:
        - no_external_io_on_parse
    # Known-issue capture stamps evidence_type: known_issue_tripwire on every
    # proof/evidence/ki-*.yaml manifest it writes, but the token is not
    # shipped-catalog vocabulary (catalog data/evidence_types/ ships only
    # nominal/negative/race/fuzz/lemma/review/acceptance/integration/
    # differential). Declaring it here puts it in project.evidence_types so
    # obligation_profile_evidence_complete credits the ki-10x profiles.
    evidence_types:
        known_issue_tripwire:
            description: Expected-red overlay reproducer run proving a filed known issue still reproduces at HEAD (proof known-issue capture).
    lint:
        exclude:
            # Generated or build output: scripts/codegen writes src/data/gen/*;
            # never hand-annotate generated tables (orphan/trace scanners would
            # otherwise demand Implements: on regenerated files).
            - src/data/gen/**
    # Typed fuzz provenance for denial_of_service_resistant cells annotated
    # on tests/css-fuzz-cssomnom.test.ts. 7521/HHVE/SBJ7/7M07 ride the
    # stylesheet parse deep-nest gate; QV2H rides StreamingTokenizer
    # appendChunk+getTokens on the same nested CSS in pieces.
    evidence_profiles:
        css-fuzz:
            evidence_type: fuzz
            command: fuzz
            result: proof/evidence/css-fuzz.yaml
            required_for:
                - denial_of_service_resistant
            requirements:
                - SYS-REQ-260821-7521
                - SW-REQ-260821-HHVE
                - SYS-REQ-260821-SBJ7
                - SW-REQ-260821-7M07
                - SW-REQ-260821-QV2H
        # ki-101..ki-105 are known-issue tripwire surveillance profiles. They
        # are bound by BUG CLASS via required_for, not by a requirements list:
        # their affected requirements (SYS-REQ-260822-YEQZ/FM19/XEPS/50T6/HARM/
        # 1MB8 and SYS/SW-REQ-260821-8TGB/HNRG) are narrow drafts whose
        # obligation_checklists are still empty at filing time, so an explicit
        # requirements scope would witness nothing (the exact misconfiguration
        # obligation_profile_evidence_complete rejects). With no list, a
        # profile binds every requirement that formalizes its class — today
        # none do, so the tripwires stay pure KI surveillance; the day a
        # requirement carries e.g. intrusive_collection_links_preserved, its
        # cell is discharged by this profile's result manifest. The manifests
        # under proof/evidence/ki-10x.yaml keep naming the affected reqs.
        ki-101:
            evidence_type: known_issue_tripwire
            command: ki-101-tripwire
            result: proof/evidence/ki-101.yaml
            # Keyframe child parentRule/parentStyleSheet structural links not
            # attached and not cleared on deleteRule.
            required_for:
                - intrusive_collection_links_preserved
        ki-102:
            evidence_type: known_issue_tripwire
            command: ki-102-tripwire
            result: proof/evidence/ki-102.yaml
            # Valid CSSCounterStyleRule descriptor setter leaves cssText stale:
            # derived serialization state not recomputed on source mutation.
            required_for:
                - derived_state_consistency
        ki-103:
            evidence_type: known_issue_tripwire
            command: ki-103-tripwire
            result: proof/evidence/ki-103.yaml
            # appendRule accepts trailing non-whitespace garbage: accepts what
            # the CSSOM spec would reject.
            required_for:
                - parser_accepts_only_chain_valid_transactions
        ki-104:
            evidence_type: known_issue_tripwire
            command: ki-104-tripwire
            result: proof/evidence/ki-104.yaml
            # Keyframe parsing retains animation properties and !important
            # values CSS Animations declares invalid: same acceptance contract.
            required_for:
                - parser_accepts_only_chain_valid_transactions
        ki-105:
            evidence_type: known_issue_tripwire
            command: ki-105-tripwire
            result: proof/evidence/ki-105.yaml
            # Stylesheet parse retains declarations with values invalid under
            # the property grammar; setProperty contracts ride the same
            # accept-exactly-the-valid-set family.
            required_for:
                - parser_accepts_only_chain_valid_transactions
    documentation:
        sources:
            - path: docs/
              type: auto
            - path: README.md
              type: auto
            - path: CONTRIBUTING.md
              type: auto
            - path: MAINTENANCE.md
              type: auto
            - path: PLAN.md
              type: auto
        roots:
            - docs/**
            - README.md
            - CONTRIBUTING.md
            - MAINTENANCE.md
            - PLAN.md
        threshold: 80
