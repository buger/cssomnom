schema_version: 1
id: DEFECT-260822-SK9P
title: StreamingTokenizerStream.peek fabricated EOF; remnant high-surrogate+CR reversed
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: streaming_peek_eof_and_remnant
description: |
    css-syntax-3 § 4.3.1 #consume-token emits <EOF-token> only at true end of input.
    StreamingTokenizerStream.peek returned a synthetic EOF when getTokens() was empty
    on an incomplete chunk. css-syntax-3 § 3.3 #input-preprocessing requires CR/FF → LF
    then surrogate → U+FFFD in source order; preprocessChunk appended a trailing high
    surrogate onto a same-call CR remnant (CR then high), so a split high+CR+low pair
    became a valid scalar instead of two U+FFFD around a newline.
    Product fix: peek throws NeedMoreDataError unless tokenizer.closed; remnant prepends
    the high surrogate onto CR so order stays high-then-CR. ArrayTokenStream EOF on an
    empty complete list is unchanged.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: QV2H/SBJ7 named chunked tokens and NeedMoreData; peek-EOF and high-then-CR remnant order were unwitnessed until KI-9.
