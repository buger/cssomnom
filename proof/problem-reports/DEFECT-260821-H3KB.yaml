schema_version: 1
id: DEFECT-260821-H3KB
title: Unbalanced media query (( serialized as (()) instead of not all
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: invalid_mq_not_not_all
description: |
    mediaqueries-4 maps a query that does not match the grammar to not all. MediaParser
    recovered unbalanced (( via css-syntax-3 EOF auto-close as general-enclosed '(())'.
    Product fix: mark unclosed simple-blocks and functions in the parser, and treat any
    query containing an unclosed construct as invalid so serializeMediaQuery emits not all.
    Balanced general-enclosed (example, all,) is unchanged. Re-landed after fe7defa restore.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: W8S1/5283 named not-all serialization; the unbalanced-paren partition was unwitnessed.
