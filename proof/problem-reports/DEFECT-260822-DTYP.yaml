schema_version: 1
id: DEFECT-260822-DTYP
title: ':disabled matched non-form controls (div[disabled], p in fieldset[disabled])'
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: disabled_non_form_control
description: |
    isElementDisabled returned true for any disabled attribute and any descendant of
    fieldset[disabled], so div[disabled] and p inside fieldset[disabled] matched
    :disabled. html#selector-disabled matches actually-disabled elements only
    (html#concept-element-disabled): button/input/select/textarea that are
    concept-fe-disabled, optgroup/option, disabled fieldsets, and form-associated
    custom elements. Product fix gates isElementDisabled on those listed types and
    returns false for div/p/span. :enabled uses the same isDisableableElement set.
    Distinct from KI-10 first-legend exemption on listed controls / nested fieldsets.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: 6D9T/PJ76 named selector matching; actually-disabled type gate was unwitnessed until KI-13.
impact_analysis:
    affected_requirements:
        - SW-REQ-260821-6D9T
        - SYS-REQ-260821-PJ76
    affected_code:
