schema_version: 1
id: DEFECT-260821-KESF
title: CSSStyleValue.parse invalid object-position returned CSSStyleValue instead of TypeError
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: invalid_parse_swallowed
description: |
    css-typed-om-1 parse(property, cssText) must throw TypeError when cssText is not valid
    for the property. POSITION_PROPERTIES short-circuited tryParsePosition failure into a
    generic CSSStyleValue. Product fix: throw TypeError from _parseAll and createValueFromTokens
    when tryParsePosition returns null. Sibling color properties already threw via CSSColorValue.parse.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: 7AKJ/HGFK named the throw; the object-position invalid partition was unwitnessed.
