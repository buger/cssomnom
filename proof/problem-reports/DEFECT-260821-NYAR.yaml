schema_version: 1
id: DEFECT-260821-NYAR
title: toParserRule mapped CSSOM type-0 at-rules to CSSParserRawRule
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: adapter_type_zero_fallback
description: |
    parser-api toParserRule promoted numeric CSSRule.type values that were not 0, 1, or 17
    into CSSParserAtRule. Modern at-rules use type 0 (CSSLayerStatementRule, CSSLayerBlockRule,
    CSSContainerRule, CSSScopeRule, CSSStartingStyleRule, …). parseStylesheetSync('@layer foo;')
    therefore returned CSSParserRawRule. Product fix: extract @-name from cssText for numeric
    CSSOM at-rules including type 0, recurse into cssRules. CSSNestedDeclarations (type 0,
    cssText not starting with @) still falls through.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: WTPD named parseStylesheetSync AST adaptation; the type-0 @layer/@container partition was unwitnessed.
