schema_version: 1
id: DEFECT-260822-NQVB
title: 'setProperty(''all'') mutate-before-validate dropped stored all: var(--x) on failed expand'
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: shorthand_mutate_before_validate
description: |
    CSSStyleDeclaration.setProperty deleted any stored all declaration before expandAll.
    all: var(--x) stores all itself; a later invalid setProperty then emptied cssText.
    Product fix: delete stored all only after expandAll succeeds. Failed expand is a no-op
    (cssom-1 § 6.7.1 #set-a-css-declaration null parse returns; css-cascade-5 § 6.2
    #all-shorthand accepts only CSS-wide keywords). Sibling SHORTHANDS already
    expand-then-return without pre-deleting the shorthand name. env() stored-all is the
    same path (hasVar includes env()). DEFECT-260821-XZAS is stale class-closure
    paperwork from a rolled-back class-fix — kept; this report is the landing closure.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: HNRG/8TGB named the no-op guarantee; the all+var partition was unwitnessed until KI-1.
