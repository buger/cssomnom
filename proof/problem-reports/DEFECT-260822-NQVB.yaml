        notes: |
            Other SHORTHANDS expand then return on failed expand without pre-deleting
            the shorthand name. cssText setter clears the declaration list first (full
            replace), so it is not a mutate-before-validate sibling. expandAll itself
            only returns longhands for CSS-wide keywords / var; no pre-delete there.
