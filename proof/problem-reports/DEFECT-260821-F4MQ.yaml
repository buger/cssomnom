schema_version: 1
id: DEFECT-260821-F4MQ
title: Retracted — CSS.registerProperty after @property IME was a false hole
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: low
    defect_class: duplicate_register_skips_ime
description: |
    Retracted. css-properties-values-api-1 §4.1 throws InvalidModificationError only when the
    name is already in [[registeredPropertySet]] (JS). @property is a separate source; a later
    CSS.registerProperty succeeds and JS wins (§3). This report closed a false hole introduced
    by treating CSS-then-JS as a duplicate JS register. Product origin gating restored.
    Live tracker is withdrawn KI-4; residual L-KI4 parks the overlay-wrong angle.
root_cause:
    missing_requirement: false
    missing_test_partition: false
    missing_mcdc_variable: false
    notes: V5GA/EGCP IME is JS-then-JS. CSS-then-JS is not duplicate_js_register.
impact_analysis:
    affected_requirements:
        - SW-REQ-260821-V5GA
        - SYS-REQ-260821-EGCP
    affected_code:
        - src/PropertyRegistry.ts
        - src/CSSOM.ts
disposition:
    status: not_in_scope
    owner: agent:grok-4.6
    next_action: None. Retracted; residual L-KI4 is the non-issue parking lot.
    review_due: "2026-09-21"
    reviewer: agent:grok-4.6
    reviewed_at: "2026-08-21T20:30:00Z"
    rationale: |
        Not a product defect. Houdini §4.1 IME is JS-slot only. §3 requires CSS.registerProperty
        to win over @property, which is impossible if the first JS register after @property throws.
        This DEFECT hardened the wrong contract and is retracted.
# Retracted false hole: CSS-then-JS is not duplicate_js_register.
# Clearing affects so change_record_lands does not demand a motivation
# citation on V5GA/EGCP for a report that did not land in the spec.
affects: []
hardening:
    strengthened_requirements:
        - SW-REQ-260821-V5GA
        - SYS-REQ-260821-EGCP
    added_obligations:
        - requirement: SW-REQ-260821-V5GA
          obligation_class: error_handling
    regression_tests:
        - "tests/register-property.test.ts:CSS.registerProperty after @property succeeds and JS wins"
        - "tests/register-property.test.ts:later @property of a JS-registered name is ignored"
        - "proof/reproducers/KI-4-register-after-at-property.ts:KI-4 residual: CSS.registerProperty after @property succeeds and JS wins"
    mcdc_witnesses:
        - requirement: SW-REQ-260821-V5GA
          witness: "duplicate_js_register=T, invalid_modification_error=T => TRUE (JS-then-JS only)"
        - requirement: SYS-REQ-260821-EGCP
          witness: "bad_dictionary=F, duplicate_js_register=T, register_throws=T => TRUE (JS-then-JS only)"
