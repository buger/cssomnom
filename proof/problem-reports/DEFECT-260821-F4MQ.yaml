schema_version: 1
id: DEFECT-260821-F4MQ
title: CSS.registerProperty after @property skipped InvalidModificationError
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: duplicate_register_skips_ime
description: |
    css-properties-values-api-1 registerProperty must throw InvalidModificationError when the
    name is already registered, including names introduced by @property. PropertyRegistry.register
    only threw when existing.origin === 'js'. Product fix: JS origin always throws IME if the
    name exists; CSS origin is ignored when the name is already registered (JS wins; earlier CSS wins).
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: V5GA/EGCP named IME on duplicate JS register; the CSS-then-JS partition was unwitnessed.
