schema_version: 1
id: DEFECT-260824-5SWC
title: CSSImportRule.styleSheet exposed no usable associated stylesheet offline (null then non-constructable empty sheet)
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: broken_object_graph_association
    security_relevant: false
description: |
    cssom-1 § 6.4.3 #the-cssimportrule-interface requires CSSImportRule.styleSheet to
    return the associated CSS style sheet object for the import rule; an unloaded
    import legitimately exposes an empty stylesheet (browser pre-load state). This
    library is an offline parser and never fetches @import hrefs (README documented
    deviation, permanent), so the associated object graph had to carry the whole
    contract — and it did not:

      1. README/older HEAD: styleSheet evaluated to null (no associated object at all).
      2. Pre-fix audit HEAD: a lazily-built EMPTY internal sheet was returned, but it
         was created via createInternal with constructed flag false, so
         replace()/replaceSync() threw NotAllowedError ("non-constructed") — a host
         could not supply content offline either. The association was also only half
         public (ownerRule set; parentStyleSheet cached eagerly at first access).

    FIX (user authorized 2026-08-23; fetching stays out of scope forever): src/CSSOM.ts
    builds the associated sheet via the public constructed constructor path, sets
    _ownerRule, syncs the child href, and drops the stale parentStyleSheet cache so
    linkage resolves live through ownerRule (cssom-1 § 6.4.3 associated stylesheet
    notes). styleSheet is now always a real, linked, host-fillable CSSStyleSheet.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: |
        The assurance gap was contract-shaped: committed unit tests asserted
        `styleSheet === null` (the README deviation), which canonized the hole instead of
        catching it. The capability itself (associated stylesheet object per cssom-1) had
        no passing witness anywhere in tests/. Proof's own overlay reproducer WAS the
        catch: proof/reproducers/KI-7-import-stylesheet-null.ts failed continuously on the
        public e2e surface from filing until this fix (exit 1 measured on pre-fix HEAD),
        and the amended reproducers fail on parent code (exit 1 x2) and pass on fixed HEAD
        (exit 0 x2). Tripwire both ways.
