schema_version: 1
id: DEFECT-260822-KF14
title: toParserRule mapped CSSKeyframeRule (type 8) to CSSParserAtRule name unknown
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: adapter_keyframe_type_eight
description: |
    CSS.parseStylesheetSync('@keyframes x { from { color: red } }') adapted the parent
    CSSKeyframesRule (type 7) then mapped each CSSKeyframeRule child (type 8) through the
    numeric at-rule branch. The child has no .name / .media / .cssRules, so the adapter
    emitted {name:"unknown", prelude:[], body:null}. CSSKeyframeRule is a qualified rule
    (keyframe selector + declaration block), not an at-rule. Product fix: type 8 maps to
    CSSParserQualifiedRule via keyText+style (css-animations-1 from ≡ 0%, to ≡ 100%) or
    cssText re-tokenize (css-syntax-3 consume-a-qualified-rule). Distinct from KI-6 type-0
    at-rules.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: WTPD named parseStylesheetSync AST adaptation; the type-8 keyframe-child partition was unwitnessed.
