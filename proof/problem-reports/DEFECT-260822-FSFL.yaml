schema_version: 1
id: DEFECT-260822-FSFL
title: ':disabled treated first-legend descendants as disabled (html concept-fieldset-disabled)'
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: fieldset_first_legend_disabled
description: |
    isElementDisabled walked parentElement and treated an ancestor fieldset's own
    disabled attribute as the descendant's, so #nested-in-legend and #in-legend
    matched :disabled. html#concept-fieldset-disabled / html#concept-fe-disabled
    skip descendants of that fieldset's first legend child. Product fix walks each
    ancestor fieldset independently via isDisabledByAncestorFieldset / isInsideFirstLegend
    and does not recurse the ancestor's own disabled onto first-legend descendants.
    Nested fieldset-in-legend with no own disabled is not :disabled; own disabled
    still is; non-first legend and outside-legend controls still are.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: 6D9T/PJ76 named selector matching; first-legend fieldset walk was unwitnessed until KI-10.
impact_analysis:
    affected_requirements:
        - SW-REQ-260821-6D9T
        - SYS-REQ-260821-PJ76
    affected_code:
