schema_version: 1
id: DEFECT-260822-3T1G
title: handleImportRule drops css-syntax url-token so @import url(foo.css) href is empty
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: import_url_token_href_dropped
description: |
    css-syntax-3 § 4.3.6 #consume-url-token emits a <url-token> for unquoted url(foo.css).
    handleImportRule copied string tokens and url() functions but not first.type === 'url',
    so href was "" and leftover <url-token> serialized as mediaText (cssText url("") url("foo.css")).
    Product fix copies url-token .value into href. Does not fetch; CSSImportRule.styleSheet
    remains the never-fetched placeholder (KI-7 stays open).
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: 5W6X named @import href; the unquoted <url-token> partition was unwitnessed until KI-8.
impact_analysis:
    affected_requirements:
        - SW-REQ-260821-5W6X
        - SYS-REQ-260821-7521
    affected_code:
        - src/parser.ts
disposition:
