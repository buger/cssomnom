    sibling_sweep:
        scope:
            - src/parser.ts
        checked_at: "2026-08-22"
        reviewer: agent:grok-4.6
        result: clean
        notes: |
            isSupportedAtRule already folded ASCII case. getAtRuleHandler / options.atRules /
            handleMarginRule were the remaining case-sensitive sites. Object.hasOwn covers
            inherited keys. Distinct from KI-6 (type-0 parser-api adapter after a typed rule exists).
    regression_tests:
        - tests/ki-2-8-12-class-fix.test.ts
        - proof/reproducers/KI-12-atrule-dispatch.ts
    mcdc_witnesses:
