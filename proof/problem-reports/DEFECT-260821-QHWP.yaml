schema_version: 1
id: DEFECT-260821-QHWP
title: CSSStyleSheet.replace parsed in queueMicrotask instead of Promise.resolve after replaceSync
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: documented_sync_parse_deferred
description: |
    README documents a Node.js deviation: replace() runs replaceSync then Promise.resolve(this).
    HEAD scheduled tokenize + consumeListOfRules in queueMicrotask so cssRules was empty on return.
    Product fix: replace() calls replaceSync on this turn and returns Promise.resolve(this).
    replaceSync was already synchronous. Non-constructed sheets still reject without parsing.
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: PAKB/GR67 named the documented deviation; the sync-parse SAT row was unwitnessed while queueMicrotask remained.
