schema_version: 1
id: DEFECT-260822-PGRM
title: tryParsePosition accepted 3-value perspective-origin / 4-value transform-origin and dropped center left
introduced_in: inception
source:
    type: audit_finding
classification:
    surface: runtime_code
    severity: medium
    defect_class: position_grammar_three_value
description: |
    css-values-4 § 10.1 #position: generic <position> is 1-/2-/4-value, not 3-value
    (csswg-drafts#2140). css-transforms-2 #perspective-origin-property uses <position>,
    so left 10px top is invalid. css-transforms-1 #transform-origin-property is not
    4-value <position>, so left 10px top 20px is invalid. css-values-4 § 2.2 #comb-all
    puts center in both x and y groups, so center left is a valid CSSPositionValue.
    Product fix: grammar-first matchesPositionPropertyGrammar (isValidCssPosition,
    isValidTransformOrigin, isKeywordAndPair) then reify. 3-value remains valid only
    for css-backgrounds-3 #background-position. Distinct from KI-3 (invalid ident swallow).
root_cause:
    missing_requirement: false
    missing_test_partition: true
    missing_mcdc_variable: false
    notes: 7AKJ/HGFK named the throw; 3-value / && / transform-origin 4-value partitions were unwitnessed.
