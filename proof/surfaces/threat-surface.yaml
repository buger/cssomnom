# Threat Surface — machine core
#
# SCHEMA v0 (dogfood). Filled by onboarding threat-surface analysis.
# Rules:
#   - Every claim here MUST be grounded in a repo artifact you read (cite path in `grounding`).
#   - `oracle_families` entries with relational checks REQUIRE `equivalence_contract`
#     to be non-empty before they may arm (contract: describe the exact comparison
#     that makes findings trustworthy, incl. known false-positive classes).
#   - Non-applicable ladder questions go under `degenerations` with `na_reason`.
#     Silence is a defect.
#   - Do not invent surfaces: cite code paths/docs as grounding.
#
# Analysis date: 2026-08-25. Probes cited as pN are scripts under /tmp/opencode/probe/
# run against src/index.ts via /opt/node24/bin/node v24.11.0 (results quoted in docs/threat-surface.md §10).
#
# SCHEMA v1 TUNINGS (applied 2026-08-25 during ground-truth reconciliation of the
# blind record; the blind content itself is preserved verbatim):
#   - schema_version 0 -> 1.
#   - New top-level section `resource_bounds:` — home for ladder Q9 answers
#     (measured bounds from probes; each entry links a vector and/or known issue).
#   - Entry types may carry an optional `grounding:` field — supported per entry
#     TYPE, not universal — formalizing what the blind run improvised ad hoc
#     under v0.
#   - `grammar_tables` rows now REQUIRE two derived-family declarations:
#     `drives_valid_sampling` + `drives_rejection_completeness`, valued with an
#     `oracle_families` family name or 'none-yet'. This supersedes the v0 boolean
#     capability flags (`drives_valid_sampling: yes/no`, and `drives_invalid_mutation`
#     is folded into `drives_rejection_completeness`).
#   - `vectors_proposed` entries carry {id, reconciliation}; reconciliation is one of:
#     {covered_by_vector[,ki]} | {covered_by_ki} | {new_vector} | {test_lane}.
#     Proposals that are test-lane concerns rather than attack vectors moved to
#     `test_lanes:`.
#   - `oracle_families` entries added AFTER the initial fill REQUIRE a provenance
#     `source:` tag (e.g. 'schema-v1-tuning') so they stay distinguishable from
#     the original blind-day record.

schema_version: 1
profile:
  languages: [typescript]           # pure TS, zero runtime deps (package.json devDependencies only)
  artifact_kind: library            # npm package `cssomnom`, ESM, exports "." and "./ts" (package.json:34-44)
  primary_guarantees:
    - "Spec-compliant CSS Syntax 3 / CSSOM-1 / Nesting / Selectors 4 / MQ4 / Typed OM parse without a browser (README Features)"
    - "Zero-dependency, offline/hermetic: parse performs no network or filesystem I/O (README deviations; proof/catalog/domain/no_external_io_on_parse.yaml)"
    - "Standard W3C CSSOM object model, not a custom AST (README Why)"
    - "Deterministic declarative cascade via getCascadedStyle; deliberately NO getComputedStyle (README Intentional Non-Goals)"
    - "Recover-don't-crash stylesheet ingest per css-syntax-3 error recovery; throwing APIs documented below"

entry_surfaces:
  - name: "parse(css) / Parser.parseStyleSheetText / replaceSync / CSS.parseStylesheetSync"
    kind: parse-transform
    invalid_input_posture: recover-drop   # keeps valid prefix rules, drops bad ones; collects ParseError[]
    grounding: "src/parser.ts:2085-2087; probe p1 (garbage '@unknown-rule x{; color:red} }}} <<<>>>' -> 2 rules kept, no throw); src/parser.ts:50,136 errors[]"
  - name: "tokenize(text) / StreamingTokenizer.appendChunk-close"
    kind: parse-transform
    invalid_input_posture: recover-drop   # css-syntax-3 § 3.3 preprocessing (NUL->FFFD, lone surrogates->FFFD); tokenizer is total, never throws on content
    grounding: "src/tokenizer.ts:41-52; src/streaming-tokenizer.ts:118-144; probe p7 (tokenize survives 50k-deep nesting, 250007 tokens)"
  - name: "CSSStyleSheet.insertRule(rule, index)"
    kind: mutation
    invalid_input_posture: throw          # SyntaxError on unparseable rule; IndexSizeError on bad index; HierarchyRequestError ordering; NotAllowedError/SecurityError state guards
    grounding: "src/CSSOM.ts:405-461; probe p2/B1 insertRule('garbage') -> SyntaxError"
  - name: "CSSStyleDeclaration.setProperty / cssText setter"
    kind: mutation
    invalid_input_posture: ignore         # invalid values/priorities/dashed-idents return without mutating; NoModificationAllowedError only when readonly
    grounding: "src/CSSStyleDeclaration.ts:470-550; probe p2/C1,C2 (invalid custom prop dropped silently)"
    note: "Validation is LENIENT: setProperty('color','totally not a color') is KEPT (probe p2/C1) — generic-token checks reject only bad-string/bad-url/unitless-length/negative-dimension classes (typed-om/values/style-value-parser.ts ParseHooks.validatePropertyValue)"
  - name: "CSSStyleRule.selectorText setter"
    kind: mutation
    invalid_input_posture: ignore         # invalid selector leaves selectorText unchanged, no throw
    grounding: "probe p2/D1 (selectorText='>>>bad<<<' stays 'b')"
  - name: "matches(el, sel) / querySelectorAll(root, sel) / querySelector"
    kind: query
    invalid_input_posture: recover-drop   # forgiving: invalid selectors parse into {type:'invalid-selector'} items that are skipped, or whole list empties; NEVER throws (DOM matches() would throw SyntaxError)
    grounding: "src/matcher.ts:87-128 (catch -> empty selector-list); probe p3/E1-E3 (matches('div:')=false, qSA('::??')=[])"
  - name: "CSSNumericValue.parse / CSSStyleValue.parse / parseAll"
    kind: parse-transform
    invalid_input_posture: throw          # DOMException SyntaxError (numeric), TypeError (style-value); argument-count TypeErrors
    grounding: "src/typed-om/numeric/numeric-methods.ts:283-330; src/typed-om/values/style-value-parser.ts:419-427; probe p4/G2,G3,G5,G6"
  - name: "Parser API CSS.parseComponentValue(Sync) / parseRule(Sync)"
    kind: parse-transform
    invalid_input_posture: mixed          # null on failure (empty), but SyntaxError DOMException when >1 component value remains; parseRule returns null on failure
    grounding: "src/parser-api.ts:532-545,595-613"
  - name: "MediaList / MediaParser.parse"
    kind: parse-transform
    invalid_input_posture: recover-drop   # invalid media queries evaluate/serialize as 'not all' per mediaqueries-4 #error-handling
    grounding: "docs/css-domain-models.md table invalid_media_serializes_as_not_all; docs/proof-onboard-research.md untrusted-input policy row"
  - name: "escape(ident) (CSS.escape)"
    kind: parse-transform
    invalid_input_posture: throw-on-missing-arg-only  # TypeError with 0 args; otherwise coerces any value via String()
    grounding: "src/css-escape.ts:12-14; probe p3/F2,F3 (escape(null)->'null' escaped)"

transformation_boundaries:
  - boundary: "text --preprocess/tokenize--> Token[]"
    has_serializer_inverse: true          # serialize(Token[]) reconstructs text; not identity (canonicalizing)
    notes: "Preprocessing is duplicated in two implementations (tokenizer.ts:41-52 sync vs streaming-tokenizer.ts:118-144 chunked with remnant buffering for CR/high-surrogate) — divergence candidate."
    grounding: "src/tokenizer.ts, src/streaming-tokenizer.ts, src/serializer.ts:151-171"
  - boundary: "Token[] --Parser--> ComponentValue/Rule AST"
    has_serializer_inverse: true
    notes: "Recursive-descent; serializer emits /**/ separators where re-tokenization would merge tokens (cssom-1 § 2.1 requires this). Round-trip is a fixpoint relation, not equality: first pass canonicalizes (fn names lowercased, counter(...,'decimal') trimmed, url() whitespace trimmed, attr() fallback stripped)."
    grounding: "src/serializer.ts:151-259 (canonicalization sites); probe p5 (url( \"f i.png\" ) normalized, then idempotent)"
  - boundary: "AST --> CSSOM rule objects (--cssText--> text)"
    has_serializer_inverse: true
    notes: "serializeDeclarations does shorthand contraction; cssText re-parse should be stable. Asymmetry risk: shorthand expand on ingest vs longhand storage."
    grounding: "src/serializer.ts:970+; src/shorthands.ts; src/CSSOM.ts rule .cssText getters"
  - boundary: "selector text --> SelectorList AST --> serialized selector text"
    has_serializer_inverse: true
    notes: "Invalid selectors become invalid-selector AST nodes (forgiving) — serialization of such nodes must round-trip or the swallow is observable."
    grounding: "src/SelectorParser.ts; src/serializer.ts:1118+; src/matcher.ts:87-96"
  - boundary: "media query list text --> MediaQuery[] --> mediaText"
    has_serializer_inverse: true
    notes: "Invalid queries serialize as 'not all' (mediaqueries-4 #error-handling); parse(serialize(parse(x))) should equal serialize(parse(x))."
    grounding: "src/MediaParser.ts:824; docs/css-domain-models.md"
  - boundary: "value text --> Typed OM values --> toString()"
    has_serializer_inverse: true
    notes: "Math trees intentionally preserved structurally (trig not flattened) though compatible sums may canonicalize units (calc(1in+96px)->192px) — toString() is canonicalizing."
    grounding: "README Houdini Deviations (Math Simplification); probe README example"

stateful_objects:
  - object: "PropertyRegistry global registry Map (module singleton)"
    lifecycle_invariants:
      - "registerProperty(name) twice without unregister hits 'existing' branch (error/reject path)"
      - "clear() resets process-global state; sequences leak across unrelated parses/tests"
      - "@property rules parsed from any stylesheet mutate the same global registry"
    grounding: "src/PropertyRegistry.ts:298,353-377 (registry Map, register/unregister/get/clear)"
  - object: "CSSStyleSheet state flags (constructedFlag, disallowModificationFlag, originCleanFlag)"
    lifecycle_invariants:
      - "replace()/replaceSync() only on constructed sheets (NotAllowedError otherwise)"
      - "origin-clean false blocks insertRule/deleteRule/toCssText? (SecurityError)"
      - "mutation allowed only pre-disallow; set of legal transitions is sequence-sensitive"
    grounding: "src/CSSOM.ts:295-315 (constructor), 344-367 (replace guards), 406-411 (insertRule guards)"
  - object: "CSSStyleDeclaration (_declarations array + _declMap + _onChange invalidation hook)"
    lifecycle_invariants:
      - "array and Map views must agree after set/remove/shorthand-expansion fan-out"
      - "shorthand set expands to longhands recursively via setProperty(notify=false); 'all'+var drop ordering was a past bug (in-code comment)"
      - "_onChange drives downstream caches; wrong notify flag desyncs dependent state"
    grounding: "src/CSSStyleDeclaration.ts:514-538 (expansion + 'Drop a stored all...' regression comment), 552-559"
  - object: "StreamingTokenizer (codePoints buffer, remnant, pos, tokens queue, isEOF)"
    lifecycle_invariants:
      - "getTokens() DRAINS queue and truncates consumed buffer (pos reset) — interleavings of appendChunk/getTokens change indexing/originalText bases"
      - "close() must precede treating EOF as final; appendChunk after close undefined-behavior candidate"
      - "remnant holds trailing CR / high surrogate across chunk boundary — split-point sensitivity"
    grounding: "src/streaming-tokenizer.ts:63-113,118-144"
  - object: "ParseHooks injection registry (import-time globals)"
    lifecycle_invariants:
      - "hooks assigned once at bottom of parser.ts; consumers (CSSOM/typed-om) fail loudly if parser never imported — import-order sensitivity"
    grounding: "src/parser.ts:2068-2081; AGENTS.md Circular Dependency Management"

environment_dependent_outputs:
  - output: "MediaParser.evaluate(query, env?) booleans"
    missing_context: "viewport width/height/aspect, device resolution, scripting/supports state, environment blending; library fabricates defaults (resolution:96, environmentBlending:'opaque', ...)"
    ruling: implement            # keep, but document default-env matrix; conformance claims only meaningful per-env
    grounding: "src/MediaParser.ts:91-104,788-816; docs/css-domain-models.md Resolution dpi section"
  - output: "new CSSStyleSheet({baseURL}) resolution"
    missing_context: "document baseURI; constructor SNIFFS globalThis.document/globalThis.location when present (CSSOM.ts:305-306) — same input yields different href depending on host globals"
    ruling: implement            # pin resolution order in a test; document sniffing
    grounding: "src/CSSOM.ts:303-313"
  - output: "var()/env() substitution results"
    missing_context: "host-supplied env() map (Parser.resolveVariables(style, property, envMap?)) and registered-property initial values"
    ruling: defer                # env map is caller-provided by design; document determinism given fixed map
    grounding: "README Parser.resolveVariables signature; docs/proof-onboard-research.md components table"
  - output: "getCascadedStyle(element, rules) outcomes"
    missing_context: "element tree/attributes come from host mock (linkedom or duck-typed); :hover/:visited-style dynamics refused by design"
    ruling: refuse               # README non-goal: no computed style; cascade only over supplied mock
    grounding: "README Intentional Non-Goals; src/cascade/index.ts:161"

grammar_tables:
  # v1: `drives_valid_sampling` / `drives_rejection_completeness` now declare
  # DERIVED FAMILIES (oracle_families names or 'none-yet'), superseding the v0
  # yes/no capability flags. `drives_invalid_mutation` from v0 folds into
  # `drives_rejection_completeness` (mutation testing IS the rejection probe).
  - table: "src/data/gen/properties.ts + standard-syntax.ts (property value syntax strings)"
    drives_valid_sampling: "Grammar-table valid-subset sampling (data-driven differential)"       # syntax strings like '<length>|auto' enumerate/generate valid values
    drives_rejection_completeness: "Grammar-table-driven rejection completeness (data-driven differential)"     # mutate valid samples (unit swaps, sign flips, arity changes) and assert rejection at each ingestion posture
    grounding: "src/data/gen/standard-syntax.ts (833 lines, @generated header); scripts/codegen/generate_properties.ts, generate_standard_syntax.ts; PropertyRegistry.matchesSyntax consumes these (src/PropertyRegistry.ts:167)"
  - table: "src/data/gen/shorthands.ts + LogicalMapping.ts"
    drives_valid_sampling: "Grammar-table valid-subset sampling (data-driven differential)"       # via expanded longhands; var()/env() store-as-is excluded by family contract
    drives_rejection_completeness: "Grammar-table-driven rejection completeness (data-driven differential)"     # shorthands route through SHORTHANDS.expand, not per-property syntax (family known-FP class)
    grounding: "src/data/gen/ dir listing; scripts/codegen/generate_shorthands.ts; SHORTHANDS use in CSSStyleDeclaration.ts:514"
  - table: "src/data/gen/units.ts (unit->base conversion), math-functions.ts, colors.ts, media-features.ts, selectors.ts"
    drives_valid_sampling: "Grammar-table valid-subset sampling (data-driven differential)"       # units/colors are the leaf generators inside valid value synthesis
    drives_rejection_completeness: "Grammar-table-driven rejection completeness (data-driven differential)"     # unit-swap mutants are drawn from this table
    grounding: "src/data/gen listing; scripts/codegen/generate_all.ts master script; unitToBase referenced in numeric-methods.ts:307"
  - table: "domain tables in docs/css-domain-models.md (at_rule_dispatch mutexes, resolution_dpi range, position_arity_reification)"
    drives_valid_sampling: none-yet                  # no generator consumes these yet; candidate edge-cell corpus for both families
    drives_rejection_completeness: none-yet
    grounding: "docs/css-domain-models.md (tables authored in 5f73ceb/b7c76d3)"
  - table: "css-syntax-3 token grammar implemented in AbstractTokenizer.ts"
    drives_valid_sampling: none-yet                  # token-level grammar feeds the tokenizer-equivalence/token-conservation families, not the property-syntax families below
    drives_rejection_completeness: none-yet          # bad-string/bad-url variant handling is probed by posture-triage + sync/stream families instead
    grounding: "src/AbstractTokenizer.ts; submodules/csswg-drafts/css-syntax-3/Overview.bs § 4"

