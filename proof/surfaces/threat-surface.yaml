oracle_families:
  - family: "WPT recorded-expectation differential (regression oracle)"
    status: armed                    # harness + fixtures + verify gate already execute continuously
    applies_to: [parse-transform, query, mutation]
    equivalence_contract:
      normalized_comparison: "subtest-level pass/fail equality against tests/fixtures/wpt/*.json and passing-set baseline; scalar compare of counts (never deep-compare cyclic CSSOM nodes — AGENTS.md DOM assertion rule)"
      known_fp_classes:
        - "browser-only subtests cataloged in tests/fixtures/wpt-browser-only-manifest.json must be excluded"
        - "intentional deviations (README Architecture §1-2) make some WPT failures authorized, e.g. CSSImportRule.styleSheet null-vs-empty"
        - "upstream WPT churn after submodule upgrade changes expectations without code change"
      open_questions: ["baseline regeneration cadence vs submodule upgrades"]
    priority: P0
    grounding: "package.json wpt:* scripts; tests/fixtures/*; AGENTS.md Spec Compliance section"
  - family: "Serializer fixpoint/idempotence (metamorphic)"
    status: proposed
    applies_to: [parse-transform]
    equivalence_contract:
      normalized_comparison: "let s0=serialize(tokenize(x) minus EOF); s1=serialize(tokenize(s0)); assert s1==s0 (fixpoint after <=1 application). NOT assert s0==x — first pass canonicalizes by design (serializer.ts:187-252)."
      known_fp_classes:
        - "intentional canonicalization (counter(,'decimal') trim, url whitespace trim, attr fallback strip, fn-name lowercasing) makes pass-1 differ — excluded by construction"
        - "/**/ separator insertion near token-merging boundaries is required by cssom-1 § 2.1 and must not be flagged"
        - "preserveCase=true invocations follow a different contract; fix comparison on default path"
      open_questions: ["does any canonical output RE-PARSE to a different AST (non-fixpoint)? that is the bug signal", "interaction with propertyName-aware serializeFontFamily dispatch (serializer.ts:152-154)"]
    priority: P1
    grounding: "probe p5 (idempotent on 3 samples incl. url canonicalization); src/serializer.ts:151-259"
  - family: "Sync-vs-streaming tokenizer equivalence (differential)"
    status: proposed
    applies_to: [parse-transform]
    equivalence_contract:
      normalized_comparison: "for any string x and EVERY split of x into chunks c1..cn: tokens(StreamingTokenizer over chunks + close()) == tokenize(x) elementwise on (type,value); originalText concatenation == x-preprocessed"
      known_fp_classes:
        - "startIndex/endIndex differ by design across chunkings until getTokens() drain semantics accounted — compare (type,value) and concatenated originalText only"
        - "EOF sentinel token appears once in both — exclude from elementwise diff tail"
      open_questions: ["remnant buffering covers CR and lone high surrogate (streaming-tokenizer.ts:122-134); is a trailing '\\r' followed by high-surrogate split across THREE chunks handled?", "appendChunk after close()"]
    priority: P1
    grounding: "two independent preprocess implementations: src/tokenizer.ts:41-52 vs src/streaming-tokenizer.ts:118-144; NeedMoreDataError protocol src/streaming-tokenizer.ts:146-167"
  - family: "Posture-consistency triage (same malformed text across ingestion surfaces)"
    status: proposed
    applies_to: [parse-transform, mutation]
    equivalence_contract:
      normalized_comparison: "for corpus item t: classify outcome at each surface {stylesheet-ingest: recovered/dropped, insertRule: threw SyntaxError?, setProperty: ignored?, parseRule API: null?}; assert mapping matches the declared posture table above; any UNCAUGHT exception type (RangeError, TypeError from internals) is a finding regardless of surface"
      known_fp_classes:
        - "context-sensitivity is legitimate: a declaration body is valid for setProperty but not for insertRule; compare only inputs valid-at-that-layer per css-syntax-3 consume-algorithm entry points"
        - "readonly/state-guard exceptions (NoModificationAllowedError, NotAllowedError) are posture, not malformation"
      open_questions: ["exact set of inputs where stylesheet-ingest recovers but insertRule throws beyond genuine rule-boundary failures"]
    priority: P1
    grounding: "probes p1,p2,p4 (three distinct postures demonstrated); src/CSSOM.ts:422-426 vs src/CSSStyleDeclaration.ts:495-512"
  - family: "Grammar-table-driven rejection completeness (data-driven differential)"
    status: proposed
    applies_to: [mutation, parse-transform]
    equivalence_contract:
      normalized_comparison: "for each property p with syntax string S in data/gen/standard-syntax.ts: generate valid values V (from S) and mutations M (V with single-token edits); assert validatePropertyValue/setProperty accepts all V and rejects mutations violating S — EXCEPT whitelisted leniency classes (var()/env()/calc()-containing, CSS-wide keywords) which bypass validation by code path (style-value-parser.ts ParseHooks.validatePropertyValue early-returns)"
      known_fp_classes:
        - "shorthand properties route through SHORTHANDS.expand not per-property syntax — exclude shorthands or use their expanded longhands"
        - "custom properties '--*' accept almost anything by design (css-variables-1)"
        - "syntax-table itself may be stale vs mdn-data/@webref — regenerate via pnpm codegen first"
      open_questions: ["is matchesSyntax (PropertyRegistry.ts:167) equivalent to validatePropertyValue's heuristics? divergence = finding"]
    priority: P1
    grounding: "src/data/gen/standard-syntax.ts; probe p2/C1 (leniency: 'totally not a color' accepted for color)"
  - family: "Shorthand<->longhand expansion equivalence (relational)"
    status: proposed
    applies_to: [mutation]
    equivalence_contract:
      normalized_comparison: "setProperty(shorthand, v) then reading each longhand == directly setting each longhand to expand(v) results, compared as serialized longhand values; also removeProperty(shorthand) clears exactly its longhands"
      known_fp_classes:
        - "values containing var()/env() intentionally skip eager expansion (CSSStyleDeclaration.ts:517-545) — store-as-is is correct, not a mismatch"
        - "'all' shorthand special-case drop ordering (line 526-529 regression comment)"
        - "case-insensitive property names; compare lowercased"
      open_questions: ["logical-property aliasing via LogicalMapping.ts double-writes physical+logical keys?"]
    priority: P2
    grounding: "src/CSSStyleDeclaration.ts:514-545; src/shorthands.ts; src/data/gen/LogicalMapping.ts"
  - family: "Case-folding metamorphic relation (ASCII case-insensitive keywords)"
    status: proposed
    applies_to: [query, parse-transform]
    equivalence_contract:
      normalized_comparison: "for x and case-permuted x' (at-rules, type selectors, keyword values, media features): match results identical AND cascaded getPropertyValue identical; serialized canonical form identical"
      known_fp_classes:
        - "DO NOT permute: custom idents (--*, animation-name, @layer names, counter-style names, font-family custom names) are case-SENSITIVE per spec — restrict permutation mask to keyword positions only"
        - "attribute values and string tokens must never be permuted"
      open_questions: ["which SelectorParser positions preserve author case in serialization (attr names vs values)"]
    priority: P2
    grounding: "docs/css-domain-models.md at-rule dispatch (ASCII-case fold css-values-4 § 4.1); src/serializer.ts:189 (fn name lowercasing)"
