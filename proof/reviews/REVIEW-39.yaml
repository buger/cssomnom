comment: 'FRETish css_text_supplied & consume_token_loop_runs & (uses_replacement_character | uses_escaped_code_point | sixth_digit_stops_hex) => token_list_returned maps to Tokenizer.tokenize looping consumeToken until EOF. consumeEscapedCodePoint stops hex at the css-syntax-3 #consume-escaped-code-point cap; a max-length hex escape then a following letter stops hex then emits the letter. NUL/surrogate/out-of-range scalars return the replacement character. consumeUnicodeRangeToken uses the same hex cap (css-syntax-3 #consume-unicode-range-token). Mutex escaped_code_point_result: replacement vs scalar, never both. tokenize always returns the token list including EOF. escaped_hex_digits bound lives on parent YQQZ, not a 7R6Z when conjunct. Idle tokenizeCalls=0 is consume_token_loop_runs=F; SAT tokenize of an escaped ident, an over-length hex escape, or a unicode-range leftover letter is consume=T.'
