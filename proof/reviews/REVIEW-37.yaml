comment: 'FRETish matches_disabled | matches_enabled => !empty_match maps to matcher :disabled/:enabled calling isElementDisabled. html#selector-disabled / html#concept-element-disabled match actually-disabled form controls, fieldset, optgroup, option — a plain div[disabled] does not match, so the trigger is F and empty_match may stay T. Mutex disabled_enabled_exclusive: HTML never matches both on one element. A true matches() for either pseudo is a non-empty match.'
