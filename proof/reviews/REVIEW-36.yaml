comment: 'FRETish parse_style_value & position_reifies => !parse_throws maps to parseThenReifyPosition: matchesPositionPropertyGrammar then tryParsePosition. css-values-4 § 8.3 #position generic and offset forms (leftover #math calc() is not <position>). css-typed-om-1 #parse-a-cssstylevalue throws TypeError when cssText fails the property grammar. Current css-typed-om-1 dropped CSSPositionValue from this level (no #positionvalue-objects; #the-stylepropertymap is StylePropertyMap); this implementation still reifies a matching two-dimensional <position> as CSSPositionValue without throwing. Background-only offset object-position/perspective-origin and transform-origin z-length (css-transforms-1 #transform-origin-property) do not reify and throw TypeError, so position_reifies is F and the trigger does not fire. Mutex invalid_input_vs_position_reify: invalid_typed_input cannot be T while a CSSPositionValue is produced. Position arity stays on the typed_om range and table position_arity_reification, not this when.'
