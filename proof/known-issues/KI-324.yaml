id: KI-324
title: expandBox runs no token grammar for border-width, border-style, and border-color
description: 'isLengthBox matches only margin, padding, top, and scroll prefixes. border-width, border-style, and border-color therefore skip the side-value gate entirely and accept any one to four tokens. css-backgrounds-3 defines border-width as line-width, border-style as line-style, and border-color as color. ''border-width: auto'', ''border-color: 1px'', ''border-style: foo'', and ''border-color: logical junk junk'' expand junk into the four longhands instead of rejecting.'
