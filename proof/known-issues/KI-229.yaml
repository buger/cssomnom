id: KI-229
title: isStringToken accepts bad-string tokens in attribute values and :lang arguments
description: isStringToken returns true for type 'bad-string' (src/SelectorParser.ts:47-48). css-syntax-3 emits a <bad-string-token> for an unterminated string, and selectors-4 grammars require a <string-token>. '[attr="unclosed]' and ':lang("en)' therefore parse instead of failing.
