id: KI-140
title: Boolean min-/max- features stay general-enclosed instead of invalidating the query
description: 'mediaqueries-4 #mq-min-max states that evaluating a min- or max-prefixed feature in boolean context is invalid and a syntax error. validateMediaInParens skips the media-feature arm for these names and parseRangeContext returns null, so (min-width) becomes general-enclosed (src/MediaParser.ts:524-551). The query stays valid, serializes as (min-width), and (color) or (min-width) evaluates true instead of false.'
