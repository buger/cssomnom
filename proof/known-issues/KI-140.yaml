severity: low
severity_basis: risk
risk: correctness
affected_api: MediaParser.parse media condition validation
attacker_input: caller-supplied media query text with bare min-/max- features; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-boolean-minmax-syntax-error.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: 'Authors can write (min-width: 0) instead of (min-width) until validation rejects the boolean form.'
remediation: Mark a lone min-/max- feature name whose base feature is known as invalid in validateMediaInParens so normalizeAndValidate returns the not-all query.
