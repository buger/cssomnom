minimization_status: minimized
mitigation: Avoid exponent-balanced huge integer offsets in @keyframes selectors; write plain percentages.
remediation: Compute the number token magnitude without intermediate overflow (accumulate mantissa and exponent separately) and reject non-finite offsets in handleKeyframesRule.
