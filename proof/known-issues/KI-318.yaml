affected_api: Parser.parseStyleSheet / parse on @keyframes with a numeric-overflow percentage offset (src/parser.ts handleKeyframesRule, src/AbstractTokenizer.ts consumeNumber)
attacker_input: stylesheet text with an exponent-balanced huge integer offset such as 400 nines followed by e-400%; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0043-keyframes-nan-offset-parse-throw.ts
