id: KI-318
title: Keyframes offset overflow parses to NaN% and throws out of parseStyleSheet
description: consumeNumber saturates a 400-digit integer to Infinity, then multiplies by an underflowed 10^-400 factor, yielding NaN. css-syntax-3 consume-a-number reads the digits in real arithmetic, so 9...9e-400 is about 1. handleKeyframesRule compares the NaN against 0 and 100; both fail, so 'NaN%' reaches the CSSKeyframeRule constructor and its keyText setter throws. parseStyleSheet therefore throws instead of ignoring the offset as css-animations-1 keyframes requires.
