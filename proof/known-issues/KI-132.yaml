do_not_refile_as: KI-5 owns serializeMediaQuery emitting (()) for unclosed constructs and landed that fix; this defect is whole-rule deletion during CSSOM ingestion, a different observable on a different layer. KI-31 covers condition serialization dropping parentheses on valid conditions, not rule deletion.
