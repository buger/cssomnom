risk: correctness
cve_surface: none
affected_api: parse() / replaceSync() stylesheet ingest of @media rules; CSSStyleSheet.insertRule()
attacker_input: ordinary malformed stylesheet text; an unclosed parenthesis inside a @media prelude
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-132-media-unclosed-prelude-rule-deletion-overlay-260826.ts
tripwire_mutation: Route unclosed-construct media queries from the ingest path through the existing invalid-to-not-all normalization so the rule is retained with its child rules while balanced controls stay unchanged
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Authors can close every parenthesis inside @media preludes; consumers cannot detect the loss without re-parsing.
remediation: 'Retain the @media rule for any query MediaParser marks invalid, serialize its condition as not all per mediaqueries-4 #error-handling, and let insertRule accept the recovered rule.'
