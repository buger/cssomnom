id: KI-132
title: '@media rules with an unclosed parenthesis in the prelude vanish from the sheet instead of serializing as not all'
description: 'A @media prelude that ends inside an unclosed parenthesis block deletes the whole grouping rule at stylesheet ingest. parse("@media ((width){a{color:red}}") returns zero rules where mediaqueries-4 #error-handling requires retention: a query that does not match the grammar becomes not all and the rule keeps its contents. The media layer itself already recovers correctly, because MediaParser.parse marks such queries invalid and serializeMediaQuery emits not all, so the CSSOM ingest layer drops what its own parser recovered. insertRule() compounds the cross-surface split and throws SyntaxError for text whose specified rule-level parse cannot fail. KI-5 fixed unclosed-construct serialization inside MediaParser; this filing pins the stylesheet-ingest deletion on top of that fix. The same input also exercises V-MALFORMED-RECOVER recovery posture.'
