id: KI-277
title: setProperty treats a null value as the empty string and removes the declaration
description: 'setProperty compares value === null and invokes removeProperty. WebIDL types the value CSSOMString, so null converts to the string "null" before cssom-1 #dom-cssstyledeclaration-setproperty runs. Step 3 removes only the empty string, so the null form must parse "null" as an ordinary value. The implementation silently deletes an existing declaration instead.'
