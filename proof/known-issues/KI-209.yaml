id: KI-209
title: CSS namespace omits parseRuleListSync while README documents it as bound
description: The CSS namespace literal binds the async parseRuleList but omits its Sync sibling. README.md lists CSS.parseRuleListSync in the Parser API method table and documents Sync variants for async parse methods. SW-REQ-260821-3553 requires the CSS object to bind the parse methods. The standalone parseRuleListSync export exists at src/parser-api.ts L519, so CSS.parseRuleListSync is undefined while CSS.parseStylesheetSync is present. Hosts that call CSS.parseRuleListSync through the namespace get undefined.
