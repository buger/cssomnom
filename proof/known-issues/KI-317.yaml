id: KI-317
title: getElementLanguage ignores xml:lang, so :lang() misses XML language tags
description: 'getElementLanguage resolves language only through getAttribute(''lang'') (src/matcher.ts:827-835). selectors-4 22.2 #the-lang-pseudo delegates content language to the document language and names xml:lang for XML documents. An element whose language comes from xml:lang matches no :lang() range. WPT exercises xml:lang through css/selectors/i18n/lang-pseudo-class-empty-attribute.xhtml.'
affected_requirements:
    - SW-REQ-260822-ZN94
evidence_manifests:
