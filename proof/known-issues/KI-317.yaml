severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: matches(element, ':lang(...)') / getElementLanguage (src/matcher.ts)
attacker_input: selector text using :lang() against XML or XHTML elements carrying xml:lang; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0046-lang-xml-lang.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Set the HTML lang attribute alongside xml:lang until the resolver reads both.
remediation: Read getAttributeNS('http://www.w3.org/XML/1998/namespace', 'lang') before falling back to the HTML lang attribute in getElementLanguage.
