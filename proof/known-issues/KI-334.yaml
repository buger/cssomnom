id: KI-334
title: '@page keeps nested style and grouping rules the css-page grammar excludes'
description: 'handlePageRule parses its block with consumeBlockContents(..., true) (src/parser.ts:622). That mode admits nested qualified rules and grouping at-rules. handlePageRule pushes every non-first item into nestedRules (src/parser.ts:627-632). css-page-3 #at-page-rule allows only page properties and margin at-rules inside @page. ''@page { div {} }'' and ''@page { @media all {} }'' therefore keep invalid children.'
