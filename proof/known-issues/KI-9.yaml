    - node --test tests/streaming.test.ts
    - node --test tests/mcdc-branch-streaming-tokenizer-leftover.test.ts tests/mcdc-branch-tokenstream-leftover.test.ts
    - node --experimental-strip-types proof/reproducers/KI-9-streaming-peek-eof.ts
