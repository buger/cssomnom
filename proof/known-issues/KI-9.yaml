severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: StreamingTokenizerStream.peek
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-9-streaming-peek-eof.ts
reproduction_steps:
    - 'Construct StreamingTokenizer + StreamingTokenizerStream, appendChunk of an incomplete string, call peek().'
    - 'Observe a synthetic EOF token instead of NeedMoreDataError.'
    - 'Split appendChunk of high-surrogate+CR then low-surrogate; compare getTokens() to tokenize(full). Observe divergence.'
    - 'Intended contract: peek throws NeedMoreDataError until close(); remnant order is high then CR so streaming matches one-shot.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-9-streaming-peek-eof.ts'
introduced_in: inception
defect_class: latent
mitigation: Peek throws NeedMoreDataError while the tokenizer is open and the buffer is empty. preprocessChunk prepends a trailing high surrogate onto a same-call CR remnant so source order stays high-then-CR.
remediation: Landed in src/TokenStream.ts + src/streaming-tokenizer.ts. Class-closure DEFECT-260822-SK9P.
notes:
    - '2026-08-22: filed after fe7defa restore. Distinct from KI-7/KI-8 import holes. Peek-EOF and remnant/CR are the same streaming restore class; one tripwire covers both.'
    - '2026-08-22: product class-fix. peek throws NeedMoreDataError until close(); remnant prepends high then CR. Overlay reproducer and tests/streaming.test.ts pass. DEFECT-260822-SK9P.'
