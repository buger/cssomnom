id: KI-9
title: StreamingTokenizerStream.peek fabricates EOF; remnant high-surrogate+CR reverses order
description: |
    css-syntax-3 § 4.3.1 #consume-token emits <EOF-token> only at true end of input. StreamingTokenizerStream.peek returns a synthetic EOF when the buffer is empty after an incomplete chunk instead of NeedMoreDataError. Separately, preprocessChunk buffers a trailing CR then appends a trailing high surrogate onto remnant (CR then high), reversing source order so a split high+CR+low pair becomes a valid scalar instead of two U+FFFD around a newline. Overlay audit cannot change product code.
affected_requirements:
    - SW-REQ-260821-QV2H
    - SYS-REQ-260821-SBJ7
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: StreamingTokenizerStream.peek
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-9-streaming-peek-eof.ts
reproduction_steps:
    - 'Construct StreamingTokenizer + StreamingTokenizerStream, appendChunk of an incomplete string, call peek().'
    - 'Observe a synthetic EOF token instead of NeedMoreDataError.'
    - 'Split appendChunk of high-surrogate+CR then low-surrogate; compare getTokens() to tokenize(full). Observe divergence.'
    - 'Intended contract: peek throws NeedMoreDataError until close(); remnant order is high then CR so streaming matches one-shot.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-9-streaming-peek-eof.ts'
introduced_in: inception
defect_class: latent
mitigation: None on HEAD. Buffer the entire stylesheet before StreamingTokenizerStream.peek, or use tokenize() instead of chunked peek.
remediation: Product hole is on origin/main logic restored in fe7defa (Implements comments kept). Overlay cannot land NeedMoreDataError in src/TokenStream.ts or remnant = high + CR in src/streaming-tokenizer.ts. Close only after both contracts hold. No DEFECT — live unfixed bugs stay as KnownIssues.
notes:
    - '2026-08-22: filed after fe7defa restore. Distinct from KI-7/KI-8 import holes. Peek-EOF and remnant/CR are the same streaming restore class; one tripwire covers both.'
