id: KI-9
title: StreamingTokenizerStream.peek fabricates EOF; remnant high-surrogate+CR reverses order
description: |
    css-syntax-3 § 4.3.1 #consume-token emits <EOF-token> only at true end of input. StreamingTokenizerStream.peek returned a synthetic EOF when the buffer was empty after an incomplete chunk instead of NeedMoreDataError. Separately, preprocessChunk buffered a trailing CR then appended a trailing high surrogate onto remnant (CR then high), reversing source order so a split high+CR+low pair became a valid scalar instead of two U+FFFD around a newline.
affected_requirements:
    - SW-REQ-260821-QV2H
    - SYS-REQ-260821-SBJ7
