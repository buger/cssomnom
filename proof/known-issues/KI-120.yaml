id: KI-120
title: 'Declaration values retain insignificant trailing whitespace: getPropertyValue returns "red " for color:red ;'
description: 'A declaration written with whitespace before the semicolon stores its value with the trailing <whitespace-token> attached, so getPropertyValue(color) returns "red " instead of the canonical "red" (same for calc(1px) and url("x") values). css-syntax-3 #consume-declaration normatively removes trailing whitespace tokens from the declaration value before storage ("While the last item in decl value is a <whitespace-token>, remove that token"), and cssom-1 #serialize-a-css-declaration appends the stored value verbatim, so the polluted stored value leaks into serialized surfaces. Dedup: distinct from KI-41 (parser-API at-rule prelude whitespace filtering).'
