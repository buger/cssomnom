id: KI-252
title: div() throws a spec-absent RangeError when a zero divisor carries a unit
description: 'numericDiv''s paired fast path throws RangeError for any zero divisor before checking units. css-typed-om-1 #dom-cssnumericvalue-div inverts each divisor and multiplies. The invert algorithm throws RangeError only for unit ''number'' with value 0. CSSUnitValue(10,''px'').div(CSSUnitValue(0,''px'')) must return a product with an invert node, not a RangeError.'
