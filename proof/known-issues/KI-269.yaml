id: KI-269
title: CSSCounterStyleRule setters store invalid names and descriptor values the spec ignores
description: 'Every CSSCounterStyleRule attribute setter assigns the raw string (src/CSSOM.ts:1799-1839). css-counter-styles-3 #cssom requires the name setter to do nothing for ''none'' and each descriptor setter to parse the value and abort on grammar failure. rule.name = ''none'' and rule.system = ''not-a-system-keyword'' therefore stick and re-serialize into invalid @counter-style text.'
