id: KI-125
title: Stale registry syntax strings reject grammar-valid property values
description: 'CSSStyleValue.parse throws for spellings that the owning property grammars define. The generated registry stores scrollbar-gutter as auto | stable while css-overflow-3 defines auto | stable && both-edges?. It stores font-variant-alternates as normal | historical-forms while css-fonts-4 defines the styleset(), character-variant(), swash(), ornaments(), and annotation() functions. It stores text-indent as length-percentage while css-text-4 appends && hanging? && each-line?. It stores font-palette as normal | light | dark while css-fonts-4 adds the palette-identifier production parsed as a dashed ident. Verified rejections today: stable both-edges, styleset(ss01), 10px hanging, and --my-palette. Distinct from KI-35 and KI-111, which cover acceptance of invalid registry input, and from KI-38, which covers cascade ignorance of the registry.'
