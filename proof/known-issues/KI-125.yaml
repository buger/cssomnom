mitigation: Callers can bypass validation with CSSStyleValue.parse of a generic property or raw component-value parsing until registry data refreshes.
remediation: Regenerate property syntax strings from mdn-data or @webref/css through scripts/codegen so scrollbar-gutter, font-variant-alternates, text-indent, and font-palette match their defining grammars.
