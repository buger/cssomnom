severity: low
severity_basis: risk
risk: correctness
affected_api: Token span metadata returned by tokenize (src/tokenizer.ts tokenize; startIndex/endIndex/originalText)
attacker_input: any stylesheet containing comments before tokens; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0022-comment-span-attribution.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not rely on originalText or indices for tokens that follow comments; re-derive from value.
remediation: Capture start after consumeComments clears leading trivia inside consumeToken, or adjust spans in tokenize.
