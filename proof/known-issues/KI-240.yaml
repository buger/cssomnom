id: KI-240
title: Tokenizer folds leading comments into the next token span and originalText
description: tokenize snapshots start before consumeToken runs consumeComments, so a preceding comment joins the following token's startIndex, endIndex, and originalText (src/tokenizer.ts:59-63). The ident in '/*c*/ foo' reports originalText '/*c*/foo' and startIndex 0. The span no longer describes the token's own source segment and disagrees with token.value.
affected_requirements:
    - SW-REQ-260821-7M07
