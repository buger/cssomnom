id: KI-32
title: SVG/MathML element names matched ASCII-case-insensitively by type selectors
description: 'matchSimpleSelector''s type-selector arm (src/matcher.ts ~L300-303) lowercases BOTH the element local name and the selector name unconditionally, so matches({localName:''textPath'', namespaceURI:''http://www.w3.org/2000/svg''}, ''textpath'') returns true and ''foreignobject'' matches <foreignObject>. selectors-4 #case-sensitive (Overview.bs:1309-1318) defaults matching of element names to the string/identical-to operation (case sensitive); its only relaxation is a host-language exception for HTML-namespace elements (html#case-sensitivity-of-selectors), which does not extend to SVG/MathML where camelCase element names are normative (SVG 2 textPath, foreignObject). Correctness fault: SVG documents style wrongly whenever a selector''s case differs from the element name.'
affected_requirements:
    - SYS-REQ-260823-SCS2
evidence_manifests:
    - proof/evidence/ki-32.yaml
severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: matches(element, selector) type-selector arm
attacker_input: selector text whose element name differs in case from a non-HTML-namespace element; no privileged access required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-32-svg-type-selector-case-sensitivity-overlay-260823.ts
tripwire_mutation: Remove unconditional toAsciiLowerCase on both sides in matchSimpleSelector's type-selector arm for non-HTML namespaces; the cased legs flip green while HTML control stays green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat case-differing type selectors as non-matching against SVG/MathML elements when consuming match() results.
remediation: Compare element local names to type-selector names case-sensitively unless the element is in the HTML namespace (keep the HTML exemption per html#case-sensitivity-of-selectors).
