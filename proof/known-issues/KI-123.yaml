severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: StylePropertyMap.get() / StylePropertyMap.getAll() reification of string-declared declarations
attacker_input: ordinary stylesheet declarations with <color> (or other base-only) values read back through Typed OM get(); no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-123-unrepresentable-value-overreification-overlay-260824.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not rely on instanceof subclass checks on StylePropertyMap.get() results for base-only properties; treat any CSSStyleValue-shaped result as untyped.
remediation: 'Route get()/getAll() reification through the #reify-property per-property table: for base-only rows return a direct CSSStyleValue carrying [[associatedProperty]] = property instead of boxing into CSSKeywordValue/CSSColorValue subclasses.'
notes:
    - 'Reproducer ran red twice before filing (exit 1 both runs: 7 tests, 1 positive-control pass, 1 green-today invariant pin ([[associatedProperty]]), 5 defect failures). Evidence captured via genuine re-execution at 2026-08-24T09:00:16Z (proof/evidence/ki-123.yaml); freshness hash sha256:3095e47b28d3efead62375ff810b43c2bf4ff8d3dc6b712a607b646d9b904aff matches final reproducer bytes. Requirement SYS-REQ-260824-XE59 drafted through proof req new under STK-REQ-260821-BQKD; informal until cssom variables can be declared in specs/system/variables/cssom.vars.yaml (concurrently owned).'
