id: KI-266
title: '@layer block keeps a comma-separated prelude that css-cascade-5 restricts to one name'
description: 'handleLayerRule forwards any serialized prelude into handleGroupingAtRule when a block follows (src/parser.ts:434-435). css-cascade-5 #layer-block types the block form as ''@layer <layer-name>? { <rule-list> }''. Only the statement form takes a comma list. parse(''@layer foo, bar { div { color: red } }'') therefore returns a CSSLayerBlockRule named ''foo, bar'' instead of dropping the rule.'
affected_requirements:
    - SW-REQ-260821-HHVE
