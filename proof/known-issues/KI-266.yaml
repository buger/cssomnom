severity: low
severity_basis: reproducer
risk: correctness
affected_api: parse() @layer block handling (src/parser.ts handleLayerRule)
attacker_input: stylesheet text with a comma list in an @layer block prelude; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0027-layer-block-comma-list.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Reject @layer blocks whose prelude contains a comma before dispatching.
remediation: 'Validate the block prelude as a single <layer-name> per css-cascade-5 #layer-block and return null on failure.'
