id: KI-294
title: matchesSyntax named-color probe uses in, so constructor counts as a color
description: The <color> arm tests membership with 'val in NAMED_COLORS' on a prototype-bearing object literal (src/PropertyRegistry.ts:230). The lowercased identifiers 'constructor' and '__proto__' collide with Object.prototype keys, so the probe passes and matchesSyntax accepts them as colors. registerProperty({syntax:'<color>', initialValue:'constructor'}) registers instead of throwing SyntaxError. register-a-custom-property step 4 must parse initialValue against the syntax definition.
