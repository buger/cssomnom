id: KI-185
title: StylePropertyMap var() substring checks throw spec-absent TypeErrors on quoted strings
description: StylePropertyMap detects var() with substring tests over serialized text. append() rejects an incoming string whose characters contain var( inside a <string> token. append() also rejects a stored value with the same characters. _checkPendingSubstitution rejects longhand writes when the serialized shorthand merely contains the characters. css-typed-om-1 append steps 5 and 7 throw only for real var() references or unparsed objects. The set algorithm carries no such throw step. Quoted strings such as "var(foo)" are valid values that the map wrongly rejects.
