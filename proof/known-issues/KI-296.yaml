attacker_input: caller-supplied media query text using orientation with a caller-supplied MediaEnvironment; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0037-orientation-ignores-env.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Set width and height to match the orientation you want until the arm reads env.orientation.
remediation: Read env.orientation in the orientation case and fall back to the width/height derivation only when the field is absent.
