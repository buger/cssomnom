id: KI-296
title: orientation media feature derives from width/height and ignores env.orientation
description: 'evaluateMediaFeature hardcodes actualIdent = env.width > env.height ? ''landscape'' : ''portrait'' (src/MediaParser.ts:1293-1294). MediaEnvironment declares an orientation field and DEFAULT_MEDIA_ENV sets it, but the switch never reads it. MediaParser.evaluate(''(orientation: portrait)'', { width: 800, height: 600, orientation: ''portrait'' }) therefore returns false. mediaqueries-4 #orientation defines the feature from the page orientation this API exposes through MediaEnvironment.'
