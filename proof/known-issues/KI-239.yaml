id: KI-239
title: parseError writes unbounded console.warn output per parse error
description: parseError calls console.warn for every recorded parse error (src/AbstractTokenizer.ts:29-34). A stylesheet with N bad strings performs N synchronous host writes inside tokenize(). Output volume grows with input size with no cap, against the tokenizer denial_of_service_resistant obligation. Recording the error in errors[] alone matches the css-syntax-3 parse-error model.
