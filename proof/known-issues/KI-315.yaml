id: KI-315
title: Disabled-attribute checks read hasAttribute only and miss getAttribute-only DOM mocks
description: isFormControlDisabled, isDisabledFieldset, and isDisabledByAncestorFieldset detect the disabled attribute through element.hasAttribute?.('disabled') alone (src/matcher.ts:884,896,905). The exported DOMElement type marks hasAttribute optional. matchAttributeSelector already falls back to getAttribute when hasAttribute is absent (src/matcher.ts:401-403). A duck-typed element exposing getAttribute only is never detected as disabled, so :disabled misses it and :enabled wrongly matches.
