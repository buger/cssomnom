id: KI-172
title: Trailing-comma selector lists are silently repaired instead of dropping the rule
description: normalizeNestedSelector discards the final empty segment of a comma-separated prelude. selectors-4 grouping invalidates a selector list containing an empty selector, so the qualified rule must be dropped. Inside @media the repaired '.foo,' selector parses as '.foo' and the invalid rule survives and applies styles.
affected_requirements:
    - INT-REQ-260821-9SGA
evidence_manifests:
    - proof/evidence/ki-172.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.normalizeNestedSelector / nested qualified rule parsing (src/parser.ts)
attacker_input: stylesheet text with a trailing comma in a nested or grouped selector; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0003-trailing-comma-selector-repaired.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Keep selector lists free of trailing commas until the empty segment invalidates the rule.
remediation: Push the trailing empty segment like inner segments and let an empty segment invalidate the selector list.
