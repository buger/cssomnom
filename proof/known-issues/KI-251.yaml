id: KI-251
title: CSSUnitValue constructor stores NaN and Infinity instead of throwing TypeError
description: The CSSUnitValue constructor assigns value without a finite check. css-typed-om-1 IDL types the constructor argument and the value attribute as plain double. WebIDL double conversion throws TypeError for NaN, +Infinity and -Infinity. new CSSUnitValue(NaN,'px') succeeds and toString() serializes calc(nan * 1px).
