id: KI-288
title: Text-orientation mapping context reads the last collected declaration, not the cascade winner
description: 'getCascadedStyle picks the text-orientation mapping context with declarationsByProperty.get(''text-orientation'')?.at(-1) before any cascade sort. css-writing-modes-4 #text-orientation forces the used direction to ltr under upright text-orientation in vertical writing modes, which drives logical inline mapping. A lower-priority text-orientation collected later hides the winning upright declaration, so the forced-LTR mapping is skipped. Identical cascade winners map margin-inline-start to opposite physical sides depending only on collection order. Same unsorted-context root as KI-259, which pins the writing-mode leg; this KI pins the text-orientation leg.'
