severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleDeclaration constructor (src/CSSStyleDeclaration.ts)
attacker_input: caller-supplied Declaration arrays handed to the public constructor; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0019-constructor-mutates-caller-declarations.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Pass freshly parsed declarations; do not reuse AST arrays across CSSStyleDeclaration constructions.
remediation: Normalize into a copied declaration object before storing, leaving the caller's nodes untouched.
