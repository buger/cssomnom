id: KI-216
title: CSSStyleDeclaration constructor renames caller-owned Declaration objects in place
description: addDeclarationRecursive assigns decl.name = normalizedName on the objects taken from the caller's array (src/CSSStyleDeclaration.ts:130). The constructor never copies declarations, so constructing a block renames the caller's AST nodes. Sharing one declaration array between two blocks lets the first construction change what the second observes.
