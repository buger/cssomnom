id: KI-338
title: Unknown media queries stay unfolded across CSSOM media surfaces
description: 'MediaParser.parse never replaces unknown-valued queries with not all. mediaqueries-4 § 3.2 #error-handling requires that fold at parse time. MediaList.mediaText, item(), the iterator, toString, and the mediaText setter leak the raw feature text. appendMedium stores two unknown queries that must compare equal as not all. deleteMedium misses a stored not all because its argument serializes unfolded. CSSMediaRule.cssText and conditionText, CSSImportRule.cssText, and CSSStyleSheet media leak the same text. Same root as KI-139, which pins the serializeMediaQuery entry alone.'
affected_requirements:
    - SYS-REQ-260821-5283
    - INT-REQ-260821-MZW3
