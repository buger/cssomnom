severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MediaList media serialization and the rules consuming media.mediaText (src/CSSOM.ts)
attacker_input: caller-supplied media text with unknown media features; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0051-not-all-cssom-surfaces.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Serialize media through a hasUnknownFeature pass that substitutes not all before comparing or emitting.
remediation: 'Fold unknown-valued queries to the invalid not-all form at the end of normalizeAndValidate, per mediaqueries-4 § 3.2 #error-handling. The fold fixes every CSSOM surface.'
