risk: correctness
affected_api: MediaParser.evaluate media feature math simplification
attacker_input: caller-supplied media query text with sign() inside calc(); local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-sign-calc-never-simplifies.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Authors can inline the sign() result as a plain number until simplify folds sign products.
remediation: Teach simplify() to evaluate sign() over same-type operands into a number, so sign products collapse into CSSUnitValue on every feature path.
