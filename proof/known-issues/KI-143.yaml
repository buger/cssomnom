id: KI-143
title: sign()-bearing calc in media features never simplifies to a unit value, queries fail
description: 'parseResolutionToDpi and parseLengthToPx return null whenever simplify() does not produce a CSSUnitValue. simplify() never folds a calc product containing sign(), so every sign()-bearing feature value evaluates unknown. WPT mq-calc-sign-function-001/002 require (width > calc(1px * (1 + sign(16px - 1rem)))) to match; this parser returns false. The claim''s mixed-unit examples fold correctly; sign() products are the live form of the non-simplifying mechanism. A resolution instance, (min-resolution: calc(sign(17px - 1rem) * 0.5x)), must match env 96dpi and returns false.'
