id: KI-188
title: Parser instance parseRule drops this.options and loses custom at-rule types
description: 'The Parser.parseRule instance method builds a fresh Parser without forwarding this.options (src/parser.ts:198). The constructor''s atRuleTypes map is lost, so parseRule classifies custom at-rules through the default path. parseStyleSheet and consumeRule on the same instance honor the option, and parser-api parseRuleSync forwards options too. A Parser constructed with atRules {foo: rule} silently loses the configuration on parseRule alone.'
