attacker_input: custom at-rule options passed to the Parser constructor; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0010-parser-parerule-drops-options.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Use Parser.consumeRule or the parser-api parseRuleSync entry points when atRules options matter.
remediation: Pass this.options into the inner Parser construction inside the instance parseRule method.
