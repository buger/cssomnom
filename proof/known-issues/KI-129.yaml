id: KI-129
title: StylePropertyMap.append skips the pending-substitution TypeError when var() hides behind a shorthand
description: 'StylePropertyMap.append stores values silently when the target longhand carries a var() reference inherited from a shorthand declaration. css-typed-om-1 #append-to-a-stylepropertymap step 7 throws TypeError when the stored entry contains a var() reference, before any mutation. A var() held by transition keeps every derived longhand carrying the reference. Local WPT declared append.tentative.html pins the throw for the transition var a case. The same append against an own-text var() reference throws today, so the guard exists but reads only the property text.'
