severity: low
severity_basis: risk
risk: correctness
affected_api: DOMMatrix / DOMMatrixReadOnly constructor dictionary init path
attacker_input: duck-typed matrix-like objects exposing toFloat64Array; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0005-duck-init-is2d-transpose.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Pass DOMMatrixReadOnly instances or plain dictionaries instead of toFloat64Array duck types.
remediation: Classify the returned 16 elements with has3DComponents and store them in the given column-major order without transposing.
