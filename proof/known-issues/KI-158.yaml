id: KI-158
title: Duck-typed toFloat64Array init marks 3D matrices 2D and transposes components
description: parseMatrixInit short-circuits any object exposing toFloat64Array and returns is2D from the dictionary, defaulting to true, with transposed values (src/DOMMatrix.ts:255-261). The path runs before has3DComponents. A column-major 16-element array with m43 at index 14 comes back flagged 2D with m34 holding the value. The declared DOMMatrixInit interface accepts this member, so callers get wrong geometry instead of a classification.
affected_requirements:
    - INT-REQ-260821-JTY2
