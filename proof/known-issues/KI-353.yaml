id: KI-353
title: CSSLayerStatementRule.nameList aliases the caller array instead of a frozen snapshot
description: The CSSLayerStatementRule constructor stores the caller-supplied array by reference (src/CSSOM.ts ~1067). css-cascade-5 types nameList as a readonly FrozenArray of CSSOMString, so the attribute exposes a frozen snapshot of the declared names. A caller-side push changes the rule nameList and its cssText. The rule class ships as public API through src/index.ts.
