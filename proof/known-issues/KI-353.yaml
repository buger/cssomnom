affected_api: CSSLayerStatementRule constructor and nameList attribute (src/CSSOM.ts)
attacker_input: caller-supplied name arrays handed to the exported constructor; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0065-layer-namelist-aliasing.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Pass a freshly built array to the constructor and never retain it on the caller side.
remediation: Copy the argument and freeze the stored array, matching the FrozenArray contract the cssText getter already assumes.
notes:
    - 'Distinct from KI-346: that pins Rule[] backing stores for cssRules mutation. This KI pins the css-cascade-5 FrozenArray nameList attribute exposing a live caller array. Different attribute and different IDL contract.'
