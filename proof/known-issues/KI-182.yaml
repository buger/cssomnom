id: KI-182
title: validateVarFunction accepts non-dashed var() names in retained declarations
description: 'validateVarFunction rejects only an empty name and curly-block mixes (src/parser.ts:1887-1911). var(foo) and var(123) pass the gate. css-variables-1 #defining-custom-properties makes a custom property with an invalid var() reference invalid and requires ignoring it. The parser retains ''--x: var(foo)'' verbatim in cssText instead. The CSS.supports surface of the same grammar gap is KI-107.'
affected_requirements:
    - INT-REQ-260821-N2VE
