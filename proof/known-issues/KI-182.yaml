severity: medium
severity_basis: risk
risk: correctness
affected_api: validateVarFunction declaration filtering (src/parser.ts)
attacker_input: stylesheet text using var() whose first argument is not a dashed ident; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0007-var-nondashed-name-accepted.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write var() names as dashed idents until the gate enforces the custom-property-name grammar.
remediation: Require isValidDashedIdent on the var() first argument in validateVarFunction and ignore custom properties carrying invalid var() references.
