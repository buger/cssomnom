id: KI-150
title: Custom property values keep uppercase VAR() references unsubstituted
description: 'collectInlineDeclarations treats a declaration raw value as resolved when it lacks the substring ''var('' (src/cascade/rule-filter.ts:645). resolveCustomProperties applies the same case-sensitive test before substituting (src/cascade/variable-resolver.ts:263). An ASCII uppercase VAR() inside a custom property value therefore stays verbatim. CSS function names are ASCII case-insensitive, so ''--a: VAR(--c)'' must resolve like its lowercase twin.'
affected_requirements:
    - INT-REQ-260821-HJVC
evidence_manifests:
