severity: low
severity_basis: risk
risk: correctness
affected_api: getCascadedStyle custom property resolution (collectInlineDeclarations, resolveCustomProperties)
attacker_input: style attributes and stylesheets with mixed-case var() in custom property values; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0004-var-case-raw-substitution.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write var() in lowercase inside custom property values that this cascade must resolve.
remediation: Detect var() references with an ASCII case-insensitive token match instead of a case-sensitive substring test on raw declaration text.
