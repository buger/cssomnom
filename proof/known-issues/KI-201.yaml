id: KI-201
title: browser-entry style maps cache in enumerable expandos and add a non-spec Element.styleMap
description: patchStyleMaps stores the map in an own enumerable expando named _attributeStyleMap (src/browser-entry.ts:220-223). css-typed-om-1 marks attributeStyleMap SameObject, which is an internal slot, so the map must not appear in Object.keys of the host. The same code installs a styleMap accessor on HTMLElement, SVGElement and MathMLElement. css-typed-om-1 exposes no element styleMap, only CSSStyleRule.styleMap and attributeStyleMap. The extra accessor builds a second map over the same inline style. The brand check uses instanceof only, so Object.create(HTMLElement.prototype) returns a map instead of throwing TypeError.
