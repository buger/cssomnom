risk: correctness
affected_api: src/browser-entry.ts patchStyleMaps attributeStyleMap and styleMap accessors on HTMLElement, SVGElement, MathMLElement
attacker_input: host code reading attributeStyleMap or styleMap on elements, or probing the accessor on a brandless prototype child; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0013-stylemap-expando-caches.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Cache maps in a WeakMap keyed by host and read attributeStyleMap only.
remediation: Replace the expando caches with a WeakMap, drop the element styleMap accessor, and reject receivers that fail a real platform brand check.
