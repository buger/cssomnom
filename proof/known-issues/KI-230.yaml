id: KI-230
title: SelectorParser.parse accepts a trailing comma in selector lists
description: 'SelectorParser.parse pushes the selector before a comma and exits the loop once the cursor is exhausted, never noticing a dangling separator (src/SelectorParser.ts:185-216). selectors-4 #grouping invalidates a list containing an empty selector, and engines throw SyntaxError for ''div,''. matches() and querySelectorAll() return the preceding selectors instead of the empty match. Sibling of KI-172, which pins the rule-parse path (normalizeNestedSelector).'
affected_requirements:
    - SW-REQ-260821-6D9T
