severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: SelectorParser.parse / matches / querySelectorAll (src/SelectorParser.ts, src/matcher.ts)
attacker_input: selector lists ending with a comma; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0020-trailing-comma-selector-list.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Trim trailing commas from selector strings before matching.
remediation: After consuming a comma, require another complex selector before the list ends; throw when the loop terminates right after a separator.
