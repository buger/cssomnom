id: KI-142
title: Zero-denominator aspect-ratio values evaluate unknown instead of degenerate infinity
description: 'css-values-4 #ratios allows zero in either ratio component and calls the result a degenerate ratio. isValidRatioOperand accepts a zero denominator, but parseRatio returns null for it, so (aspect-ratio: 16/0) evaluates unknown (src/MediaParser.ts:1066-1073). WPT aspect-ratio-002/004 require 0/0 to behave as the infinite ratio 1/0. MediaParser.evaluate(''(max-aspect-ratio: 0/0)'') returns false instead of true, and not (aspect-ratio: 16/0) returns false instead of true.'
