severity: low
severity_basis: risk
risk: correctness
affected_api: MediaParser.evaluate aspect-ratio feature evaluation
attacker_input: caller-supplied media query text with zero-denominator ratios; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-ratio-zero-denominator.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Authors can rewrite zero-denominator ratios as large finite ratios until evaluation handles degenerate ratios.
remediation: Return Infinity from parseRatio for a zero denominator, and map the 0/0 form to the legacy infinite ratio 1/0 per WPT aspect-ratio-002/004.
