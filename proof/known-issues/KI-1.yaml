id: KI-1
title: setProperty('all') deletes existing all before expandAll; failed expand drops prior all
description: |
    CSSStyleDeclaration.setProperty deleted any existing all declaration before expandAll. A successful all:unset expands to longhands and is observably a no-op on a later failed expand. The live hole was when all itself is stored (all: var(--x) or env()): a later invalid setProperty dropped cssText from "all: var(--x);" to empty. Product fix: drop stored all only after expandAll succeeds. DEFECT-260821-XZAS is stale class-closure paperwork from a rolled-back class-fix — do not delete. Class-closure for this landing is DEFECT-260822-NQVB.
affected_requirements:
    - SW-REQ-260821-HNRG
    - SYS-REQ-260821-8TGB
commands:
    - node --test tests/cssom-all-shorthand.test.ts
evidence_manifests:
    - proof/evidence/ki-1.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleDeclaration.setProperty
attacker_input: caller-supplied declaration value text passed to CSSStyleDeclaration.setProperty all-shorthand handling; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-1-setproperty-all.ts
reproduction_steps:
    - Construct a CSSStyleDeclaration and setProperty('all', 'var(--x)') so the all declaration is stored (not expanded to longhands).
    - Call setProperty('all', 'not-a-css-wide-keyword') (expandAll returns null).
    - Observe cssText and getPropertyValue('all') are empty. The prior all was deleted at CSSStyleDeclaration.ts before expand returned.
    - 'Intended contract: invalid all is a no-op; all: var(--x) remains.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-1-setproperty-all.ts'
introduced_in: inception
defect_class: latent
minimization_status: not_applicable
mitigation: 'Invalid all is a no-op. Stored all: var(--x)/env() remains. Delete stored all only after expandAll succeeds.'
remediation: 'Landed in src/CSSStyleDeclaration.ts. Invalid all is a no-op; stored all: var(--x) remains. Class-closure DEFECT-260822-NQVB.'
notes:
    - '2026-08-22: src logic restored to origin/main (264c2ea / 0.1.4) in fe7defa; Implements comments kept. Campaign class-fixes are gone. Reopened. Overlay reproducer is again a failing tripwire.'
    - '2026-08-22: product class-fix. Delete stored all only after expandAll succeeds. Overlay reproducer and tests/cssom-all-shorthand.test.ts pass. DEFECT-260822-NQVB. DEFECT-260821-XZAS kept as stale paperwork.'
    - '2026-08-24: ledger hygiene pass (mechanical): collapsed duplicate stale-paperwork sentences to the single description occurrence (DEFECT-260821-XZAS guidance unchanged) and replaced copy-pasted Web3 rubric boilerplate in poc_quality with a single dated domain note; release_disposition/minimization_status/attacker_input backfilled via proof CLI.'
