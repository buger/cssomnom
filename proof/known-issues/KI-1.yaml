id: KI-1
title: setProperty('all') deletes existing all before expandAll; failed expand drops prior all
description: |
    CSSStyleDeclaration.setProperty deletes any existing all declaration before expandAll. A successful all:unset expands to longhands and is observably a no-op on a later failed expand. The live hole is when all itself is stored (all: var(--x) or env()): a later invalid setProperty drops cssText from "all: var(--x);" to empty. Overlay audit cannot change product code. No DEFECT is filed: a ProblemReport is post-fix class-closure evidence (hardening, regression net, sibling sites), not a live ticket.
affected_requirements:
    - SW-REQ-260821-HNRG
    - SYS-REQ-260821-8TGB
commands:
    - node --test tests/cssom-all-shorthand.test.ts
evidence_manifests:
    - proof/evidence/ki-1.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleDeclaration.setProperty
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-1-setproperty-all.ts
reproduction_steps:
    - Construct a CSSStyleDeclaration and setProperty('all', 'var(--x)') so the all declaration is stored (not expanded to longhands).
    - Call setProperty('all', 'not-a-css-wide-keyword') (expandAll returns null).
    - Observe cssText and getPropertyValue('all') are empty. The prior all was deleted at CSSStyleDeclaration.ts before expand returned.
    - 'Intended contract: invalid all is a no-op; all: var(--x) remains.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-1-setproperty-all.ts'
introduced_in: inception
defect_class: latent
mitigation: Invalid all after stored var/env is a no-op; stored all is deleted only after expandAll succeeds.
remediation: Landed in src/CSSStyleDeclaration.ts. Class-closure DEFECT-260821-XZAS.
notes:
    - 'Overlay MC/DC reclassified after product fix: SAT TRUE unique-cause rows are witnessed; guarantee-violation FALSE rows are //mcdc:ignore:defensive (unreachable). Overlay reproducer PASSES and has no [known-issue] tripwire. Status remains fixed. KI-7 stays open.'
