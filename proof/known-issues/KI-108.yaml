introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Avoid nested var() custom-property names when computed values must resolve in this implementation.
remediation: Substitute arbitrary functions in var() first arguments, parse the resulting custom-property name, then perform the outer replacement and fallback steps.
