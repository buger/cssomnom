id: KI-108
title: Nested var() custom-property names are not substituted
description: The cascade does not substitute a nested var() in the first argument of an outer var() before parsing that argument as a custom-property name. The CSS Variables replace-a-var algorithm and its --other/--myvar/--result example require the inner function to resolve first, yielding the referenced custom property value.
