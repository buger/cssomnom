id: KI-173
title: Bare '--' accepted as a custom media name in @custom-media
description: handleCustomMediaRule accepts any ident starting with '--'. mediaqueries-5 custom-mq names custom media with <dashed-ident>, and a bare '--' is not an ident per css-syntax-3 would-start-an-identifier. '@custom-media -- true;' fabricates CSSCustomMediaRule('--', true) although Parser.isValidDashedIdent rejects the name.
affected_requirements:
    - INT-REQ-260821-9SGA
