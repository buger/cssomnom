severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.handleCustomMediaRule name check (src/parser.ts)
attacker_input: stylesheet text using '--' as a custom media name; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0003-custom-media-bare-dashes-name.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Give every custom media a real dashed name beyond the two hyphens.
remediation: Route the name through Parser.isValidDashedIdent before constructing CSSCustomMediaRule.
