id: KI-7
title: CSSImportRule.styleSheet is always null; @import never fetches (documented offline parser)
description: 'README documents CSSImportRule.styleSheet as null because the library is a static offline parser with no network or disk I/O to load external stylesheets. Full CSSOM associates the imported CSSStyleSheet on CSSImportRule.styleSheet. HEAD never fetches the href. The public getter now returns null to match README (no empty placeholder sheet). The user-observable capability gap remains: @import never loads. This KnownIssue tracks SYS-REQ-260821-H3BD (external_sheet_fetched=T => FALSE) and SW-REQ-260821-5W6X (css_import_rule_constructed=T, external_sheet_fetched=T, import_url_present=T => FALSE).'
affected_requirements:
    - SYS-REQ-260821-H3BD
    - SW-REQ-260821-5W6X
commands:
    - node --experimental-strip-types proof/reproducers/KI-7-import-stylesheet-null.ts
    - node --experimental-strip-types proof/reproducers/KI-7-import-url-token.ts
evidence_manifests:
    - proof/evidence/ki-7.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSImportRule.styleSheet
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-7-import-stylesheet-null.ts
reproduction_steps:
    - 'Import parser.ts then parse(''@import url("sheet.css"); body { color: red; }'').'
    - Find the CSSImportRule in cssRules.
    - Observe styleSheet is null (README) or an empty never-fetched placeholder (HEAD cssRules.length 0). Fetch/network I/O is not used.
    - 'Intended contract (full CSSOM): CSSImportRule.styleSheet is the associated loaded stylesheet (not null).'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-7-import-stylesheet-null.ts'
    - 'Extra e2e user-shaped public APIs (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-7-import-url-token.ts'
    - '@import "x.css" — associated loaded sheet / cssRules from fixtures/x.css'
    - '@import url(x.css) — associated loaded sheet / cssRules from fixtures/x.css (url-token)'
    - '@import url("https://example.com/x.css") — associated loaded sheet / cssRules from the imported resource'
    - '@import url(x.css) print; — associated loaded sheet / cssRules from fixtures/x.css plus media print'
introduced_in: inception
defect_class: latent
remediation: Load the imported href so CSSImportRule.styleSheet is the associated CSSStyleSheet (or keep the documented offline contract and treat full CSSOM import loading as out of scope). Close this KI only after the product change lands. Overlay cannot land that change.
notes:
    - Product getter aligned to README-null (no empty placeholder CSSStyleSheet). Overlay reproducer still asserts the full CSSOM associated-loaded-sheet contract and FAILS while never-fetch remains. Did not close KI-7.
    - 'Overlay MC/DC keeps capability-gap + failing tripwire [known-issue] [ki: KI-7] on SYS-REQ-260821-H3BD fetched=T => FALSE and SW-REQ-260821-5W6X constructed=T, fetched=T, import_url_present=T => FALSE. Do not ignore SAT for fetch=false. Status remains open (documented offline parser, no fetch).'
    - 'Acknowledge on approved guarantee SW-REQ-260821-5W6X: ship the documented offline no-fetch contract (SAT TRUE css_import_rule_constructed=T, external_sheet_fetched=F, import_url_present=T). KI-7 tripwire remains the full-CSSOM FALSE row constructed=T, fetched=T, import_url_present=T. Status stays open; no fetch I/O; do not treat the DEFECT-3T1G href SAT as a fetch claim.'
    - Extra overlay e2e proof/reproducers/KI-7-import-url-token.ts covers user-shaped @import "x.css", url(x.css), url("https://example.com/x.css"), url(x.css) print;. Each asserts associated loaded sheet / cssRules from the imported file and FAILS while no-fetch holds. Did not implement fetch. KI-7 stays open.
    - 'Refreshed proof/evidence/ki-7.yaml so both overlay tripwires are in commands and input_set/freshness_hashes: KI-7-import-stylesheet-null.ts (reproducer_command) and KI-7-import-url-token.ts (extra e2e). Also hashed fixtures/x.css, src/parser.ts, src/CSSOM.ts. Tripwires still FAIL (exit 1); no fetch; status remains open.'
