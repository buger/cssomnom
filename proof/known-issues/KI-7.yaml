id: KI-7
title: 'FIXED: CSSImportRule.styleSheet is the associated offline stylesheet (never null); @import never fetches'
description: |
    ORIGINAL HOLE: CSSImportRule.styleSheet exposed no usable associated stylesheet — README-documented null, then (pre-fix HEAD) a lazily-built empty internal sheet whose constructed flag was false, so hosts could not even supply content offline via replaceSync() (NotAllowedError). cssom-1 § 6.4.3 #the-cssimportrule-interface requires styleSheet to return the associated CSSStyleSheet object for the import rule; an unloaded import legitimately exposes an empty stylesheet (browser pre-load state).

    FIXED 2026-08-23 (user-authorized): styleSheet now returns a real, constructed, publicly linked CSSStyleSheet (ownerRule === the import rule; parentStyleSheet resolves live through ownerRule to the owning sheet). Fetching href content remains OUT OF SCOPE permanently as a documented deviation, so the associated sheet stays empty until a host supplies content offline via replaceSync(). This KnownIssue tracked SYS-REQ-260821-H3BD (external_sheet_fetched=T => FALSE row remains unreachable by design) and SW-REQ-260821-5W6X (constructed=T, external_sheet_fetched=F, import_url_present=T => TRUE after fix).
affected_requirements:
    - SYS-REQ-260821-H3BD
    - SW-REQ-260821-5W6X
commands:
    - node --experimental-strip-types proof/reproducers/KI-7-import-stylesheet-null.ts
    - node --experimental-strip-types proof/reproducers/KI-7-import-url-token.ts
evidence_manifests:
