    notes: |
        real_infrastructure: browser/run.ts is a top-level CLI module (importing it would
        execSync pnpm build and spawn python3 wpt), so the reproducer mirrors run.ts:64-66 path
        templates and the run.ts:74-77 dist-dir creation verbatim, cited at HEAD 83ce08f, against a
        disposable two-level jail; the report file write itself is performed in production by the
        spawned 'wpt run' child (spawn at run.ts:141-144) at the interpolated --log-wptreport path,
        which the materialization leg stands in for (reproducer L115-116).
        quantitative_impact: 5 hostile --browser values yield 11 derived log paths escaping dist/
        ('../ki23-escape', 'a/../../b', 'foo/../../../deep', '../../outside',
        'chrome/../../../pwned'); the materialization leg proves the reportJson destination lands
        above dist/ on disk via the interpolated path the spawned `wpt run` child would write.
        control_test: benign 'chrome' keeps all three logs inside dist/ (passes), isolating
        interpolation as the cause.
        untrusted_attacker: operator-typed argv today, but wrappers/CI matrices forwarding
        parameterized browsers make it attacker-influenced; templates are the only gate.
        current_deployment_relevance: package.json wires wpt:browser:chrome|firefox through this
        script on every parity run.
        honest_severity: medium data_integrity — arbitrary file create/overwrite as the invoking
        identity; requires control of the --browser value (no remote vector claimed).
        attacker_profitability: a single matrix variable becomes arbitrary-path JSON/HTML/log
        writes — e.g. overwriting consumed config beside dist/.
        reproducible: two consecutive reproducer runs exited 1 (mirror legs assert containment;
        escapes enumerated); evidence capture re-ran it (proof/evidence/ki-23.yaml status fail).
        no_inflation: severity_basis reproducer; cve_surface none; local-only write primitive
        stated plainly.
        operational_path_verified: mirrored construction IS the production statement chain
        (resolve at :64-66 feeding dist-dir mkdir at :74-77, destinations handed to wpt argv at
        :84-86, spawn at :141-144 whose child performs the actual report materialization).
        reachability_verified: any invocation with a traversal --browser value reaches the sinks;
        no authz layer exists between argv and path.resolve.
kill_domain: path_traversal
