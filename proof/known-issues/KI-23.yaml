id: KI-23
title: --browser flag interpolates into dist/report-${browser}.json log paths that escape dist/
description: scripts/wpt/browser/run.ts:64-66 (verified at HEAD 83ce08f) builds report/screenshot/html destinations by raw template interpolation of the operator-supplied --browser argv value ('dist/report-${browser}.json', 'dist/${browser}-screenshots.txt', 'dist/report-${browser}.html') into path.resolve with no value validation, creates the dist directory via mkdirSync(dirname(reportJson)) (L74-77), and hands the interpolated destinations to 'wpt run' argv (--log-wptreport/--log-wptscreenshot/--log-html, L84-86) before spawning python3 wpt (L141-144); the spawned WPT child materializes the log files at the attacker-chosen paths. Traversal values such as a/../../b therefore write files outside dist/ and outside the checkout (CWE-22).
