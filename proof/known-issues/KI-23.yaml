severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: scripts/wpt/browser/run.ts CLI (pnpm run wpt:browser:*)
attacker_input: --browser argv value carrying ../ traversal segments (operator-typed or forwarded by wrappers/CI matrices)
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-23-wpt-browser-flag-path-escape-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Run browser-parity jobs only with curated --browser values from package.json scripts.
remediation: Validate --browser against an allowlist (chrome|firefox|safari) before path construction, or sanitize resolved log paths through a containedUnder(dist/) check that fails closed.
