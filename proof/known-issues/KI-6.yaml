    - Observe the top-level node is not a CSSParserAtRule (constructor name CSSParserRawRule).
    - 'Control: CSS.parseStylesheetSync(''@media all { .x { color: red; } }'')[0] is CSSParserAtRule.'
    - 'Intended contract: parseStylesheetSync returns CSSParserAtRule/CSSParserQualifiedRule, with nested rules adapted recursively.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-6-parser-api-type0.ts'
