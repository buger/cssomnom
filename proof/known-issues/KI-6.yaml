id: KI-6
title: toParserRule maps CSSOM type-0 at-rules to CSSParserRawRule instead of CSSParserAtRule
description: |
    parser-api toParserRule only promoted numeric CSSRule.type values that were not 0, 1, or 17 into CSSParserAtRule. Modern at-rules use type 0 (CSSLayerStatementRule, CSSLayerBlockRule, CSSContainerRule, CSSScopeRule, CSSStartingStyleRule, and others). parseStylesheetSync('@layer foo;') therefore returned a CSSParserRawRule fallback instead of CSSParserAtRule. Product fix: cssomAtRuleFromFields uses CSSOM name/prelude/cssRules (not first-`{` cssText slice); type 0 at-rules adapt to CSSParserAtRule with nested rules. DEFECT-260821-NYAR is stale class-closure paperwork from a rolled-back class-fix — do not delete. Class-closure for this landing is DEFECT-260822-T0AR.
