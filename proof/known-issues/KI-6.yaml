id: KI-6
title: toParserRule maps CSSOM type-0 at-rules to CSSParserRawRule instead of CSSParserAtRule
description: |
    parser-api toParserRule only promotes numeric CSSRule.type values that are not 0, 1, or 17 into CSSParserAtRule. Modern at-rules use type 0 (CSSLayerStatementRule, CSSLayerBlockRule, CSSContainerRule, CSSScopeRule, CSSStartingStyleRule, and others). parseStylesheetSync('@layer foo;') therefore returns a CSSParserRawRule fallback instead of CSSParserAtRule, and nested rules inside @layer/@container/@scope are not adapted recursively. Overlay audit cannot change product code. No DEFECT is filed: a ProblemReport is post-fix class-closure evidence, not a live ticket.
