mitigation: Type-0 CSSOM at-rules adapt to CSSParserAtRule via CSSOM fields (name/prelude/cssRules) with re-tokenize fallback. Nested rules are adapted recursively.
remediation: Landed in src/parser-api.ts (cssomAtRuleFromFields). Class-closure DEFECT-260822-T0AR. DEFECT-260821-NYAR is stale class-closure paperwork — do not delete.
