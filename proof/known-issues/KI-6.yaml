defect_class: latent
mitigation: toParserRule maps CSSOM type-0 at-rules whose cssText starts with @ to CSSParserAtRule and recurses cssRules.
remediation: Landed in src/parser-api.ts. Class-closure DEFECT-260821-NYAR.
