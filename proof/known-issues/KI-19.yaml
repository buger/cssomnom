    notes: |
        real_infrastructure: public CSSNumericValue.parse() and .toSum() (src/typed-om barrel,
        methods wired in src/typed-om/numeric/numeric-methods.ts) — no internal helpers.
        quantitative_impact: measured on current HEAD, Node v24.11.1 — 16-factor mixed-unit product
        allocated ~33.4MB live heap in ~77ms before the TypeError (reproducer L41 asserts <= 8MB);
        scan baseline: 2^16=65536 terms ~76ms ~190MB RSS, n=18 ~215ms ~336MB, n=20 ~740ms
        ~585MB-610MB RSS; ternary px/em/rem variant 3^10 terms.
        control_test: L33 asserts the same-unit positive conversion (calc(1px + 2px).toSum()
        serializes with 3px), proving conversion works when terms collapse.
        untrusted_attacker: the payload is a ~150-byte calc string; attacker controls both the
        expression shape and the unit mix that defeats canonicalization.
        current_deployment_relevance: .to()/.toSum() are the published Typed OM conversion API;
          confirmed live at HEAD d826b0f against a fresh build before filing.
        honest_severity: medium availability — memory/CPU spike per call; TypeError is eventually
        thrown correctly, only the cost profile is broken.
        attacker_profitability: exponential allocation for linear input bytes; each conversion call
        is a fresh amplification opportunity on a worker's heap.
        reproducible: two consecutive reproducer runs exited 1 with the asserted heap-budget failure
        (~33.4MB > 8MB); evidence capture re-ran it again.
        no_inflation: heap-delta proxy asserted (deterministic live-set growth) instead of wall-clock;
        n=16 chosen to demonstrate without risking runner OOM at n=20; cve_surface none.
        operational_path_verified: failing leg is the exact public conversion path hosts call.
        reachability_verified: any host converting attacker-influenced parsed numeric values via
        .to/.toSum reaches the uncapped distribution directly through public API.
