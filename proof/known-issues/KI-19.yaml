id: KI-19
title: CSSNumericValue.to/toSum cartesian expansion allocates 2^n terms without a cap
description: 'createSumValue in numeric-methods.ts distributes products of sums with nested cartesian loops and no intermediate term cap. A compact calc((1px + 1em)*(1px + 1em)*...) with n factors (relative units keep distinct unit maps) allocates prod|sum_i| = 2^n terms: n=16 is 65536 terms / ~30-34MB live heap growth / ~64-77ms, and n=20 reaches ~1M terms and ~585MB RSS per security scan — all paid BEFORE the conversion rejects the mixed-unit result with TypeError. Availability fault (CWE-400) on the published Typed OM .to()/.toSum() surface.'
affected_requirements:
    - SYS-REQ-260822-8BK4
evidence_manifests:
    - proof/evidence/ki-19.yaml
severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: CSSNumericValue.parse().to() / .toSum()
attacker_input: untrusted dimension/calc string parsed via CSSNumericValue.parse whose product-of-sums shape mixes units that do not collapse under canonicalization
reproducer_command: /tmp/node-v24.11.1-linux-x64/bin/node --experimental-strip-types --test proof/reproducers/KI-19-numeric-tosum-cartesian-expansion-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not call .to()/.toSum() on untrusted parsed values without an external memory guard.
remediation: Add a MAX_TERMS-style cap to the createSumValue product branch; fail closed (or lazily represent the product) once the term budget is exceeded instead of materializing the full cartesian product.
