id: KI-307
title: parse-a-rule entries overflow with a raw RangeError instead of SyntaxError
description: 'Parser.parseRuleText, the instance parseRule, and parseRuleInBlockText run the unbounded consume walk (src/parser.ts:1646-1681, 195-211). Deeply nested rule text escapes as a raw RangeError before any SyntaxError path runs. css-syntax-3 5.4.6 #parse-rule returns a syntax error; cssom-1 #parse-a-css-rule throws DOMException SyntaxError. The grouping-rule insertRule wiring stores parseRuleInBlock on every constructed rule, so insertRule paths inherit the leak.'
affected_requirements:
    - SYS-REQ-260821-7521
