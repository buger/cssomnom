    - proof/evidence/ki-307.yaml
severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: Parser.parseRuleText / Parser.parseRule / Parser.parseRuleInBlockText and their module exports (src/parser.ts)
attacker_input: rule text with deeply nested style rules passed to any parse-a-rule entry, including insertRule paths
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0069-parse-rule-entries-rangeerror.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Cap input nesting depth before calling parse-a-rule entries, or wrap calls in a stack guard.
remediation: Thread a nesting-depth budget through the consume walk and convert overflow into the DOMException SyntaxError the entries already promise.
