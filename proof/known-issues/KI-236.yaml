id: KI-236
title: CSSColorValue.parse accepts non-hex hash tokens and returns NaN channels
description: reifyColor admits hash tokens of length 3, 4, 6, or 8 without checking for hex digits, then parseInt on non-hex text yields NaN (src/typed-om/color/color-reify.ts:40-48). CSSColorValue.parse('#ggg') and ('#xyz') return rgb(nan,nan,nan). css-color-4 hex-notation allows hexadecimal digits only, so css-typed-om-1 parse-a-cssstylevalue step 3 must throw. The typed-om parse entry instead succeeds with NaN channels.
