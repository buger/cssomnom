id: KI-273
title: CSS.supports throws on non-string arguments instead of WebIDL CSSOMString conversion
description: supports dispatches on typeof value === 'string' and trims propertyOrCondition raw (src/parser-api.ts:766-769,635). The IDL types both arguments as CSSOMString, so WebIDL converts null, undefined and numbers before the algorithm runs. CSS.supports(null) and CSS.supports(undefined, 'red') therefore throw TypeError on trim, and CSS.supports('opacity', 0.5) takes the one-argument path and returns false.
