id: KI-304
title: Color resolver rewrites grammar-invalid rgb()/hsl() components into bogus colors
description: 'parseRgbComponents and parseHslComponents parseFloat every component and never reject NaN (src/cascade/color-resolver.ts:92-183). Garbage text resolves silently: hsl(0, foo, 50%) becomes rgb(NaN, NaN, NaN) and hsl(nope, 100%, 50%) becomes red. Invalid alpha coerces to opaque 1. Four space-separated components parse although the modern syntax requires a slash before alpha. Comma syntax silently drops a slash alpha, and unitless s/l values read as 0-1 fractions. Modern ''none'' components are rejected instead of computing as 0. css-color-4 #funcdef-rgb and #funcdef-hsl type every component, so invalid input must stay untouched.'
affected_requirements:
    - SW-REQ-260822-1REE
evidence_manifests:
    - proof/evidence/ki-304.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: normalizeComputedColor / parseRgbComponents / parseHslComponents (src/cascade/color-resolver.ts)
attacker_input: color declarations with off-grammar rgb()/hsl() component text; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0040-color-resolver-garbage-inputs.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Validate rgb()/hsl() component text against the css-color-4 grammar before trusting computed colors.
remediation: Reject non-numeric components and trailing junk, handle none as 0, require the slash for alpha, and return null so normalizeComputedColor passes the original text through.
