id: KI-267
title: setProperty throws a raw TypeError on non-string values instead of WebIDL conversion
description: 'setProperty reads value.includes(''var('') without coercing the argument (src/CSSStyleDeclaration.ts:521). The IDL types the argument as CSSOMString, so WebIDL converts numbers and string-coercible objects before the algorithm runs. setProperty(''margin'', 123), setProperty(''color'', {toString(){return ''blue''}}) and style.margin = 123 therefore throw TypeError: input.replace is not a function instead of converting and ignoring the invalid value.'
