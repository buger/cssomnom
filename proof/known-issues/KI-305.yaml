id: KI-305
title: Stream at-rule path ignores atRuleTypes custom typing
description: consumeAtRuleFromStream never reads this.atRuleTypes (src/parser.ts:1261-1319). A custom 'declaration' or 'rule' at-rule inside a group-rule body becomes a plain CSSAtRule. The token twin consumeAtRule honors the same option at the stylesheet top level. One Parser instance therefore produces two rule shapes for identical input.
