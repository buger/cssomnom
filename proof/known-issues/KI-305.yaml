severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.consumeAtRuleFromStream custom at-rule dispatch (src/parser.ts)
attacker_input: options.atRules typing plus a nested unknown at-rule; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0041-stream-atrules-ignored.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Keep custom-typed at-rules at the stylesheet top level until the stream path consults atRuleTypes.
remediation: Apply the customAtRuleType lookup in consumeAtRuleFromStream the same way consumeAtRule does.
