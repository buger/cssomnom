do_not_refile_as: KI-18 covers consumeBlockContents/consumeAtRule recursion on nested style rules and grouping at-rules; KI-22 covers math expression recursion. Both name different recursive subsystems and different defect legs than this media-condition parser crash.
dedup_armor: |
    Three distinct recursive subsystems under one hazard class. KI-18 pins the consume-algorithms stack: nested style rules (a{a{...}}) and nested grouping at-rules (@media all{...}) overflow inside consumeBlockContents/consumeNestedQualifiedRuleFromStream, with no media parsing involved. KI-22 pins the math expression parser on nested calc() input. KI-131 pins MediaParser condition descent over nested parenthesis blocks in the @media prelude, where the crash survives with a single qualified rule as body. A fix threading a depth counter through one subsystem performs no work on the others; each filing keeps its own tripwire legs and must not cross-close.
