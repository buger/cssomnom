reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-131-media-paren-depth-rangeerror-overlay-260826.ts
tripwire_mutation: Thread a depth counter through the media-condition parser so deep parenthesization fails closed into a structured parse error while balanced shallow queries keep parsing
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Reject untrusted stylesheets that contain long runs of open parentheses before parsing, or run the parser under a process-level stack guard.
remediation: Track condition depth in MediaParser and fail closed with a structured SyntaxError once a bounded limit is reached, mirroring the remediation plan of KI-18.
