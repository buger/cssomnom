id: KI-131
title: Media condition parenthesis nesting overflows the JS stack with a raw RangeError through parse() and insertRule()
description: 'MediaParser parses nested parenthesis blocks in a media condition through recursive descent with no depth counter. A @media prelude with about 2200 nested balanced parentheses drives parse() past the engine stack limit and a raw RangeError escapes to the caller. CSSStyleSheet.insertRule() leaks the identical RangeError for the same text. css-syntax-3 #consume-stylesheet-contents requires stylesheet ingestion to return a stylesheet, and the tokenizer itself survives 50000-deep nesting iteratively, so the recursion lives in the condition parser alone. This mechanism differs from the block-nesting recursion of KI-18 and from the math-expression recursion of KI-22.'
