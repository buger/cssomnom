id: KI-323
title: isValidLengthOrPercentage admits auto, CSS-wide keywords, and negatives as box sides
description: The ident branch returns true for auto and for initial/inherit/unset/revert/revert-layer, and the dimension and percentage branches never check the sign. One predicate gates every length box, so padding auto, padding -10px, scroll-margin auto, and margin 1px inherit expand instead of rejecting. css-box-3 padding is length-percentage [0,∞] with negatives invalid; css-scroll-snap-1 scroll-margin is length only; css-cascade-4 forbids mixing CSS-wide keywords with other values.
