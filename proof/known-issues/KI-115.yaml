        quantitative_impact: measured at HEAD on Node v24.11.1 - '@media(not (x))and (r)' retains conditionText 'not (x) and (r)' on pass 1 but its serialized text re-parses to 'not all' (2 defect legs: condition round-trip and whole-rule structure); 7 tests total, 5 green controls incl. all asserted mq-invalid-media-type-005 rows and the scope-honest bare '(x)' control.
