introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not feed CSSMediaRule.conditionText back into parse() and expect the same rule set for conditions containing negations under grouping.
remediation: Preserve (or re-derive) the grouping parentheses of nested condition terms when reconstructing conditionText so serialized text re-parses to the same media query.
notes:
