id: KI-115
title: conditionText serialization drops the grouping parens around a negated media condition
description: 'Parsing ''@media(not (x))and (r){.q{c:d}}'' correctly retains the valid grouped condition on pass 1 (conditionText ''not (x) and (r)''), but the serializer emits that text WITHOUT the outer parentheses around ''not (x)''. mediaqueries-4 #mq-syntax defines <media-not> = not S* <media-in-parens> as a complete production that cannot take an and-chain, so the serialized text matches neither <media-condition> alternative; re-parsing it replaces the query with ''not all'' per mediaqueries-4 #error-handling (~line 1031), violating css-syntax-3 #serialization (parse(serialize(parse(x))) must yield the same data structures). Root subsystem: MediaParser/serializer flattens the condition tree when reconstructing conditionText. Scope honesty: bare ''@media (x){}'' keeping ''(x)'' is SPEC-CORRECT (test_media_queries.html expression_should_be_unknown requires unknown features to stay parseable, not become ''not all'') and is asserted as a green control here, as are mq-invalid-media-type-005.html''s eight grammar-error rows which already pass.'
