    - '2026-08-25: F2 dedup pairing resolution: designated canonical for the KI-31/KI-115 near-duplicate pair as the older filing (created 2026-08-23T13:30:44Z; KI-31 followed at 13:41:59Z). Both remain open - genuine trigger difference (this file pins not-under-grouping round-trip collapse; KI-31 pins nested or/and operand grouping), same serializeMediaCondition paren-loss subsystem.'
    - '2026-08-25 (F2): canonical seat for the media-condition paren-loss cluster is THIS file (KI-115); KI-31 is the cross-linked sibling.'
