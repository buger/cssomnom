id: KI-316
title: :defined always matches, including never-defined custom elements
description: 'matchPseudoClassSelector returns true unconditionally for :defined (src/matcher.ts:665-667). html#selector-defined limits :defined to defined elements: built-ins and successfully upgraded custom elements. An autonomous custom element with a valid name and no definition must not match. The matcher reads no defined flag or registry, so ''my-el'' matches :defined before any upgrade.'
