tripwire_mutation: Route cascade-path custom property resolution through the same PropertyRegistry-aware logic as Parser.#resolveVarFunction (initial substitution + inherits gating + syntax validation); all three failing legs flip red->green while both positive controls stay green - leg 2 probes a true descendant (child carries only the consuming class), so adding inherits gating alone makes it converge.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not rely on getCascadedStyle for registered custom property semantics; use the parser-level var() resolution path until unified.
remediation: 'Make resolveCustomProperties consult PropertyRegistry for each custom property name: apply initialValue when unset, gate inheritance on the inherits descriptor, and validate values against the registered syntax, mapping failures to invalid-at-computed-value-time.'
