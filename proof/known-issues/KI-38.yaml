id: KI-38
title: 'Cascade computed-value path ignores PropertyRegistry: initial-value substitution, inherits flag and syntax validation all dead in getCascadedStyle'
description: 'registerProperty({name:''--len'',syntax:''<length>'',inherits:false,initialValue:''10px''}) is honored by Parser.#resolveVarFunction (src/parser.ts:1726-1823) but entirely ignored on the cascade path: substituteVariables/resolveCustomProperties (src/cascade/variable-resolver.ts:50+, :220+) consult only the cascaded custom-property maps - two resolvers in the same engine disagree. Observed legs: (1) width:var(--len) with no --len anywhere returns '''' instead of substituting the registered initial value 10px; (2) a TRUE descendant (child div carrying only the consuming class, inside <div class=p>) reads parent .p{--len:40px} through width:var(--len) as ''40px'' despite the inherits:false registration - an inherits:true control over the same descendant shape also propagates, isolating the missing inheritance gating; (3) .p{--len:red} fails <length> validation yet leaks through as width:''red'' instead of invalid-at-computed-value-time. Fixture honesty: an earlier draft of leg 2 placed both classes on the child (<div class="p c">), where .p applies DIRECTLY - correct even under inherits:false since the descriptor only blocks inheritance - so it could not evidence a leak; that direct-application confound was removed and the child now carries only class c. css-properties-values-api #calculation-of-computed-values (Overview.bs:202-216): the computed value of a registered custom property is determined by its registration syntax; a failing value makes the declaration invalid at computed-value time; #inherits-descriptor (:617,:627-629) controls whether the property inherits by default; #initial-value-descriptor controlling sentence (:642-644) specifies the initial value. Correctness fault (computed-value contract silently broken for every registered property consumer). Distinctness: KI-108/109/110 are substitution dispatch bugs; KI-111/KI-35 are registration-time validation; withdrawn KI-4 covered JS-vs-@property registration precedence, not cascade precedence.'
