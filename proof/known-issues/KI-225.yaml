attacker_input: selector strings starting with a combinator; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0020-relative-selector-matches.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Validate selector strings for leading combinators before calling matches or querySelectorAll.
remediation: Parse top-level matcher selectors with allowRelative false and delete the no-scope leading-combinator shortcut in matchComplexRecursive.
