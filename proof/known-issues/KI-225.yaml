id: KI-225
title: matches and querySelectorAll accept relative selectors and match them
description: matcher.parseSelector constructs SelectorParser with allowRelative true (src/matcher.ts:91). matchComplexRecursive returns true for a leading combinator whenever scope is undefined (src/matcher.ts:211-213). DOM matches() and querySelectorAll() parse a selector, not a relative selector, so '> div' is invalid input; this engine's documented posture is a silent empty match (KI-134). Instead, '> div' returns every element matching the trailing compound.
