id: KI-217
title: contractFlex serializes flex 0 1 auto as the css-wide keyword initial
description: 'contractFlex returns the literal string ''initial'' when grow is 0, shrink is 1, and basis is auto (src/shorthands.ts:1699-1701). cssom-1 #serialize-a-css-value may emit a css-wide keyword only when the longhand values are that keyword. Browsers serialize the specified longhands (''0 auto''), so getPropertyValue(''flex'') fabricates a keyword the author never wrote.'
