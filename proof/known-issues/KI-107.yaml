    notes: |
        real_infrastructure: public CSS.supports(property, value) from src/parser-api.ts only - no mocks; overlay reproducer imports the real parser API.
        quantitative_impact: measured at HEAD on Node v24.11.1 - CSS.supports('color', 'var()'), var(--ki107-name red), and both unclosed forms return true instead of false (4 defect legs); the three valid-var controls pass, isolating the defect to malformed-syntax handling.
        control_test: direct name, empty-fallback, and non-empty-fallback forms are asserted supported in the same run, so failures are not setup errors.
        untrusted_attacker: ordinary CSS value text passed to CSS.supports is the trust boundary; any caller probing feature support reaches the broken grammar check with zero privileges.
        current_deployment_relevance: feature querying gates author fallback paths; confirmed live via two red runs at HEAD plus evidence-capture re-execution.
        honest_severity: medium correctness - a wrong boolean steers feature detection; no memory-safety impact.
        attacker_profitability: not profit-driven; any consumer using supports() as an oracle ships broken fallbacks for malformed input.
        reproducible: node --experimental-strip-types --test proof/reproducers/KI-107-css-supports-malformed-var-overlay-260822.ts exited 1 twice at landing validation (2026-08-24).
        no_inflation: severity medium matches blast radius (incorrect boolean, recoverable); risk names correctness honestly; cve_surface none.
        operational_path_verified: failing legs call the exact two-argument CSS.supports entry hosts use; no debug or gated path involved.
        reachability_verified: public CSS namespace IS the product surface; no ingress layer exists between host and the supports() algorithm.
kill_domain: feature_query_grammar_validity
do_not_refile_as: generic supports() boolean plumbing or trailing-garbage value parsing (parser_api supports_throws surface); mixed-case VAR()/ENV() dispatch is KI-109 - this KI pins malformed substitution-function grammar only
