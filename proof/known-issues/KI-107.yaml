id: KI-107
title: CSS.supports accepts malformed var() syntax
description: CSS.supports returns true for malformed var() functions, including empty arguments, extra name tokens, and unclosed functions. CSS Conditional requires supports(property, value) to return true only when the value successfully parses; the CSS Variables var() grammar requires a dashed custom-property name and an optional fallback.
