id: KI-174
title: Unknown env() without fallback splices to zero tokens and leaves a mangled value
description: '#resolveEnvFunction returns an empty component list when the environment variable is missing and no fallback exists. css-env-1 env-function makes the containing property invalid at computed-value time in that case. Nested env() deletes itself and width: calc(1px + env(x)) resolves to the mangled string ''calc(1px + )'' instead of invalidating.'
