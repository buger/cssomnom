introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Provide a fallback in every env() until unknown names invalidate the property.
remediation: 'Return the guaranteed-invalid ident like #resolveVarFunction so the property collapses at computed-value time.'
