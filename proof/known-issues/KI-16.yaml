severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: querySelectorAll() / matches() / cascade rule filtering
attacker_input: untrusted selector or stylesheet selector text (:has(...) / long ~ chains) evaluated against a large host-side DOM-like tree
reproducer_command: /tmp/node-v24.11.1-linux-x64/bin/node --experimental-strip-types --test proof/reproducers/KI-16-has-combinator-no-match-budget-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not evaluate untrusted selectors containing :has() or long sibling combinators against large trees without an external timeout.
remediation: Thread a step/deadline budget through matches()/querySelectorAll() -> matchComplexRecursive -> matchHasPseudo/getAllDescendants, memoize :has results per query, and fail closed when the budget is exhausted.
