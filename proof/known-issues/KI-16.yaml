    notes: |
        real_infrastructure: public querySelectorAll()/matches() (src/matcher.ts) over a plain
        object DOM built to the exported DOMElement interface — the documented matcher contract.
        quantitative_impact: measured on current HEAD, Node v24.11.1 — ':has(~ .ki16-nope)' miss
        over 3000 siblings took ~224ms vs ~1.2ms for the equivalent class scan (~192x; reproducer
        L91 asserts <= 8x). Scan baseline at width 5000: 811ms vs 0.47ms (~1722x); deep-chain route
        ~627x at depth 2000. Superlinear growth confirmed across widths (255x@1k -> 1722x@5k).
        control_test: L81 asserts the linear-scan positive contract (all 3000 nodes match) and the
        parse-time nested-:has rejection, isolating the missing budget as the failure cause.
        untrusted_attacker: attacker supplies the selector text; host supplies tree size — both
        realistic in theme/filter/query-builder ingestion.
        current_deployment_relevance: matches() is also the cascade rule-filter sink, so attacker
          stylesheet selectors pay this cost during style resolution; confirmed live at HEAD d826b0f.
        honest_severity: medium availability — CPU-bound event-loop stalls that terminate;
          polynomial with large constants, honestly not exponential at tested sizes.
        attacker_profitability: a one-line miss selector turns a linear scan into Theta(w^2) work
        per evaluation and re-pays it per visited node via querySelectorAll.
        reproducible: two consecutive reproducer runs exited 1 with the asserted ratio failure
        (192x > 8x); evidence capture re-ran it again.
        no_inflation: ratio bound asserted instead of absolute wall-clock to stay hardware-fair;
        severity_basis reproducer; cve_surface none; scan's own finding says polynomial, filed as such.
        operational_path_verified: failing leg is the exact public tree-query API hosts call.
        reachability_verified: public matcher entry points are the product surface for selector
        evaluation; no privilege or internal path needed between host input and the sink.
