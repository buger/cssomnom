id: KI-118
title: NaN math results serialize with a lowercase nan identifier instead of the canonical NaN keyword
description: 'CSSStyleValue.parse(...).toString() serializes evaluated NaN results as calc(nan) / calc(calc(nan * 1px)) — a lowercase identifier. css-values-4 #calc-serialize step 2 ("serialize a math function") makes the spelling normative: serialize the keyword infinity, -infinity, or NaN, as appropriate; for a length-typed result the form is calc(NaN * 1px), matching local WPT css/css-values/calc-infinity-nan-serialize-length.html rows (1px * NaN -> calc(NaN * 1px); 1px * iNFinIty -> calc(infinity * 1px)). The wpt-cssom known-failure baseline carries 160 entries across the five calc-infinity-nan-serialize-* fixtures. Root-dedup: distinct from KI-39 (degenerate-Sum parenthesization/structure drift); this KI pins only canonical keyword casing via structure-independent assertions.'
