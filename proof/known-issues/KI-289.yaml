id: KI-289
title: Grouping-rule insertRule swallows the parse-rule SyntaxError for trailing garbage
description: 'CSSGroupingRule.insertRule wraps ParseHooks.parseRule in an empty catch and always proceeds to _parseRuleInBlock. cssom-1 #insert-a-css-rule steps 3-5 require parse a CSS rule, which css-syntax-3 #parse-a-rule fails on trailing tokens, followed by a SyntaxError throw. The nested-declaration recovery must not run for a non-nested grouping rule such as @media. consumeBlockContents keeps the leading qualified rule and swallows the garbage, so insertRule succeeds and mutates cssRules. Distinct from KI-160, which pins the constructed CSSStyleSheet default _parseRule.'
