attacker_input: host-supplied parentless duck-typed elements with an ownerDocument documentElement; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0034-parentless-root-custom-prop-leak.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Give every element a parent before requesting cascaded style.
remediation: Drop the documentElement fallback branch and let parentless elements start from an empty custom-property map.
