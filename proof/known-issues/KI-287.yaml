id: KI-287
title: Parentless element inherits documentElement custom properties instead of guaranteed-invalid
description: getCascadedStyle copies documentElement custom properties into rawCustomProps whenever parentCascaded is null and rootNode differs from the element. css-variables-1 defines custom-property inheritance from the parent element, so a parentless element holds the guaranteed-invalid initial value. A parentless connected element therefore resolves var(--x) inside custom properties against the root value. The leak only reaches custom-property substitution; standard properties keep the fallback.
