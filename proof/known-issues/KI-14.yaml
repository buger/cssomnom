id: KI-14
title: toParserRule maps CSSKeyframeRule (type 8) to CSSParserAtRule name unknown
description: |
    CSS.parseStylesheetSync('@keyframes x { from { color: red } }') adapts the parent CSSKeyframesRule (type 7) to a CSSParserAtRule, then maps each CSSKeyframeRule child (type 8) through the numeric at-rule branch because type is not 1/17/0. The child has no .name / .media / .cssRules, so the adapter emits {name:"unknown", prelude:[], body:null} instead of a CSSParserQualifiedRule with prelude "from" and a color declaration. Distinct from KI-6 (type-0 CSSLayer*/CSSContainerRule become CSSParserRawRule). Overlay audit cannot change product code.
affected_requirements:
    - INT-REQ-260821-WTPD
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSS.parseStylesheetSync
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-14-keyframes-parser-api.ts
reproduction_steps:
    - 'Call CSS.parseStylesheetSync(''@keyframes x { from { color: red } }'').'
    - Observe the child is CSSParserAtRule name "unknown" with empty prelude and body null.
    - 'Controls: @media nested style rules still adapt to CSSParserQualifiedRule; top-level from { color: red } is CSSParserQualifiedRule.'
    - 'Intended contract: the keyframe child is CSSParserQualifiedRule with prelude from and a color declaration.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-14-keyframes-parser-api.ts'
introduced_in: inception
defect_class: latent
mitigation: None on HEAD. Callers must not assume parseStylesheetSync keyframe children are CSSParserQualifiedRule.
remediation: Product hole is on origin/main logic restored in fe7defa (Implements comments kept). Overlay cannot land CSSKeyframeRule (type 8) qualified-rule adaptation in src/parser-api.ts toParserRule. Close only after the keyframe child is CSSParserQualifiedRule. No DEFECT — live unfixed bugs stay as KnownIssues.
notes:
    - '2026-08-22: discovered during code MC/DC unique-cause leftover work after restore fe7defa. Not KI-6 (type-0 at-rules). Overlay reproducer is a failing tripwire.'
