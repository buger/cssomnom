dedup_armor: |
    Only CSSKeyframeRule (CSSRule.type === 8) is mapped as an at-rule named unknown (no .name, empty prelude, body null). Distinct from KI-6, which is type === 0 (CSSLayerStatementRule / CSSLayerBlockRule / CSSContainerRule) falling through to CSSParserRawRule. CSSKeyframesRule type 7 still enters the numeric at-rule branch. Do not merge this KI into KI-6 without a second live type-8 hole.
