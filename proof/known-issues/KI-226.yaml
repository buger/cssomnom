affected_api: Parser.handleScopeRule and Parser.parseBlockContents forwarding into consumeBlockContents (src/parser.ts L241, L444, L1005)
attacker_input: nested stylesheets nesting conditional at-rules inside @scope, or hosts using Parser.parseBlockContents; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0017-scope-nested-grouping-decls-dropped.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Nest conditional at-rules directly in the style rule instead of inside @scope until the flag forwarding is fixed.
remediation: Forward the enclosing nested context into grouping at-rule bodies in handleScopeRule and parseBlockContents so their bodies parse as block-contents.
