id: KI-226
title: Grouping at-rules inside @scope or parseBlockContents drop nested declarations
description: 'handleScopeRule hardcodes consumeBlockContents(values, true, false) and forwards isNestedStyleRule=false into consumeAtRuleFromStream. The public parseBlockContents entry hardcodes the same pair. A grouping at-rule reached through either path parses its body with nested=false, so the declaration lookahead never runs. css-nesting-1 3.3 parses nested group rule bodies as block-contents, keeping declarations as CSSNestedDeclarations. ''.a { @scope (.foo) { @media (width > 0px) { color: red; .b {} background: blue; } } }'' drops both declarations. Direct nesting keeps them.'
