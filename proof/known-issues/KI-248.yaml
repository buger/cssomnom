id: KI-248
title: 'Typed OM numeric unit handling is case-sensitive: parse, to and toSum reject ''PX'''
description: 'parseNumericValue, numericTo, numericToSum and CSSUnitValue.to look up the raw unit string in unitToBase. css-values-4 #lengths makes unit identifiers ASCII case-insensitive. CSSNumericValue.parse(''10PX'') throws ''Invalid unit: PX''. new CSSUnitValue(10,''px'').to(''PX'') and .toSum(''PX'') throw the same SyntaxError instead of treating the argument as px.'
