        real_infrastructure: public parse() and CSSStyleDeclaration getters/cssText only - no mocks; WPT css/cssom/border-shorthand-serialization.html rows .a/.b/.c asserted verbatim as controls.
        quantitative_impact: measured at HEAD on Node v24.11.1 - border-image:url("x") 60 launders to all-initial longhands (getPropertyValue('border-image') === 'none', cssText omits the declaration entirely, 3 retention legs fail) and url(x) 60 silently truncates the slice (leg 4); 7 tests total, 4 defect legs red, 3 green WPT controls.
        control_test: gradient border-image survives (row .b modeled) and border shorthand suppression works when longhands are genuinely non-initial, proving the escape is quoted-url/slice handling inside expandBorderImage (src/shorthands.ts ~955-1001).
        untrusted_attacker: ordinary stylesheet text with quoted-url border-image declarations is the trust boundary; any host parsing user/theme CSS hits first-parse data loss with zero privileges.
        current_deployment_relevance: border-image with quoted urls is the most common authoring form; confirmed live via two red runs at HEAD plus evidence re-execution.
        honest_severity: high correctness - a whole author declaration vanishes from the object model and serialization, corrupting persisted stylesheets; still no memory-safety dimension.
        attacker_profitability: not profit-driven; CMS/build round-trips deterministically drop author intent for a mainstream declaration pattern.
        reproducible: node --experimental-strip-types --test proof/reproducers/KI-114-border-image-declaration-lost-overlay-260823.ts exited 1 twice at landing validation (2026-08-24), matching the pre-filing red pair recorded in the filing note.
