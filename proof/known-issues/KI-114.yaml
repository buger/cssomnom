tripwire_mutation: Teaching expandBorderImage to treat a function token named url as an image source (and to apply or invalidate trailing slice components) flips all four defect legs green while leaving the three WPT control legs untouched
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not rely on border-image surviving a parse cycle when the source url is quoted, and treat reconstructed 'border:' shorthand text as unreliable whenever border-image was authored alongside it.
remediation: Make expandBorderImage recognize function tokens named url as border-image-source values and either apply or invalidate the full declared value (slice included); contractBorder already suppresses the border shorthand once border-image-* are genuinely non-initial.
