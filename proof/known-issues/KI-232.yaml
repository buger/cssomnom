id: KI-232
title: HTML case-insensitive attribute matching covers only input[type] of the listed set
description: 'isHTMLCaseInsensitiveAttribute returns true only for input[type] although its docstring cites html #case-sensitivity-of-selectors (src/matcher.ts:451-454). That section lists 45 attributes (accept, align, bgcolor, checked, dir, disabled, lang, media, method, rel, target, type, valign, ...) whose values compare ASCII case-insensitively on HTML elements. [method=get] therefore misses form method=''GET''.'
