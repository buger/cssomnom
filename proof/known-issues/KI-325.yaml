id: KI-325
title: expandBackground expands grammar-invalid layers instead of rejecting
description: expandBackground classifies tokens by keyword tables and only length-caps the position list at four. css-backgrounds-3 gives each layer one position, one slash size, one repeat-style, and one attachment. The expander instead accepts three or four bare lengths, bare cover, contain, or auto as position, and left right or top bottom pairs. It also joins three repeat keywords into the default repeat, keeps repeat-x beside a second keyword, joins two attachments, and lets a third value after the size slash fall into the position. Every listed form must reject the declaration.
