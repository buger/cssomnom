id: KI-274
title: CSS.supports accepts operands that fail the supports-condition grammar
description: 'evalSupportsConditionValues inverts ''not'' operands with ! and joins ''or'' chains with .some() without checking that each operand parses as <supports-in-parens> (src/parser-api.ts:732,759). css-conditional-3 #supports-condition requires ''not'' and the and/or operators to be followed by <supports-in-parens>. A bare ident fails that production, so the whole condition fails to parse and supports must return false. CSS.supports(''not foo'') and CSS.supports(''(color: red) or foo'') therefore return true.'
