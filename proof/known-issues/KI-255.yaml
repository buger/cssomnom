id: KI-255
title: Substitution failure rolls back to the previous declaration instead of IACVT semantics
description: 'processStandardDeclarations and resolveCustomProperties continue to a lower declaration when substitution fails. css-variables-1 #guaranteed-invalid makes the failure poison the winner at computed-value time. Non-custom properties must compute as unset. Custom properties must compute as the empty guaranteed-invalid value. WPT variables-substitute-guaranteed-invalid.html asserts ''''. The cascade instead returns the loser''s value: red survives color: var(--missing), --x returns ''1px'', and a failed shorthand keeps margin-top: 10px.'
