id: KI-237
title: Unicode-range tokenizer guards emit delim U and swallow the range digits
description: consumeUnicodeRangeToken returns {type:'delim', value:'U'} when start or end exceeds U+10FFFF or end < start (src/AbstractTokenizer.ts:546-577). The caller already consumed U, +, the hex digits, question marks, and the hyphen range, so those code points vanish from the stream. css-syntax-3 consume-a-unicode-range-token steps 3, 5.3, and 6 always return a unicode-range token; range validity belongs to the font descriptor layer. U+A?????, U+110000, U+10-5, and U+1-110000 therefore lose the token list css-syntax-3 defines.
