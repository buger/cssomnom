severity: medium
severity_basis: risk
risk: correctness
affected_api: Tokenize with unicodeRangesAllowed=true (src/AbstractTokenizer.ts consumeUnicodeRangeToken; @font-face unicode-range descriptor re-tokenization)
attacker_input: unicode-range descriptor text with out-of-range or inverted values; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0022-urange-delim-guard.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Reject invalid ranges at the @font-face descriptor layer after tokenization.
remediation: Return the unicode-range token with the parsed start and end and drop the 0x10FFFF and end<start guards from the tokenizer.
