id: KI-34
title: :lang() wildcard language ranges never match
description: 'The :lang() arm in matcher.ts (~L598-606) implements only exact equality or dash-prefix comparison, so an asterisk-prefixed range like ''*-US'' matches nothing: with ancestor/own lang="en-US", matches(p, '':lang("*\-US")'') returns false where it must return true. selectors-4 #lang-pseudo (Overview.bs:2661-2667) requires each language range to be an RFC4647 extended language range matched by extended filtering per RFC4647 section 3.3.2, under which each ''*'' subtag acts as a wildcard (''*-US'' matches en-US; ''*-CA'' matches fr-CA); ranges containing asterisks may be quoted or escaped (:2643-2645). WPT fixtures css/selectors/selectors-4/lang-007.html (:lang("*-CH")), lang-008.html (:lang("*-Latn")), lang-010.html (:lang("*-FR")), lang-015.html (:lang(\*-FR)), lang-018.html (:lang("*-x-foobar")) and lang-021.html (:lang("*-gb")) all assert wildcard matching. Correctness fault: wildcard language selection silently selects nothing.'
