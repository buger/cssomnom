reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-34-lang-wildcard-extended-filtering-overlay-260823.ts
tripwire_mutation: Adding RFC4647 extended-filtering wildcard handling to the lang arm flips the wildcard leg red->green while exact/prefix controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Avoid wildcard :lang() ranges with this engine; enumerate concrete tags.
remediation: 'Implement RFC4647 extended filtering in the lang arm: split range and tag on ''-'', treat each ''*'' subtag as matching any single subtag, and keep ASCII case-insensitive comparison.'
