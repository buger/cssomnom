severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MediaParser.parse
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-5-media-unbalanced.ts
reproduction_steps:
    - Call MediaParser.parse('((') and serializeMediaQuery on each result.
    - Observe serialization '(())' with invalid unset.
    - 'Intended contract (MQ4): a query that does not match the grammar serializes as ''not all''.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-5-media-unbalanced.ts'
introduced_in: inception
defect_class: latent
mitigation: Unclosed () / functions in a media query force invalid so serializeMediaQuery emits not all.
remediation: Landed in src/parser.ts + src/MediaParser.ts. Class-closure DEFECT-260821-H3KB.
notes:
    - 'Overlay MC/DC reclassified after product fix: SAT TRUE unique-cause rows are witnessed; guarantee-violation FALSE rows are //mcdc:ignore:defensive (unreachable). Overlay reproducer PASSES and has no [known-issue] tripwire. Status remains fixed. KI-7 stays open.'
