    - "src/parser.ts:1502 #fixed class-fix: consumeBlock marks unclosed on EOF"
    - "src/parser.ts:1533 #fixed class-fix: consumeFunction marks unclosed on EOF"
    - "src/types.ts:176 #fixed class-fix: SimpleBlock.unclosed recovered-EOF flag"
    - "src/types.ts:184 #fixed class-fix: CSSFunction.unclosed recovered-EOF flag"
