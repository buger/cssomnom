id: KI-5
title: Unbalanced media query (( serializes as (()) instead of not all
description: |
    Media Queries 4 maps a query that does not match the grammar to the not-all media query. MediaParser.parse('((') used to recover the tokens as general-enclosed and serializeMediaQuery emitted '(())' because the invalid flag was never set. Product fix: css-syntax-3 EOF auto-close marks simple-block/function unclosed; normalizeAndValidate maps those queries to invalid so serializeMediaQuery emits not all. DEFECT-260821-H3KB is class-closure.
affected_requirements:
    - SW-REQ-260821-W8S1
    - SYS-REQ-260821-5283
commands:
    - node --test tests/media-validation.test.ts
evidence_manifests:
    - proof/evidence/ki-5.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: MediaParser.parse
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-5-media-unbalanced.ts
reproduction_steps:
    - Call MediaParser.parse('((') and serializeMediaQuery on each result.
    - Observe serialization '(())' with invalid unset.
    - 'Intended contract (MQ4): a query that does not match the grammar serializes as ''not all''.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-5-media-unbalanced.ts'
introduced_in: inception
defect_class: latent
mitigation: Unclosed () / functions in a media query force invalid so serializeMediaQuery emits not all. css-syntax-3 EOF auto-close is marked unclosed; MediaParser.normalizeAndValidate rejects those constructs before canonical re-serialize.
remediation: Landed in src/parser.ts (unclosed on consume-simple-block / consume-function EOF), src/types.ts, and src/MediaParser.ts (hasUnclosedConstruct). Class-closure DEFECT-260821-H3KB.
notes:
    - '2026-08-22: src logic restored to origin/main (264c2ea / 0.1.4) in fe7defa; Implements comments kept. Campaign class-fixes are gone. Reopened. Overlay reproducer is again a failing tripwire. DEFECT-260821-H3KB is stale class-closure paperwork — do not delete.'
    - '2026-08-22: class-fix re-landed after fe7defa restore. RED tests/media-validation.test.ts (( -> (()). GREEN twice Node 24: ((, (color, foo(, mixed lists serialize as not all; balanced (foo()) / (color) / (example, all,) unchanged. mediaqueries-4 § 3.2 #error-handling; css-syntax-3 § 5.5.9 / § 5.5.10 / § 2.2 #autoclosing.'
