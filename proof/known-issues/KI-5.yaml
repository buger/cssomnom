id: KI-5
title: Unbalanced media query (( serializes as (()) instead of not all
description: |
    Media Queries 4 maps a query that does not match the grammar to the not-all media query. MediaParser.parse('((') recovers the tokens as general-enclosed and serializeMediaQuery emits '(())' because the invalid flag is never set. Overlay audit cannot change product code. No DEFECT is filed: a ProblemReport is post-fix class-closure evidence (hardening, regression net, sibling sites), not a live ticket.
