dedup_armor: |
    serializeMediaQuery already returns 'not all' when query.invalid is true (&test, screen and, trailing comma). The hole is MediaQueryValidator accepting unbalanced '((' as general-enclosed so invalid stays unset. Do not merge this KI into a generic serializer defect without a second live recovered-invalid query.
