id: KI-149
title: Cascade maps logical properties with specified writing-mode and direction values
description: 'getCascadedStyle assigns the raw specified winner to its logical mapping context (src/cascade/index.ts:234-241). ''inherit'' and ''var(--wm)'' therefore map logical properties through the horizontal-tb ltr defaults. The emitted writing-mode and direction resolve correctly, so only the physical names go wrong: margin-inline-start maps to margin-left under a computed vertical-rl. CSS Logical 1 and CSS Writing Modes 4 define logical mapping against computed values.'
