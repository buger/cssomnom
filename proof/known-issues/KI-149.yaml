mitigation: Avoid CSS-wide keywords and var() in writing-mode, direction and text-orientation while resolving logical properties through this API.
remediation: Compute the winning writing-mode, direction and text-orientation through the same substitution and inheritance pass that produces the emitted values before calling resolveLogicalProperty.
