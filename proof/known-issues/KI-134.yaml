id: KI-134
title: matches() and querySelectorAll() swallow invalid selectors where the DOM contract throws SyntaxError
description: The matcher returns false and querySelectorAll returns an empty list for every selector that fails to parse, including fully invalid lists and mixed valid-plus-invalid plain lists. DOM Standard matches(), closest(), and querySelectorAll throw a SyntaxError DOMException when the selector list is invalid, and selectors-4 grants forgiving parsing only to :is() and :where(). Our :is(span,>>>) correctly still matches span, so the forgiving-list machinery exists; the top-level APIs stay silent instead. README claims Selectors 4 support and records no deviation for this error posture, so the divergence is undocumented interop drift. Silent false hides author typos that browsers surface loudly.
