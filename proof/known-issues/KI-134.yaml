mitigation: Validate selector text against a browser before trusting silent-false results from these APIs.
remediation: Throw SyntaxError from matches/querySelectorAll/querySelector on selector parse failure in non-forgiving contexts; keep :is()/:where() forgiving per selectors-4 and document any remaining intentional deviation in README.
