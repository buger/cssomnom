id: KI-36
title: '122 generated shorthands missing from runtime table: setProperty never expands gap/transition/grid'
description: 'Observed: setProperty(''gap'',''10px'') stores it verbatim; getPropertyValue(''row-gap'') returns ''''; mixed write orders leave wrong cascade winners that re-parse unchanged. API: setProperty/getPropertyValue/cssText - SHORTHANDS (src/shorthands.ts ~L1943) wires 44/165 of src/data/gen/shorthands.ts; 122 never resolve (runtime-only keys absent from the generated table). Expected: canonical-order longhand expansion keeping the greatest cascading winner (cssom-1 #concept-declarations-specified-order Overview.bs:2243-2245; css-gaps-1 #gap-shorthand :236; css-transitions-1 #transition-shorthand-property :510). Impact: silent data loss / cascade corruption.'
affected_requirements:
    - SYS-REQ-260823-SHX6
evidence_manifests:
    - proof/evidence/ki-36.yaml
severity: high
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: CSSStyleDeclaration.setProperty/getPropertyValue/cssText (src/shorthands.ts SHORTHANDS expansion table)
attacker_input: ordinary stylesheet text or CSSOM property writes naming any of the 122 uncovered shorthands; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-36-generated-shorthand-table-incomplete-overlay-260823.ts
tripwire_mutation: Back the runtime SHORTHANDS table with SHORTHANDS_DATA for all generated keys (generic two-value/four-value expanders where no bespoke expander exists); coverage leg plus both cascade legs flip red->green while the margin positive control stays green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not read longhands through getPropertyValue after setting an uncovered shorthand, and do not persist cssText produced by this engine; expand affected shorthands by hand before writing stylesheets.
remediation: Drive src/shorthands.ts SHORTHANDS entirely from src/data/gen/shorthands.ts SHORTHANDS_DATA (165 keys), supplying generic expanders for families lacking bespoke ones, so every generated shorthand expands into canonical-order longhands and serialization drops stale shorthands whose winners changed.
notes:
    - '2026-08-25: F2 ledger-hygiene description compression to <=600 chars (Observed/API/Expected/Impact shape); every dropped detail relocated verbatim here, zero content removed. Relocated: 122 uncovered families include gap, transition, animation, grid, columns, place-items/place-content/place-self, column-rule, text-decoration, mask and offset; getPropertyValue(''row-gap'') returns '''' after setProperty(''gap'',''10px'') although the block conceptually contains row-gap:10px; setting row-gap first and gap second leaves cssText ''row-gap: 30px; gap: 10px;'' with row-gap still reading 30px - the later gap declaration must win per greatest cascading order; setting gap then row-gap yields cssText ''gap: 10px; row-gap: 20px;'' keeping a stale unexpanded shorthand beside its override. Project-contract anchor: AGENTS.md Automation Over Hardcoding requires codegen output to back runtime tables. Distinctness: KI-112/113 cover font shorthand grammar roots; KI-114/116 cover expandBorderImage quoted-url handling; KI-36 is the missing table coverage itself.'
    - 'Calibration rule (2026-08-25, F2): untrusted_attacker marks hostile-input REACHABILITY of the affected API surface, not adversarial intent; attacker_profitability false reflects pure correctness impact.'
