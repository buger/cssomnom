id: KI-284
title: register keys the registry by the raw name; object-valued names alias the string key
description: WebIDL stringifies PropertyDefinition.name before registerProperty runs. PropertyRegistry.validate checks nameStr = definition.name.toString() but stores and looks up entries by definition.name itself. Registering a String object or coercible object naming '--x' then registering the string '--x' misses the existing entry. The duplicate registration stores without InvalidModificationError and leaves two live entries for one property.
