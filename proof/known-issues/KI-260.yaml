id: KI-260
title: normalizeComputedColor crashes on Object.prototype color identifiers like constructor
description: 'normalizeComputedColor tests membership with ''lower in NAMED_COLORS'' on a prototype-bearing object. CSS identifiers such as constructor and valueOf collide with Object.prototype keys. NAMED_COLORS[lower] then yields a function and the destructuring throws TypeError. getCascadedStyle crashes for the stylesheet value color: constructor.'
