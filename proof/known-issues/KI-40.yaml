severity: high
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: CSS.parseRule/parseRuleList/parseStylesheet -> CSSParserQualifiedRule.body (src/parser-api.ts toParserRule ~L452-461)
attacker_input: ordinary stylesheet text parsed through the public Parser API; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-40-parser-api-style-rule-body-drops-declarations-overlay-260823.ts
tripwire_mutation: In src/parser-api.ts toParserRule, test the qr.style branch before qr.cssRules truthiness (or check cssRules length / use styleToParserDeclarations when the rule is a style rule); both declaration legs flip red->green while the keyframe control stays green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not consume declaration content from Parser API qualified-rule bodies; use the CSSOM layer (CSSStyleRule.style) or re-parse rule cssText until the adapter maps declarations.
remediation: In toParserRule (src/parser-api.ts ~452-461), check qr.style before the qr.cssRules truthiness branch for style rules (or use styleToParserDeclarations when the record is a style rule) so CSSParserQualifiedRule.body carries the authored declarations; both reproducer legs flip red->green.
