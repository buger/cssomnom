    - proof/evidence/ki-144.yaml
severity: medium
severity_basis: risk
risk: availability
affected_api: MediaParser.evaluate custom media (--name) evaluation
attacker_input: caller-supplied customMedia map whose entries reference themselves or each other; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-custom-media-cycle-overflow.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Validate customMedia maps for cycles before wiring them into an environment.
remediation: 'Thread a visited set through evaluateMediaFeature custom media expansion and return unknown for any name already on the stack, per mediaqueries-5 #custom-mq loop handling.'
