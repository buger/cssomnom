id: KI-144
title: Custom media query cycles overflow the JS stack in evaluate without a visited set
description: 'evaluateMediaFeature re-parses custom media string values and re-evaluates them against the same environment (src/MediaParser.ts:1133-1140). A custom media entry that references itself recurses without a visited set until the engine stack overflows, and a raw RangeError escapes MediaParser.evaluate. mediaqueries-5 #custom-mq requires loops to fail to be defined, so the feature must evaluate unknown and the query must not match. The mechanism differs from the parenthesis-depth recursion of KI-131: this recursion lives in evaluation, not in condition parsing.'
affected_requirements:
    - SW-REQ-260822-QKE9
