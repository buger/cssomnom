id: KI-292
title: get returns the live registry record; mutating origin defeats the duplicate-JS gate
description: PropertyRegistry.get returns the Map value by reference and register stores { ...definition, origin } without freezing (src/PropertyRegistry.ts:364,374-376). register gates the JS-then-JS InvalidModificationError throw on existing.origin === 'js' (src/PropertyRegistry.ts:357-359). A caller that writes origin='css' on the object handed out by get() flips the gate and the next duplicate JS registration overwrites silently. SW-REQ-260821-V5GA requires the InvalidModificationError guarantee for every duplicate JS registration.
