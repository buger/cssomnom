attacker_input: library callers mutating the registration object returned by PropertyRegistry.get; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0036-get-leaks-registry-record.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat the object returned by get() as read-only.
remediation: Store a frozen internal record and have get() return a copy that omits the origin field.
