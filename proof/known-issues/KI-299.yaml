id: KI-299
title: Empty-parentheses media query becomes not all instead of general-enclosed
description: 'validateMediaInParens returns null when the filtered inner token list is empty (src/MediaParser.ts:492). mediaqueries-4 #mq-syntax defines <general-enclosed> = [ ( <any-value>? ) ], where the any-value is optional, so ''()'' is a valid general-enclosed query that evaluates unknown. normalizeAndValidate instead flags the query invalid and serializeMediaQuery emits ''not all''. The same validator accepts ''func()'' as general-enclosed, so the empty form alone is rejected.'
