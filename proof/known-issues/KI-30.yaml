attacker_input: source lines in scripts/** and tests/** acquiring child_process via computed-specifier dynamic import or variable require (no literal specifier adjacent to import tokens)
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-30-check-safe-exec-literal-import-only-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Keep relying on human review for exotic import shapes until the detector covers them; CI currently self-polices via the same guard.
remediation: 'Detect acquisition forms rather than literals: strip string concatenation/template joins before matching, additionally flag await import(...) whose argument is not a literal, and consider a runtime seam (import map or module loader hook) that hard-denies child_process outside the ALLOWED_FILES allowlist.'
