id: KI-30
title: check-safe-exec bans only literal child_process imports; computed-specifier dynamic imports bypass the guard
description: scripts/ci/check-safe-exec.ts:19 (verified at HEAD 83ce08f) reduces the AGENTS.md 'Safe Subprocess Execution & Mechanical Preflight Enforcement' contract to one literal-string regex /(?:from\s*|import\s*\(?\s*|require\s*\(\s*)['"](?:node:)?child_process['"]/ over source lines. A computed-specifier dynamic import ('node:'+'child_process'; await import(m)) or variable require acquires the module with zero matches, so checkFiles() (L37-72) returns no violations and main() prints the success message 'All scripts and tests conform to safe subprocess policies' (check-safe-exec.ts:94) while the fixture body spawns unmonitored children outside safeExecTestFile's constraints (--max-old-space-size=512, RSS/state-D watchdog, cleanup tracking). Policy bypass (CWE-155/CWE-693) against the project's own documented trust boundary; compliance risk, not direct RCE.
