id: KI-197
title: CSS.supports returns true for any value of properties without a generated syntax
description: 'Five legacy -webkit-box-* properties sit in SUPPORTED_PROPERTIES without a STANDARD_PROPERTIES_SYNTAX entry and without a shorthand. evaluateSupportsDeclaration reaches its unconditional final return for them, so every non-empty value reports supported. css-conditional-3 #supports-property-value requires the value to parse according to the property''s grammar. CSS.supports(''-webkit-box-align'',''zzz-not-a-value'') returns true instead of false.'
