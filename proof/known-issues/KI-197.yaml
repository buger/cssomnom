attacker_input: feature-detection queries against the five legacy -webkit-box-* properties; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types proof/reproducers/CRS-0068-supports-unsyntaxed-property-true.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat CSS.supports results for the legacy -webkit-box-* properties as unreliable until a grammar exists for them.
remediation: Generate STANDARD_PROPERTIES_SYNTAX entries for the remaining SUPPORTED_PROPERTIES members, or return false when no grammar is known for a property.
