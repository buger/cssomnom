id: KI-191
title: matchesSyntax compares the <url> function name case-sensitively, rejecting Url("x")
description: 'The <url> branch of matchesSyntax compares the function token name with === ''url''. css-values-4 #functional-notation makes function names ASCII case-insensitive. A registered <url> property rejects initialValue ''Url("sheet.png")'' with a SyntaxError. Unquoted URL(x) still works because the tokenizer folds it into a <url-token>. Only the quoted functional form hits the comparison.'
