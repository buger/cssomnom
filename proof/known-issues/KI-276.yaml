id: KI-276
title: CSSStyleSheet.deleteRule crashes with a raw TypeError on 0.5/NaN indices
description: 'deleteRule compares the raw index, so 0.5 and NaN pass the length gate. The code then reads this._rules[0.5], gets undefined, and isNamespaceRule dereferences .type on it. WebIDL types the argument unsigned long: ToUint32 maps 0.5 and NaN to 0, so cssom-1 #dom-cssstylesheet-deleterule must delete the first rule. A raw TypeError escapes instead of any DOMException.'
affected_requirements:
