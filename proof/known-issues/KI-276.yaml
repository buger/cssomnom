severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleSheet.deleteRule (src/CSSOM.ts)
attacker_input: caller-supplied non-integer index; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0031-deleterule-noninteger-typeerror.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Call deleteRule only with integer indices between 0 and length-1.
remediation: Convert the index through WebIDL unsigned long conversion before the bounds check, matching insertRule's required behavior (KI-163).
