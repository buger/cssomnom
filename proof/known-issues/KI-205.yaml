id: KI-205
title: parseComponentValueSync returns null for empty input instead of a syntax error
description: parseComponentValueSync returns null when only whitespace and comments remain (src/parser-api.ts:603-605). css-syntax-3 5.4.8 parse-a-component-value step 3 returns a syntax error for empty input after discarding whitespace. The same function already throws for leftover tokens at step 6, so the empty arm is inconsistent with its own leftover check.
