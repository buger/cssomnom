id: KI-244
title: Color rectifiers accept the keyword undefined in angle and number channels
description: rectifyColorAngle returns the keyword 'undefined' and the JS undefined branch fabricates it (src/typed-om/color/color-rectify.ts:94-105). css-typed-om-1 rectify-a-csscolorangle step 4 accepts only the keyword 'none'; every other keyword reaches the step 5 throw. css-color-4 hue is <number> | <angle> | none. CSSColorValue.parse('oklch(50% 0.1 undefined)') therefore returns a color instead of throwing, breaking the parse_throws guarantee for invalid input.
