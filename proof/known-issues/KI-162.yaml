id: KI-162
title: Missing-URL @import fabricates a CSSImportRule with empty href
description: handleImportRule leaves href empty when the prelude carries no <url> or <string> and still constructs a CSSImportRule. css-cascade-6 at-import makes the URL mandatory, so @import; and @import screen; must be ignored. The fabricated rule reaches cssRules with href ''. KI-43 pins the bad-url leg of the same handler; this pins the missing-URL leg.
affected_requirements:
    - INT-REQ-260821-30ZA
    - INT-REQ-260821-9SGA
evidence_manifests:
    - proof/evidence/ki-162.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.handleImportRule (src/parser.ts)
attacker_input: stylesheet or insertRule text with an @import prelude lacking a URL; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0002-import-missing-url-fabricates-rule.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Always include a string or url() in @import preludes.
remediation: Track whether a URL was found and return null from handleImportRule when the prelude never matched a <url> or <string>.
