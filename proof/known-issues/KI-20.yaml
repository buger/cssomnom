    notes: |
        real_infrastructure: mirror legs replicate the three production sinks line-for-line
        (extract_nv_cssom.ts:44-55 slicing+eval, extract_rrweb.ts:26-50 sandbox shape +
        vm.createContext/runInContext, extract_wpt.ts regexes + runInNewContext at :126/:257),
        cited at HEAD 83ce08f; extractor scripts are top-level-executing modules with no exports,
        so importing them would harvest real submodules — mirroring is the faithful spawn-free
        route per batch convention.
        quantitative_impact: hostile TESTS-array element expression executes bare eval in the HOST
        realm and writes a marker file via process.getBuiltinModule('node:fs'); rrweb leg escapes
        via this.constructor.constructor('return process')() (scan Route B, confirmed on Node
        v24.11.1 where ({})..constructor chains fail but context-global this succeeds); both
        runInNewContext legs evaluate object-literal value expressions that write host markers.
        3/3 families produce host-realm side effects from ~200 bytes of vendored-content stand-in.
        control_test: benign arrays/literals extract to expected fixture values with ZERO
        side-effect markers in the same run (L105), so failures are execution, not parsing noise.
        untrusted_attacker: submodule content authored upstream is the boundary; pins move via
        pnpm run submodules:upgrade on every maintenance cycle.
        current_deployment_relevance: MAINTENANCE.md's documented loop (submodules:upgrade ->
        fixtures:generate) detonates vendored payloads automatically; extract_all.ts spawnSyncs
        every extractor.
        honest_severity: medium data_integrity — maintainer/CI host exec, not
        remote-unauthenticated; sibling extractors prove data-only extraction was always viable.
        attacker_profitability: one merged upstream commit or moved pin converts a routine
        fixture regen into filesystem/env/network access as the developer identity.
        reproducible: two consecutive reproducer runs exited 1 (hostile legs assert markers must
        NOT exist; they do); evidence capture re-ran it (proof/evidence/ki-20.yaml status fail).
        no_inflation: severity_basis reproducer; cve_surface none; no RCE-against-third-parties
        claimed — impact scoped to this repo's tooling identity.
        operational_path_verified: mirrored sinks are the exact statements executed by
        'pnpm run fixtures:generate'.
        reachability_verified: any maintainer following the documented upgrade loop reaches all
        three sinks with zero additional privileges.
