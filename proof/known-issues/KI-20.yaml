id: KI-20
title: Fixture extractors execute vendored submodule JavaScript via eval/vm instead of parsing it
description: 'Three fixture-harvest scripts treat vendored submodule JS as code: scripts/external_suites/extract_nv_cssom.ts:55 bare-evals the sliced ''var TESTS = [...]'' array (element expressions run in the HOST realm); extract_rrweb.ts:49 vm.runInContext''s full submodule content over a plain-object sandbox whose leaked host closures give this.constructor.constructor chains to host process.getBuiltinModule(''fs''); extract_wpt.ts:126/:257 vm.runInNewContext regex-matched object literals so literal-value expressions evaluate cross-realm (all sinks verified at HEAD 83ce08f). A compromised upstream bump or malicious submodule pin move turns the next ''pnpm run fixtures:generate'' into maintainer/CI host code execution (CWE-94 supply-chain family).'
affected_requirements:
    - SYS-REQ-260823-AKDT
evidence_manifests:
    - proof/evidence/ki-20.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: pnpm run fixtures:generate -> scripts/external_suites/extract_nv_cssom.ts, extract_rrweb.ts, extract_wpt.ts (via extract_all.ts)
attacker_input: hostile JavaScript embedded in vendored submodule content (submodules/CSSOM parse.spec.js TESTS array elements, rrweb-cssom parse.spec.js body, web-platform-tests HTML var tests/test_map object literals)
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-20-fixture-extractors-eval-vm-submodule-js-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Skip fixtures:generate after submodule bumps until extraction is data-only; treat submodule pins as trusted only from audited upstreams.
remediation: 'Replace execution sinks with data-only parsing: JSON5/JSON.parse for array/object literals (sibling extract_csstree.ts/extract_postcss.ts already show the pattern), or a grammar-limited literal parser that never evaluates call expressions; delete the eval and vm.runInContext/runInNewContext calls outright.'
owner: agent:champ
review_date: "2026-09-22"
release_disposition: ship_with_known_issue
status: open
