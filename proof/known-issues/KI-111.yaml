severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSS.registerProperty({syntax, initialValue})
attacker_input: ordinary registered-property definition; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-111-registered-syntax-matcher-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not register typed custom properties with function-shaped initial values unless independently validated against the declared syntax.
remediation: Parse initialValue with the complete registered syntax definition and throw SyntaxError when <length> or <image> matching fails.
