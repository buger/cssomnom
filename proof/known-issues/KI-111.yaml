id: KI-111
title: Registered syntax matcher accepts invalid length and image initial values
description: CSS.registerProperty accepts arbitrary function tokens as initial values for registered <length> and <image> syntaxes. The Properties and Values API requires initialValue to parse according to the consumed syntax definition and throw SyntaxError on failure; the implementation matcher only checks function shape for these types.
affected_requirements:
