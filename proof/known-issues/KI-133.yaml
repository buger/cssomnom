kill_domain: conditional_rule_ingest_grammar
do_not_refile_as: KI-107 owns CSS.supports(property, value) returning true for malformed var() syntax on the boolean API; this filing owns rule retention at ingest for conditions that fail the css-conditional grammar outright.
dedup_armor: |
    css-conditional-3 rule-level ingest grammar versus boolean evaluation. KI-107 covers the CSS.supports(property, value) API returning true for malformed var() argument syntax after a condition already parsed. KI-133 covers stylesheet ingest retaining whole @supports rules whose condition matches no production of #supports-syntax, where css-conditional-3 mandates ignoring the rule with all of its contents. Different surfaces (CSS.supports call versus parse()/cssRules), different clauses (declaration-value parse versus condition grammar), different observables (boolean true versus retained rule). Fixing one performs no work on the other, so merging hides a leg. WPT legs at-supports-019 through at-supports-026 belong to this filing only.
