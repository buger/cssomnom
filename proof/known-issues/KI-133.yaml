id: KI-133
title: Grammatically invalid @supports rules are retained at ingest instead of being ignored with all contents
description: 'css-conditional-3 #supports-syntax requires processors to ignore any @supports rule whose condition fails the grammar, including all of its contents. The parser retains eight probed invalid shapes as CSSSupportsRule objects: empty declaration values, trailing close parentheses, bracket blocks in place of parens, mismatched closers, operand-less not, and dangling and operators. WPT fixtures at-supports-019 through at-supports-026 pin the same shapes as ignored rules. Retention makes dead conditions observable through cssRules and cssText and lets their contents apply under a condition no browser would construct. KI-107 covers malformed var() acceptance inside CSS.supports evaluation, which is a different surface and clause.'
