mitigation: Treat every @supports rule from this library as suspect until the condition parses; validate conditions independently before relying on rule presence.
remediation: Validate the parsed condition against the css-conditional-3 grammar during ingest and drop invalid rules together with their contents, matching WPT at-supports recovery expectations.
