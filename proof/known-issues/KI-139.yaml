id: KI-139
title: Unknown-valued media queries serialize as themselves instead of not all
description: 'mediaqueries-4 #error-handling requires a media query whose value is unknown to be replaced by not all during parsing. MediaParser.parse keeps such queries valid, so serializeMediaQuery emits the original text. matchesType admits number-typed math functions for integer features without checking integrality, so (color: calc(1.5)) stays a valid unknown query. The plain form (color: 20example), the spec''s own example, misserializes identically through MediaList.cssText.'
affected_requirements:
    - SW-REQ-260822-QKE9
evidence_manifests:
    - proof/evidence/ki-139.yaml
severity: low
severity_basis: risk
risk: correctness
affected_api: MediaParser.parse / serializeMediaQuery reaching MediaList.cssText
attacker_input: caller-supplied media query text with values that fail the feature value syntax; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-unknown-query-not-folded.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Callers can post-filter queries through hasUnknownFeature and substitute not all before serializing.
remediation: 'Fold queries whose condition evaluates unknown into the invalid not-all form at the end of normalizeAndValidate, per mediaqueries-4 #error-handling.'
