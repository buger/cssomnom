id: KI-176
title: Hard-coded mediaall rejection drops an unknown at-rule every other name keeps
description: isSupportedAtRule rejects the literal name 'mediaall' before the unknown-at-rule fallback. css-syntax-3 consume-at-rule returns unknown at-rules, and cssom-1 the-cssrule-interface expects such rules to report type 0. '@mediaall {}' is dropped while '@foo {}' survives as CSSAtRule, so one arbitrary name diverges. The special case exists to satisfy the external nv/rrweb fixture, which records CSSOM.js behavior rather than the spec.
