mitigation: Treat any serialized border-image text containing a quoted url as potentially unstable across parse cycles until fixed.
remediation: Make expandBorderImage accept the function-token form of url (the form our own serializer emits) so the shorthand reaches a one-cycle fixpoint, matching background:url() behavior.
notes:
    - 'Evidence captured via ''proof evidence capture KI-116'' by genuine re-execution at 2026-08-23T13:30:53Z (proof/evidence/ki-116.yaml); reproducer ran red twice before filing (exit 1 both runs: 5 tests, 2 green controls incl. background:url() stability, 3 defect failures). Kept separate from KI-114 despite shared expandBorderImage trigger surface: distinct violated contract (css-syntax-3 #serialization fixpoint stability vs first-parse retention), documented in docs/proof-escape-ki-114-116.md. Bound to draft SYS-REQ-260823-BNDX created through ''proof req new''; informal until cssom variables can be declared.'
