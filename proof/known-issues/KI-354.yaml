affected_api: CSSStyleRule selectorText setter via the public cssRules getter (src/CSSOM.ts)
attacker_input: host-built non-origin-clean sheets created through createInternal; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0065-selector-text-setter-security-error.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Re-parent rules onto an origin-clean sheet before mutating selectors.
remediation: Read the namespace context from the internal rule list, mirroring the fix KI-222 requires for the getter, so the setter never crosses the origin-clean gate.
