id: KI-354
title: The selectorText setter walks the origin-clean cssRules getter and throws SecurityError
description: The CSSStyleRule selectorText setter iterates sheet.cssRules to collect namespaces (src/CSSOM.ts ~827). That getter throws SecurityError when the sheet is not origin-clean, so assigning selectorText on a rule of a sheet built with CSSStyleSheet.createInternal(rules, parse, false) aborts before the selector parses. cssom-1 defines the setter as a selector re-parse with no SecurityError step. The getter half of the same leak is KI-222.
