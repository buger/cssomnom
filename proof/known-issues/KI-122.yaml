minimization_status: minimized
mitigation: Do not rely on the constructor identity of values read back from StylePropertyMap for limited-range properties until range wrapping is implemented.
remediation: 'In create-an-internal-representation, detect grammar components with limited numeric ranges ([0,∞], [1,∞), [0,1], [1,1000]) and wrap out-of-range CSSUnitValue parts in a fresh CSSMathSum before storing, so get()/getAll() reify the wrapped shape (css-typed-om-1 #create-an-internal-representation).'
