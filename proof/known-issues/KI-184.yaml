id: KI-184
title: consumeAtRule drops valid nested statement at-rules when '}' ends the prelude
description: 'The nested ''}'' arm returns null unconditionally (src/parser.ts:380-381). css-syntax-3 #consume-at-rule returns the rule when it is valid in the current context. css-cascade-5 #layer-empty allows @layer statements everywhere @layer blocks are allowed, and css-nesting-1 lists @layer as a nested group rule. Parser.consumeRule(true) must therefore return a nested ''@layer foo'' closed by ''}''. The stream twin consumeAtRuleFromStream completes the same rule, so the two paths disagree.'
affected_requirements:
    - INT-REQ-260821-N2VE
evidence_manifests:
    - proof/evidence/ki-184.yaml
severity: low
severity_basis: risk
risk: correctness
affected_api: Parser.consumeRule/consumeAtRule with nested=true
attacker_input: token stream holding a nested statement at-rule closed by '}' passed to the public consumeRule(true); local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0007-consume-atrule-nested-curly-drops.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Route nested at-rules through consumeAtRuleFromStream, which completes them, until the token twin matches.
remediation: 'Return the at-rule on nested ''}'' when it is valid in the current context and leave the ''}'' token for the parent block, per css-syntax-3 #consume-at-rule.'
