id: KI-187
title: Grouping-rule insertRule prefixes the nesting selector when no style rule encloses it
description: CSSGroupingRule.insertRule derives its nested flag from this instanceof CSSStyleRule or parentRule !== null. A media rule nested inside a media rule therefore parses inserted text as nested block contents. normalizeNestedSelector prepends the implicit ampersand, so insertRule('div {}') yields '& div'. cssom-1 insert-a-css-rule parses the text with the css-syntax-3 parse-a-rule steps. css-nesting-1 conditionals applies block-contents parsing only inside style rules. The same text parsed in place keeps 'div', so insertRule disagrees with the initial parse.
