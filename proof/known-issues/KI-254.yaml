id: KI-254
title: Typed OM parse skips math-function argument validation outside calc/min/max/clamp
description: 'validateMathFunctions only parses calc, min, max and clamp. Other math functions such as sin() and hypot() recurse into children without argument validation. CSSStyleValue.parse(''width'',''sin(garbage)'') reifies a CSSMathFunction although garbage is not a calculation for any property. ''width: calc(garbage)'' throws for the same reason.'
