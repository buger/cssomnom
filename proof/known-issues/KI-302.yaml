id: KI-302
title: serializeFontFamily emits unescaped quotes and drops empty comma groups
description: 'serializeFontFamilyItem wraps string families in raw quotes without serializeString (src/serializer.ts:928-942). A family containing a quote character serializes as broken CSS that re-tokenizes as three tokens. The function also drops empty comma groups, so ''Arial,'' becomes ''Arial'' and ''Arial,,serif'' loses a separator. css-syntax-3 #serialization requires round-trip fidelity.'
