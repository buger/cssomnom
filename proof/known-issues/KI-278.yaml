id: KI-278
title: deleteRule unregisters an @property name that a surviving duplicate rule still registers
description: 'CSSStyleSheet.deleteRule calls PropertyRegistry.unregister for every deleted CSSPropertyRule. css-properties-values-api #determining-registration lets the last valid @property rule in sheet order win a name. Deleting that winner while an earlier valid duplicate remains must re-register the survivor. The unconditional unregister drops the name, leaving a live @property rule with no registration.'
affected_requirements:
    - SW-REQ-260821-PAKB
evidence_manifests:
    - proof/evidence/ki-278.yaml
severity: medium
severity_basis: risk
risk: data_integrity
cve_surface: none
affected_api: CSSStyleSheet.deleteRule / PropertyRegistry.unregister (src/CSSOM.ts, src/PropertyRegistry.ts)
attacker_input: stylesheets containing duplicate @property rules followed by a deleteRule call; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0031-deleterule-property-unregister.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Avoid deleting one of several @property rules sharing a name; re-parse the sheet to restore registrations.
remediation: After removing a CSSPropertyRule, recompute the registration for its name from the remaining @property rules in sheet order.
