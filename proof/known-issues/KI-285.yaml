id: KI-285
title: Streaming tokenizer eager lookaheads withhold complete tokens until close()
description: 'AbstractTokenizer evaluates this.cp, peek(1), and peek(2) eagerly as call arguments in isValidEscape, wouldStartNumber, wouldStartIdentSequence, and wouldStartUnicodeRange. StreamingTokenizer.cp and peek throw NeedMoreDataError at the end of the buffered chunk. A lookahead that runs past a token terminator already inside the chunk therefore aborts consumeToken for a finished token. tokenizeLoop treats every NeedMoreDataError as an incomplete token: it rolls pos back and stops without pushing. Ident, function, dimension, hash, delim, percentage, and number tokens terminated at chunk end stay invisible to getTokens until close(). css-syntax-3 4.3.1 #consume-token decides each of these tokens from in-buffer code points, and SW-REQ-260821-QV2H requires tokens_available_after_get_tokens whenever a complete token sits in the chunk.'
affected_requirements:
    - SW-REQ-260821-QV2H
