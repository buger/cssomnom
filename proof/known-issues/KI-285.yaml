severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: StreamingTokenizer.appendChunk/getTokens and StreamingTokenizerStream.peek via AbstractTokenizer lookahead helpers (src/AbstractTokenizer.ts, src/streaming-tokenizer.ts, src/TokenStream.ts)
attacker_input: caller-supplied chunk boundaries that end right after a token terminator; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0033-streaming-eager-lookahead-withholds-tokens.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Close the tokenizer before reading tokens, or append the terminating code point in the same chunk plus one more.
remediation: Evaluate lookahead arguments lazily in AbstractTokenizer, or make StreamingTokenizer.peek return a sentinel the guards can treat as not-a-match, and only roll back for genuinely incomplete tokens.
