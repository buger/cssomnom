id: KI-259
title: Logical mapping context picks the last writing-mode declaration, not the cascade winner
description: getCascadedStyle reads the last grouped writing-mode declaration before any cascade sort. groupDeclarationsByProperty appends in encounter order. CSS Logical 1 maps logical properties against the computed writing-mode. An earlier important vertical-rl therefore loses to a later normal horizontal-tb, and margin-block-start maps to margin-top instead of margin-right.
