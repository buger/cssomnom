id: KI-106
title: CSSStyleDeclaration setProperty and cssText accept invalid display values
description: Both CSSStyleDeclaration.setProperty("display", ...) and the cssText setter retain a value outside the CSS Display grammar. CSSOM requires an invalid parsed value to be ignored and the declaration to remain unchanged; the implementation stores the invalid display value.
