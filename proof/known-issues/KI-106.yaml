id: KI-106
title: CSSStyleDeclaration setProperty and cssText accept invalid display values
description: Both CSSStyleDeclaration.setProperty("display", ...) and the cssText setter retain a value outside the CSS Display grammar. CSSOM requires an invalid parsed value to be ignored and the declaration to remain unchanged; the implementation stores the invalid display value.
severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSSStyleDeclaration.setProperty() / CSSStyleDeclaration.cssText
attacker_input: ordinary CSSOM caller-supplied invalid display value; no attacker required
sanitizer: manual:logic
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not treat a setProperty or cssText success as evidence that a display value is valid.
remediation: Route both mutation paths through property-specific display validation; invalid values must be a no-op and valid neighboring declarations must remain.
notes:
    - Withdrawn as a duplicate of KI-105 after KI-105 gained independent parser, setProperty, and cssText subtests; the consolidated root remains open.
    - 'Superseded-by: KI-105. Withdrawn record intentionally retains no command, reproducer, or evidence references.'
