id: KI-262
title: Nested declarations inside @scope lose their selector specificity
description: 'walkRules threads scopeNode from any ancestor @scope into every descendant. The CSSNestedDeclarations arm zeroes specificity whenever scopeNode is truthy. css-cascade-5 #cascade-sort sorts declarations by their originating selector''s specificity. Declarations nested after an at-rule inside a scoped .foo rule therefore lose to a later div rule.'
