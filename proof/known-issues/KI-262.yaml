reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0026-scope-nested-declaration-specificity.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Declare nested values directly in the style rule instead of after a nested at-rule inside @scope.
remediation: Zero specificity only when the CSSNestedDeclarations rule's direct parent is the CSSScopeRule, not for any scoped ancestor.
