severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: matchAttributeSelector (src/matcher.ts)
attacker_input: namespaced attribute selectors over DOM trees exposing hasAttributeNS; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0020-attribute-namespace-ignored.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Use [|attr] for the null namespace; avoid [*|attr] over namespaced-only attributes.
remediation: Route '*' through hasAttributeNS for every namespace and resolve declared prefixes against the stylesheet namespace context.
