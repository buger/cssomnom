id: KI-231
title: 'Attribute selectors ignore namespaces: [*|attr] misses namespaced attributes'
description: 'matchAttributeSelector handles namespace '''' through hasAttributeNS and sends every other namespace, including ''*'', to the un-namespaced hasAttribute (src/matcher.ts:389-404). selectors-4 #attrnmsp defines [*|attr] as the attribute in any namespace and [ns|attr] as the prefix-resolved namespace. [*|href] therefore misses an element carrying only xlink:href, and parsed prefixes are never resolved at all.'
affected_requirements:
    - SW-REQ-260821-6D9T
