id: KI-224
title: expandLineClamp stores junk tokens in max-lines instead of rejecting line-clamp
description: 'expandLineClamp returns the leftover token list as max-lines without any type check (src/shorthands.ts:1764-1768). css-overflow-4 #line-clamp grammar is none | [<integer [1,infinity]> || <''block-ellipsis''>]. line-clamp: 3 foo therefore stores max-lines ''3 foo'', and a stylesheet comment inside the value even serializes into the longhand.'
