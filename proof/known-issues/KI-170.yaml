id: KI-170
title: Malformed var() declarations dropped at parse time, not at computed value
description: 'validateDeclarationValue routes var() with an empty name through validateVarFunction and returns false, so consumeDeclarationFromStream drops the declaration. css-variables-1 guaranteed-invalid defines an invalid substitution function as producing the guaranteed-invalid value at computed-value time. The declaration must survive parsing; cssText currently loses color: var() entirely.'
