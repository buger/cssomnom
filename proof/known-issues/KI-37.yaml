id: KI-37
title: Comment in descendant-combinator position drops the entire qualified rule
description: 'parse(''div/**/x{a:b}'').cssRules.length === 0 - the whole rule vanishes; the whitespace control ''div x{a:b}'' parses one rule with selector ''div x'', while ''div > /**/ p'' and ''/**/div'' are unaffected, localizing the fault to implicit-descendant handling. Root cause: SelectorParser.skipWhitespace (src/SelectorParser.ts:102-106) skips only ''whitespace'' ComponentValues, so a preserved ''comment'' token where the descendant combinator belongs breaks recognition of two adjacent compound selectors. css-syntax-3 #serialization (Overview.bs:3701-3704) requires that implementations preserving comments ensure ''this preserved information must have no effect on the parsing step''; selectors-4 #descendant-combinators (Overview.bs:4281-4283) defines the descendant combinator as ''whitespace that separates two compound selectors''. Correctness fault (silent structural loss): stylesheets containing innocuous comments between compound selectors silently lose rules at parse time. Distinct from KI-31 (media condition paren dropping, different layer) and from comment-in-value handling.'
