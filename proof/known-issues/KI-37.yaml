severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: parse() -> CSSStyleSheet.cssRules via SelectorParser (skipWhitespace)
attacker_input: ordinary stylesheet text with a comment between compound selectors; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-37-selector-comment-descendant-drop-overlay-260823.ts
tripwire_mutation: Teach skipWhitespace (or its callers) to also skip comment tokens in selector parsing so an implicit descendant combinator is recognized across trivia; both failing legs flip red->green while explicit-combinator and leading-comment controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Strip comments from selector text before invoking this engine, or avoid comments inside complex selectors.
remediation: Treat preserved comment tokens as ignorable trivia equivalent to whitespace in SelectorParser (skip in skipWhitespace and wherever implicit-descendant adjacency is decided), honoring css-syntax-3's no-effect-on-parsing requirement.
