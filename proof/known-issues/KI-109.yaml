id: KI-109
title: Mixed-case VAR() and ENV() are not dispatched in custom properties
description: The custom-property cascade gate detects only lowercase var( and env( text, so mixed-case VAR() and ENV() stored in intermediate custom properties are not dispatched even though CSS function names are ASCII case-insensitive. Lowercase direct controls pass, while use-site replacement exposes the unresolved intermediate function.
