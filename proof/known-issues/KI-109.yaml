    notes: |
        real_infrastructure: real parseStyleSheet + getCascadedStyle + CSSStyleDeclaration over linkedom - no mocks.
        quantitative_impact: measured at HEAD on Node v24.11.1 - --y: VAR(--x) leaves color unresolved (fallback red wins) and --safe: ENV(safe-area-inset-top) leaves padding-top at its 9px fallback instead of '0px' (2 defect legs); identical lowercase spellings resolve to rgb(0, 255, 0)/0px in the same run.
        control_test: lowercase var()/env() positive controls prove the dispatch and environment lookup work, so failures are case-handling specific.
        untrusted_attacker: ordinary stylesheet text with mixed-case function names is the trust boundary; ASCII case-insensitivity of function names is normative, so any user CSS can carry these forms.
        current_deployment_relevance: custom-property intermediates feeding use-site substitution is a core cascade lane; confirmed live via two red runs at HEAD plus evidence re-execution.
