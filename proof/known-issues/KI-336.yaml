id: KI-336
title: '@namespace ignores trailing prelude tokens after the URI'
description: 'handleNamespaceRule reads tokens[0] and tokens[1] and never inspects the remaining prelude (src/parser.ts:859-868). css-namespaces-3 #syntax allows one optional prefix and exactly one URI, and requires a syntactically invalid @namespace to be ignored. ''@namespace "a" "b";'' therefore survives with the second string silently dropped. KI-169 pins the missing-URI leg of the same handler.'
