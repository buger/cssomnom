risk: correctness
affected_api: src/browser-entry.ts wrapConstructor (expectedLengths, Wrapper, copyStaticMethods) installed on window by the IIFE bundle
attacker_input: browser bundle consumers probing constructor length, constructing abstract interfaces, or enumerating constructor own properties; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0013-wrapper-webidl-fidelity.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Read arity from the WebIDL table per class and add an illegal-constructor guard for interfaces without constructors.
remediation: Complete expectedLengths, fall back to OriginalClass.length instead of zero, reject construction of no-constructor interfaces, and stop copying ancestor statics.
