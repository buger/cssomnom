id: KI-199
title: 'browser-entry wrappers break WebIDL interface-object contract: arity 0, constructible abstracts, copied statics'
description: wrapConstructor reads arity from an expectedLengths table and defaults missing keys to zero (src/browser-entry.ts:93). WebIDL 3.10.1 sets interface-object length to the count of required arguments. CSSUnitValue reports 0 instead of 2 and CSSMathClamp reports 0 instead of 3. The Wrapper also constructs interfaces that carry no IDL constructor, so new CSSStyleValue() succeeds instead of throwing. copyStaticMethods copies ancestor static operations onto every child Wrapper as own properties. Native WebIDL keeps parse and parseAll on the declaring interface object only.
