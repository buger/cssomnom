id: KI-310
title: Nested cycle sentinels leak into serialized resolved values
description: '#resolveVariablesInString scans only top-level values for the sentinel idents (src/parser.ts:1706). #resolveOneVariable buries markers inside function and block values (1727-1740), so the scan misses them. serialize then emits the NUL-derived sentinel into the computed value. css-variables-1 #guaranteed-invalid makes the containing property resolve to the empty invalid signal.'
