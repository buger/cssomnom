id: KI-238
title: consumeNumber drifts from the decimal literal for fractional inputs like 0.3
description: consumeNumber accumulates the significand as an integer and scales with Math.pow(10, power) (src/AbstractTokenizer.ts:455-492). css-syntax-3 consume-a-number step 5 interprets the number part as a base-10 number, which yields Number('0.3') === 0.3. The scaling instead computes 3 * 10^-1 = 0.30000000000000004, and 0.6 drifts the same way. Numeric token values then disagree with the decimal literal the author wrote.
