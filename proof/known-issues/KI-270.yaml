id: KI-270
title: '@page keeps an invalid page selector the css-page-3 grammar forbids'
description: 'The CSSPageRule constructor stores the raw selector text when parsePageSelectorList returns null (src/CSSOM.ts:1639); the setter correctly ignores null. css-page-3 #syntax-page-selector restricts <<pseudo-page>> to :left, :right, :first and :blank. parse(''@page :bogus { margin: 1px }'') therefore returns a CSSPageRule with selectorText '':bogus'' instead of dropping the rule.'
