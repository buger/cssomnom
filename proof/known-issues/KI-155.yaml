id: KI-155
title: fromFloat32Array and fromFloat64Array reject 6 elements and transpose 16
description: 'All four fromFloat*Array overrides require exactly 16 elements and pass transpose(array) to the constructor (src/DOMMatrix.ts:344-356,517-529). The 16-element constructor branch already stores the sequence in column-major order. A 6-element array throws TypeError instead of creating a 2d matrix. A 16-element array moves index 12 (m41) into m14. geometry-1 #dommatrix-create fromFloat32Array/fromFloat64Array accept 6 or 16 elements in the provided order.'
