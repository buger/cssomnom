severity: medium
severity_basis: risk
risk: correctness
affected_api: Parser.consumeBlockContents nested declaration parsing
attacker_input: nested style-rule body with a dashed ident not followed by a colon; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0007-bad-decl-remnants-leak.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Keep dashed idents followed by a colon until the failed declaration consumes its remnants.
remediation: Consume the remnants of a bad declaration up to the next semicolon before resuming the consumeBlockContents loop.
