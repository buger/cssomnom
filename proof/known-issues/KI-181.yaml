id: KI-181
title: consumeBlockContents reparses bad-declaration remnants as fresh declarations
description: 'The nested isDecl arm treats a leading ''--*'' ident as a declaration without a colon lookahead (src/parser.ts:1016-1017). consumeDeclarationFromStream then consumes only the ident and returns null at the colon check. consumeBlockContents leaves the remnants in the stream, so ''bar: red;'' after ''--foo bar'' parses as a new declaration. css-syntax-3 #consume-a-declaration requires consuming the remnants of a bad declaration up to the next semicolon. The sibling consumeDeclarationsFromBlockContents implements that skip (src/parser.ts:970-977).'
