id: KI-161
title: url() function names matched case-sensitively in @import and @namespace preludes
description: handleImportRule and extractUri compare the function token name with === 'url'. css-values-4 functional-notation states function names are ASCII case-insensitive. URL("a.css") and Url("u") preludes therefore miss the href branch and yield empty href or namespaceURI. The same handlers already lowercase layer() and supports() names.
affected_requirements:
    - INT-REQ-260821-30ZA
    - INT-REQ-260821-9SGA
evidence_manifests:
    - proof/evidence/ki-161.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.handleImportRule / Parser.handleNamespaceRule.extractUri (src/parser.ts)
attacker_input: stylesheet text using URL() or Url() spelling; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0002-url-function-name-case.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write url(...) in lowercase until the name comparison lowercases the function token.
remediation: Compare (token as CSSFunction).name.toLowerCase() === 'url' in both handlers, mirroring the layer()/supports() checks.
status: open
