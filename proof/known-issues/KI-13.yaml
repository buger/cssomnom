id: KI-13
title: ':disabled matches non-form controls (div[disabled], p in fieldset[disabled])'
description: |
    html #selector-disabled matches actually-disabled elements only (html #concept-element-disabled / #concept-fe-disabled): listed form controls, fieldsets, and form-associated custom elements. isElementDisabled returns true for any element with a disabled attribute and for any descendant of a disabled fieldset, so matches(div[disabled], ':disabled') and matches(p inside fieldset[disabled], ':disabled') are true. :enabled already gates on the listed tag set. Distinct from KI-10 (first-legend exemption on a listed control / nested fieldset). Overlay audit cannot change product code.
affected_requirements:
    - SW-REQ-260821-6D9T
    - SYS-REQ-260821-PJ76
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: matches
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-13-disabled-non-form.ts
reproduction_steps:
    - 'Parse <div disabled> and <fieldset disabled><p id=p></fieldset> with linkedom.'
    - 'Call matches(div, ":disabled") and matches(p, ":disabled").'
    - 'Observe both true. Intended both false (not listed form controls).'
    - 'Controls: input[disabled], button[disabled], fieldset[disabled], and input inside fieldset[disabled] still match :disabled.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-13-disabled-non-form.ts'
introduced_in: inception
defect_class: latent
mitigation: None on HEAD. Callers must not use :disabled as a proxy for a disabled attribute on non-form elements, or for arbitrary descendants of fieldset[disabled].
remediation: Product hole is on origin/main logic restored in fe7defa (Implements comments kept). Overlay cannot land a listed-form-control gate in src/matcher.ts isElementDisabled. Close only after div[disabled] and p-in-fieldset[disabled] do not match :disabled. No DEFECT — live unfixed bugs stay as KnownIssues.
notes:
    - '2026-08-22: discovered during code MC/DC unique-cause leftover work after restore fe7defa. Distinct from KI-10 first-legend. Overlay reproducer is a failing tripwire.'
