sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-13-disabled-non-form.ts
reproduction_steps:
    - 'Parse <div disabled> and <fieldset disabled><p id=p></fieldset> with linkedom.'
    - 'Call matches(div, ":disabled") and matches(p, ":disabled").'
    - 'Observe both true. Intended both false (not listed form controls).'
    - 'Controls: input[disabled], button[disabled], fieldset[disabled], and input inside fieldset[disabled] still match :disabled.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-13-disabled-non-form.ts'
