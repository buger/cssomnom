mitigation: Product fix landed in src/matcher.ts. isElementDisabled gates on html#concept-element-disabled listed types (button/input/select/textarea/optgroup/option/fieldset and form-associated custom elements) before applying concept-fe-disabled / concept-fieldset-disabled.
remediation: Closed after class-fix. div[disabled] and p-in-fieldset[disabled] do not match :disabled. Listed form controls still match. Class-closure DEFECT-260822-DTYP.
notes:
    - '2026-08-22: discovered during code MC/DC unique-cause leftover work after restore fe7defa. Distinct from KI-10 first-legend. Overlay reproducer is a failing tripwire.'
    - '2026-08-22: class-fix landed. Overlay reproducer and tests/matcher.test.ts pass. Distinct from KI-10 first-legend walk.'
