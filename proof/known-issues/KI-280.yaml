severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: PropertyRegistry.parseSyntax / CSS.registerProperty (src/PropertyRegistry.ts)
attacker_input: syntax strings ending in '|', with or without trailing spaces; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0032-syntax-trailing-combinator.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: End syntax strings with a component, not with '|'.
remediation: Require consumeSyntaxComponent to succeed after each '|'; treat EOF there as a SyntaxError.
