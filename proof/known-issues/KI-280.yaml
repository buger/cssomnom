id: KI-280
title: parseSyntax accepts a trailing '|' combinator and registers the definition
description: 'css-properties-values-api #consume-a-syntax-definition requires another component after every ''|''; EOF hits the anything-else branch and fails the definition. parseSyntax continues after the combinator and exits the loop at EOF. CSS.registerProperty({syntax:''<length> |''}) therefore stores a registration instead of throwing SyntaxError.'
affected_requirements:
    - SW-REQ-260821-PD6M
