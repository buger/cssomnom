id: KI-42
title: parseComponentValueSync('url(a b)') returns truncated token 'a' instead of SyntaxError for <bad-url-token>
description: 'parseComponentValueSync("url(a b)") returns CSSParserToken("a") - the truncated ident inside a <bad-url-token> - instead of throwing. css-syntax-3 ~2013-2016 marks <bad-url-token>/<bad-string-token> always-parse-errors; #parse-a-component-value (~2457-2484) turns consumption failure into a syntax error. The library owns >1-value branch already throws for "a b" (src/parser-api.ts ~600-602), so rejecting the lone bad token is consistent internal behavior, not new policy. Same defect for url(a\\nb).'
affected_requirements:
    - SYS-REQ-260823-BTC4
evidence_manifests:
    - proof/evidence/ki-42.yaml
severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSS.parseComponentValue/parseComponentValueSync (src/parser-api.ts ~L590-605)
attacker_input: component-value strings containing bad-url constructs (raw whitespace inside unquoted url()); correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-42-bad-url-component-value-not-rejected-overlay-260823.ts
tripwire_mutation: In parseComponentValueSync, reject non-whitespace values whose type is bad-url/bad-string (or run ensureEOF-style failure detection after consume) before toParserToken; both bad-url legs flip red->green while the multi-value control stays green.
mitigation: Until this closes, do not feed unquoted url() containing raw whitespace to parseComponentValueSync expecting a SyntaxError; pre-validate url() preludes or wrap calls and re-check returned token types for bad-url/bad-string.
remediation: In parseComponentValueSync, reject non-whitespace component values whose consumed token type is bad-url/bad-string (ensureEOF-style failure detection after consume) before toParserToken, so lone bad tokens throw like the >1-value branch already does.
