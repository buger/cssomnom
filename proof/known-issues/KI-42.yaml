        quantitative_impact: measured at HEAD on Node v24.11.1 - 'url(a b)' returns CSSParserToken('a') (BAD_URL_ACCEPT_BUDGET=0 violated); the library's own >1-value branch throws SyntaxError for 'a b', proving the rejection machinery exists and is simply not applied to bad tokens.
        control_test: multi-value control leg ('a b') still throws via the >1-value branch, isolating the failure to missing bad-token detection.
        untrusted_attacker: component-value strings are host-supplied text (custom properties, attribute values like img/sizes); zero privileges required.
        current_deployment_relevance: parseComponentValue is a documented WICG surface of this release; confirmed live at HEAD via two red reproducer runs plus evidence capture re-execution.
        honest_severity: medium correctness - callers relying on the throw contract receive a bogus truncated token instead of an error, corrupting downstream value validation; no security/RCE dimension, cve_surface none.
        attacker_profitability: input that every conformant implementation rejects is accepted as a plausible-looking value ('a'), letting malformed data pass validation gates built on this API.
        reproducible: node --experimental-strip-types --test proof/reproducers/KI-42-bad-url-component-value-not-rejected-overlay-260823.ts exited 1 twice pre-filing and once more under proof evidence capture.
