id: KI-44
title: 'CSSKeyframeRule.keyText setter accepts JS-Number-coercible garbage: ''0x10%'' normalizes to ''16%'''
description: 'Setting keyText="0x10%" normalizes to "16%" (and "0X10%" likewise) because normalizeKeyframeSelector uses raw Number(valStr). css-animations-1 ~1072-1077 requires SyntaxError + unchanged value for invalid keyframe selectors; the grammar (~210-212) is from | to | <percentage [0,100]>, which "0x10%" violates. Controls that correctly throw and leave keyText unchanged: 50%%, fifty%, Infinity%, -5%, 0. The tokenizer parse path is already correct: parsing "@keyframes k{0x10%{opacity:0}50%{a:b}}" drops the bad block and keeps only 50% (src/parser.ts ~571-591) - setter must agree with parser.'
affected_requirements:
    - SYS-REQ-260823-KTS6
evidence_manifests:
    - proof/evidence/ki-44.yaml
severity: low
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSSKeyframeRule.keyText setter / normalizeKeyframeSelector (src/CSSOM.ts ~L1157)
attacker_input: CSSOM property writes of keyText with JS-coercible non-grammar strings; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-44-keytext-setter-js-coercion-overlay-260823.ts
tripwire_mutation: Remove raw Number(valStr) coercion from src/CSSOM.ts normalizeKeyframeSelector so the setter validates via the tokenizer grammar and throws SyntaxError for non-percentage forms like '0x10%' — the secure setter legs then pass while the parser characterization leg stays green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: 'Set keyText only to grammar-valid forms: from, to, or a percentage in [0,100]. Treat any keyText write from outside the code as suspect until validation lands. Until the fix lands, the setter accepts JS-coercible strings like ''0x10%'' and normalizes them to ''16%''.'
remediation: Remove the raw Number(valStr) coercion from normalizeKeyframeSelector in src/CSSOM.ts. Validate selector candidates through the tokenizer grammar instead. Throw SyntaxError for non-percentage forms like '0x10%'. Leave keyText unchanged on failed assignments, matching the parse path.
