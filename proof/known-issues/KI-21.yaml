    notes: |
        real_infrastructure: public parse() and CSSStyleRule.cssText (src/parser.ts,
        src/CSSOM.ts, src/serializer.ts) — round trip through the library's own serializer only.
        quantitative_impact: measured on current HEAD — 'div { color: #\3B
        background-image:url(https://evil.example/track.png); }' parses to exactly 1 declaration;
        cssText serializes it as 'color: #;background-image:url("https://evil.example/track.png")';
        re-parsing yields 2 declarations including the injected background-image (reproducer L61).
        Function-name leg: 'width: a\7d(1)' serializes to 'width: a}(1);' and re-parses as
        'width=a' (L89). One escaped character = one injected declaration boundary.
        control_test: L48 asserts a benign hash (#fafafa) round-trips structurally unchanged,
        proving the harness detects structural change rather than formatting noise.
        untrusted_attacker: the attacker authors the stylesheet text; escaping is precisely what
          lets '#\3B'-style payloads survive naive allowlists before the library re-arms them.
        current_deployment_relevance: cssText/serialize() output is routinely concatenated back
          into <style> elements or theme sheets; confirmed live at HEAD d826b0f.
        honest_severity: medium data_integrity — emitted-CSS structure corruption and CSS-injection
        contribution; not direct XSS by itself, honestly scoped to what re-embed hosts inherit.
        attacker_profitability: attacker turns an escaped (filter-passing) hash into real ';'/'}'
        boundaries, injecting declarations such as background-image:url(...) exfil/tracking URLs.
        reproducible: two consecutive reproducer runs exited 1 with the asserted structural-diff
        failure on both legs; evidence capture re-ran it again.
        no_inflation: filed data_integrity with reproducer basis; no memory-corruption or XSS-bypass
        claims made; impact statement mirrors the scan's own calibration.
        operational_path_verified: failing legs exercise parse -> cssText -> re-parse, the exact
        serialize/re-embed loop hosts perform.
        reachability_verified: public serializer surface is the product surface; any host that
        serializes parsed attacker CSS and re-reads it reaches the breakout with no extra privileges.
