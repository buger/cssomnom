id: KI-21
title: Hash/function serialization omits serialize-an-identifier, enabling cssText structural breakout
description: 'serializeToken''s hash branch emits ''#'' + raw decoded value (and serializeNode emits AST function names) without the cssom-1 #serialize-an-identifier escape algorithm used by neighboring ident/at-keyword/id-selector branches. Because the tokenizer decodes CSS escapes into token values, an attacker-supplied ''#\3B'' or ''a\7d('' reappears as a real '';'' or ''}'' in cssText: parsing ''div { color: #\3B background-image:url(https://evil.example/track.png); }'' serializes to ''color: #;'' and re-parsing yields an INJECTED background-image:url(...) declaration. Hosts that re-embed serialized cssText inherit a CSS injection contribution (CWE-116); data_integrity of emitted stylesheets.'
affected_requirements:
    - SYS-REQ-260822-8HDQ
evidence_manifests:
    - proof/evidence/ki-21.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: CSSStyleRule.cssText / serializer.serialize() / serializeDeclarations()
attacker_input: 'untrusted stylesheet text containing escaped hash spellings (#\3B, #\7d) or escaped function names (a\7d(...)) that survive naive allowlists precisely because they are escaped'
reproducer_command: /tmp/node-v24.11.1-linux-x64/bin/node --experimental-strip-types --test proof/reproducers/KI-21-serializer-hash-identifier-escape-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat serialized cssText as attacker-influenced source; do not re-embed it into style contexts without re-validation.
remediation: 'Route the hash-token branch and the AST function-name branch through serializeIdentifier (cssom-1 #serialize-an-identifier / #serialize-a-function), including getOriginalText function paths.'
