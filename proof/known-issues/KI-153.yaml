id: KI-153
title: DOMMatrix transform methods pre-multiply instead of post-multiplying
description: 'translateSelf, scaleSelf, rotateSelf, rotateAxisAngleSelf, skewXSelf and skewYSelf apply their transform on the left of the stored matrix (src/DOMMatrix.ts:606-808). multiplySelf and preMultiplySelf implement each other''s contract. flipX and flipY negate the wrong stored column set. geometry-1 #mutable-transformation-methods requires post-multiplication for every transform and swaps the two multiply methods. The spec example scaleSelf(2); translateSelf(20,20) must yield matrix(2, 0, 0, 2, 40, 40); this build yields matrix(2, 0, 0, 2, 20, 20).'
affected_requirements:
    - INT-REQ-260821-JTY2
evidence_manifests:
    - proof/evidence/ki-153.yaml
severity: high
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: DOMMatrix.multiplySelf, preMultiplySelf, translateSelf, scaleSelf, rotateSelf, skewXSelf, skewYSelf, flipX, flipY
attacker_input: geometry call sequences from callers; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0005-premultiply-convention.ts
tripwire_mutation: 'Post-multiply every mutable transform method in src/DOMMatrix.ts (translateSelf, scaleSelf, rotateSelf, rotateAxisAngleSelf, skewXSelf, skewYSelf), swap the multiplySelf and preMultiplySelf operand order, and negate m11/m12 for flipX and m21/m22 for flipY per geometry-1 #mutable-transformation-methods'
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Compose transforms with the immutable methods and verify the spec examples before relying on this build's matrix composition.
remediation: Post-multiply every transform in the mutable methods, swap the multiplySelf and preMultiplySelf operand order, and negate m11/m12 for flipX and m21/m22 for flipY.
