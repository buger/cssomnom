id: KI-146
title: normalizePseudoElement accepts unterminated functional pseudo-elements as valid and known
description: normalizePseudoElement checks only whether the last token is ')' (src/cascade/index.ts:122-124). Without the paren, argTokens still slice the ident and the function returns valid and known at line 133. CSS Syntax cannot produce a complete pseudo-element selector from '::highlight(foo'. getCascadedStyle then matches rules for a selector CSSOM parsing rejects.
