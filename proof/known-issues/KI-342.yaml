id: KI-342
title: Typed OM parse skips calc/min/max/clamp grammar when the math function contains var()
description: validateMathFunctions bypasses parseMathFunction whenever a math-function argument contains var(). calc(var(--x) + ) ends with a dangling operator, so no substitution can ever satisfy the css-values-4 calc grammar. css-typed-om-1 6.6 parse-a-cssstylevalue step 3 must throw TypeError, matching the var()-free twin calc(1px + ). The parse returns a CSSUnparsedValue instead.
