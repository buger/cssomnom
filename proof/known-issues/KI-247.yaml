id: KI-247
title: Padded universal syntax ' * ' wrongly requires an initial value and drops a valid @property
description: 'validate compares the untrimmed syntax string against ''*''. #consume-a-syntax-definition step 1 strips ASCII whitespace before step 3 recognizes the universal asterisk. WPT at-property.html line 104 lists '' * '' as valid universal syntax without an initial value. registerProperty({syntax:'' * ''}) throws ''initialValue is required'' and the parser drops the @property rule.'
