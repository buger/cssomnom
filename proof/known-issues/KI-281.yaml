id: KI-281
title: parseSyntax accepts an unterminated '{' multiplier that EOF silently closes
description: 'The brace-multiplier loop breaks on either ''}'' or EOF and then assigns multiplier ''+''. Brace repetition is absent from the css-properties-values-api #syntax-strings grammar, and an unclosed brace is a truncated definition regardless. CSS.registerProperty({syntax:''<length>{2''}) therefore registers instead of throwing SyntaxError.'
