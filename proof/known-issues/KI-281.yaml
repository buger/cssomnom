introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Close every brace range, or avoid brace multipliers entirely (they are not valid syntax strings).
remediation: 'Reject the brace branch: braces are not a multiplier in syntax strings, and EOF must never close one.'
