severity: low
severity_basis: reproducer
risk: correctness
affected_api: CSSFontFaceDescriptors style.setProperty (src/CSSOM.ts + src/CSSStyleDeclaration.ts)
attacker_input: caller-supplied @font-face descriptor values; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0028-fontface-descriptor-junk.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat font-face descriptor writes as unvalidated until descriptor grammars land.
remediation: Route descriptor names through a per-descriptor grammar check in setProperty instead of the generic property validator.
