id: KI-271
title: Font-face descriptor surface stores grammar-invalid src values
description: 'CSSFontFaceDescriptors._isPropertySupported admits every FONT_FACE_DESCRIPTORS name, then setProperty runs the generic property validator (src/CSSOM.ts:551). That validator carries no descriptor grammar. css-fonts-4 #font-face-src types src as a comma list of url()/local()/tech()/format() terms. fontFaceRule.style.setProperty(''src'', ''not-a-src'') therefore stores the junk and re-serializes an invalid @font-face rule.'
