id: KI-220
title: consumeBlockContents flushes leftover declarations when a qualified rule returns nothing
description: 'consumeNestedQualifiedRuleFromStream returns null both for the stop-token nothing case and for a rejected selector after a block. css-syntax-3 consume-block-contents distinguishes them: nothing means do nothing, an invalid rule error flushes the declaration run. The else arm at src/parser.ts L1070-1072 flushes on both nulls. ''.a { .b {} color: red; div; background: blue; }'' therefore emits two CSSNestedDeclarations where the spec keeps one consecutive run. SW-REQ-260821-39E0 requires the consecutive-run wrapping.'
