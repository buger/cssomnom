severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.consumeBlockContents else arm via consumeNestedQualifiedRuleFromStream (src/parser.ts L1064-1073, L1229-1259)
attacker_input: nested style-rule bodies mixing declarations with a stop-token prelude like 'div;'; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0017-blockcontents-nothing-flush.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Read nested declaration runs from the merged style or re-merge consecutive CSSNestedDeclarations consumers after parse.
remediation: Return a discriminated result from consumeNestedQualifiedRuleFromStream and flush only on the invalid-rule-error and rule outcomes, per css-syntax-3 consume-block-contents.
