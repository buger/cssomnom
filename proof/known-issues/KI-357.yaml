id: KI-357
title: CSSGroupingRule.insertRule applies the raw JS range check before WebIDL unsigned long conversion
description: CSSGroupingRule.insertRule compares the raw index value before parsing. WebIDL types index as unsigned long, so ToUint32 maps 0.5 to 0 and NaN to 0. The fractional index therefore throws IndexSizeError before the parse can throw SyntaxError, and NaN bypasses the bounds check and returns NaN as the insertion index.
