    notes: |
        real_infrastructure: public parse() (src/parser.ts) and CSSStyleSheet.replaceSync()
        (src/CSSOM.ts) only — no mocks, no private hooks; reproducer imports mirror KI-7 style.
        quantitative_impact: measured on current HEAD, Node v24.11.1 — nestStyle(200) parses in
        ~9ms (reproducer L49); nestStyle(4000), nestMedia(2000), replaceSync(nestStyle(4000)) all
        throw RangeError: Maximum call stack size exceeded in 6-12ms each; scan baseline: last good
        depth ~2187 for a{a{...}}, @media dies earlier (~1000-2000).
        control_test: L49 asserts the shallow-nest positive contract (stylesheet returned, 1 rule),
        so the failing deep legs are not setup failures.
        untrusted_attacker: stylesheet text is the trust boundary; a few KB of attacker-chosen
        nesting reaches the sink through any host that ingests user CSS.
        current_deployment_relevance: parse() is the headline ingest API of this library release;
          confirmed live at HEAD d826b0f against a fresh build before filing.
        honest_severity: medium availability — abort of one parse/worker request; no memory
        corruption, no RCE, library has no network face of its own.
        attacker_profitability: an attacker who can choose theme/upload CSS gains a reliable
        single-request CPU/abort primitive against parsing workers; retry amplification is free.
        reproducible: two consecutive runs of the reproducer command both exited 1 with the
        asserted RangeError-catch failure (L57/L72/L87 legs); evidence capture re-ran it again.
        no_inflation: severity_basis is reproducer with the executed manifest attached; risk field
        names availability honestly; cve_surface none (library, not a network service).
        operational_path_verified: the three failing tests are the exact product path a host calls
        (parse / replaceSync); no debug-only or gated path involved.
        reachability_verified: public entry points ARE the product surface here — any caller
        passing attacker CSS to parse()/replaceSync() reaches the recursion with zero additional
        privileges; no ingress ACL layer exists between host and parser.
kill_domain: resource_exhaustion
do_not_refile_as: parser stack overflow via nested rules/blocks
dedup_armor: |
    Two distinct recursive subsystems share the resource_exhaustion kill_domain and
    now carry distinct affected_file basenames. KI-18 pins the css-syntax-3 consume
    stack in src/parser.ts: consumeBlockContents / consumeNestedQualifiedRuleFromStream
    / consumeAtRule recurse on nested style rules (a{a{...}}) and nested grouping
    at-rule blocks (@media all{...}); ~4000-deep style rules and ~2000-deep @media
    blocks overflow there with no media-condition parsing involved. KI-131 pins
    MediaParser condition descent in src/MediaParser.ts: nested parenthesis blocks
    inside a @media prelude overflow at ~2200 depth while the tokenizer survives
    50000-deep nesting iteratively and a single qualified rule body is enough to
    crash. KI-22 pins the math expression parser on nested calc() input. Different
    subsystems and different sinks: a depth counter threaded through one performs
    no work on the others; each filing keeps its own tripwire legs and must not
    cross-close.
affected_file: src/parser.ts
