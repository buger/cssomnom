attacker_input: stylesheet text with out-of-grammar @property syntax descriptors; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0054-at-property-syntax-holes-kept.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write only in-grammar syntax strings in @property rules until the ingest gate closes.
remediation: Restrict consumeSyntaxComponent to the {+,#} multipliers immediately after the name, reject braces, require a component after every '|', and drop 'flex' from VALID_COMPONENTS.
