id: KI-339
title: '@property ingest keeps rules whose syntax string fails consume-a-syntax-definition'
description: 'Parser.handlePropertyRule validates @property syntax strings through PropertyRegistry.parseSyntax. consumeSyntaxComponent accepts the ''?'' and ''*'' multipliers, any brace run rewritten to ''+'', a multiplier after whitespace, a trailing ''|'' combinator, and the unsupported <flex> name. css-properties-values-api #consume-a-syntax-definition fails each form, so #at-property-rule must drop the rule. Stylesheets keep CSSPropertyRule objects for all six inputs.'
