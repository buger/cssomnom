id: KI-189
title: '@property inside group rules constructs the rule but never registers it'
description: CSSStyleSheet.createInternal registers CSSPropertyRule instances only while iterating top-level rules (src/CSSOM.ts:331-336). The parser accepts @property inside group rules and constructs a CSSPropertyRule child there. The nested rule never reaches PropertyRegistry, so its syntax and inheritance stay unregistered. replaceSync and deleteRule bookkeeping never track it either. css-properties-values-api requires every valid @property rule to register the custom property it names.
