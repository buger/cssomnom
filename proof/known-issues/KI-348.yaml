id: KI-348
title: Unknown at-rule inside a group rule loses block declarations from cssText
description: 'consumeAtRuleFromStream''s fallback parses unknown at-rule blocks with nested=false (src/parser.ts ~L1311). consumeBlockContents then drops declaration runs, so childRules keep only rules. CSSAtRule.cssText serializes non-empty childRules and silently deletes the declarations. ''@media screen { @foo { .a { color: blue } color: red; } }'' loses ''color: red;''. css-syntax-3 #consume-an-at-rule preserves unrecognized at-rules; the token-stream path already keeps raw text.'
affected_requirements:
    - SYS-REQ-260821-NHZ8
evidence_manifests:
