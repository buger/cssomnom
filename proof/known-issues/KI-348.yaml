severity: medium
severity_basis: risk
risk: correctness
affected_api: Parser.consumeAtRuleFromStream fallback / CSSAtRule.cssText for unknown at-rules in group rules
attacker_input: stylesheet text with an unrecognized block at-rule nested in a group rule; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0062-unknown-atrule-decls-through-group-rule.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Preserve the raw block text for unknown at-rules like the token-stream fallback does.
remediation: Keep unrecognized at-rule blocks verbatim in the stream path; serialize unknown at-rules from the raw block, not from childRules.
