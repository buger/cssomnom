id: KI-321
title: assembleUnicodeRanges launders seven source digits into a six-hex urange
description: The ident-u branch rebuilds the hex segment from the number token value with toString(16) and never counts source digits. Only the rebuilt text meets the {1,6} regex. Seven decimal digits from 1048576 through 1114111 re-encode to six hex characters inside U+10FFFF, so u+1048576 assembles as U+100000. css-fonts-4 unicode-range caps <urange> at six source hex digits, so the assembler must return null.
affected_requirements:
    - SW-REQ-260822-MN8Z
