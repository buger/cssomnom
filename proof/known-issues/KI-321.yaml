severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: assembleUnicodeRanges ident-u reconstruction branch (src/parser.ts, also exposed via ParseHooks)
attacker_input: unicode-range descriptor text whose split tokens carry a seven-digit decimal number; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0043-urange-seven-digit-reencode.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write unicode-range values with six or fewer hex digits.
remediation: Count source digits while rebuilding the hex segment and reject runs longer than six before the regex, keeping KI-164's re-encoding fix in mind.
