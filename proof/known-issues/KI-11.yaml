id: KI-11
title: tryParsePosition accepts 3-value perspective-origin / 4-value transform-origin and drops center left
description: |
    css-values-4 § 10.1 #position: generic <position> is 1-/2-/4-value, not 3-value (csswg-drafts#2140). css-transforms-2 #perspective-origin-property uses <position>, so left 10px top must throw. css-transforms-1 #transform-origin-property is not 4-value <position>, so left 10px top 20px must throw. The && grammar puts center in both x and y groups, so object-position: center left is a valid CSSPositionValue. HEAD tryParsePosition accepts 3-value for all POSITION_PROPERTIES, accepts 4-value transform-origin, and returns null for center left (swallowed as CSSStyleValue). Distinct from KI-3 (invalid 'not-a-position' not throwing). Overlay audit cannot change product code.
