affected_api: CSSStyleValue.parse
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-11-position-grammar.ts
reproduction_steps:
    - Call CSSStyleValue.parse('perspective-origin', 'left 10px top') — observe CSSPositionValue instead of TypeError.
    - Call CSSStyleValue.parse('transform-origin', 'left 10px top 20px') — observe CSSPositionValue instead of TypeError.
    - Call CSSStyleValue.parse('object-position', 'center left') — observe CSSStyleValue instead of CSSPositionValue.
    - 'Intended: 3-value perspective-origin TypeError; 4-value transform-origin TypeError; center left is CSSPositionValue.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-11-position-grammar.ts'
introduced_in: inception
defect_class: latent
mitigation: matchesPositionPropertyGrammar / isValidCssPosition rejects 3-value generic <position> (perspective-origin, object-position). isValidTransformOrigin rejects 4-value <position>. isKeywordAndPair accepts center left (css-values-4 &&). tryParsePosition reifies 2D only.
remediation: Landed in src/typed-om/position/position-parser.ts and src/typed-om/values/style-value-parser.ts. Class-closure DEFECT-260822-PGRM.
notes:
    - '2026-08-22: filed after fe7defa restore. Distinct from KI-3 (invalid not-a-position swallow). Same reqs (7AKJ/HGFK), different grammar hole.'
    - '2026-08-22: class-fix. 3-value perspective-origin TypeError; 4-value transform-origin TypeError; object-position center left reifies CSSPositionValue. Overlay reproducer PASSES twice (Node 24). Distinct from KI-3 (invalid not-a-position swallow).'
