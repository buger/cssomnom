id: KI-233
title: isInsideFirstLegend requires legend.contains and disables legend children without it
description: 'isInsideFirstLegend computes containment only through legend.contains?.(element) (src/matcher.ts:847-849). The exported DOMElement type marks contains optional, and the focus-within path already falls back to a parent-chain walk. A host DOM without contains returns false, so html #concept-fe-disabled marks inputs inside the first legend of a disabled fieldset as disabled. Residual edge of the fixed KI-10.'
