attacker_input: any '@supports' rule input; correctness hole reachable by ordinary API use
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-33-supports-rule-matches-idl-overlay-260823.ts
tripwire_mutation: Adding a boolean matches getter evaluating conditionText flips all four legs red->green while the oracle control stays green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Guard reads of .matches with typeof checks; use CSS.supports(rule.conditionText) directly.
remediation: Add a readonly boolean matches getter to CSSConditionRule/CSSSupportsRule that evaluates conditionText through the same evaluator backing CSS.supports().
