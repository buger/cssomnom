introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Always pass a string to insertRule.
remediation: Coerce the rule argument through CSSOMString conversion before parsing, or catch parser exceptions and rethrow a SyntaxError DOMException.
