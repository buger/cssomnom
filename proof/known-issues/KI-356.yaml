id: KI-356
title: insertRule leaks a raw TypeError for non-string rule arguments instead of SyntaxError
description: CSSStyleSheet.insertRule forwards the raw rule argument to _parseRule, and tokenize dereferences it. WebIDL types rule as CSSOMString, so undefined converts to the string undefined and null to null. cssom-1 6.5.3 insert-a-css-rule steps 3-5 must then throw a SyntaxError DOMException. The raw engine TypeError escapes instead.
