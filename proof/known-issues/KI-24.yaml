id: KI-24
title: sandbox.fetch /interfaces/ join escapes the WPT root and discloses local files to fixture JS
description: scripts/wpt/node/run.ts intercepts fixture fetches under '/interfaces/' and serves IDL from disk via path.join(WPT_ROOT, 'interfaces', idlFileName) (L143-145 at HEAD 83ce08f) followed by existsSync/readFileSync (L146-147) with no containment check on idlFileName. '/interfaces/../../../package.json' climbs out of <WPT_ROOT>/interfaces and returns arbitrary readable files to sandboxed page JS as a 200 Response (CWE-22). Live probe confirmed status 200 with repo-root package.json contents through the real exported runWptFile.
affected_requirements:
    - SYS-REQ-260823-KYB6
evidence_manifests:
    - proof/evidence/ki-24.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: scripts/wpt/node/run.ts sandbox.fetch bridge inside runWptFile()
attacker_input: fixture-controlled fetch URLs starting with /interfaces/ (../ traversal segments after the prefix)
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-24-wpt-interfaces-join-no-containment-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat WPT fixture trees as untrusted input; avoid running hostile fixtures until the bridge is confined.
remediation: Normalize the joined path and require it stays inside path.resolve(WPT_ROOT, 'interfaces') via a path.relative containment check served from the same shared helper as the script-content fix; reject escapes before existsSync so probes cannot oracle out-of-tree files.
