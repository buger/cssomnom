id: KI-243
title: Failed dashed-ident declaration eats the ident and reshapes the nested rule
description: 'The isDecl arm forces a declaration for every ''--*'' ident, and consumeDeclarationFromStream returns null after eating only the ident (src/parser.ts:1016-1019,1083-1096). The arm never restores the mark, and the helper never consumes bad-declaration remnants. css-syntax-3 consume-block-contents restores the mark and reparses the construct as one qualified rule. ''.parent { --foo .child { color: red } }'' therefore yields a child rule for ''.child'' instead of one rule with selector ''--foo .child''.'
