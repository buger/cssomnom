id: KI-261
title: '@media viewport takes parseFloat of percentage or em frame widths as pixels'
description: 'walkRules derives the media viewport from the frame element with bare parseFloat. A style width of 100% feeds 100px and 50em feeds 50px into MediaParser. mediaqueries-4 #evaluating-a-media-query requires the used pixel viewport. A percentage iframe width therefore matches (max-width: 150px) even though the real width is wider.'
