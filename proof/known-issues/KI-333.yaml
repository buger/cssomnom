id: KI-333
title: Keyframes and counter-style names skip custom-ident keyword exclusions
description: 'handleKeyframesRule rejects none/initial/inherit/unset/revert/default but omits revert-layer (src/parser.ts:511-513). handleCounterStyleRule performs no name check at all (src/parser.ts:648-650). css-values-4 #custom-ident excludes the CSS-wide keywords and default from every <custom-ident>; css-cascade-5 lists revert-layer as CSS-wide. css-counter-styles-3 #counter-style also excludes none and requires a name. ''@keyframes revert-layer {}'' and ''@counter-style none {}'' therefore survive.'
