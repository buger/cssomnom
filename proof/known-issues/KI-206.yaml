introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Reject values for those five properties at the call site until the grammar tables cover them.
remediation: Return false when the property has no grammar row, and extend the generated syntax table for the legacy -webkit-box aliases.
