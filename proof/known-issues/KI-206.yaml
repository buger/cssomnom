id: KI-206
title: CSS.supports returns true for any value of the five -webkit-box properties that lack a grammar row
description: evaluateSupportsDeclaration ends in an unconditional return true (src/parser-api.ts:681). The arm fires when a property sits in SUPPORTED_PROPERTIES but not in STANDARD_PROPERTIES_SYNTAX or SHORTHANDS. Five legacy -webkit-box properties fill that gap. CSS.supports('-webkit-box-align', 'definitely-not-a-valid-value') therefore returns true. css-conditional-3 requires a known property and a value that matches its grammar.
