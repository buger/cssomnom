id: KI-343
title: matchesSyntax color branch matches Object.prototype identifiers like constructor
description: The <color> branch of matchesSyntax tests named colors with 'val in NAMED_COLORS' on a prototype-bearing Record. Inherited Object.prototype keys such as constructor therefore match <color>. registerProperty({syntax:'<color>', initialValue:'constructor'}) stores the registration instead of throwing SyntaxError, and the @property rule survives ingest. The same identifier family crashes normalizeComputedColor in KI-260.
