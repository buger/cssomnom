id: KI-192
title: Syntax-string literals accept the CSS-wide keyword revert-rule
description: 'consumeSyntaxComponent rejects initial, inherit, unset, revert, revert-layer and default as literal identifiers. The list omits revert-rule. css-cascade-5 #revert-rule-keyword defines revert-rule as a CSS-wide keyword. css-values-4 excludes CSS-wide keywords from <custom-ident>, so the syntax string ''revert-rule'' must throw SyntaxError. CSS.registerProperty accepts it as a literal ident and matches the value ''revert-rule''.'
