id: KI-242
title: Grouping-rule custom-property remnant consumption eats the following valid rule
description: 'consumeNestedQualifiedRuleFromStream runs consumeRemnantsOfABadDeclaration for custom-property-shaped preludes regardless of the nested flag (src/parser.ts:1244-1246). A top-level @media body parses with nested false, where css-syntax-3 consume-a-qualified-rule requires consume-a-block and return nothing. The remnants instead swallow tokens through the next semicolon or EOF. ''@media all { --foo:hover { color: blue } div { color: red } }'' therefore drops the div rule the spec keeps.'
