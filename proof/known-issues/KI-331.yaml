id: KI-331
title: Margin at-rules are accepted outside @page as CSSMarginRule
description: 'isSupportedAtRule returns true for MARGIN_RULE_NAMES before any parent-context check (src/parser.ts:109). handleMarginRule then constructs a CSSMarginRule wherever the name appears (src/parser.ts:641-643). css-page-3 #at-page-rule allows margin at-rules only inside @page. A top-level ''@top-left {}'' therefore reports a CSSMarginRule instead of a preserved unknown at-rule.'
