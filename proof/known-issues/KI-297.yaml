affected_api: MediaParser.evaluateMediaFeature feature mapping (src/MediaParser.ts)
attacker_input: caller-supplied media query text using the declared -webkit or ua-color-scheme features; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0037-unevaluated-known-features.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not rely on -webkit-device-pixel-ratio or ua-color-scheme queries; use resolution and prefers-color-scheme.
remediation: Map -webkit-device-pixel-ratio onto env.resolution in dppx, -webkit-transform-3d onto a capability value, and read env.uaColorScheme in the ident switch.
