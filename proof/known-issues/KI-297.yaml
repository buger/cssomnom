id: KI-297
title: Declared-known -webkit and ua-color-scheme media features never evaluate
description: The generated media-features table lists -webkit-device-pixel-ratio in KNOWN_FEATURES and RANGE_FEATURES, -webkit-transform-3d as integer, and ua-color-scheme and shape with allowed idents. evaluateMediaFeature has no case for those names in getActualNumeric, parseValueForFeature or the discrete-ident switch (src/MediaParser.ts:1210-1246,1292-1378). MediaParser.parse accepts the queries as media features and evaluate then returns unknown, so they never match. MediaEnvironment carries uaColorScheme and resolution, so the environment can answer.
