id: KI-268
title: setProperty drops mixed-case VAR() shorthand values that CSS types case-insensitively
description: 'The shorthand branch detects substitution with the case-sensitive substring value.includes(''var('') (src/CSSStyleDeclaration.ts:521). css-values-4 #keywords makes function names ASCII case-insensitive, so ''VAR(--m)'' is a substitution. expand() rejects the tokens, the !stub arm returns, and the declaration vanishes. setProperty(''margin'', ''VAR(--m)'') therefore stores nothing while the lowercase control stores ''margin: var(--m)''.'
