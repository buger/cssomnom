    notes: |
        real_infrastructure: public CSS.supports from src/parser-api.ts and Parser.resolveVariables over a real CSSStyleDeclaration - no mocks.
        quantitative_impact: measured at HEAD on Node v24.11.1 - one env() grammar root, two independently failing paths: CSS.supports('width', 'env(name)') and its empty-fallback form return false (V110 legs), and env(name -1, 5px) substitutes the unindexed '9px' instead of invalidating at computed-value time (V11A leg); controls 10px/env() and a non-negative index resolving '8px' stay green.
        control_test: ordinary-value and non-negative-index controls pin correct behavior around both defect paths, so failures are not setup errors.
        untrusted_attacker: ordinary CSS env() values including indexed names are the trust boundary; any host parsing or substituting user CSS reaches both paths with zero privileges.
        current_deployment_relevance: env() is the standard device/environment adaptation mechanism; confirmed live via two red runs at HEAD plus evidence re-execution.
        honest_severity: medium correctness - a false negative blocks valid fallbacks and a wrong index path yields stale values; no memory-safety impact.
        attacker_profitability: not profit-driven; mis-ranked fallback selection can silently apply wrong geometry in responsive layouts.
        reproducible: node --experimental-strip-types --test proof/reproducers/KI-110-env-grammar-supports-overlay-260822.ts exited 1 twice at landing validation (2026-08-24).
        no_inflation: severity medium matches blast radius; one root filed once with two requirement traces rather than duplicated KIs.
        operational_path_verified: failing legs call the exact public supports()/resolveVariables paths hosts use.
        reachability_verified: public CSS/Parser surfaces ARE the product path; no gating layer between host and grammar check.
kill_domain: environment_function_grammar
do_not_refile_as: 'mixed-case VAR()/ENV() dispatch casing (KI-109) and CSS.supports malformed var() grammar (KI-107): different function grammars and different observables'
