id: KI-110
title: env() grammar is shallowly accepted and supports() rejects valid env()
description: 'One env() grammar root has two independently failing paths: CSS.supports rejects syntactically valid env() values instead of applying the parse-time validity rule, and computed substitution accepts an invalid negative index path rather than making the property invalid at computed-value time. The local CSS Environment Variables grammar permits non-negative integer indices and a bare comma fallback only.'
affected_requirements:
    - SYS-REQ-260822-V110
    - SYS-REQ-260822-V11A
    - STK-REQ-260821-BQKD
