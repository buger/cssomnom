severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSS.supports env() grammar and Parser.resolveVariables env() substitution
attacker_input: ordinary CSS env() values, including indexed names; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-110-env-grammar-supports-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat env() values as untrusted until grammar and index validity are checked; do not use current CSS.supports results as an env() grammar oracle.
remediation: Recognize syntactically valid env() in CSS.supports and reject malformed indices before substitution, producing invalid-at-computed-value-time when no valid fallback applies.
