id: KI-221
title: consumeBlockContents skips declaration-run flushes on failed reparses and dropped at-rules
description: 'Two arms skip the declaration-run flush that css-syntax-3 consume-block-contents mandates. The nested isDecl arm never restores the mark to reparse a failed declaration as a qualified rule, so ''color: red { x: y; }'' merges the surrounding runs instead of flushing. The at-keyword arm flushes only when the at-rule object is non-null, but the spec flushes before consuming every at-rule. ''color: red; @charset "x"; background: blue;'' therefore keeps one merged CSSNestedDeclarations where the spec emits two.'
