attacker_input: nested rule bodies with declaration-shaped invalid rules or dropped at-rules between declarations; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0017-blockcontents-missing-flush.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat merged CSSNestedDeclarations runs around invalid constructs as expected until the flush lands.
remediation: Restore the mark and reparse failed declarations as qualified rules, and flush decls in the at-keyword arm before consuming the at-rule, matching the spec switch.
