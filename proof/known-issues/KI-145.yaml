id: KI-145
title: normalizePseudoElement rejects spec-valid ::slotted and ::part argument grammars
description: 'normalizePseudoElement gates known functional pseudo-elements on one ident token (src/cascade/index.ts:126). css-shadow-1 #slotted-pseudo defines ::slotted( <compound-selector> ). css-shadow-1 #part-pseudo defines ::part( <ident>+ ). The gate returns invalid for ::slotted(*), ::slotted(div.foo) and ::part(tab active). getCascadedStyle then serves the empty pseudo-element style for selectors the scoping spec accepts.'
