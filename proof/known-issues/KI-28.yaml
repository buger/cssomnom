        getGitCommitInfo from scripts/wpt/node/safe-child-process.ts and drives them inside a
        disposable mkdtemp git repo (local user.email/name configured; git init/add/commit via
        execFileSync argv only); injected payload merely echoes a marker and touches a marker file
