id: KI-28
title: getGitNotesLog interpolates count/ref into an execSync command line (shell command injection)
description: 'scripts/wpt/node/safe-child-process.ts:303-305 (verified at HEAD 83ce08f): getGitNotesLog builds ''git log -n ${count} --notes=${ref} --format=%h %N'' by string interpolation and executes it with execSync (/bin/sh -c). Caller-controlled count/ref become arbitrary shell commands as the process user; the injected payload executes with full stdout capture parsed back as notes entries. The argv-based siblings execGit (L283-285) and addGitNote (L293) demonstrate the safe pattern and stay inert under identical injection. This violates the kernel''s own AGENTS.md Safe Subprocess Execution mandate that all child execution be constrained (CWE-78).'
affected_requirements:
    - SYS-REQ-260823-0A2D
evidence_manifests:
    - proof/evidence/ki-28.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: scripts/wpt/node/safe-child-process.ts getGitNotesLog(count, ref) (used by progress-note flows)
attacker_input: 'count/ref parameters reaching getGitNotesLog (CLI-derived or state-read values carrying shell metacharacters ; | $(...) #)'
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-28-getgitnoteslog-execsync-interpolation-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Only pass literal/trusted count/ref values; treat progress-state-derived strings as hostile until converted.
remediation: Rewrite getGitNotesLog to execFileSync('git', ['log','-n',String(count),'--notes='+ref,'--format=%h %N']) mirroring execGit/addGitNote, and validate count as a positive integer at the boundary.
