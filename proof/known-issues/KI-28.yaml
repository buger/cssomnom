        quantitative_impact: BOTH parameters inject — ref='wpt; echo KI28_REF_MARKER; touch
        ki28-ref-marker #' and count='1; echo KI28_COUNT_MARKER; touch ki28-count-marker #' each
        produce (a) marker files on disk under the repo cwd and (b) echo lines parsed back into
