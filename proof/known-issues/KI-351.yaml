attacker_input: caller-supplied supports condition strings holding custom property declarations; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0064-supports-custom-prop-operator-value.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Use the two-argument form for custom property probing until the condition parser classifies declaration blocks first.
remediation: Try the colon-delimited supports-decl classification before the operator heuristic in evalSupportsInParens, so declaration values never masquerade as condition operators.
