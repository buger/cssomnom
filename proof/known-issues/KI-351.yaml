id: KI-351
title: CSS.supports rejects custom-property declarations whose value is and, or, or not
description: 'evalSupportsInParens scans every ident in the parenthesized block to detect condition operators (src/parser-api.ts ~705). The scan hits the declaration value, so (--x: not) routes into evalSupportsConditionValues instead of the supports-decl arm and returns false. css-conditional-3 defines supports-decl as a parenthesized declaration, and a custom property accepts any declaration-value, including the bare idents and, or, and not. The two-argument form already accepts those same values, so the forms disagree.'
