id: KI-328
title: 'keyText accepts a space before the percent: ''50 %'' normalizes to ''50%'''
description: normalizeKeyframeSelector slices the trailing percent and trims the rest, so '50 %' becomes Number('50') inside the range check and stores '50%'. css-animations-1 requires a SyntaxError for an invalid keyframe selector, and the selector grammar is from, to, or one percentage token. A CSSOM parse of '50 %' yields a number token plus a percent delim. KI-44 pins the JS-radix leg; this pins the whitespace leg.
affected_requirements:
    - SW-REQ-260822-YBF2
