severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: normalizeKeyframeSelector via CSSKeyframeRule.keyText setter, findRule, deleteRule (src/CSSOM.ts)
attacker_input: keyText writes with a space between the number and the percent sign; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0044-keytext-space-percent.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write keyframe selectors as single percentage tokens.
remediation: Parse the selector with the CSS tokenizer instead of endsWith and Number, rejecting any part that is not from, to, or a percentage token.
