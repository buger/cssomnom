attacker_input: declaration values with deeply nested functions passed to resolveVariables; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0069-resolve-variables-deep-recursion.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Bound input nesting depth before resolving values that came from untrusted stylesheets.
remediation: Thread a depth budget through serializeNode and the resolver walkers, mirroring the KI-18 remediation on the resolve path.
