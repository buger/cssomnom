id: KI-309
title: resolveVariables overflows the stack on deeply nested values parse() accepts
description: 'The resolver serializes the stored value, then the serializer and resolver walkers recurse once per nesting level with no depth budget (src/serializer.ts:164-251; src/parser.ts:1727-1740). A 4000-deep calc() value parses cleanly but resolveVariables throws a raw RangeError. css-values-4 #calc-syntax admits arbitrarily nested calc(); the resolver must fail closed. This is the resolve-time sibling of the parse-time overflow in KI-18.'
