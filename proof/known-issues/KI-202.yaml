id: KI-202
title: browser-entry installs non-WebIDL module exports such as createCSSStyleValue onto window
description: installGlobalClasses spreads every module export into the classes object and installs all of them on window (src/browser-entry.ts:163-187). The comment says classes, but the object is a namespace dump with no interface filter. src/typed-om/index.ts exports the module helper createCSSStyleValue, so the browser bundle leaks an internal factory as a window global. No WebIDL interface declares that name.
