id: KI-295
title: matchesSyntax counts insignificant tokens, so supports() rejects valid values
description: 'matchesSyntax hands its raw component-value list to checkItem, which requires exactly one token (src/PropertyRegistry.ts:203). Whitespace and comments are insignificant in declaration values, so ''1 /*c*/'' must match ''<integer>''. parser-api passes the unfiltered list to matchesSyntax (src/parser-api.ts:677), so CSS.supports(''z-index'', ''1 /*c*/'') returns false. css-conditional-3 #the-css-namespace rules make comments insignificant in supported declaration values.'
