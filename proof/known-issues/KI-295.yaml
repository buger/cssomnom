affected_api: PropertyRegistry.matchesSyntax reached from CSS.supports (src/parser-api.ts)
attacker_input: declaration values carrying comments passed to CSS.supports; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0036-matches-syntax-insignificant-tokens.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Strip comments from values passed to CSS.supports until the matcher skips insignificant tokens.
remediation: Filter whitespace and comment component values inside matchesSyntax before matching, as validate() already does at src/PropertyRegistry.ts:328.
