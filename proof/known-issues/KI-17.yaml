        quantitative_impact: measured on current HEAD, Node v24.11.1 — doubling chain depth 2
        resolves to exactly 'x x x x' (reproducer L44); depth 15 expands to 65535 chars in ~445ms;
        depth 20 throws RangeError after ~1.0s. Scan baseline: outLen 511@8, 2047@10, 8191@12,
        32767@14, 65535@15 (~160ms Parser.resolveVariables, ~430ms cascade), RangeError @16+.
        control_test: L44 asserts the exact small-chain substitution result, proving the resolver
        works and only the budget is missing.
        untrusted_attacker: a dozen attacker-authored declarations (--kN: var(--k(N-1)) twice)
        are the entire payload; no host state or privileges needed.
        current_deployment_relevance: variable resolution runs inside getCascadedStyle, the
          library's computed-style entry; confirmed live at HEAD d826b0f before filing.
        honest_severity: medium availability — CPU/memory/stack growth is bounded per call by
        chain length but grows as 2^N; single-request abort primitive, not persistent damage.
        attacker_profitability: linear-byte input buys exponential work and a crash at modest
        depth; ideal cost/benefit for an availability attacker.
        reproducible: two consecutive reproducer runs exited 1 with the asserted failure
        ('acyclic substitution threw RangeError ... expected resolved length <= 10000', L50);
        evidence capture re-ran it again.
        no_inflation: severity_basis reproducer with executed manifest attached; risk availability;
        cve_surface none; cycle detection working is stated rather than inflated into partial fix.
        operational_path_verified: the failing leg calls the exact public cascade path hosts use;
        no internal-only shortcut.
        reachability_verified: any host resolving var() on untrusted CSS via getCascadedStyle /
        Parser.resolveVariables reaches the unbounded expansion directly through public API.
