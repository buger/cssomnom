id: KI-17
title: Acyclic var()/env() substitution expands exponentially without a size budget
description: 'The custom-property resolvers detect cyclic var()/env() graphs but never bound the cost of an ACYCLIC fan-out DAG. A doubling chain --vN: var(--v(N-1)) var(--v(N-1)) re-tokenizes and re-resolves each reference independently, expanding to 2^(N+1)-1 characters: depth 15 already yields a 65535-char value (~160ms via Parser.resolveVariables, ~430ms via getCascadedStyle), and depth 16+ ends in RangeError: Maximum call stack size exceeded. Availability fault (CWE-400) against hosts that resolve variables on untrusted CSS; cycle detection terminating proves no budget, only the cycle set, exists.'
affected_requirements:
    - SYS-REQ-260822-EGPW
evidence_manifests:
    - proof/evidence/ki-17.yaml
severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: getCascadedStyle() / Parser.resolveVariables() / cascade variable-resolver
attacker_input: untrusted stylesheet text with a fan-out (doubling) acyclic custom-property chain plus one consuming property (a dozen declarations suffice)
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-17-var-env-exponential-expansion-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not resolve var()/env() on untrusted stylesheets without an external timeout/memory guard.
remediation: Add an expansion-size and substitution-depth budget to src/cascade/variable-resolver.ts substituteVariables() and the Parser.#resolveVarFunction path alongside the existing cyclicProps set; treat overflow as invalid at computed-value time per css-variables-1.
