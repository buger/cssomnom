id: KI-350
title: CSS.supports throws TypeError for property names that hit Object.prototype
description: evaluateSupportsDeclaration looks up SHORTHANDS with a raw bracket read (src/parser-api.ts ~649,670). SHORTHANDS is a plain object, so names like constructor and __proto__ resolve inherited members. The isSupported gate then passes, and the shorthand arm calls shorthand.expand on the inherited Object value, which has no expand method. CSS.supports('constructor','foo') throws TypeError instead of returning false. css-conditional-3 supports and SYS-REQ-260821-SMW6 require a boolean with no exception. STANDARD_PROPERTIES_SYNTAX carries the same inherited-lookup shape.
