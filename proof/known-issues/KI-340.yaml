id: KI-340
title: Typed OM parse drops empty <bg-position> list items instead of throwing TypeError
description: The POSITION_PROPERTIES list branch skips empty comma segments before reifying each item. css-backgrounds-3 types background-position as <bg-position>#, so a leading, trailing, or doubled comma yields an empty item and invalidates the value. css-typed-om-1 6.6 parse-a-cssstylevalue step 3 must throw TypeError. The parse returns the surviving CSSPositionValue items instead.
