        wpt.fyi API URL and an in-memory results body; dryRun:false so the actual write branch
        (:222-227) executes against disposable temp storage; zero network egress.
        quantitative_impact: absolute --cachePath lands the baseline at <lab>/outside/
        ki26-evil-cache.json and traversal form 'dist/../../outside/ki26-evil-via-dist.json'
        (2 climb segments) lands outside the intended base; both files exist post-call with full
        fetched JSON contents (mkdirSync recursive included, :225).
        control_test: default cachePath stays inside .wpt-cache and ingests totalTests=1
        correctly in the same run — ingestion works, confinement is what is missing.
        untrusted_attacker: operator-supplied option today; hostile values arrive via wrappers,
        Makefiles, or compromised CI inputs flowing into fetchWptFyiRun options.
        current_deployment_relevance: wpt:fetch-upstream npm script runs this against the real
        checkout where ../ can clobber tracked files.
        honest_severity: medium data_integrity — arbitrary-path write of fetched JSON as the
        invoking identity; requires control of the option (no remote vector claimed).
        attacker_profitability: overwrite package.json/tsconfig or plant executable-adjacent
        files outside the tree with API-fetched content as cover.
        reproducible: two consecutive reproducer runs exited 1 asserting containedUnder(cachedPath,
        .wpt-cache); evidence capture re-ran it (proof/evidence/ki-26.yaml status fail).
        no_inflation: severity_basis reproducer; cve_surface none; local write primitive stated
        plainly.
        operational_path_verified: failing leg is the production non-dryRun persistence block
        executed end-to-end through the real function.
        reachability_verified: single options object reaches path.resolve(:224) with no guard
        between.
dedup_armor: |
    Only fetchWptFyiRun cache persistence escapes containment (scripts/wpt/browser/fetch-wptfyi.ts:222-227 — path.resolve + mkdirSync + writeFileSync of the fetched baseline: a WRITE overlay primitive driven by the operator-supplied --cachePath option). Distinct from KI-24 (runWptFile sandbox.fetch /interfaces/ bridge in scripts/wpt/node/run.ts:143-147 — a READ disclosure serving local files to fixture JS via fixture-controlled fetch URLs; no write sink). Different API surface, opposite sink direction (write vs read), different attacker input (operator CLI option vs fixture page JS). Do not merge into a generic path-containment fix without covering both sinks.
kill_domain: path_traversal
do_not_refile_as: fetch-wptfyi cachePath unconstrained resolve write
affected_file: scripts/wpt/browser/fetch-wptfyi.ts
