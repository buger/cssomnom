id: KI-26
title: fetch-wptfyi --cache-path writes fetched baselines to unconstrained path.resolve destinations
description: 'scripts/wpt/browser/fetch-wptfyi.ts:222-227 (verified at HEAD 83ce08f): targetPath = path.resolve(options.cachePath || ''.wpt-cache/report-chrome-upstream.json'') followed by mkdirSync(path.dirname(targetPath), {recursive:true}) and fs.writeFileSync of the fetched baseline — no allowlisted-base containment. An absolute --cache-path or traversal form dist/../../outside/x.json lands attacker/operator-chosen files anywhere the invoking identity can write, clobbering checkout files or dropping payloads outside the tree (CWE-22).'
affected_requirements:
    - SYS-REQ-260823-MPS4
    - STK-REQ-260821-556N
evidence_manifests:
    - proof/evidence/ki-26.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: fetchWptFyiRun() cache persistence (scripts/wpt/browser/fetch-wptfyi.ts; pnpm run wpt:fetch-upstream)
attacker_input: operator-supplied --cachePath option (absolute targets or ../ traversal relative forms)
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-26-wptfyi-cachepath-resolve-write-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Avoid passing operator-controlled cachePath values on shared/multi-tenant checkouts.
remediation: Resolve cachePath against a fixed base and require path.relative(base, targetPath) to stay inside the .wpt-cache base before mkdir/write; fail closed on escape exactly like the confined-write contrast shape in the scan PoC.
