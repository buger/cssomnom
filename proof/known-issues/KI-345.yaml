affected_api: CSSPropertyRule.cssText (src/CSSOM.ts)
attacker_input: any @property rule with an initial-value descriptor; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0056-property-rule-csstext-missing-space.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Re-serialize cssText output before echoing it into stylesheets.
remediation: Append the initial-value clause with a leading space, mirroring the other descriptor clauses.
