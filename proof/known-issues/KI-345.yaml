id: KI-345
title: CSSPropertyRule.cssText omits the space between inherits and initial-value
description: 'The cssText getter appends ''initial-value: ...'' directly after ''inherits: <v>;'' with no separator. cssom-1 #serializing-css-declarations requires each declaration to serialize as name, '': '', value, ''; ''. The rule therefore serializes as ''inherits: false;initial-value: 0;'', which is not canonical @property text.'
