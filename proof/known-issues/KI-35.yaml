affected_api: CSS.registerProperty() / PropertyRegistry.register() syntax-string parsing
attacker_input: property definition dictionaries with brace-multiplier syntax strings; reachable from any caller of registerProperty
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-35-register-property-brace-multiplier-overlay-260823.ts
tripwire_mutation: Restricting the multiplier grammar to {+,#} in the property-syntax parser flips both brace legs red->green while +/# controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not ship definitions whose syntax contains brace multipliers; validate syntax strings at the boundary before calling registerProperty.
remediation: Constrain the syntax-string parser to the closed multiplier set {+,#} and throw SyntaxError for any other multiplier token, including {N}/{N,M} forms.
