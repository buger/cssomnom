id: KI-124
title: Declaration-block parsing retains grammar-invalid values instead of dropping them
description: 'Declaration-block parsing keeps declarations whose values fail the property grammar. cssom-1 #parse-a-css-declaration-block step 3.1 parses each declaration per the appropriate specifications and drops the parts said to be ignored. A value that fails its property grammar is ignored, so getPropertyValue must return empty. At HEAD the probes width:red, color:10px, animation-timing-function:bogus(), and margin-left:solid all survive with non-empty reads. The invalid-superset oracle measured 6627 retained-invalid instances across 811 properties at seed 260825 on HEAD. KI-113 font, KI-117 relative color, KI-105 display, and KI-104 keyframes pin narrow instance slices; this issue owns the generic missing grammar-validation root.'
