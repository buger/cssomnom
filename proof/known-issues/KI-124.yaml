        real_infrastructure: public parse() and getPropertyValue() over stylesheet text - no mocks; probes span ident, dimension, function, and keyword value types.
        quantitative_impact: measured at HEAD - width:red, color:10px, animation-timing-function:bogus(), and margin-left:solid all survive with non-empty reads (4 defect legs) while both controls stay green; invalid-superset oracle measured 6627 retained-invalid instances over 811 properties at seed 260825.
