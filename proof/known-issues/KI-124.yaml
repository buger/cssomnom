dedup_armor: |
    Declaration blocks retain values that FAIL their property grammars (cssom-1 #parse-a-css-declaration-block step 3.1 says such parts are ignored), so getPropertyValue must return empty but returns raw text. Nearest open high sibling KI-40 is an adjacent stage in the OPPOSITE direction: the Parser API adapter drops EVERY declaration from CSSParserQualifiedRule.body (API surface loss), while KI-124 keeps exposed declarations it should have rejected. Fixing KI-40 body plumbing performs no grammar validation, so merging the filings hides one leg behind the other. KI-36 (missing generated shorthand expansion table) is a different mechanism - expansion data absence, not acceptance of invalid values. Instance slices KI-113 font, KI-117 relative color, KI-105 display, and KI-104 keyframes pin distinct property families until the generic validator lands; do not cross-close them.
kill_domain: grammar_validation_absence
do_not_refile_as: 'grammar-invalid value retained for one specific property: file as an instance of this generic root unless a distinct validation mechanism applies; relative color retention (KI-117), font shorthand retention (KI-113), display retention (KI-105), keyframe retention (KI-104): existing instance filings of this same root'
