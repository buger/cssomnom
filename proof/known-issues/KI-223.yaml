severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleDeclaration.setProperty shorthand branch (src/CSSStyleDeclaration.ts)
attacker_input: declaration values whose quoted strings or urls contain the characters var(; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0019-shorthand-var-substring.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Avoid quoted strings containing var( inside shorthand values until detection is token-level.
remediation: Detect var()/env() on the parsed component values (function tokens) rather than the serialized text.
