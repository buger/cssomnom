id: KI-223
title: setProperty detects var() by substring, so quoted "var(" blocks shorthand expansion
description: 'The shorthand branch computes hasVar with value.includes(''var('') || value.includes(''env('') (src/CSSStyleDeclaration.ts:521). css-variables-1 #using-variables makes a var() inside a quoted string inert. background: url("var(x)") therefore skips expansion, wipes the longhands, and getPropertyValue(''background-image'') returns ''''. Distinct from KI-185, which pins the same substring heuristic in StylePropertyMap.'
