id: KI-22
title: Math expression parse/simplify recurses unbounded on nested calc() input
description: 'parseMathExpressionTokens / parseMathFunction / simplify in src/math-parser.ts descend nested parentheses, nested calc(), and deep CSSMathValue trees with no expression-depth or node-count budget. The public tokenize -> Parser.parseComponentValues -> createCSSStyleValue path aborts with a raw RangeError: Maximum call stack size exceeded at parenNest(4000) / calcNest(3000). css-values-4 #calc-syntax admits arbitrarily nested calc(); a consumer must fail closed with a structured error instead of relying on the engine stack. Availability fault (CWE-674/CWE-400); sibling manifestation of KI-18''s missing depth invariant inside math value consumption.'
affected_requirements:
    - SYS-REQ-260822-JD78
evidence_manifests:
    - proof/evidence/ki-22.yaml
severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: createCSSStyleValue() / CSSNumericValue.parse() / Typed OM calc() value paths
attacker_input: untrusted calc()/math string with a few thousand nesting levels of parentheses or nested calc() (linear byte cost)
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-22-math-parser-unbounded-recursion-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not reify untrusted calc() strings through Typed OM value factories without a process-level stack guard.
remediation: Thread an expression-depth/node-count counter through parseMathFunction and simplify; reject over-budget expressions with a structured parse error before recursion exhausts the stack.
