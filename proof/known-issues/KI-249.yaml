id: KI-249
title: CSSUnitValue.to throws TypeError for every hz/khz frequency conversion
description: 'CSSUnitValue.to implements only length, angle, time and resolution arms. css-typed-om-1 #convert-a-cssunitvalue converts between any compatible units, and css-values-4 makes hz and khz one frequency family. new CSSUnitValue(1000,''hz'').to(''khz'') throws ''Unsupported conversion for frequency''. isCompatible(''hz'',''khz'') reports true, so toSum and numericTo advertise conversions the converter cannot perform.'
