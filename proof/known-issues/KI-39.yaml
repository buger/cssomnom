tripwire_mutation: Collapse single-child Sums in the Product serializer (or serialize from canonicalized trees) so toString() output re-parses to an equal tree; both failing legs flip red->green while both positive controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Persist serialized math strings as-is; do not assume toString() output re-parses to an equivalent tree.
remediation: 'Make math serialization fixpoint-stable: collapse single-child Sum/Product nodes during serialization (or avoid creating degenerate wrappers in style-value-factory), so String(v) === String(parse(String(v))) for every CSSMathValue.'
