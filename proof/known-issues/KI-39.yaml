id: KI-39
title: 'calc() serialization not fixpoint-stable: single-child Sum serializes as parenthesized product operand'
description: 'CSSMathValue.toString() output does not re-parse to the same structure. Fully public chain at HEAD: CSSStyleValue.parse(''width'',''calc(1px + 2px)'') folds to a degenerate single-child CSSMathSum (''calc(3px)''); .mul(3) then serializes ''calc((3px) * 3)'', whose re-parse serializes ''calc(9px)'' - String(v) !== String(parse(String(v))). Direct construction shows the identical defect: new CSSMathProduct(CSS.number(3), new CSSMathSum(CSS.px(3))).toString() === ''calc(3 * (3px))'' which re-parses to ''calc(9px)''. Meanwhile a fresh parse of the folded value is stable, proving inconsistent simplification between the arithmetic path and the parse path. Root cause: src/typed-om/values/style-value-factory.ts:47 wraps folded unit values in degenerate single-child CSSMathSum nodes and the Product serializer (src/typed-om/numeric/math/CSSMathOperations.ts ~L150) parenthesizes non-first children without collapsing single-child Sums. css-syntax-3 #serialization (Overview.bs:3710-3712) requires serialization to round-trip with parsing; css-values-4 #serialize-a-calculation-tree defines the Sum (:5312-5340) and Product (:5342-5365) node steps whose parenthesization must preserve tree equivalence. All WPT cssMathValue serialization rows pass - isolated to folded nested sums reachable through typed OM arithmetic. Correctness fault (serializer equivalence violation). Distinct from KI-31 (media condition parentheses, different layer).'
