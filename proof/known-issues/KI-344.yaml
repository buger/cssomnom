id: KI-344
title: PropertyRegistry.get returns the live record; mutating origin bypasses the duplicate check
description: PropertyRegistry.get returns the Map value by reference, including the internal origin tag. A caller that flips record.origin to 'css' defeats the JS-then-JS duplicate branch. The second register of the same name then overwrites silently. register-a-custom-property step 2 requires InvalidModificationError for any repeated name.
