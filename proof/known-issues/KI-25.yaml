id: KI-25
title: sandbox.fetch falls through to the host network stack for non-/interfaces/ URLs (SSRF egress)
description: 'scripts/wpt/node/run.ts overrides the fixture sandbox''s fetch to serve /interfaces/*.idl locally but ends with an unconditional ''return fetch(input, init)'' (L158 at HEAD 83ce08f) — no scheme/host allowlist. Page JS running in the vm sandbox can drive the privileged runner process against arbitrary URLs: cloud metadata 169.254.169.254, loopback/RFC1918 internal services, attacker exfil collectors; even a missing in-tree IDL falls through instead of failing closed. SSRF/confused-deputy egress (CWE-918) from maintainer/CI identities.'
affected_requirements:
    - SYS-REQ-260823-7TCQ
evidence_manifests:
    - proof/evidence/ki-25.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: scripts/wpt/node/run.ts sandbox.fetch bridge inside runWptFile()
attacker_input: fixture-controlled fetch() arguments of any scheme/host (https://attacker.example, http://169.254.169.254, loopback services)
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-25-wpt-sandbox-fetch-host-fallthrough-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Run WPT fixtures only on network-isolated hosts; assume any URL probed by fixture JS may egress until the bridge is closed.
remediation: 'Replace the fallthrough with a fail-closed deny: serve only allowlisted in-tree prefixes (/interfaces/, optionally /resources/) and return a rejected Response (or throw) for everything else; never forward to host fetch.'
