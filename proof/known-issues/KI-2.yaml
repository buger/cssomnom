evidence_manifests:
    - proof/evidence/ki-2.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleSheet.replace
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-2-replace-sync.ts
reproduction_steps:
    - 'Construct a CSSStyleSheet and call replace(''div { color: red; }'').'
    - Observe cssRules.length is 0 before awaiting the returned Promise (parse is queued in queueMicrotask).
    - After await, cssRules is populated.
    - 'Intended contract (README): replace() calls replaceSync() then returns Promise.resolve(this); cssRules is populated before replace() returns.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-2-replace-sync.ts'
introduced_in: inception
defect_class: latent
mitigation: Await the Promise from replace() before reading cssRules. That is not the documented README contract.
remediation: Product fix was rolled back to origin/main logic in fe7defa (Implements comments kept). Overlay cannot land replaceSync+Promise.resolve(this) in src/CSSOM.ts. Close only after cssRules is populated before replace() returns. DEFECT-260821-QHWP is stale class-closure paperwork — do not delete.
notes:
    - '2026-08-22: src logic restored to origin/main (264c2ea / 0.1.4) in fe7defa; Implements comments kept. Campaign class-fixes are gone. Reopened. Overlay reproducer is again a failing tripwire. DEFECT-260821-QHWP is stale class-closure paperwork — do not delete.'
