id: KI-2
title: CSSStyleSheet.replace parses in queueMicrotask instead of Promise.resolve after replaceSync
description: |
    README documents a Node.js deviation: replace() executes parsing synchronously via replaceSync() and returns Promise.resolve(this). Product now honors that: replace() calls replaceSync then Promise.resolve(this), so cssRules is populated before replace() returns. Overlay SAT TRUE row (deviation_applies=T, documented_deviation_honored=T, replace_sync_parse_runs=T => TRUE) is witnessed on tests/mcdc-witness-cssom.test.ts. The honored=F FALSE row is unreachable after the fix and is //mcdc:ignore:defensive. Overlay reproducer proof/reproducers/KI-2-replace-sync.ts PASSES (no [known-issue] tripwire). Class-closure DEFECT-260821-QHWP.
affected_requirements:
    - SW-REQ-260821-PAKB
    - SYS-REQ-260821-GR67
commands:
    - node --test tests/constructable-stylesheets.test.ts
evidence_manifests:
    - proof/evidence/ki-2.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleSheet.replace
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-2-replace-sync.ts
reproduction_steps:
    - 'Construct a CSSStyleSheet and call replace(''div { color: red; }'').'
    - Observe cssRules.length is 1 and cssText is the parsed rule before awaiting the returned Promise.
    - The returned value is a Promise that resolves to the same sheet (Promise.resolve(this)); after await, cssRules is unchanged.
    - 'Fixed contract (README): replace() calls replaceSync() then returns Promise.resolve(this); cssRules is populated before replace() returns.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-2-replace-sync.ts (PASSES on HEAD).'
introduced_in: inception
defect_class: latent
mitigation: replace() calls replaceSync then Promise.resolve(this) as README documents.
remediation: Landed in src/CSSOM.ts. Class-closure DEFECT-260821-QHWP.
notes:
    - 'Overlay MC/DC reclassified after product fix: SAT TRUE unique-cause rows are witnessed; guarantee-violation FALSE rows are //mcdc:ignore:defensive (unreachable). Overlay reproducer PASSES and has no [known-issue] tripwire. Status remains fixed. KI-7 stays open.'
