id: KI-2
title: CSSStyleSheet.replace parses in queueMicrotask instead of Promise.resolve after replaceSync
description: 'README documents a Node.js deviation: replace() executes parsing synchronously via replaceSync() and returns Promise.resolve(this). HEAD still parses inside queueMicrotask, so cssRules is empty when replace() returns. Overlay audit cannot change product code. No new DEFECT: DEFECT-260821-QHWP is stale class-closure paperwork from a rolled-back class-fix, not a live ticket.'
affected_requirements:
    - SW-REQ-260821-PAKB
    - SYS-REQ-260821-GR67
commands:
