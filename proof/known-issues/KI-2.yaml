id: KI-2
title: CSSStyleSheet.replace parses in queueMicrotask instead of Promise.resolve after replaceSync
description: |
    README documents a Node.js deviation: replace() executes parsing synchronously via replaceSync() and returns Promise.resolve(this). The live implementation schedules tokenize + ParseHooks.consumeListOfRules inside queueMicrotask, so cssRules is still empty when replace() returns. Overlay audit cannot change product code. No DEFECT is filed: a ProblemReport is post-fix class-closure evidence, not a live ticket.
    The SW-REQ-260821-PAKB SAT TRUE row (deviation_applies=T, documented_deviation_honored=T, replace_sync_parse_runs=T => TRUE) is blocked by this live hole, not mute: HEAD cannot honor documented sync replace while queueMicrotask deferral remains. Red is honest. The overlay reproducer does not witness that SAT assignment as [known-issue]; the tripwire observes honored=F (cssRules empty) and must not claim honored=T.
affected_requirements:
    - SW-REQ-260821-PAKB
    - SYS-REQ-260821-GR67
commands:
    - node --test tests/constructable-stylesheets.test.ts
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleSheet.replace
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-2-replace-sync.ts
reproduction_steps:
    - 'Construct a CSSStyleSheet and call replace(''div { color: red; }'').'
    - Observe cssRules.length is 0 before awaiting the returned Promise.
    - After await, cssRules contains the parsed rule.
    - 'Intended contract (README): parsing runs synchronously via replaceSync(); cssRules is populated before replace() returns Promise.resolve(this).'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-2-replace-sync.ts'
introduced_in: inception
defect_class: latent
mitigation: replace() calls replaceSync then Promise.resolve(this) as README documents.
remediation: Landed in src/CSSOM.ts. Class-closure DEFECT-260821-QHWP.
