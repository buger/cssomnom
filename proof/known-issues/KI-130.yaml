id: KI-130
title: Unitless zero reifies as px instead of preserving the number leg on border-image-outset and width
description: 'Typed zero values on border-image-outset and border-image-width reify with unit px instead of unit number. css-typed-om-1 #reify-a-numeric-value step 2 maps a unitless zero to px only when the value is a dimension. Step 3 sets unit number for a number value. The dual length-or-number grammars of these properties match the number leg, and typed inputs carry that leg explicitly. Non-zero numbers round-trip correctly today, so the coercion keys on the zero magnitude alone. Local WPT border-image-outset.html pins the number case through assert_is_equal_with_range_handling.'
