id: KI-265
title: env() substitution cycles recurse without a seen set and overflow the JS stack
description: '#resolveEnvFunction re-tokenizes the raw envMap value and re-enters #resolveVariablesInComponentValues with the var() seen set (src/parser.ts:1871-1875). The set never records env names. css-variables-1 #using-variables makes a substitution cycle resolve to the guaranteed-invalid value. Parser.resolveVariables(style, ''color'', { ''safe-area-inset-top'': ''env(safe-area-inset-top)'' }) therefore dies with RangeError: Maximum call stack size exceeded instead of returning the empty value.'
