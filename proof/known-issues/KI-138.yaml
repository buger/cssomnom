id: KI-138
title: calc() ratio operands in aspect-ratio type-check but evaluate unknown
description: 'isValidRatioOperand admits math functions with a number type as ratio operands (src/MediaParser.ts:706-718). parseRatio accepts only number tokens, so (aspect-ratio: calc(4) / calc(3)) parses as a known feature and then evaluates unknown. WPT css/mediaqueries/mq-calc-008.html requires calc() ratio operands to compare. Against the default 800x600 environment the query (aspect-ratio: calc(4) / calc(3)) must match and currently returns false.'
