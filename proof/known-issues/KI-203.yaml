id: KI-203
title: parseRuleSync returns null for empty and unparseable input instead of a syntax error
description: parseRuleSync maps a null consumeRule result to null and skips the EOF check (src/parser-api.ts:536-538). css-syntax-3 5.4.6 parse-a-rule step 3 returns a syntax error when the next token is EOF. Step 4 returns a syntax error when consume a qualified rule yields nothing. parseRuleSync('') and parseRuleSync('div') therefore return null, so callers cannot separate an empty stylesheet from an invalid one. Trailing garbage already throws through ensureEOF.
