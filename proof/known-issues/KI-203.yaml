attacker_input: empty, whitespace-only, comment-only, or block-less rule text passed to parseRule; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0014-parse-rule-null-not-syntax-error.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat a null parseRuleSync result as a syntax error at the call site.
remediation: Throw a SyntaxError DOMException when consumeRule returns null, matching css-syntax-3 5.4.6 steps 3 and 4.
