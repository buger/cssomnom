id: KI-45
title: CSS.parseValue('10% x') silently returns 10% while parseComponentValue throws on trailing garbage
description: 'parseValueSync lacks the EOF check its sibling parseComponentValueSync performs, so trailing garbage after one value is silently truncated. css-syntax-3 #parse-a-component-value (~2457-2484) returns a syntax error when input is non-empty after one component value, and both APIs document themselves as exposing those algorithms. Honest caveat: the thin WICG draft does not spell out parseValue failure semantics explicitly; the violation is anchored on the shared css-syntax algorithm plus internal inconsistency (sibling throws), not explicit parseValue prose. README documents both APIs without a leniency deviation.'
affected_requirements:
    - SYS-REQ-260823-PVE7
evidence_manifests:
    - proof/evidence/ki-45.yaml
severity: low
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSS.parseValue -> parseValueSync (src/parser-api.ts ~L563-569) vs CSS.parseComponentValue -> parseComponentValueSync (~L590-605)
attacker_input: value strings with trailing garbage after one component value; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-45-parsevalue-trailing-garbage-lenient-overlay-260823.ts
tripwire_mutation: Add the same EOF/leftover check to parseValueSync that its sibling performs (~583-587) so it throws on trailing garbage; both rejection legs flip red->green while clean-value controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Use CSS.parseComponentValue(Sync) instead of parseValue for untrusted or hand-edited strings. That sibling API rejects trailing garbage today. Otherwise verify the string contains exactly one component value before calling parseValue.
remediation: 'Add the leftover-input check to parseValueSync that parseComponentValueSync performs. Throw a syntax error when input remains after one component value. Match the css-syntax-3 #parse-a-component-value failure semantics.'
