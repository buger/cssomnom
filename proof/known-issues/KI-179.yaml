id: KI-179
title: Parser.resolveVariables uses the var() fallback for a specified-empty custom property
description: '#resolveVarFunction gates substitution on rawValue truthiness plus a non-blank trim (src/parser.ts:1769-1770). A declared ''--x:;'' therefore falls through to the fallback arm. css-variables-1 #guaranteed-invalid defines an empty specified value as a valid value, not the guaranteed-invalid value. var(--x, red) must substitute empty and leave the property invalid at computed-value time. The resolver returns ''red'' instead.'
