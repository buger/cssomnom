introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Declare a non-empty value or omit the property until empty specified values stop selecting the fallback.
remediation: Distinguish a declared empty custom property from an unset one and substitute it as empty, using the fallback only for the guaranteed-invalid value.
