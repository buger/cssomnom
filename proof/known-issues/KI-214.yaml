severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSS.parseValue -> parseValueSync (src/parser-api.ts L569-574)
attacker_input: value strings with leading whitespace; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0015-parsevalue-leading-whitespace.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Trim leading whitespace before calling parseValueSync, or use parseComponentValueSync which discards it.
remediation: Discard leading whitespace before consuming the component value in parseValueSync, matching css-syntax-3 5.4.8 step 2.
