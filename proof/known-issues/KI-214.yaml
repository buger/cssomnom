id: KI-214
title: parseValueSync returns the leading whitespace token as the parsed value
description: parseValueSync calls consumeComponentValue directly with no leading-whitespace discard. css-syntax-3 5.4.8 parse-a-component-value discards whitespace before consuming the single value. parseValueSync('  red') returns a CSSParserToken serializing to a single space instead of the ident 'red'. The sibling parseComponentValueSync applies the discard and returns 'red'. css-syntax-3 5.4.8 step 2 mandates the discard for every entry point wrapping the algorithm.
