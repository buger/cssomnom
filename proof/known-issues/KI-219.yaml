attacker_input: declaration strings with at-rule prefixes or non-declaration content; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0015-parsedeclaration-atrule-prefix.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Pre-validate the string with parseDeclarationListSync or wrap parseDeclarationSync in a null check that throws.
remediation: 'Run css-syntax-3 5.4.7 directly: consume one declaration and throw a SyntaxError DOMException when nothing returns. Returning the first declaration of a multi-declaration string stays conformant.'
