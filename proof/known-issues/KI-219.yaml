id: KI-219
title: parseDeclarationSync skips at-rule prefixes and returns null instead of a syntax error
description: 'parseDeclarationSync reuses the declaration-list parser and returns list[0]. css-syntax-3 5.4.7 parse-a-declaration consumes one declaration and returns a syntax error when nothing comes back. A leading at-keyword fails consume-a-declaration, so ''@media all { } color: red'' is a syntax error. The impl drops the at-rule and returns ''color: red''. Unparseable input such as ''div'' returns null instead of an error. The WICG parseDeclaration return type is non-nullable CSSParserDeclaration.'
