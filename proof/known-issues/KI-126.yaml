id: KI-126
title: parse() leaves CSSAtRule.childRules unset so unknown at-rule children stay unreachable
description: 'Unknown at-rules with blocks parse into CSSAtRule objects whose childRules field stays undefined on the parse() entry point. css-syntax-3 #consume-an-at-rule retains unknown at-rules in full, and the CSSAtRule class declares childRules with a serializer branch over it. The cascade walker reads the same field, and the component-value-stream parser path populates it, so population is an established internal contract. The token-stream path constructs CSSAtRule with the block only, so inner qualified rules stay reachable only through re-parsing raw cssText. cssom-1 defines no unknown-rule interface and leaves child access unregulated; this filing records interop fidelity against our own contract and postcss issue 8, not a cssom-1 violation.'
