id: KI-195
title: toParserRule turns CSSNestedDeclarations into an empty CSSParserRawRule
description: 'CSSNestedDeclarations has CSSRule.type 0 and a cssText that holds a plain declaration list. toParserRule routes it into the type-0 at-rule arm, every instanceof check fails, and atRulePartsFromCssText returns null because no at-keyword exists. The record lands on the CSSParserRawRule fallback, which calls serialize() on the CSSOM object itself and yields an empty string. parseStylesheetSync(''div { color: red; span { color: blue } color: green }'') drops the trailing color: green. css-nesting-1 keeps those declarations, and INT-REQ-260821-WTPD requires parser_ast_adapted.'
affected_requirements:
    - INT-REQ-260821-WTPD
evidence_manifests:
    - proof/evidence/ki-195.yaml
severity: medium
severity_basis: risk
risk: data_integrity
cve_surface: none
affected_api: parseStylesheetSync/toParserRule declaration fallback for CSSNestedDeclarations (src/parser-api.ts)
attacker_input: ordinary stylesheet text using nested style rules with trailing declarations; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types proof/reproducers/CRS-0068-nested-declarations-rawrule.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Keep nested declarations out of stylesheets parsed through the Parser API, or read them from the CSSOM .style.
remediation: Map CSSNestedDeclarations to CSSParserDeclaration nodes from .style before the type-0 at-rule arm, and stop calling serialize() on non-component-value objects.
