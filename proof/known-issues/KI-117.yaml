id: KI-117
title: Grammar-invalid relative color values are retained instead of dropped by declaration-block parsing
description: 'Declaration-block parsing keeps color declarations whose values fail the css-color grammar, including every WPT css/css-color/parsing/color-invalid-relative-color.html row probed (rgb/hsl/hwb/lab/oklch channel-type mismatches and invalid component names such as rgb(from rebeccapurple r 10deg 10) and rgb(from rebeccapurple red g b)). cssom-1 #parse-a-css-declaration-block step 3.1 requires parsing each declaration per the appropriate specifications and DROPPING the parts said to be ignored; a grammar-invalid value must yield an empty getPropertyValue(color) while valid neighbors survive. The reproducer also carries a green positive control proving valid relative colors round-trip, pinning that this is retention-of-invalid, not blanket rejection.'
