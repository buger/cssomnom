introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not trust parsed color values as grammar-validated input downstream; treat retained spellings as unvalidated text.
remediation: 'Implement the css-color grammar check for the color property in declaration-block parsing and drop failing declarations per cssom-1 #parse-a-css-declaration-block step 3.1, preserving neighboring valid declarations (WPT color-invalid-relative-color.html).'
