id: KI-332
title: '@view-transition keeps a non-empty prelude its grammar forbids'
description: 'handleViewTransitionRule never inspects rule.prelude (src/parser.ts:497-499). The handler constructs the rule from the block alone. css-view-transitions-2 #view-transition-rule types ''@view-transition { <declaration-list> }'' with an empty prelude, so extra prelude tokens invalidate the rule. ''@view-transition foo { navigation: auto }'' survives and silently drops the prelude from its serialized form.'
