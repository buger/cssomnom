id: KI-141
title: MediaParser.evaluate leaks a raw TypeError for incompatible-unit calc in feature values
description: 'canonicalSerialize guards parseMathFunction with try/catch, but the evaluation path calls it unguarded. parseMathFunction throws for calc(1px + 1deg) and min(1px, 1deg), so the throw escapes MediaParser.evaluate through matchesType at src/MediaParser.ts:727. mediaqueries-4 #error-handling requires the query to fold to not all, so evaluate must return false. cascade/rule-filter.ts:510 routes stylesheet media text into this call, so untrusted stylesheet content crashes the host instead of failing closed.'
affected_requirements:
    - SW-REQ-260822-QKE9
evidence_manifests:
    - proof/evidence/ki-141.yaml
severity: medium
severity_basis: risk
risk: availability
affected_api: MediaParser.evaluate reached from cascade rule filtering
attacker_input: untrusted stylesheet @media text containing a math function with incompatible units; crosses the stylesheet trust boundary
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-calc-typeerror-escape.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Wrap every parseMathFunction call on the evaluation path in try/catch and treat a throw as an unknown value.
remediation: Catch parseMathFunction failures in matchesType, isValidRatioOperand, parseLengthToPx, and parseResolutionToDpi, and return unknown or null so the query folds to not all.
