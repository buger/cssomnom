id: KI-246
title: Syntax strings accept '?', '*' and whitespace-separated multipliers
description: 'consumeSyntaxComponent accepts ''?'', ''*'' and a multiplier after whitespace. css-properties-values-api #multipliers closes the multiplier set to ''+'' and ''#'' and requires immediate adjacency. #consume-a-syntax-definition must fail on the leftover multiplier token. CSS.registerProperty({syntax:''<length>?''}) and ''<length> +'' register instead of throwing SyntaxError.'
