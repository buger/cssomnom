introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Restrict syntax strings to the '+' and '#' multipliers written directly after the component name.
remediation: Accept only U+002B and U+0023 immediately after the component name and let parseSyntax reject the leftover token.
