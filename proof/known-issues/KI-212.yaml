id: KI-212
title: setProperty checks priority before the empty-value removal and trims the priority string
description: 'setProperty normalizes priority with trim().toLowerCase() and returns early when it is not '''' or ''important'' (src/CSSStyleDeclaration.ts:486-490). cssom-1 #dom-cssstyledeclaration-setproperty runs the empty-value removal before the priority gate, so setProperty(''color'','''',''bogus'') must still remove color. The spec compares the raw priority string, so '' important '' must fail the ASCII case-insensitive match; the trim makes it register as important.'
