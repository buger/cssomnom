introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Pass '' or 'important' exactly as the priority; empty out values through removeProperty.
remediation: Reorder the steps (empty-value removal first) and compare the raw priority without trim, per cssom-1 setProperty steps.
