id: KI-135
title: Media viewport units resolve against hardcoded 800x600 instead of MediaEnvironment
description: 'parseLengthToPx converts vw/vh/vi/vb/vmin/vmax against hardcoded 800 and 600 (src/MediaParser.ts:985-990). css-values-4 #viewport-relative-lengths defines these units against the live viewport. MediaParser.evaluate receives the caller viewport in the environment, so (width: 100vw) must equal env.width. A caller evaluating (width: 100vw) with width 1920 gets false instead of true.'
affected_requirements:
    - SW-REQ-260822-QKE9
evidence_manifests:
    - proof/evidence/ki-135.yaml
severity: low
severity_basis: risk
risk: correctness
affected_api: MediaParser.evaluate media feature value conversion
attacker_input: caller-supplied media query text containing viewport-percentage units; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-media-vw-hardcoded.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Pass width and height from MediaEnvironment into parseLengthToPx and compute viewport units from them.
remediation: Thread env.width and env.height through parseValueForFeature into parseLengthToPx and derive vw/vh/vi/vb/vmin/vmax from the environment.
