id: KI-272
title: '@view-transition keeps an off-grammar navigation descriptor value'
description: 'handleViewTransitionRule assigns the serialized declaration value unconditionally (src/CSSOM.ts:1130). css-view-transitions-2 #view-transition-navigation-descriptor types navigation as ''auto | none'' and requires off-grammar descriptors to be ignored in their entirety. The getter then returns the empty string because no descriptor exists. parse(''@view-transition { navigation: bogus }'') therefore reports navigation ''bogus'' and re-serializes it.'
