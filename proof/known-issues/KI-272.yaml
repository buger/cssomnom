introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Ignore @view-transition rules whose navigation value is not auto or none.
remediation: Parse the navigation declaration against the css-view-transitions-2 grammar and skip off-grammar descriptors.
