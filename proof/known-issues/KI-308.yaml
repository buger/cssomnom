id: KI-308
title: resolveVariables skips mixed-case VAR() and ENV() in custom properties
description: 'The parser resolver compares function names with === ''var'' / === ''env'' (src/parser.ts:1721-1724). Custom properties keep raw author text, so uppercase spellings survive to substitution. css-values-4 4.1 #keywords makes function names ASCII case-insensitive. Parser.resolveVariables returns the literal reference instead of the substituted value.'
