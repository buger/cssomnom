id: KI-127
title: url() reifies as concrete CSSURLImageValue subclass instead of opaque exact CSSImageValue on get()
description: 'StylePropertyMap get() reifies url() image values as instances of a concrete CSSURLImageValue subclass. css-typed-om-1 #imagevalue-objects declares only interface CSSImageValue : CSSStyleValue and calls the object intentionally opaque. No CSSURLImageValue interface exists anywhere in the Level 1 surface. Local WPT fixtures pin assert_class_string(result, CSSImageValue), so the leaked subclass tag fails five sandbox rows across background-image, border-image-source, list-style-image, mask-image, and shape-outside. The instanceof hierarchy leg stays correct today; only the public class identity leaks.'
