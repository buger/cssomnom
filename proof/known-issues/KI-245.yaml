reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0024-universal-syntax-independence.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Register typed initial values only, or omit initialValue with the universal syntax.
remediation: Run isComputationallyIndependent on the parsed initialValue for every syntax, including the universal definition.
