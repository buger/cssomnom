id: KI-245
title: Universal-syntax @property skips the computational-independence check on initial values
description: 'PropertyRegistry.validate skips isComputationallyIndependent when the syntax is the universal ''*''. css-properties-values-api #register-a-custom-property step 4 requires independence whenever initialValue is present. CSS.registerProperty({syntax:''*'', initialValue:''var(--y)''}) stores the registration. The @property rule with initial-value: var(--y) survives too. WPT at-property.html line 148 expects that rule invalid.'
