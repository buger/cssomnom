severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.handleLayerRule statement branch (src/parser.ts)
attacker_input: stylesheet text with @layer; or comma-only layer statements; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0003-layer-statement-empty-namelist.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Name at least one layer in every @layer statement until empty lists are rejected.
remediation: Return null from handleLayerRule when the filtered name list is empty.
