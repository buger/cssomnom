id: KI-171
title: Empty-name @layer statement is kept as CSSLayerStatementRule([]) instead of ignored
description: handleLayerRule filters empty name segments but still constructs CSSLayerStatementRule with an empty list. css-cascade-5 layer-empty types the statement form as <layer-name>#, which requires one or more names. '@layer;' therefore must be ignored, yet the rule reaches cssRules and serializes as '@layer ;'.
