severity: medium
severity_basis: risk
risk: correctness
affected_api: getCascadedStyle(element, rules) disconnected-element path
attacker_input: host-supplied duck-typed or detached DOM elements; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0004-disconnected-element-empty.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Attach elements before requesting cascaded style, or resolve detached subtrees without the connectivity guard.
remediation: Keep the explicit rules argument authoritative when the caller passes it, and fall back to a computed-style declaration for detached elements instead of an empty mutable one.
