id: KI-148
title: getCascadedStyle drops rules, inline style and inheritance for disconnected elements
description: collectStyleSheetsAndRules returns null whenever element.isConnected is false (src/cascade/rule-filter.ts:86-88). getCascadedStyle then returns a bare empty CSSStyleDeclaration at src/cascade/index.ts:187-189. Explicitly passed rules, the element style attribute and parent inheritance are skipped, and matcher, MediaParser and supports run never. Browsers apply stylesheet rules, inline style and inheritance to detached elements, and the connected twin of each fixture resolves correctly.
affected_requirements:
    - INT-REQ-260821-HJVC
