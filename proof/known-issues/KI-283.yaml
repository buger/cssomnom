id: KI-283
title: matchesSyntax accepts calc(1.5), rgb() and rotate() as matching initial values
description: 'checkItem accepts a function token when its name appears in a known-name set. The <integer>/<length>/... arms return true for every math function without a result-type check, so calc(1.5) and sin(1) count as integers. The <color> and <transform-list> arms match rgb() and rotate() with no arguments. css-properties-values-api #the-registerproperty-function must parse initial values against the syntax definition and throw SyntaxError.'
