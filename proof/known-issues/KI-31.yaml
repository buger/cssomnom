    notes: |
        real_infrastructure: public parse() (src/parser.ts) and the CSSMediaRule.conditionText getter only - no mocks; reproducer imports mirror KI-18 style.
        quantitative_impact: measured at HEAD on Node v24.11.1 - conditionText for '@media ((width >= 100px) or (grid)) and (hover)' serializes "(width >= 100px) or (grid) and (hover)" and re-parses to invalid/not all in <5ms; second leg 'screen and ((color) or (monochrome))' degrades identically; CONDITION_OPERAND_COUNT=3 exercised against an obligation budget of 6.
        control_test: positive-control leg asserts a flat and-chain round-trips byte-identically and stays valid, so failures are not setup errors.
        untrusted_attacker: stylesheet text is the trust boundary; any host ingesting user/theme CSS reaches serializeMediaCondition with zero privileges.
        current_deployment_relevance: conditionText is the headline media-rule surface of this release; confirmed live at HEAD 69defe8 via two red reproducer runs plus evidence capture re-execution.
        honest_severity: high correctness - silent semantic flip of persisted/re-serialized conditions from satisfiable to never-match; no memory-safety or RCE dimension.
        attacker_profitability: an attacker who can get one serialized rule re-ingested (CMS round-trip, build pipeline) deterministically disables the guarded branch of downstream rules.
        reproducible: node --experimental-strip-types --test proof/reproducers/KI-31-media-condition-paren-dropping-overlay-260823.ts exited 1 twice pre-filing and once more under proof evidence capture.
        no_inflation: severity_basis reproducer with executed manifest attached; risk names correctness honestly; cve_surface none.
        operational_path_verified: failing legs call the exact public parse()/conditionText path hosts use; no gated or debug path involved.
        reachability_verified: public parse() IS the product surface; no ingress layer exists between host and serializer.
dedup_armor: |
    serializeMediaCondition drops grouping parentheses between and/or operands, corrupting condition semantics on re-parse. Distinct from KI-5 (unbalanced-paren input recovery) and KI-41 (Parser-API adapter joins prelude tokens with '' - token-stream layer). Do not merge into generic media-text normalization without re-parse semantic-equivalence evidence.
