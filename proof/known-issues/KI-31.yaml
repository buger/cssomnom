reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-31-media-condition-paren-dropping-overlay-260823.ts
tripwire_mutation: Parenthesize each non-atomic child in serializeMediaCondition's join; both failing legs flip red->green while controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not persist or compare against serialized conditionText from this engine; keep the original source text for round-trips.
remediation: In serializeMediaCondition, parenthesize every multi-child media-condition operand before joining with ' and '/' or ' (or serialize from the original token stream), preserving <media-in-parens> structure end-to-end.
