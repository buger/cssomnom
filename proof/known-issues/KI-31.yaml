id: KI-31
title: Media condition serialization drops required parentheses and corrupts round-trip semantics
description: 'Observed: serializeMediaCondition (src/MediaParser.ts ~L839-844) joins children with bare separators, dropping grouping parens around nested or/and operands; such conditions re-parse invalid and become ''not all''. API: parse() -> CSSMediaRule.conditionText. Expected: and/or operands must be <media-in-parens> (mediaqueries-4 #mq-syntax Overview.bs:900-904); conditionText serializes unsimplified (css-conditional-3 #the-cssconditionrule-interface :789). Impact: persisted conditionText silently flips matching from satisfiable to never-match. Distinct from KI-5 (unbalanced-paren rejection).'
affected_requirements:
    - SYS-REQ-260823-MRT1
evidence_manifests:
    - proof/evidence/ki-31.yaml
severity: high
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: parse() -> CSSMediaRule.conditionText (serializeMediaCondition)
attacker_input: ordinary stylesheet text with nested media conditions; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-31-media-condition-paren-dropping-overlay-260823.ts
tripwire_mutation: Parenthesize each non-atomic child in serializeMediaCondition's join; both failing legs flip red->green while controls stay green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not persist or compare against serialized conditionText from this engine; keep the original source text for round-trips.
remediation: In serializeMediaCondition, parenthesize every multi-child media-condition operand before joining with ' and '/' or ' (or serialize from the original token stream), preserving <media-in-parens> structure end-to-end.
notes:
    - '2026-08-25: F2 ledger-hygiene description compression to <=600 chars (Observed/API/Expected/Impact shape); every dropped detail relocated verbatim here, zero content removed. Relocated exact inputs: parsing ''@media ((width >= 100px) or (grid)) and (hover){div{}}'' yields conditionText ''(width >= 100px) or (grid) and (hover)'', which RE-PARSES as an invalid mixed and/or chain and serializes as ''not all''; ''@media screen and ((color) or (monochrome))'' likewise degrades to ''not all''. Relocated spec quotes/ranges: css-conditional-3 #the-cssconditionrule-interface (Overview.bs:752-795) requires conditionText on getting to return ''the result of serializing the associated condition'' (:789); the prohibition of logical simplifications such as removal of unneeded parentheses (''so that the returned condition will evaluate to the same result as the specified condition'') is stated in the CSSSupportsRule-specific conditionText definition inherited by conditional-rule subclasses (#the-csssupportsrule-interface, Overview.bs:861-876). serializeMediaCondition joins children with the bare separator literal '' <op> ''.'
    - '2026-08-25: F2 dedup pairing resolution for the KI-31/KI-115 near-duplicate pair (audits found asymmetric cross-referencing): canonical seat goes to KI-115 as the older filing (created 2026-08-23T13:30:44Z vs this file''s 2026-08-23T13:41:59Z). Both stay open because a real trigger difference exists (grouped negation vs nested or/and operands); added the matching do_not_refile_as pointer instead of merging.'
    - 'Calibration rule (2026-08-25, F2): untrusted_attacker marks hostile-input REACHABILITY of the affected API surface, not adversarial intent; attacker_profitability false reflects pure correctness impact.'
