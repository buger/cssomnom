id: KI-31
title: Media condition serialization drops required parentheses and corrupts round-trip semantics
description: 'serializeMediaCondition (src/MediaParser.ts ~L839-844) joins condition children with bare '' <op> '' separators, dropping grouping parentheses around nested or/and operands. Parsing ''@media ((width >= 100px) or (grid)) and (hover){div{}}'' yields conditionText "(width >= 100px) or (grid) and (hover)", which RE-PARSES as an invalid mixed and/or chain and serializes as ''not all''; ''@media screen and ((color) or (monochrome))'' likewise degrades to ''not all''. mediaqueries-4 #mq-syntax (Overview.bs:900-904) requires every and/or operand to be a <media-in-parens>; css-conditional-3 #the-cssconditionrule-interface (Overview.bs:752-795) requires conditionText on getting to return ''the result of serializing the associated condition'' (:789); and the prohibition of logical simplifications such as removal of unneeded parentheses (''so that the returned condition will evaluate to the same result as the specified condition'') is stated in the CSSSupportsRule-specific conditionText definition inherited by conditional-rule subclasses (#the-csssupportsrule-interface, Overview.bs:861-876). Correctness fault (serializer equivalence violation): any consumer that persists or re-serializes conditionText silently flips matching semantics from satisfiable to never-match. Distinct from KI-5, which covers unbalanced-paren ''(( input rejection only.'
