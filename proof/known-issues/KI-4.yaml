id: KI-4
title: CSS.registerProperty after @property IME is not a product defect
description: 'False KI. css-properties-values-api-1 §4.1 throws InvalidModificationError only when the name is already in the Document [[registeredPropertySet]] (JS slot). @property is a separate registration source and does not fill that slot. §3: CSS.registerProperty further wins over any @property for the same name. Overlay IME-after-@property was spec-wrong. Commit 62aacd7 that threw IME on any existing origin is reverted for this path only. JS-then-JS still throws IME.'
affected_requirements:
    - SW-REQ-260821-V5GA
    - SYS-REQ-260821-EGCP
commands:
    - node --test tests/register-property.test.ts
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSS.registerProperty
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-4-register-after-at-property.ts
reproduction_steps:
    - 'PropertyRegistry.clear() then parse(''@property --x { syntax: "*"; inherits: false; }'').'
    - 'Call CSS.registerProperty({ name: ''--x'', syntax: ''<color>'', inherits: true, initialValue: ''red'' }).'
    - Observe no throw; JS syntax/inherits/initialValue overwrite the @property registration.
    - 'Spec contract (css-properties-values-api-1 §3 / §4.1): CSS-then-JS succeeds and JS wins. A second JS register of --x throws InvalidModificationError.'
    - 'Passing spec runner: node --experimental-strip-types proof/reproducers/KI-4-register-after-at-property.ts'
introduced_in: inception
defect_class: latent
mitigation: 'Not a product defect. Restored origin gating: IME only when existing.origin is js and origin is js. CSS-then-JS overwrites; JS wins.'
remediation: Withdrawn as overlay-wrong. Overlay proof/reproducers/KI-4-register-after-at-property.ts is a passing spec test (CSS-then-JS succeeds, JS-then-JS IME). Residual L-KI4 parks the angle. DEFECT-260821-F4MQ retracted.
notes:
    - 'Scrutineer verdict: do not throw after @property. Restored CSS-then-JS succeed+JS-wins. JS-then-JS IME retained. KI-1,2,3,5,6 untouched.'
