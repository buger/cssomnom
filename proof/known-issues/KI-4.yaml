id: KI-4
title: CSS.registerProperty after @property overwrites without InvalidModificationError
description: |
    CSS Properties and Values API registerProperty must throw InvalidModificationError when the name is already registered, including names introduced by @property. PropertyRegistry.register only throws when existing.origin === 'js'. A CSS-origin registration is overwritten by a later JS registerProperty with no throw. Overlay audit cannot change product code. No DEFECT is filed: a ProblemReport is post-fix class-closure evidence (hardening, regression net, sibling sites), not a live ticket.
affected_requirements:
    - SW-REQ-260821-V5GA
    - SYS-REQ-260821-EGCP
commands:
    - node --test tests/register-property.test.ts
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSS.registerProperty
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-4-register-after-at-property.ts
reproduction_steps:
    - 'PropertyRegistry.clear() then parse(''@property --x { syntax: "*"; inherits: false; }'').'
    - 'Call CSS.registerProperty({ name: ''--x'', syntax: ''*'', inherits: false }).'
    - Observe no throw; registry origin becomes js.
    - 'Intended contract: InvalidModificationError because the name is already registered.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-4-register-after-at-property.ts'
introduced_in: inception
defect_class: latent
mitigation: JS registerProperty throws InvalidModificationError if the name is already registered regardless of origin.
remediation: Landed in src/PropertyRegistry.ts. Class-closure DEFECT-260821-F4MQ.
