id: KI-337
title: '@font-feature-values keeps an empty family name the grammar requires'
description: 'handleFontFeatureValuesRule serializes the prelude into fontFamily and constructs CSSFontFeatureValuesRule unconditionally (src/parser.ts:655-656). css-fonts-4 #font-feature-values types the rule as ''@font-feature-values <font-family-name># { <declaration-rule-list> }'' and the # multiplier requires one name. ''@font-feature-values { @swash { x: 1 } }'' therefore survives with an empty family.'
