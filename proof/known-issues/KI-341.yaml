id: KI-341
title: Parser keeps @property <image> rules whose initial value is a non-image function
description: 'matchesSyntax returns true for every function token when the syntax component is <image>. css-properties-values-api #supported-names types <image> as any valid <<image>> value, and #register-a-custom-property step 4 parses the initial value against the syntax. calc(1) and rgb(0,0,0) are not images, so the @property rule must drop at ingest. The stylesheet keeps the rule.'
