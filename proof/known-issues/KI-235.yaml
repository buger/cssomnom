id: KI-235
title: Typed OM parse accepts grammar-invalid var() as CSSUnparsedValue
description: _parseAll returns a CSSUnparsedValue whenever hasVarFunction sees a function named var (src/typed-om/values/style-value-parser.ts:201-203). tokensToUnparsedSegments then serializes an invalid var() as a plain string segment (src/typed-om/values/CSSUnparsedValue.ts:120-126). css-variables-1 funcdef-var requires var( custom-property-name , declaration-value? ). var(foo), var(--), and var() are syntax errors, so css-typed-om-1 parse-a-cssstylevalue step 3 must throw TypeError. The parse instead succeeds.
