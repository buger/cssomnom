id: KI-104
title: Keyframe parsing retains forbidden animation declarations and important values
description: Keyframe declaration parsing retains animation-name and animation-duration, even though CSS Animations requires animation properties to be ignored except animation-timing-function. It also retains opacity marked !important, which the specification declares invalid and ignored in keyframes.
affected_requirements:
    - SYS-REQ-260822-HARM
