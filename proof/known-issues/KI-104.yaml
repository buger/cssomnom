severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: parse() / CSSKeyframeRule.style
attacker_input: ordinary @keyframes declaration list containing animation properties or !important; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-104-keyframes-forbidden-declarations-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not use keyframe style declarations as an animation source until forbidden declarations are filtered.
remediation: Filter CSS Animations-defined properties other than animation-timing-function and drop declarations with the important flag while consuming keyframe blocks.
notes:
    - Bound to a narrowly modeled draft requirement created through Proof because no existing requirement honestly covered this API-specific conformance contract.
