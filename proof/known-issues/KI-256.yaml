id: KI-256
title: Custom-property var() substitution reads the last-encountered value, ignoring importance
description: getCascadedStyle fills rawCustomProps from the last grouped declaration in encounter order. substituteVariables resolves var() inside custom properties through that unsorted map. css-variables-1 cascades custom properties normally, so an important --a beats a later normal --a. WPT variable-reference-13.html and -14.html expect green. A custom property referencing --a sees 'crimson' while a standard property sees the correct 'green'.
