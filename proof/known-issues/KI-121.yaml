id: KI-121
title: 'Serializer drops the attr() namespace pipe: attr(|bar) round-trips as attr(bar), losing the attribute reference qualification on reparse'
description: 'Setting content to attr(|bar) (or the WPT rows attr( |bar ) and attr(|bar, "fallback")) serializes back with the namespace prefix and pipe silently removed — attr(bar) — changing which attribute the function references and corrupting serialize-then-reparse fidelity. Local WPT css/cssom/serialize-values.html pins verbatim serializations for these namespaced <<attr-name>> rows, whose grammar (css-values-5 #attr ~line 1983: <<attr-name>> = [ <<ident-token>>? | ]? <<ident-token>>) makes the optional namespace part of the value. Dedup: distinct from KI-21 (hash/function identifier escaping); this is lossy normalization of a grammar-legal namespaced function argument.'
