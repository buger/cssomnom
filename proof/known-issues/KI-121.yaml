mitigation: Treat serialized attr() output as potentially namespace-stripped; keep the original source text where fidelity matters.
remediation: Preserve the namespaced <<attr-name>> token stream through parse/serialize so attr(|bar)-family values round-trip verbatim per WPT serialize-values.html.
