    notes: |
        real_infrastructure: public Parser API exports and the CSSParserAtRule stringifier only - no mocks; serializations observed live at HEAD.
        quantitative_impact: measured at HEAD on Node v24.11.1 - '@media screen{a{b:c}}' serializes to '@mediascreen{a{}}' and re-parses to an at-rule NAMED 'mediascreen' (PRELUDE_ROUNDTRIP_CORRUPTION_BUDGET=0 violated on 4/4 at-rule families: media, keyframes, layer, namespace).
        control_test: qualified-rule round-trip control leg ('div{}') serializes and re-parses identically, so the failure is specific to the at-rule keyword/prelude join, not the test harness.
        untrusted_attacker: stylesheet text is the trust boundary; any Parser API consumer persisting or re-parsing serialized at-rules hits the corruption with zero privileges.
        current_deployment_relevance: the stringifier is a normative WICG surface (stringifier on CSSParserAtRule); confirmed live at HEAD via two red reproducer runs plus evidence capture re-execution.
        honest_severity: high correctness/data_integrity - rule identity itself changes across a serialize/re-parse cycle (media -> mediascreen), silently misclassifying every affected at-rule for downstream consumers; no security/RCE dimension, cve_surface none.
        attacker_profitability: crafted input like '@media screen{...}' deterministically renames the rule on round-trip, breaking any pipeline that filters or re-ingests by at-rule name (@media, @keyframes, @layer, @namespace all affected).
        reproducible: node --experimental-strip-types --test proof/reproducers/KI-41-atrule-prelude-whitespace-roundtrip-overlay-260823.ts exited 1 twice pre-filing and once more under proof evidence capture.
        no_inflation: severity_basis reproducer with executed manifest attached; risk names correctness honestly; cve_surface none.
        operational_path_verified: failing legs call String(CSSParserAtRule) + parseRuleListSync, the exact documented host path; no gated or debug path involved.
        reachability_verified: public Parser API IS the product surface; nothing stands between a host and tokensToPrelude.
dedup_armor: |
    CSSParserAtRule.toString/tokensToPrelude join prelude tokens with '' dropping whitespace ('@mediascreen'). Parser-API adapter layer; distinct from KI-31 (condition semantics inside MediaParser) and KI-21 (identifier escaping in serializer). Do not merge into serializer escaping work.
kill_domain: data_corruption
do_not_refile_as: 'media-condition text corruption inside MediaParser/CSSOM (KI-31/KI-115): this is the Parser-API adapter layer losing the keyword/prelude separator itself'
