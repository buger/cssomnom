id: KI-41
title: 'Parser API prelude whitespace filter corrupts serialization: @media screen re-parses as mediascreen'
description: 'parseRuleListSync("@media screen{a{b:c}}")[0] serializes to "@mediascreen{a{}}", which re-parses to an at-rule NAMED mediascreen; @keyframes k -> @keyframesk{...} (named keyframesk), @layer l -> @layerl, @namespace svg url(...) -> @namespacesvgurl. Root cause: CSSParserAtRule.toString joins prelude tokens with empty separator directly after @name (src/parser-api.ts ~122-128) and tokensToPrelude strips whitespace/comment component values (~202-205), so the structural boundary between at-keyword and prelude is lost. Expected: css-syntax-3 round-trip requirement (#serialization ~3706-3713) - parse(serialize(parse(x))) must yield the same data structures; WICG note: whitespace is parsed into DOMStrings, i.e. preserved information, not garbage.'
affected_requirements:
    - SYS-REQ-260823-PRT3
evidence_manifests:
    - proof/evidence/ki-41.yaml
severity: high
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: CSSParserAtRule.toString stringifier + tokensToPrelude (src/parser-api.ts ~L122-128, ~L202-205)
attacker_input: ordinary at-rule stylesheet text parsed then serialized through the public Parser API; correctness hole, no attacker required
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-41-atrule-prelude-whitespace-roundtrip-overlay-260823.ts
tripwire_mutation: Make tokensToPrelude keep whitespace tokens (or serialize a single-space separator) and/or have CSSParserAtRule.toString emit a separator between @name and the prelude; all four round-trip identity legs flip red->green while the qualified-rule control stays green.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: 'Treat Parser API at-rule stringifier output as non-round-trippable today: do not persist or re-parse String(CSSParserAtRule) results; reconstruct preludes from the token arrays instead.'
remediation: 'Preserve a separator between at-keyword and prelude in CSSParserAtRule.toString and stop tokensToPrelude from dropping whitespace tokens (src/parser-api.ts ~122-128, ~202-205) so serialization round-trips per css-syntax-3 #serialization; all four identity legs flip red->green.'
notes:
    - '2026-08-24: ledger hygiene pass (mechanical): balanced the unterminated double quote around the serialized at-rule sample in description. No other content changed.'
