id: KI-301
title: Shorthand contraction crosses intervening all and side shorthands, flipping the cascade
description: 'checkIntervening skips any intervening declaration without a propertyToGroup entry (src/serializer.ts:563-564). ''all'' and same-side shorthands like ''border-top'' carry no entry, so the [''all'',''border''] and startsWith guards never fire. serializeDeclarations then emits the contracted shorthand at the first longhand, ahead of the reset. Re-parsing the cssText lets all:unset or the later shorthand win, dropping declarations that won in the source. css-syntax-3 #serialization requires round-trip fidelity.'
