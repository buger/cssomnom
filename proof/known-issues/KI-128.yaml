id: KI-128
title: Declared StylePropertyMap iterates in sorted key order instead of inline declaration order
description: 'Declared StylePropertyMap iteration sorts keys instead of following the source declaration order. css-typed-om-1 #declared-stylepropertymap initializes the declarations slot in the same order as the owning style rule or inline style. That clause states otherwise and therefore overrides the default sorted ordering rule, which applies only unless otherwise stated. Custom properties must interleave at their source positions. Local WPT declared iterable.tentative.html pins keys A width C transition-duration color B for a mixed declaration; HEAD returns the fully sorted sequence.'
