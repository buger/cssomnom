id: KI-136
title: 'viewport-segments features stay unknown: no environment mapping, values parsed as ident'
description: 'The generated media-features table lists horizontal-viewport-segments and vertical-viewport-segments as known integer range features. evaluateMediaFeature maps neither name in getActualNumeric, and parseValueForFeature falls through to parseIdent for them, so every viewport-segments query evaluates unknown and never matches. mediaqueries-5 #viewport-segments defines both features for the viewport. MediaEnvironment carries no segment fields, so the feature cannot express any environment.'
affected_requirements:
    - SW-REQ-260822-QKE9
evidence_manifests:
    - proof/evidence/ki-136.yaml
severity: low
severity_basis: risk
risk: correctness
affected_api: MediaParser.evaluate media feature evaluation
attacker_input: caller-supplied media query text using viewport-segments features; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0001-viewport-segments-unknown.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat viewport-segments as unsupported features and drop them from the generated known-feature tables until evaluation exists.
remediation: Add horizontalViewportSegments and verticalViewportSegments to MediaEnvironment, map both names in getActualNumeric, and route integer values through parseInteger instead of the parseIdent default arm.
