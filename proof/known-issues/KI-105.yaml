id: KI-105
title: Invalid display values retained across stylesheet and CSSStyleDeclaration paths
description: 'The parser, CSSStyleDeclaration.setProperty, and CSSStyleDeclaration.cssText paths all retain display: definitely-not-a-display-value instead of dropping it. CSSOM requires invalid values to be ignored without mutation, while stylesheet declaration parsing must drop the invalid declaration and preserve valid neighbors. The consolidated reproducer executes independent parser, setProperty, and cssText subtests plus valid controls.'
affected_requirements:
    - SYS-REQ-260822-1MB8
    - SYS-REQ-260821-8TGB
    - SW-REQ-260821-HNRG
