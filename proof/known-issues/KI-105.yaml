        quantitative_impact: measured at HEAD - invalid display values survive stylesheet parsing, setProperty, and cssText paths (3 red legs) while valid-display controls stay green on both mutation paths.
        control_test: two dedicated positive controls (setProperty and cssText retain valid display) isolate the invalid-value acceptance.
        untrusted_attacker: any stylesheet/inline-style input carrying display: garbage reaches the unfiltered validators.
        current_deployment_relevance: display validation spans the three most common ingestion surfaces; live at HEAD.
        honest_severity: medium correctness - invalid values persist into cascaded models instead of being dropped.
        attacker_profitability: not profit-driven; persisted garbage skews computed-style comparisons in graders/tooling.
        reproducible: deterministic exit 1 x3 legs across runs and evidence capture.
        no_inflation: one property family, three surfaces, medium ceiling.
        operational_path_verified: all three real ingestion paths exercised end-to-end.
