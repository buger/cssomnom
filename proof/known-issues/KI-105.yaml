id: KI-105
title: Invalid display values retained across stylesheet and CSSStyleDeclaration paths
description: 'The parser, CSSStyleDeclaration.setProperty, and CSSStyleDeclaration.cssText paths all retain display: definitely-not-a-display-value instead of dropping it. CSSOM requires invalid values to be ignored without mutation, while stylesheet declaration parsing must drop the invalid declaration and preserve valid neighbors. The consolidated reproducer executes independent parser, setProperty, and cssText subtests plus valid controls.'
affected_requirements:
    - SYS-REQ-260822-1MB8
    - SYS-REQ-260821-8TGB
    - SW-REQ-260821-HNRG
commands:
    - /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-105-stylesheet-invalid-display-overlay-260822.ts
evidence_manifests:
    - proof/evidence/ki-105.yaml
severity: medium
severity_basis: reproducer
risk: correctness
cve_surface: none
affected_api: parse() / CSSStyleDeclaration.setProperty() / CSSStyleDeclaration.cssText
attacker_input: ordinary stylesheet text containing a property-grammar-invalid display value; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/KI-105-stylesheet-invalid-display-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Treat style values read from parsed stylesheets as unvalidated when property-specific validity matters.
remediation: Apply the property grammar during stylesheet declaration parsing and drop a declaration whose entire value is invalid, while preserving neighboring valid declarations.
