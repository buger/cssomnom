id: KI-183
title: AT_RULE_HANDLERS.import keeps a blockful @import and discards the block
description: 'AT_RULE_HANDLERS.import drops the block parameter (src/parser.ts:75). consumeAtRule consumes the style block and still calls the handler (src/parser.ts:385-390). handleImportRule never inspects a block and always constructs a CSSImportRule (src/parser.ts:836). css-cascade-5 #at-import defines @import as a semicolon-terminated statement without a block form. css-syntax-3 #consume-at-rule returns nothing when the rule is invalid in the current context, so the blockful import must be dropped.'
affected_requirements:
    - INT-REQ-260821-N2VE
