severity: medium
severity_basis: risk
risk: correctness
affected_api: handleImportRule via consumeAtRule block dispatch
attacker_input: stylesheet text with '@import <url> { ... }'; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0007-import-block-kept.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Terminate every @import with a semicolon until the handler rejects block forms.
remediation: Make the import handler return null when consumeAtRule passes a block, matching the statement-only @import grammar.
