id: KI-355
title: Typed OM parse drops empty comma items on non-position list properties instead of throwing
description: 'The non-position LIST_PROPERTIES comma branch filters empty segments before calling createValueFromTokens. css-values-4 2.2 #comb-comma types these properties as #-multiplied lists with no empty items. A leading, trailing, or doubled comma invalidates the whole value, so css-typed-om-1 6.6 parse-a-cssstylevalue step 3 must throw TypeError. The parse drops the empty items and returns the surviving values.'
