reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0004-upright-logical-accessor.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Read the physical twin (margin-top) instead of the logical name while upright overrides the used direction.
remediation: Share one mapping context between the emitted physical names and the accessor, or return the stored logical declaration value before re-resolving physical twins.
