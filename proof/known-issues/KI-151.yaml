id: KI-151
title: Upright forced-LTR logical mapping disagrees with the computed-style logical accessor
description: getCascadedStyle forces the mapping direction to ltr under text-orientation:upright and vertical writing modes (src/cascade/index.ts:243-245), which matches the used-value rule in css-writing-modes-3. CSSComputedStyleDeclaration.getPropertyValue then re-resolves logical names with the computed direction rtl (src/cascade/computed-style.ts:145-152). The accessor looks up margin-bottom while the emitted physical declaration is margin-top, so getPropertyValue('margin-inline-start') returns the empty string for a declared 1px value.
