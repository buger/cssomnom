    notes: |
        real_infrastructure: public parse() and CSSKeyframesRule.appendRule/deleteRule only - no mocks; overlay reproducer imports parser+CSSOM directly.
        quantitative_impact: measured at HEAD - parsed @keyframes children have parentRule null and parentStyleSheet null (leg 1), and after appendRule+deleteRule the child retains stale owner links (leg 2); both fail on Node v24.11.1 across repeated runs.
        control_test: appendRule attach behavior itself is exercised inside the failing legs; detached-state assertions double as negative checks against fake-green wiring.
        untrusted_attacker: ordinary CSS @keyframes text is the trust boundary; any host parsing user stylesheets reaches the broken linkage with zero privileges.
        current_deployment_relevance: keyframe parent linkage is core CSSOM navigation surface; confirmed live via evidence-captured failing runs on current HEAD.
        honest_severity: medium correctness - broken object graph misleads tree walkers and serializers without memory-safety impact.
        attacker_profitability: not profit-driven; any consumer walking rule trees (graders, serializers, tooling) silently mis-traverses keyframe children.
        reproducible: deterministic node:test overlay run, exit 1 both runs pre-filing and at evidence capture.
        no_inflation: severity medium matches blast radius (correctness-only, recoverable by re-parsing).
