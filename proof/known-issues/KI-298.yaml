id: KI-298
title: dynamic-range boolean context reports false on a standard display
description: 'The boolean-context switch returns env.dynamicRange === ''high'' for dynamic-range and the same for video-dynamic-range (src/MediaParser.ts:1193-1194). mediaqueries-4 #evaluating Media Features in a Boolean Context makes a feature true whenever it would be true for any value other than 0, a zero dimension, or the keyword none. Both features have no ''none'' value, so a standard display must report true, exactly like the neighbouring color-gamut and scan arms. (dynamic-range) currently returns false while (dynamic-range: standard) returns true.'
