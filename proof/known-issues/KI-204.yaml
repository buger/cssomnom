id: KI-204
title: CSS.supports skips the declaration shortcut when and, or, or not appears inside names, strings, or comments
description: 'supports guards its declaration shortcut with a word-boundary regexp over the raw string (src/parser-api.ts:770). The regexp matches not inside the custom property name --not-foo, and inside quoted values and comments. css-conditional-3 12.1 step 2 wraps the string in parentheses and evaluates it as a supports condition, which turns a bare declaration into a supports-decl. CSS.supports(''--not-foo: 1''), CSS.supports(''content: "and"'') and CSS.supports(''color: red /* not */'') therefore return false where every browser returns true.'
