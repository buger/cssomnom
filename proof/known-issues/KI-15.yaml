id: KI-15
title: WPT runner getScriptContent reads and vm-executes <script src> payloads outside the WPT root
description: scripts/wpt/node/run.ts getScriptContent (L92-115 at HEAD 83ce08f) resolves fixture-controlled <script src> values via path.join(WPT_ROOT, src) or path.resolve(htmlDir, src) with no containment check, then fs.readFileSync's the result (L109-110); runWptFile's script loop (L347-363) hands the bytes to new vm.Script(code).runInContext(context) (L360-362). A hostile or compromised WPT/HTML fixture gains arbitrary local-file read plus execution of out-of-tree attacker JavaScript inside the privileged maintainer/CI runner process (CWE-22/CWE-94). Data-integrity fault against every consumer of the WPT node runner.
affected_requirements:
    - SYS-REQ-260823-2P2Q
evidence_manifests:
    - proof/evidence/ki-15.yaml
severity: high
severity_basis: reproducer
risk: data_integrity
cve_surface: none
affected_api: scripts/wpt/node/run.ts runWptFile()/getScriptContent() (pnpm run wpt / wpt:node)
attacker_input: fixture-controlled <script src> attribute in vendored web-platform-tests HTML or any HTML path handed to the runner (../../ and absolute /../ traversal segments)
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-15-wpt-getscriptcontent-no-containment-overlay-260822.ts
tripwire_mutation: Contain getScriptContent's path resolution inside WPT_ROOT (reject resolved paths whose relative-to-root prefix escapes, e.g. path.relative(root,p)!=='..' checks or a root-prefixed containment assertion before fs.readFileSync) — the KI-15 reproducer then passes because script src traversal is refused and vm.Script never receives outside-tree content.
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not point the WPT node runner at untrusted fixture trees; treat any HTML the runner executes as privileged input until containment lands.
remediation: After computing fullPath, require path.relative(WPT_ROOT, fullPath) to stay inside the root (reject '..' segments and absolute rel) before existsSync/readFileSync, for both the join and resolve branches; share the helper with the /interfaces/ fetch branch.
