id: KI-291
title: register validates before the duplicate check; duplicate JS register throws SyntaxError
description: PropertyRegistry.register calls this.validate(definition) before it reads the registry (src/PropertyRegistry.ts:354-359). register-a-custom-property step 2 throws InvalidModificationError for a name already in [[registeredPropertySet]] and exits before step 3 consumes a syntax definition. A duplicate JS registration with an invalid syntax string or a missing initialValue therefore reports SyntaxError instead of InvalidModificationError.
