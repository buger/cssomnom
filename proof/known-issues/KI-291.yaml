introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Register duplicate names with a fully valid definition; the second call still fails, only with the wrong exception name.
remediation: Move the registry.get duplicate check immediately after the name-string check, before validate() consumes syntax and initialValue.
