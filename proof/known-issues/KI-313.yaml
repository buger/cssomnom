id: KI-313
title: getElementSiblings omits the element for children-less parents, killing :disabled/:enabled
description: The parentElement branch of getElementSiblings returns parentElement.children without a membership check (src/matcher.ts:768-770). The child-index guard at src/matcher.ts:527 then returns false before the form-state arms run. The exported DOMElement type marks children optional, and the parentNode branch falls back to [element]. A parent without children therefore makes :disabled miss a disabled input and :enabled miss an enabled one. html#selector-disabled requires actually disabled elements to match.
