severity: low
severity_basis: risk
risk: correctness
affected_api: Parser.consumeRule(nested=true) qualified-rule custom-property arm (src/parser.ts consumeQualifiedRule)
attacker_input: rule text whose prelude is a dashed ident followed by a colon and a block; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0023-nested-custom-prop-block.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Drive nested parsing through consumeBlockContents rather than consumeRule(true) on custom-property-shaped input.
remediation: Branch on the nested flag in consumeQualifiedRule and run consumeRemnantsOfABadDeclaration with nested true.
