id: KI-241
title: consumeQualifiedRule ignores the nested flag for custom-property preludes
description: 'The ''{'' arm of consumeQualifiedRule runs the consume-a-block path for every custom-property-shaped prelude and returns null (src/parser.ts:932-936). css-syntax-3 consume-a-qualified-rule requires the remnants of a bad declaration when nested is true, so the whole construct is swallowed through its ending semicolon. consumeRule(true) on ''--foo: { a: b } .bar { color: blue; }'' leaves ''.bar'' in the stream, and a caller loop then parses it as a fresh valid rule.'
