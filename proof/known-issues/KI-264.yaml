id: KI-264
title: parseHue treats grad hues as degrees, resolving the wrong hsl() color
description: 'parseHue strips only deg, rad and turn suffixes before parseFloat. css-values-4 #angle defines grad as a full angle unit with 400grad = 360deg. hsl(100grad, 50%, 50%) therefore has hue 90deg, but the parser reads 100 and resolves the 100deg color. The wrong color is returned silently instead of converting or failing.'
