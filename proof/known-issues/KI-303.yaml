id: KI-303
title: serializeUrlToken backslash-escapes url control characters into invalid tokens
description: 'serializeUrlToken escapes code points <= 0x20 with a bare backslash (src/serializer.ts:454-463). Backslash followed by newline is not a valid escape inside an unquoted url, so the value re-tokenizes as a bad-url token. A U+FFFD in the value (from a \0 escape) bypasses the originalText fast path. Custom-property serialization reaches this path with preserveCase=true. css-syntax-3 #serialization requires round-trip fidelity.'
affected_requirements:
    - SW-REQ-260821-YTV6
evidence_manifests:
