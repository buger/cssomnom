severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: serializeUrlToken via serialize(., preserveCase=true) (src/serializer.ts)
attacker_input: url values carrying escaped control characters inside custom properties; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0039-url-control-char-escape-lost.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not put control characters or NULL escapes inside url() values.
remediation: Emit hex escapes for non-printable code points and replace NULL with U+FFFD in serializeUrlToken.
