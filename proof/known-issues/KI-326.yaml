id: KI-326
title: expandFont overwrites duplicate font-weight and font-style instead of rejecting
description: 'The font preamble loop assigns weightVal or styleVal for every matching token and continues with no already-set guard. css-fonts-4 font grammar allows one font-style, one font-variant-css2, one font-weight, and one font-width-css3 each. ''font: 400 700 16px Arial'' stores weight 700 and ''font: italic oblique 16px Arial'' stores style oblique; both must reject the whole declaration.'
