severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleValue.parse
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-3-object-position-parse.ts
reproduction_steps:
    - Import parser.ts then CSSStyleValue from typed-om.ts.
    - Call CSSStyleValue.parse('object-position', 'not-a-position').
    - Observe a CSSStyleValue is returned (toString 'not-a-position') instead of TypeError.
    - 'Intended contract: invalid <position> values throw TypeError.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-3-object-position-parse.ts'
introduced_in: inception
defect_class: latent
mitigation: CSSStyleValue.parse throws TypeError when tryParsePosition fails for POSITION_PROPERTIES.
remediation: Landed in src/typed-om/values/style-value-parser.ts. Class-closure DEFECT-260821-KESF.
notes:
