id: KI-3
title: CSSStyleValue.parse('object-position', invalid) returns CSSStyleValue instead of throwing
description: |
    CSS Typed OM Level 1 parse(property, cssText) must throw TypeError when cssText is not a valid value for the property. style-value-parser.ts short-circuited POSITION_PROPERTIES: tryParsePosition failure returned a generic CSSStyleValue instead of throwing. CSSStyleValue.parse('object-position', 'not-a-position') therefore succeeded. Product fix: grammar-first matchesPositionPropertyGrammar then reify. Class-closure DEFECT-260821-KESF.
affected_requirements:
    - SW-REQ-260821-7AKJ
    - SYS-REQ-260821-HGFK
commands:
    - node --test tests/typed-om-position.test.ts
evidence_manifests:
    - proof/evidence/ki-3.yaml
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSStyleValue.parse
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-3-object-position-parse.ts
reproduction_steps:
    - Import parser.ts then CSSStyleValue from typed-om.ts.
    - Call CSSStyleValue.parse('object-position', 'not-a-position').
    - Observe a CSSStyleValue is returned (toString 'not-a-position') instead of TypeError.
    - 'Intended contract: invalid <position> values throw TypeError.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-3-object-position-parse.ts'
introduced_in: inception
defect_class: latent
mitigation: CSSStyleValue.parse throws TypeError when matchesPositionPropertyGrammar fails (grammar-first). Valid grammar that cannot reify as CSSPositionValue returns CSSKeywordValue / raw CSSStyleValue.
remediation: Landed in src/typed-om/values/style-value-parser.ts (parseThenReifyPosition) and src/typed-om/position/position-parser.ts (matchesPositionPropertyGrammar). Class-closure DEFECT-260821-KESF.
notes:
    - '2026-08-22: src logic restored to origin/main (264c2ea / 0.1.4) in fe7defa; Implements comments kept. Campaign class-fixes are gone. Reopened. Overlay reproducer is again a failing tripwire. DEFECT-260821-KESF is stale class-closure paperwork — do not delete.'
    - '2026-08-22: class-fix restored after fe7defa. Grammar-first parse then reify. Overlay reproducer PASSES twice (Node 24). SAT TRUE unique-cause rows; no [known-issue] tripwire. DEFECT-260821-KESF remains class-closure paperwork.'
