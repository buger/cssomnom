id: KI-3
title: CSSStyleValue.parse('object-position', invalid) returns CSSStyleValue instead of throwing
description: |
    CSS Typed OM Level 1 parse(property, cssText) must throw TypeError when cssText is not a valid value for the property. style-value-parser.ts short-circuits POSITION_PROPERTIES: tryParsePosition failure returns a generic CSSStyleValue instead of throwing. CSSStyleValue.parse('object-position', 'not-a-position') therefore succeeds. Overlay audit cannot change product code. No DEFECT is filed: a ProblemReport is post-fix class-closure evidence (hardening, regression net, sibling sites), not a live ticket.
affected_requirements:
    - SW-REQ-260821-7AKJ
    - SYS-REQ-260821-HGFK
commands:
    - node --test tests/typed-om-position.test.ts
evidence_manifests:
