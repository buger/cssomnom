id: KI-227
title: consumeClassSelector accepts an empty class name and swallows the next token
description: 'consumeClassSelector returns {type:''class-selector'', name:''''} when no ident follows the dot and consumes that token anyway (src/SelectorParser.ts:459-462). selectors-4 #class-selector requires ''.'' <ident-token>, so ''.'' and ''.>'' invalidate the selector list. The matcher then matches every element through the className split fallback, and a real DOMTokenList makes matches() throw SyntaxError from contains('''').'
affected_requirements:
