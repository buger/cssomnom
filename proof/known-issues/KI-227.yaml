severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: SelectorParser.consumeClassSelector / matchSimpleSelector / matches (src/SelectorParser.ts, src/matcher.ts)
attacker_input: selector strings with a bare or truncated class selector; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0020-empty-class-selector.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Ensure every '.' is followed by an identifier before passing selectors to the matcher.
remediation: Throw SyntaxError when the token after '.' is not an ident (do not consume it) and guard the class matcher against the empty token.
