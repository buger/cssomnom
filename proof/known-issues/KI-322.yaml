id: KI-322
title: expandBox and background center alias one component-value list across longhands
description: expandBox assigns the same ComponentValue[] object to every side that repeats a value. One-value padding shares top's array with right, bottom, and left; two-value forms alias bottom to top and left to right; logical forms alias the same way. normalizePositionTokens returns [t0, t0] for a lone center, sharing one token object across both axes. Mutating one longhand's list rewrites the aliased sides; each longhand must own an independent list.
