id: KI-314
title: Option disabled walks ignore html optgroup and select barriers, disabling enabled options
description: isOptionDisabled scans every ancestor for a disabled optgroup, and nearestAncestorSelectIsDisabled accepts any select on the chain (src/matcher.ts:909-926). html#concept-option-disabled returns false at a select, hr, datalist, or option ancestor and decides solely on the nearest optgroup. The nearest-ancestor-select algorithm returns null at datalist, hr, option, or a second optgroup. isElementDisabled ORs both helpers (src/matcher.ts:942-944), so options the spec leaves enabled match :disabled and lose :enabled.
