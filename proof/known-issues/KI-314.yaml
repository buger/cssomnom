mitigation: Keep options directly under their select or a single optgroup; avoid script-nested optgroup/select/datalist around options.
remediation: Implement the html#concept-option-disabled reverse-tree walk with the select/hr/datalist/option stops and nearest-optgroup decision, plus the nearest-ancestor-select null barriers.
