severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSNamespaceRule.cssText (src/CSSOM.ts)
attacker_input: any parsed or constructed @namespace rule whose URI contains a double quote; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0031-namespace-uri-unescaped.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Construct CSSNamespaceRule only with URIs free of double quotes until serialization escapes them.
remediation: Serialize the namespaceURI with serializeString inside the url() wrapper, matching CSSImportRule.cssText.
