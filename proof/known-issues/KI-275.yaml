id: KI-275
title: CSSNamespaceRule.cssText interpolates the raw URI, emitting an unterminated url string
description: 'cssom-1 #serialize-a-css-rule serializes the namespaceURI with serialize-a-URL, which escapes string quotes. CSSNamespaceRule.cssText interpolates the URI verbatim inside url("..."). A URI containing a double quote therefore emits @namespace url("foo"bar"); and the tokenizer reports an unterminated string plus stray tokens. The serialized rule no longer re-parses to the same namespace.'
affected_requirements:
    - SW-REQ-260821-PAKB
