introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Do not rely on getPropertyValue('font') after setting a system font keyword, and do not read back the keyword-stamped font-* longhand specified values.
remediation: Treat a lone system font keyword as a retained system-font shorthand declaration that serializes as-is with empty specified longhands (WPT css/css-fonts/system-fonts-serialization.tentative.html), instead of expanding the keyword into every font longhand.
