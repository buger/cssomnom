id: KI-112
title: Valid system font keyword leaves font shorthand serialization empty and stamps longhands
description: 'Parsing or setting a lone system font keyword (caption, icon, menu, message-box, small-caption, status-bar) as the font shorthand value stores the raw keyword stamped into all 13 longhands, so contractFont refuses to re-contract them and getPropertyValue(''font'') returns the empty string while cssText serializes longhand pollution such as ''font-variant: icon icon icon icon icon icon icon''. css-fonts-4 #font-prop ends its Value grammar with ''| <<system-font-family-name>>'' and #system enumerates the six keywords, so the declaration is grammatically valid; cssom-1 #parse-a-css-declaration-block licenses dropping only grammar-failing values, and WPT css/css-fonts/parsing/font-valid.html asserts font is set (non-empty) and round-trips for each keyword.'
