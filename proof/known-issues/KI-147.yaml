title: normalizePseudoElement drops arguments of unknown functional pseudo-elements
description: The unknown-function path returns '::' plus the lowercased name and empty parentheses (src/cascade/index.ts:119-120). It never reads the argument tokens. '::unknown(foo)' normalizes to '::unknown()'. Selectors 4 preserves unknown pseudo-elements for forward compatibility, so a normalizer must keep the argument list.
