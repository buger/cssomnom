introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write 'oblique 10deg' as the style component only when the serializer already stored it; avoid re-expanding font with angles.
remediation: After consuming oblique, consume up to two following angle dimension tokens into styleVal before scanning the size.
