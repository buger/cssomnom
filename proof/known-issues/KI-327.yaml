id: KI-327
title: 'expandFont drops the oblique angle: 10deg becomes font-size and 16px joins the family'
description: 'The preamble loop records ''oblique'' as font-style and continues without peeking at a following angle token. css-fonts-4 font-style is ''normal | italic | oblique <angle>{1,2}'', and the font shorthand consumes font-style as one component. ''font: oblique 10deg 16px Arial'' therefore stores font-size 10deg and pushes 16px into the family list.'
