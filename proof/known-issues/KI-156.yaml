id: KI-156
title: toFloat32Array and toFloat64Array return a transposed matrix layout
description: 'Both serializers return transpose(this._values) (src/DOMMatrix.ts:483-489). _values already stores m11 through m44 in column-major order, so the extra transpose moves m41 from index 12 to index 3. geometry-1 #dommatrix-readonly requires toFloat32Array and toFloat64Array to serialize m11 to m44 in column-major order. Round trips only appear correct because fromFloat64Array transposes too.'
