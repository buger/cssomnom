introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Use <custom-ident>+ instead of a literal with a multiplier until the matcher handles the list forms.
remediation: Apply the same '#'/'+' branching the <type> arm uses to the ident-literal arm of matchesSyntax.
