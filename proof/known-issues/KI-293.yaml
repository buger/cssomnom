id: KI-293
title: matchesSyntax ignores multipliers on ident-literal components and rejects valid lists
description: 'consumeSyntaxComponent records the ''+'' and ''#'' multiplier for ident-literal syntax components (src/PropertyRegistry.ts:142-144). matchesSyntax''s ident branch requires exactly one ident token and never reads comp.multiplier (src/PropertyRegistry.ts:262-265). css-properties-values-api #multipliers defines ''<ident>+'' as a space-separated list and ''<ident>#'' as a comma-separated list. registerProperty({syntax:''foo+'', initialValue:''foo foo''}) therefore throws ''does not match syntax'' instead of registering.'
