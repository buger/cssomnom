id: KI-113
title: parse() retains font declarations mixing a system font keyword with size/family despite failing the grammar
description: 'Parsing ''.o{font: menu 10px serif;}'' (and any system keyword mixed with size or family, e.g. ''menu icon'') stores the declaration verbatim: getPropertyValue(''font'') returns ''menu 10px serif'' and cssText re-serializes it. The font grammar has only two alternatives - the full size/family production or a lone system font keyword (css-fonts-4 #font-prop); the #font-prop-desc note (~line 1990) treats the keywords as keywords only in initial position, and WPT css/css-fonts/parsing/font-invalid.html asserts test_invalid_value(''font'', ''menu icon''). cssom-1 #parse-a-css-declaration-block step 3.1 requires dropping declarations that fail their grammar. setProperty() and insertRule() already honor this ignore-invalid contract; only the parse-a-css-declaration-block path accepts the invalid mix.'
