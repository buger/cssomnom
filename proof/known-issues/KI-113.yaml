mitigation: Do not treat getPropertyValue('font') text as grammar-validated after parsing stylesheets containing keyword-mixed font declarations.
remediation: Run the same shorthand grammar validation used by setProperty over declarations produced by parse-a-css-declaration-block so grammar-failing values are dropped instead of stored verbatim.
notes:
    - 'Evidence captured via ''proof evidence capture KI-113'' by genuine re-execution at 2026-08-23T11:36:30Z (proof/evidence/ki-113.yaml); reproducer ran red twice before filing (exit 1 both runs: 6 tests, 2 control passes, 4 defect failures). Distinct root from KI-112: accept-invalid on the parse-a-css-declaration-block path only (setProperty/insertRule drop correctly). Adjacent observation recorded honestly: the same path also retains other grammar-failing values verbatim (e.g. ''.o{color:10px;}''), so the root is absence of value-grammar validation in declaration-block parsing. Bound to draft SYS-REQ-260823-0BRJ created through ''proof req new''; informal until cssom variables can be declared.'
