attacker_input: caller-supplied supports condition strings carrying !important declarations; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0064-supports-important-in-condition.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Strip a trailing !important before probing the condition form, or query declarations without the flag.
remediation: Split an optional !important suffix off the value tokens in the condition-form declaration arm, then hand the bare value to the declaration evaluator.
