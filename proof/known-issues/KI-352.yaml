id: KI-352
title: CSS.supports rejects !important inside a parenthesized supports-decl
description: 'The declaration arm of evalSupportsInParens serializes the tokens after the colon and calls evaluateSupportsDeclaration without splitting the !important flag (src/parser-api.ts ~715). The flag delims reach matchesSyntax, so the declaration reports unsupported. css-conditional-3 defines supports-decl as a parenthesized css-syntax-3 declaration, which carries an optional !important. WPT css-conditional/css-supports-004.xht requires @supports (color: green !important) to apply. The two-argument form must keep rejecting !important, so the two entry points need different handling.'
