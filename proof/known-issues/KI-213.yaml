id: KI-213
title: Indexed rule lists resolve non-canonical keys like "" and hide indices from in/keys
description: createIndexedProxy, createStyleProxy, and the CSSKeyframesRule proxy test Number(prop) truthiness instead of WebIDL canonical numeric indices (src/utils.ts:32, src/CSSStyleDeclaration.ts:34, src/CSSOM.ts:1187). Keys '', ' ', '0x0', '0.0' therefore resolve rules. The proxies define only a get trap, so 0 in cssRules is false and Object.keys leaks internals instead of index names.
affected_requirements:
    - SW-REQ-260821-6951
evidence_manifests:
    - proof/evidence/ki-213.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSRuleList / MediaList / StyleSheetList / CSSStyleDeclaration / CSSKeyframesRule indexed access
attacker_input: caller-supplied property keys on list objects; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0019-indexed-proxy-webidl-divergence.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Access list members through item(), index numbers, or canonical decimal strings only.
remediation: Gate indexed getters on the canonical numeric index test (String(ToUint32(p)) === p) and add has/ownKeys traps that expose real indices.
