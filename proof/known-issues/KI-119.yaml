id: KI-119
title: Repeated declarations (font shorthand, color) silently replace the earlier declaration instead of both being retained
description: 'Parsing p{font:22px Helvetica; font:xxx-large system-ui} retains only 13 declaration entries — the second font shorthand wholesale replaces the first; likewise a{color:red;color:green} collapses to length 1. cssom-1 #parse-a-css-declaration-block appends EVERY successfully parsed declaration and contains no same-name replacement step, and the CSSStyleDeclaration.length definition counts retained declarations, so both sets must survive with the second starting at index 13. Cascade arbitration (which duplicate wins) belongs at computed-value time, not to parse-time mutation. Interpretation flagged: expected counts follow the reproducer control demonstrating cssomnom own 13-longhand expansion granularity; the plain color case is granularity-independent. Validation of this interpretation pending Scrutineer pass. Dedup: distinct root from KI-112/KI-113 (system-keyword expansion / invalid-mix acceptance) and KI-36 (missing expansion table) — here both declarations are ordinary valid values.'
