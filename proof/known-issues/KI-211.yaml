introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write import URLs with url() or a string until the src() form is handled.
remediation: Extend the href extraction to functions named src (ASCII case-insensitively) taking a string argument, per css-values-4 <src()>.
