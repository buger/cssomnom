id: KI-211
title: '@import src() prelude loses the URL into mediaText'
description: 'handleImportRule accepts only string tokens, url tokens, and url() functions (src/parser.ts:782-797). css-values-4 #url-value defines <url> = <url()> | <src()> and css-cascade-5 #at-import takes [ <url> | <string> ]. The parser leaves href empty for @import src("foo.css") and serializes the function into the media list.'
