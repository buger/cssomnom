id: KI-12
title: At-rule dispatch is ASCII-case-sensitive; margin name, atRules fold, and hasOwn handlers missing
description: |
    css-values-4 § 4.1 #keywords / infra #ascii-case-insensitive: at-keywords are ASCII case-insensitive. getAtRuleHandler looks up MARGIN_RULE_NAMES / AT_RULE_HANDLERS / keyframes without toLowerCase, so @MEDIA is CSSAtRule not CSSMediaRule and @TOP-LEFT inside @page is dropped. options.atRules is case-sensitive so { foo: 'rule' } misses @FOO. AT_RULE_HANDLERS[name] without Object.hasOwn hits Object.prototype (@__proto__ throws TypeError: handler is not a function). Overlay audit cannot change product code.
affected_requirements:
    - INT-REQ-260821-ZMZR
    - SYS-REQ-260821-7521
    - INT-REQ-260821-WTPD
commands:
    - node --test tests/ki-2-8-12-class-fix.test.ts
    - node --experimental-strip-types proof/reproducers/KI-12-atrule-dispatch.ts
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.getAtRuleHandler
attacker_input: caller-supplied mixed-case at-keyword inside stylesheet text dispatched via Parser.getAtRuleHandler; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-12-atrule-dispatch.ts
reproduction_steps:
    - 'parse(''@MEDIA all { .x { color: red; } }'') — observe CSSAtRule, not CSSMediaRule.'
    - 'parse(''@page { @TOP-LEFT { margin: 1px; } }'') — observe no CSSMarginRule named top-left.'
    - 'CSS.parseStylesheetSync(''@FOO { div { color: red; } }'', { atRules: { foo: ''rule'' } }) — observe CSSParserRawRule / empty body, not CSSParserAtRule with a qualified child.'
    - 'parse(''@__proto__ { }'') — observe TypeError: handler is not a function.'
    - 'Intended: ASCII-case dispatch to typed handlers; margin name lowercased; atRules folded; inherited keys are CSSAtRule and do not throw.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-12-atrule-dispatch.ts'
introduced_in: inception
defect_class: latent
minimization_status: not_applicable
mitigation: getAtRuleHandler lowercases the at-keyword, Object.hasOwn on AT_RULE_HANDLERS, options.atRules own keys folded into a Map, handleMarginRule stores lowercase name.
remediation: Landed in src/parser.ts. Overlay and tests/ki-2-8-12-class-fix.test.ts pass. DEFECT-260822-ZSWZ.
