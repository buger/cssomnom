id: KI-8
title: handleImportRule drops css-syntax <url-token> so @import url(foo.css) href is empty
description: |
    css-syntax-3 § 4.3.6 #consume-url-token emits a <url-token> for unquoted url(foo.css). cssom-1 § 6.4.4 #dom-cssimportrule-href returns that URL. handleImportRule copies string tokens and url() functions but not first.type === 'url', so parse('@import url(foo.css);').cssRules[0].href is "". Distinct from KI-7 (styleSheet never-fetch). Overlay audit cannot change product code.
affected_requirements:
    - SW-REQ-260821-5W6X
    - SYS-REQ-260821-7521
commands:
    - node --test tests/ki-2-8-12-class-fix.test.ts
    - node --experimental-strip-types proof/reproducers/KI-8-import-href.ts
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: CSSImportRule.href
attacker_input: caller-supplied unquoted url token href inside stylesheet text handed to parse; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-8-import-href.ts
reproduction_steps:
    - Call parse('@import url(foo.css);') (unquoted url-token, not url("foo.css")).
    - Observe cssRules[0] is CSSImportRule but href is "".
    - 'Intended contract: href is foo.css.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-8-import-href.ts'
introduced_in: inception
defect_class: latent
minimization_status: not_applicable
mitigation: 'handleImportRule copies first.type === url into href. Unquoted url(foo.css) href is foo.css. CSSImportRule.styleSheet still performs no network fetch (KI-7 fixed 2026-08-23: offline object-graph only).'
remediation: Landed in src/parser.ts handleImportRule. Overlay and tests/ki-2-8-12-class-fix.test.ts pass. DEFECT-260822-3T1G. No network fetch here or in KI-7 (object-graph fixed 2026-08-23).
notes:
    - |
      2026-08-22: class-fix with KI-2/KI-12. <url-token> href is foo.css. Overlay GREEN twice. No fetch I/O.
    - '2026-08-22: overlay reproducer already existed as a passing contract check after f173f32. src restore emptied href again. Filed KI-8 as a failing tripwire. Distinct from KI-7 (styleSheet null / never-fetch).'
    - '2026-08-22: same hole also serializes cssText as url("") url("foo.css") because the leftover <url-token> becomes mediaText. Overlay tripwire now asserts both href === foo.css and cssText without url(""). No product fix. Did not rewrite KI-8 yaml fields.'
    - '2026-08-24: ledger hygiene pass (mechanical): replaced copy-pasted Web3 rubric boilerplate in poc_quality notes/not_applicable with a single dated domain note; release_disposition/minimization_status/attacker_input backfilled via proof CLI using tool-accepted enum values.'
