id: KI-320
title: resolveVariables skips mixed-case VAR()/ENV() inside custom property chains
description: '#resolveOneVariable compares function names with === ''var'' and === ''env''. css-values-4 functional-notation makes function names ASCII case-insensitive, and WPT variable-reference-20.html requires VAR() substitution. Non-custom values are lowercased by the serializer, so the hole hides there. Custom property values preserve case, so ''--b: VAR(--a)'' resolves to ''var(--a)'' instead of green.'
affected_requirements:
    - SW-REQ-260822-MN8Z
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: 'Parser.resolveVariables / #resolveOneVariable on custom property values (src/parser.ts)'
attacker_input: custom property values containing VAR() or ENV() in mixed case; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0043-var-uppercase-custom-prop-chain.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Write var()/env() lowercase inside custom property values.
remediation: 'Compare the lowercased function name in #resolveOneVariable, matching validateVarFunction''s existing case-insensitive check.'
notes:
    - Duplicate of KI-308. The concurrent CRS-0069 wave filed the same resolver dispatch defect first. CRS-0043/C18 links to KI-308.
status: withdrawn
