id: KI-300
title: Instance parseRule returns null where parse-a-rule must throw SyntaxError
description: 'Parser.parseRule returns the null consumeRule result when the input is a declaration or has no valid selector (src/parser.ts:195-210). css-syntax-3 #parse-rule step 3 returns a syntax error when consume-a-qualified-rule yields nothing, and cssom-1 #parse-a-css-rule surfaces that as a thrown SyntaxError. The static Parser.parseRuleText throws for the same input, so the two public parse-a-rule surfaces disagree.'
