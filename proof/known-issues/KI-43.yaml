id: KI-43
title: parse('@import url(a b)x.css;') fabricates CSSImportRule href:'' mediaText:'not all' instead of dropping the grammar-invalid rule
description: 'css-cascade-5 #at-import (~150-160) defines @import [ <url> | <string> ] ...; url(a b) is a <bad-url-token>, so the prelude cannot match and the rule is invalid as a whole. handleImportRule matches none of its href branches, leaves href="", collapses leftover tokens into an empty media list that MediaList normalizes to "not all", and pushes a fabricated CSSImportRule into cssRules. Controls: valid unquoted imports round-trip byte-exactly ("@import url(x.css);" -> href "x.css"); layered imports survive. Precision note: constructed sheets drop ALL imports by policy and insertRule throws HierarchyRequestError there - neither covers document-style parse(), where this fabrication happens.'
