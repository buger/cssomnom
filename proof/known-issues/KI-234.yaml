id: KI-234
title: CSSTransformValue.parse reifies invalid transform functions instead of throwing
description: parseNumeric returns unitless 0 for every unparseable argument, and parseMatrix maps non-number arguments to 0 (src/typed-om/transform/transform-parser.ts:39-50,161-168). parseSkew and parsePerspective never check argument count (144-159). scale(foo) and matrix(foo,bar,baz,qux,1,2) therefore reify as scale(0) and matrix(0,0,0,0,1,2). skew(1deg,2deg,3deg) and perspective(10px,foo) drop surplus arguments. css-typed-om-1 parse-a-cssstylevalue step 3 throws TypeError when the transform grammar rejects the value.
