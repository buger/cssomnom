id: KI-29
title: fetch-wptfyi gunzipSync lacks maxOutputLength so gzip bombs expand synchronously
description: scripts/wpt/browser/fetch-wptfyi.ts:77-88 decompressBuffer (verified at HEAD 83ce08f) checks gzip magic bytes then calls zlib.gunzipSync(buffer) with NO maxOutputLength, feeding attacker-influenced downloaded baseline bytes (fetchWptFyiRun L194-196) straight into unbounded synchronous inflation; its catch silently returns raw bytes on error, masking failures. A crafted member compressing 5 MiB to ~5 KiB (1022x demonstrated; scan ceiling 32 MiB for demos, no engine cap) allocates the full expansion inside the maintainer/CI process — availability fault via memory exhaustion/OOM on repeat (CWE-409). The remediated shape (gunzipSync maxOutputLength) rejects the same input with ERR_BUFFER_TOO_LARGE, grounded in the reproducer's contrast leg.
affected_requirements:
    - SYS-REQ-260823-JS16
evidence_manifests:
    - proof/evidence/ki-29.yaml
severity: medium
severity_basis: reproducer
risk: availability
cve_surface: none
affected_api: decompressBuffer() in scripts/wpt/browser/fetch-wptfyi.ts (download ingestion path)
attacker_input: gzip members returned by the API-provided results URL (magic-byte gated 0x1F 0x8B; expansion ratio bounded only by engine limits)
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-29-wptfyi-gunzipsync-no-output-cap-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Download baselines only from trusted endpoints; watch RSS when running fetch-upstream (the 512MB heap flag caps Node heap but not buffer growth before OOM-kill).
remediation: 'Pass {maxOutputLength: BUDGET} sized to expected report sizes (e.g. 32 MiB) and drop the silent catch-to-raw-bytes fallback; propagate ERR_BUFFER_TOO_LARGE as a loud failure.'
