        quantitative_impact: measured at HEAD 83ce08f, Node v24.11.1 — 5128 compressed bytes
        expand synchronously to 5242880 UTF-16 code units (10.00 MiB string, 5 MiB buffer;
        1022.4x ratio) in ~11.7ms inside the calling process; expansion scales linearly with
        crafted input size (scan demo ceiling 32 MiB chosen for lab safety; engine imposes no cap
        on the vulnerable path). The silent catch-to-raw-bytes fallback (:83-85) additionally
        masks decompression failures as plain-text output.
        control_test: small gzip member decompresses byte-exactly AND the remediated contrast leg
        zlib.gunzipSync(buffer,{maxOutputLength:BUDGET}) throws ERR_BUFFER_TOO_LARGE in the same
        run — budget enforcement works when actually passed.
        untrusted_attacker: gzip member bytes originate from the API-provided results URL
        (KI-27 chain), i.e. attacker-influenced under API compromise/MITM.
        current_deployment_relevance: fetch-upstream runs on maintainer laptops and CI where OOM
        kills disrupt neighboring jobs; repeat invocations amplify.
        honest_severity: medium availability — bounded-process memory exhaustion/abort, honestly
        not RCE or persistent damage; 5 MiB demo scaled far below weaponized sizes deliberately.
        attacker_profitability: a few-KB response forces hundreds-of-MB allocations per attempt;
        free retries make it an OOM loop against CI runners sharing the machine.
        reproducible: two consecutive reproducer runs exited 1 (live leg asserts output <= 655360-
        byte budget or ERR_BUFFER_TOO_LARGE; full expansion observed both times); evidence capture
        re-ran it (proof/evidence/ki-29.yaml status fail).
