severity: medium
severity_basis: risk
risk: correctness
affected_api: DOMMatrix(string) constructor and DOMMatrix.setMatrixValue transform list parsing
attacker_input: transform strings supplied by callers; local library input, no trust boundary crossed
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0005-transform-string-lenient.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Validate transform strings with a conforming CSS parser before constructing matrices.
remediation: Route every transform string through the CSS transform grammar (the typed-om hook) and keep only the exact empty string and none as identity fast paths.
