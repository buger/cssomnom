id: KI-152
title: DOMMatrix string parser accepts invalid CSS transform syntax without SyntaxError
description: 'parseMatrixString trims before the empty-string identity test, and the native matrix()/matrix3d() paths split arguments on /\s,]+/ and coerce with Number() (src/DOMMatrix.ts:81-124,136). Whitespace-only strings become identity. Space-separated, collapsed and trailing comma lists parse as numbers. ''Infinity'' passes the isNaN gate. The native paths also run before the typed-om hook, so these strings never reach CSSTransformValue.parse. geometry-1 #dommatrix-parse rewrites only the exact empty string and requires a valid CSS transform list. setMatrixValue shares the parser.'
