id: KI-10
title: ':disabled treats first-legend descendants as disabled (html concept-fieldset-disabled)'
description: |
    html #concept-fieldset-disabled: a fieldset is disabled if its disabled attribute is specified, or it is a descendant of another disabled fieldset and is not a descendant of that fieldset's first legend child. html #concept-fe-disabled uses the same first-legend skip for form controls. isElementDisabled walks to the ancestor fieldset then treats that ancestor's own disabled attribute as the element's, so #nested-in-legend and #in-legend both match :disabled. Overlay audit cannot change product code.
affected_requirements:
    - SW-REQ-260821-6D9T
    - SYS-REQ-260821-PJ76
severity: medium
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: matches
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types proof/reproducers/KI-10-fieldset-disabled.ts
reproduction_steps:
    - 'Parse a fieldset[disabled] whose first legend contains an input and a nested fieldset (no own disabled).'
    - 'Call matches(nestedFieldset, ":disabled") and matches(inputInLegend, ":disabled").'
    - 'Observe both true. Intended both false.'
    - 'Controls: the outer fieldset and an input outside the first legend still match :disabled.'
    - 'Optional overlay runner (not in pnpm test:node): node --experimental-strip-types proof/reproducers/KI-10-fieldset-disabled.ts'
introduced_in: inception
defect_class: latent
commands:
    - node --test tests/matcher.test.ts
    - node --experimental-strip-types --test proof/reproducers/KI-10-fieldset-disabled.ts
evidence_manifests:
    - proof/evidence/ki-10.yaml
mitigation: Product fix landed in src/matcher.ts. isDisabledByAncestorFieldset walks each ancestor fieldset independently and skips descendants of that fieldset's first legend; it does not treat the ancestor's own disabled attribute as the element's.
remediation: Closed after class-fix. html#concept-fieldset-disabled / #concept-fe-disabled first-legend skip is implemented. #nested-in-legend, #in-legend, and nested-legend-input are not :disabled. Class-closure DEFECT-260822-FSFK (renamed from invalid Crockford id DEFECT-260822-FSFL).
notes:
    - '2026-08-22: filed after fe7defa restore. Distinct from selector-parse empty-match (6D9T FRETish); attached because matcher is the selectors surface.'
    - '2026-08-22: class-fix landed. Overlay reproducer and tests/matcher.test.ts pass. Distinct from KI-13 listed-control gate.'
