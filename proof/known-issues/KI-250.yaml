id: KI-250
title: toSum fails for the resolution unit x because the compatible-unit list omits it
description: 'isCompatible lists dppx, dpi and dpcm but omits ''x''. css-values-4 #resolution defines x as the dppx unit''s serialization and CSSUnitValue.to converts x like dppx. numericToSum drops every x value into the leftover bucket. CSSUnitValue(1,''x'').toSum(''x'') therefore throws ''Remaining units: dppx'' even for the identity conversion.'
