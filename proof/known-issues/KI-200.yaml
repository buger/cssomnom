severity: medium
severity_basis: risk
risk: correctness
affected_api: src/browser-entry.ts installUnitFactories CSS unit factory functions installed on the CSS namespace
attacker_input: host code calling CSS unit factories with strings, non-numeric strings, or no argument; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0013-unit-factory-double-conversion.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Call the factories with numbers, and check the argument count before calling.
remediation: Convert the argument with Number at the factory boundary, throw TypeError on NaN, and enforce the single required argument. The generated CSSFactories table in src/data/gen/css-factories.ts needs the same conversion.
