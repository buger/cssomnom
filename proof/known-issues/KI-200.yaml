id: KI-200
title: browser-entry CSS unit factories skip WebIDL double conversion and the required-argument check
description: installUnitFactories forwards the raw argument into CSSUnitValue (src/browser-entry.ts:198). css-typed-om-1 numeric factory functions take a WebIDL double, so ToNumber must run at the boundary. CSS.px('10') therefore stores the string '10' and serializes to nanpx. WebIDL double rejects NaN, so CSS.px('foo') must throw TypeError. CSS.px() with no argument constructs a value of undefined instead of throwing the arity TypeError.
