severity: low
severity_basis: risk
risk: availability
cve_surface: none
affected_api: getCascadedStyle ancestor recursion (src/cascade/index.ts)
attacker_input: host-supplied duck-typed element graphs with cyclic parents; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0026-parent-cycle-stack-overflow.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Validate element graphs for cycles before requesting cascaded style.
remediation: Track visited ancestors during the parent walk and stop recursion on revisits.
