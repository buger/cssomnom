id: KI-263
title: Cyclic parentElement drives getCascadedStyle into a stack overflow
description: getCascadedStyle recurses into parentNode and parentElement with no visited set. A duck-typed element whose parentElement is itself recurses until the engine throws RangeError. The crash escapes the public cascade API instead of terminating the ancestor walk.
affected_requirements:
    - SW-REQ-260821-FWNH
evidence_manifests:
