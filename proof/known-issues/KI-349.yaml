id: KI-349
title: Declaration value loop swallows a stray close-curly token and trailing declarations
description: 'consumeDeclarationFromStream breaks its value loop only on EOF or semicolon (src/parser.ts ~L1106-1109). css-syntax-3 #consume-a-declaration step 5 consumes the value with nested=true; #consume-a-list-of-component-values returns at a close-curly when nested. The public parseBlockContents(''color: red } background: blue'') therefore stores ''red } background: blue'' as the color value. The lookahead at ~L1030 already treats the close-curly as a declaration end.'
affected_requirements:
    - SYS-REQ-260821-NHZ8
evidence_manifests:
