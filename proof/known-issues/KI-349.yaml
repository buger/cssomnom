severity: low
severity_basis: risk
risk: correctness
affected_api: Parser.parseBlockContents / consumeDeclarationFromStream value loop
attacker_input: declaration-list input with an unbalanced close-curly token; no attacker required
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0062-decl-value-close-curly.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Stop the declaration value at '}' on block-contents streams, mirroring the lookahead.
remediation: Thread the nested flag into consumeDeclarationFromStream and stop its value loop at '}' like consume-a-list-of-component-values.
