id: KI-167
title: Typed OM parse skips the property-grammar gate on four ungated paths
description: 'css-typed-om-1 parse-a-cssstylevalue step 3 throws TypeError when the value fails the property grammar. _parseAll returns before the matchesSyntax gate on four paths: comma-split LIST_PROPERTIES segments, shouldFallbackToCSSStyleValue, the declaration-count-only shorthand check, and properties lacking a syntax entry. Invalid values reify as raw CSSStyleValue instead of throwing.'
