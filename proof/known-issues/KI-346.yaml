id: KI-346
title: Rule-list constructors alias caller arrays (keyframes, grouping, sheet list)
description: CSSKeyframesRule, CSSGroupingRule subclasses such as CSSMediaRule, and StyleSheetList store the caller-supplied array by reference. insertRule, appendRule and later caller pushes therefore mutate the same array from both sides. The classes ship as public API through src/index.ts, and CSSStyleSheet.createInternal copies with push(...), so the aliasing is an isolation gap.
