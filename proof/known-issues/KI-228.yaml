id: KI-228
title: consumeAttributeSelector accepts matcherless values, bare flags, and non-matcher delims
description: 'consumeAttributeSelector stores any delim as the operator and copies an ident or string as the value without cross-checks (src/SelectorParser.ts:505-533). selectors-4 #attribute-selector requires a value after every <attr-matcher> and allows a modifier only after that value; <attr-matcher> is exactly [ ''~'' | ''|'' | ''^'' | ''$'' | ''*'' ]? ''=''. ''[attr=]'', ''[foo i]'', and ''[attr==x]'' all parse, and the first two then match elements.'
