id: KI-290
title: CSSContainerRule stores a style() query fragment as the container name
description: 'The CSSContainerRule constructor splits an unnamed container query on the first space when the text lacks a parenthesized opener. css-containers-2 #container-rule types the optional name as a custom-ident before the query. A style(...) or scroll-state(...) query therefore lands in containerName as the fragment before the first inner space, here ''style(color:''. The rule reports a name that is not an identifier and splits one function across two attributes.'
