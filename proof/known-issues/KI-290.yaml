attacker_input: 'stylesheet text with a function-token container query such as @container style(color: red); local library input'
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0035-container-style-query-misread-as-name.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Read conditionText instead of containerName for style() and scroll-state() queries.
remediation: Tokenize the prelude and store a name only when a leading custom-ident precedes the query.
