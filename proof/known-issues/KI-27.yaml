    notes: |
        real_infrastructure: REAL exported fetchWptFyiRun driven with customFetch answering the
        wpt.fyi API query; raw_results_url points at a loopback HTTP listener (127.0.0.1,
        ephemeral port, server.close() in finally) standing in for an internal service; no
        external egress (verified at HEAD 83ce08f; sink fetchFn(downloadUrl) at :189).
        quantitative_impact: poisoned run record causes exactly 1 dereference of
        http://127.0.0.1:<port>/latest/meta-data/ — the listener records the hit and its JSON
        response flows back through decompressBuffer->JSON.parse into normalizeWptFyiData, i.e.
        it would be cached as the trusted upstream baseline but for the test's assertions.
        control_test: allowlisted raw_results_url (storage.googleapis.com stand-in served by the
        same stub) ingests totalTests=1 in the same run — download machinery works; the missing
        piece is solely a host allowlist.
        untrusted_attacker: the runs-API response is the boundary; compromised/MITM'd wpt.fyi or
        a hostile mirror authors it.
        current_deployment_relevance: fetch-upstream output feeds parity gating, so poisoning
        propagates into release signals, not just a transient request.
        honest_severity: medium data_integrity — SSRF plus baseline poisoning behind an
        already-positioned network attacker or API compromise; no unauthenticated remote claim.
        attacker_profitability: point raw_results_url at cloud metadata/intranet and have CI
        fetch it on schedule; returned bytes become parity ground truth.
        reproducible: two consecutive reproducer runs exited 1 asserting hits.length === 0;
        evidence capture re-ran it (proof/evidence/ki-27.yaml status fail).
        no_inflation: severity_basis reproducer; cve_surface none; redirect amplification noted
        (undici follows redirects by default) but only single-hop demonstrated.
        operational_path_verified: failing leg executes the production download path end-to-end
        (:178 selection, :189 fetch, :194-197 decode).
        reachability_verified: one stubbed API response away from dereferencing arbitrary URLs;
        no allowlist check exists anywhere in the path.
kill_domain: ssrf_egress
do_not_refile_as: wpt.fyi results download without host allowlist (SSRF/baseline poisoning)
