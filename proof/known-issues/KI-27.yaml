id: KI-27
title: fetchWptFyiRun downloads API-provided results URLs with no host allowlist (SSRF/cache poisoning)
description: 'scripts/wpt/browser/fetch-wptfyi.ts:178-196 (verified at HEAD 83ce08f): downloadUrl = run.raw_results_url || run.results_url is dereferenced verbatim through fetchFn with default redirect following and no scheme/host allowlist between ''bytes returned by the runs API'' and ''URL this process requests''. A compromised or MITM''d wpt.fyi record can coerce maintainer/CI hosts into requesting internal HTTP services (metadata 169.254.169.254, loopback, RFC1918) and cache the returned bytes as the trusted upstream WPT baseline used for parity gating (CWE-918 + baseline poisoning).'
affected_requirements:
    - SYS-REQ-260823-Z8HR
    - STK-REQ-260821-556N
evidence_manifests:
    - proof/evidence/ki-27.yaml
severity: medium
severity_basis: reproducer
risk: data_integrity
cve_surface: none
security_relevance_justification:
    reviewer: loop-gate:reviewer+grizz (batch A2, commits fdba96d/9ef9c86)
    rationale: |
        SSRF-class egress finding in an operator CLI (scripts/wpt/**), not a network service.
        Exploitability requires an operator to run this tooling against attacker-influenced
        wpt.fyi records; the library product surface performs no network I/O. Filed
        cve_surface: none / risk data_integrity after LOOP review accepted severity medium;
        CVSS vector intentionally omitted as not security-relevant per campaign disposition.
affected_api: fetchWptFyiRun() results download (scripts/wpt/browser/fetch-wptfyi.ts; pnpm run wpt:fetch-upstream)
attacker_input: wpt.fyi runs-API response fields raw_results_url/results_url (attacker-influenced under API compromise/MITM), including redirect targets
sanitizer: manual:logic
reproducer_command: node --experimental-strip-types --test proof/reproducers/KI-27-wptfyi-downloadurl-no-allowlist-overlay-260822.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Fetch upstream baselines only from networks where wpt.fyi TLS is trustworthy; spot-check cached reports for unexpected hosts.
remediation: Allowlist {https://wpt.fyi, https://storage.googleapis.com} (scheme+host, pre-redirect) for downloadUrl and disable cross-host redirect following; reject violations loudly instead of fetching.
