id: KI-279
title: insertRule keeps unsupported property names on inserted CSSNestedDeclarations
description: CSSGroupingRule.insertRule filters parsedRule.style.declarations only to decide whether all declarations are invalid. CSS error recovery (CSS 2.1 4.2) ignores declarations with unknown property names, and the cssText setter in the same class enforces that filter. Inserting nested declarations with one valid plus one unsupported name therefore keeps both and re-serializes the unsupported name into the sheet.
