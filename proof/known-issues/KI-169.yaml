id: KI-169
title: Missing-URI @namespace fabricates CSSNamespaceRule and registers the prefix
description: handleNamespaceRule never verifies that extractUri found a string or url. css-namespaces-3 syntax requires [ <string> | <url> ] and says an invalid @namespace rule must be ignored. '@namespace foo;' constructs CSSNamespaceRule('foo','') and adds the prefix to declaredNamespaces, so later selectors resolve against an empty namespace.
affected_requirements:
    - INT-REQ-260821-9SGA
evidence_manifests:
    - proof/evidence/ki-169.yaml
severity: low
severity_basis: risk
risk: correctness
cve_surface: none
affected_api: Parser.handleNamespaceRule (src/parser.ts)
attacker_input: stylesheet text with a prefix-only @namespace prelude; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0003-namespace-missing-uri-fabricates-rule.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Always declare a string or url() URI in @namespace rules.
remediation: Return null from handleNamespaceRule when namespaceURI stays empty, before constructing the rule or mutating declaredNamespaces.
