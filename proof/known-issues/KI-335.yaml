introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Consume custom-typed at-rules through the parser-api surface instead of parseStyleSheet.
remediation: Wrap the typed branch in a CSSAtRule carrying the consumed children as CSSRule objects.
