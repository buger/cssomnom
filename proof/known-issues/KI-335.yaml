id: KI-335
title: Custom at-rule typing leaks raw ASTAtRule objects into CSSStyleSheet.cssRules
description: consumeAtRule returns the raw ASTAtRule cast as a Rule when atRuleTypes types a custom at-rule (src/parser.ts:398-405). parseStyleSheet passes that plain object to CSSStyleSheet.createInternal. cssRules[0] then serializes as '[object Object]' instead of a CSSRule. The documented atRules option on the public Parser constructor produces a broken stylesheet.
