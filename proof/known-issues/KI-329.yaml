id: KI-329
title: Blockful @namespace and @custom-media rules are kept; handlers ignore the block
description: 'AT_RULE_HANDLERS.namespace and .custom-media drop the block parameter (src/parser.ts:76,79). consumeAtRule consumes the block and still calls the handler. The handlers construct the rule and never reject a block. css-namespaces-3 #syntax types @namespace as a semicolon-terminated statement; mediaqueries-5 2.3 #custom-mq does the same for @custom-media. A syntactically invalid rule must be ignored. ''@namespace "u" { }'' and ''@custom-media --q screen { }'' survive instead of dropping. KI-183 pins the @import leg of this mechanism.'
