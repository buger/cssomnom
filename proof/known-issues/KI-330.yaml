id: KI-330
title: Unknown at-rule preservation broken for '-keyframes' and '--' names
description: 'getAtRuleHandler routes every at-name ending in ''-keyframes'' into handleKeyframesRule (src/parser.ts:91-92). ''@not-keyframes foo {}'' constructs a CSSKeyframesRule; a prelude-free ''@not-keyframes {}'' drops. isSupportedAtRule also returns false for every at-name starting with ''--'' (src/parser.ts:108), so ''@--foo {}'' drops. css-syntax-3 #consume-at-rule returns unrecognized at-rules and cssom-1 reports them as type 0. The parser must preserve them as generic at-rules. The mediaall twin of this class is KI-176.'
