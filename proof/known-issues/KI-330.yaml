attacker_input: stylesheet text using non-vendor *-keyframes names or dashed at-names; local library input
sanitizer: manual:logic
reproducer_command: /opt/node24/bin/node --experimental-strip-types --test proof/reproducers/CRS-0050-unknown-atrule-preservation.ts
introduced_in: inception
defect_class: latent
minimization_status: minimized
mitigation: Use exact or vendor-prefixed keyframes names and avoid dashed at-names.
remediation: Match only keyframes plus a single vendor prefix, and drop the '--' rejection so dashed names take the generic at-rule path.
