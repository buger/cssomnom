    callee: cssom
    type: function_call
    signature: 'new CSSStyleRule/CSSMediaRule(..., parseRuleInBlock: (text: string) => Rule) ; CSSStyleSheet.createInternal(rules, parseRule)'
    assumptions: "Grouping-rule insertRule uses the parse callback supplied at construction, not a Parser import from CSSOM."
    guarantees: "parse() constructs CSSOM rule classes. insertRule on a parsed CSSMediaRule uses the parser callback to insert a nested CSSStyleRule."
    producer: cssom
    consumer:
        - parser
