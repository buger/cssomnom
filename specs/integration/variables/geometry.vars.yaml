component: geometry
variables:
    - name: transform_string_parsed
      type: bool
      direction: input
      description: Boolean flag transform string parsed for component geometry.
    - name: typed_om_transform_hook_used
      type: bool
      direction: output
      description: Boolean flag typed om transform hook used for component geometry.
    - name: native_matrix_string
      type: bool
      direction: input
      description: Caller passed a native matrix() or matrix3d() DOMMatrix string. Documented exemption from the typed_om transform hook.
    - name: matrix_index
      type: int
      direction: input
      description: Row or column index in a Geometry DOMMatrix 4-by-4 (drafts.fxtf.org/geometry/#dommatrix; multiplyArrays i,j in 0..3).
      range:
        max: 3
        min: 0
