component: typed_om
variables:
    - name: css_unit_value_returned
      type: bool
      direction: output
      description: Boolean flag css unit value returned for component typed_om.
    - name: invalid_typed_input
      type: bool
      direction: input
      description: Boolean flag invalid typed input for component typed_om.
    - name: parse_throws
      type: bool
      direction: output
      description: Boolean flag parse throws for component typed_om.
    - name: ten_px_parsed
      type: bool
      direction: input
      description: Boolean flag ten px parsed for component typed_om.
    - name: position_property
      type: enum
      direction: input
      description: 'Property whose grammar is <position> or a related origin: object-position, background-position, perspective-origin, or transform-origin.'
    - name: position_reifies
      type: bool
      direction: output
      description: True when CSSStyleValue.parse reifies the value as CSSPositionValue.
    - name: position_arity_class
      type: enum
      direction: input
      description: 'Position grammar class: 1- or 2-value generic <position>, 3-value (background-only or transform-origin z), or 4-value.'
    - name: mixed_unit_product_converted
      type: int
      direction: input
      description: Number of mixed-unit sum factors in a calc() product-of-sums handed to CSSNumericValue.to()/toSum() (reproducer exercises n=16; scan baseline OOM risk beyond n=20).
      range:
        max: 16
        min: 1
    - name: conversion_terms_bounded
      type: int
      direction: output
      description: Intermediate cartesian terms materialized by createSumValue before rejection/return; quantitative obligation — <= 4096 terms at n=12, with live heap growth during conversion <= 8MB (reproducer proxy at n=16).
      range:
        max: 4096
        min: 0
independence:
    declared: true
    reason: SYS typed_om pairs (parse throw vs 10px CSSUnitValue) skip as cross-component; they govern disjoint invalid vs nominal parse outputs.
domain:
    tables:
        - name: position_arity_reification
          source: 'css-values-4 § 8.3 #position; css-backgrounds-3 #background-position; css-transforms-1 #transform-origin-property; css-transforms-2 #perspective-origin-property; css-typed-om-1 § 2 #parse-a-cssstylevalue (this implementation CSSPositionValue reify; dropped from current css-typed-om-1)'
          inputs:
            - name: position_arity_class
              type: enum
              values:
                - one_or_two
                - three
                - four
            - name: position_property
              type: enum
              values:
                - object_position
                - background_position
                - perspective_origin
                - transform_origin
          output:
            name: position_reifies
            type: bool
          rows:
            - position_arity_class: one_or_two
              position_property: object_position
              position_reifies: true
            - position_arity_class: one_or_two
              position_property: background_position
              position_reifies: true
            - position_arity_class: one_or_two
              position_property: perspective_origin
              position_reifies: true
            - position_arity_class: one_or_two
              position_property: transform_origin
              position_reifies: true
            - position_arity_class: three
              position_property: object_position
              position_reifies: false
            - position_arity_class: three
              position_property: background_position
              position_reifies: true
            - position_arity_class: three
              position_property: perspective_origin
              position_reifies: false
            - position_arity_class: three
              position_property: transform_origin
              position_reifies: false
            - position_arity_class: four
              position_property: object_position
              position_reifies: true
            - position_arity_class: four
              position_property: background_position
              position_reifies: true
            - position_arity_class: four
              position_property: perspective_origin
              position_reifies: true
            - position_arity_class: four
              position_property: transform_origin
              position_reifies: false
    mutex:
        - name: invalid_input_vs_position_reify
          members:
            - invalid_typed_input
            - position_reifies
          reason: 'css-typed-om-1 § 2 #parse-a-cssstylevalue: grammar-fail CSSStyleValue.parse throws TypeError and cannot reify as this implementation''s CSSPositionValue'
