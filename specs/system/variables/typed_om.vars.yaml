component: typed_om
variables:
    - name: css_unit_value_returned
      type: bool
      direction: output
      description: Boolean flag css unit value returned for component typed_om.
    - name: invalid_typed_input
      type: bool
      direction: input
      description: Boolean flag invalid typed input for component typed_om.
    - name: parse_throws
      type: bool
      direction: output
      description: Boolean flag parse throws for component typed_om.
    - name: ten_px_parsed
      type: bool
      direction: input
      description: Boolean flag ten px parsed for component typed_om.
    - name: position_arity
      type: int
      direction: input
      description: Count of non-whitespace <position> components (1-4).
      range:
        max: 4
        min: 1
    - name: position_property
      type: enum
      direction: input
      description: 'Property whose grammar is <position> or a related origin: object-position, background-position, perspective-origin, or transform-origin.'
    - name: position_reifies
      type: bool
      direction: output
      description: True when CSSStyleValue.parse reifies the value as CSSPositionValue.
    - name: position_arity_class
      type: enum
      direction: input
      description: 'Position grammar class: 1- or 2-value generic <position>, 3-value (background-only or transform-origin z), or 4-value.'
domain:
    tables:
        - name: position_arity_reification
          source: "css-values-4 § 10.1 #position; css-backgrounds-3 #background-position; css-transforms-1 #transform-origin-property; css-transforms-2 #perspective-origin-property; css-typed-om-1 § 3.3 #positionvalue-objects"
          inputs:
            - name: position_arity_class
              type: enum
              values: [one_or_two, three, four]
            - name: position_property
              type: enum
              values: [object_position, background_position, perspective_origin, transform_origin]
          output:
            name: position_reifies
            type: bool
          rows:
            - {position_arity_class: one_or_two, position_property: object_position, position_reifies: true}
            - {position_arity_class: one_or_two, position_property: background_position, position_reifies: true}
            - {position_arity_class: one_or_two, position_property: perspective_origin, position_reifies: true}
            - {position_arity_class: one_or_two, position_property: transform_origin, position_reifies: true}
            - {position_arity_class: three, position_property: object_position, position_reifies: false}
            - {position_arity_class: three, position_property: background_position, position_reifies: true}
            - {position_arity_class: three, position_property: perspective_origin, position_reifies: false}
            - {position_arity_class: three, position_property: transform_origin, position_reifies: false}
            - {position_arity_class: four, position_property: object_position, position_reifies: true}
            - {position_arity_class: four, position_property: background_position, position_reifies: true}
            - {position_arity_class: four, position_property: perspective_origin, position_reifies: true}
            - {position_arity_class: four, position_property: transform_origin, position_reifies: false}
independence:
    declared: true
    reason: SYS typed_om pairs (parse throw vs 10px CSSUnitValue) skip as cross-component; they govern disjoint invalid vs nominal parse outputs.
