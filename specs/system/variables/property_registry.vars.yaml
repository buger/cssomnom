component: property_registry
variables:
    - name: bad_at_property
      type: bool
      direction: input
      description: Boolean flag bad at property for component property_registry.
    - name: bad_dictionary
      type: bool
      direction: input
      description: Boolean flag bad dictionary for component property_registry.
    - name: duplicate_js_register
      type: bool
      direction: input
      description: True when CSS.registerProperty is invoked for a name already present in the JS [[registeredPropertySet]] (JS-then-JS duplicate). False for a first JS register after @property, because @property does not populate that slot.
    - name: property_rule_dropped
      type: bool
      direction: output
      description: Boolean flag property rule dropped for component property_registry.
    - name: register_throws
      type: bool
      direction: output
      description: Boolean flag register throws for component property_registry.
    - name: urange_hex_digits
      type: int
      direction: input
      description: Hex plus wildcard length of a unicode-range token consumed while parsing at-property prelude remnants (css-syntax-3 § 4.3.14
      range:
        max: 6
        min: 0
    - name: namespace_prelude_count
      type: int
      direction: input
      description: 'Non-whitespace @namespace prelude token count (css-namespaces-3: uri, or prefix plus uri).'
      range:
        max: 2
        min: 1
    - name: keyframe_offset_percent
      type: real
      direction: input
      description: Keyframe selector percentage offset seen on the at-property consume path through parser keyframe handling (css-animations-1 0-100).
      range:
        max: 100
        min: 0
    - name: urange_hex_run_class
      type: enum
      direction: input
      description: Whether a unicode-range hex-plus-wildcard run is at most 6 digits or longer than the css-syntax-3 cap.
    - name: urange_sixth_digit_stops
      type: bool
      direction: output
      description: True when unicode-range consumption stops hex and question-mark digits at 6.
    - name: registered_value_invalid
      type: bool
      direction: input
      description: A registered custom property initial value fails its declared syntax.
    - name: registration_rejected
      type: bool
      direction: output
      description: CSS.registerProperty rejects an initial value that fails its declared syntax.
independence:
    declared: true
    reason: SYS property_registry pairs (register throw vs at-property drop) skip as cross-component INT-backed contracts; no intra-component shared-output pair remains to check.
domain:
    tables:
        - name: urange_hex_cap
          source: 'css-syntax-3 § 4.3.14 #consume-unicode-range-token'
          inputs:
            - name: urange_hex_run_class
              type: enum
              values:
                - at_most_six
                - overflow
          output:
            name: urange_sixth_digit_stops
            type: bool
          rows:
            - urange_hex_run_class: at_most_six
              urange_sixth_digit_stops: false
            - urange_hex_run_class: overflow
              urange_sixth_digit_stops: true
