component: parser
variables:
    - name: css_nested_declarations_emitted
      type: bool
      direction: output
      description: Boolean flag css nested declarations emitted for component parser.
    - name: css_text_supplied
      type: bool
      direction: input
      description: Boolean flag css text supplied for component parser.
    - name: external_sheet_fetched
      type: bool
      direction: output
      description: Boolean flag external sheet fetched for component parser.
    - name: invalid_rule_consumed
      type: bool
      direction: internal
      description: Boolean flag invalid rule consumed for component parser.
    - name: nested_declarations_after_nested_rule
      type: bool
      direction: input
      description: Boolean flag nested declarations after nested rule for component parser.
    - name: ordinary_invalid_css
      type: bool
      direction: input
      description: Boolean flag ordinary invalid css for component parser.
    - name: parse_does_not_throw
      type: bool
      direction: output
      description: Boolean flag parse does not throw for component parser.
    - name: rule_dropped
      type: bool
      direction: output
      description: Boolean flag rule dropped for component parser.
    - name: stylesheet_returned
      type: bool
      direction: output
      description: Boolean flag stylesheet returned for component parser.
    - name: at_rule_kind
      type: enum
      direction: input
      description: 'At-rule name class after ASCII-case fold: media, unknown, or page-margin.'
    - name: at_rule_case
      type: enum
      direction: input
      description: 'At-keyword spelling case: lowercase or mixed-case ASCII.'
    - name: typed_cssom_rule
      type: bool
      direction: output
      description: True when at-rule dispatch constructs a typed CSSOM subclass (CSSMediaRule or CSSMarginRule).
    - name: unknown_at_rule_fallback
      type: bool
      direction: output
      description: True when an unknown at-rule falls back to CSSAtRule instead of a typed subclass.
    - name: keyframe_declaration_forbidden
      type: bool
      direction: input
      description: A keyframe declaration is forbidden by CSS Animations or marked important.
    - name: declaration_dropped
      type: bool
      direction: output
      description: A property-grammar-invalid declaration was dropped while parsing.
    - name: property_value_invalid
      type: bool
      direction: input
      description: A declaration value is invalid under its property grammar.
    - name: deep_math_expression_consumed
      type: int
      direction: input
      description: Nesting depth of parentheses or nested calc() in a math expression consumed through tokenize -> Parser.parseComponentValues -> createCSSStyleValue (reproducer positive control 200; failing legs 4000 paren / 3000 calc).
      range:
        max: 4000
        min: 1
    - name: math_depth_bounded
      type: int
      direction: output
      description: Maximum supported math-expression nesting depth consumable without an engine RangeError — the domain expresses the floor; consumption up to 3000 nested levels must reify or fail closed with a structured parse error, never a raw RangeError.
      range:
        max: 8000
        min: 3000
independence:
    declared: true
    reason: SYS parser pairs (stylesheet return, nesting, no-throw, no-fetch) skip as cross-component INT-backed contracts; no intra-component shared-output pair remains to check.
domain:
    tables:
        - name: at_rule_dispatch
          source: 'css-syntax-3 § 5.5.2 #consume-at-rule; css-values-4 § 4.1 #keywords; cssom-1 CSSMediaRule/CSSMarginRule/CSSAtRule'
          inputs:
            - name: at_rule_kind
              type: enum
              values:
                - media
                - unknown
                - margin
            - name: at_rule_case
              type: enum
              values:
                - lower
                - mixed
          output:
            name: typed_cssom_rule
            type: bool
          rows:
            - at_rule_case: lower
              at_rule_kind: media
              typed_cssom_rule: true
            - at_rule_case: mixed
              at_rule_kind: media
              typed_cssom_rule: true
            - at_rule_case: lower
              at_rule_kind: unknown
              typed_cssom_rule: false
            - at_rule_case: mixed
              at_rule_kind: unknown
              typed_cssom_rule: false
            - at_rule_case: lower
              at_rule_kind: margin
              typed_cssom_rule: true
            - at_rule_case: mixed
              at_rule_kind: margin
              typed_cssom_rule: true
    mutex:
        - name: at_rule_cssom_class
          members:
            - typed_cssom_rule
            - unknown_at_rule_fallback
          reason: One at-rule dispatch constructs at most one of a typed CSSOM subclass and the CSSAtRule fallback.
