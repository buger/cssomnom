component: selectors
variables:
    - name: comment_descendant_shapes
      type: int
      direction: input
      description: 'Count of selector shapes exercising a preserved comment in the descendant-combinator position (reproducer KI-37 probes COMMENT_DESCENDANT_PROBE_COUNT=2 valid shapes: div+comment+x, a+comment+b; permanently invalid shapes such as div.+comment+a are excluded since no parser repair can legitimately make them parse; obligation covers up to 6 shapes).'
      range:
        max: 6
        min: 1
    - name: selector_rules_lost
      type: int
      direction: output
      description: 'Quantitative budget - number of qualified rules dropped entirely by parse() when a comment sits between compound selectors; must be zero per css-syntax-3 #serialization (preserved comments must have no effect on parsing) and selectors-4 #descendant-combinators (reproducer constant RULES_LOST_BUDGET = 0).'
      range:
        max: 0
        min: 0
