component: cssom
variables:
    - name: bad_rule
      type: bool
      direction: input
      description: Boolean flag bad rule for component cssom.
    - name: deviation_applies
      type: bool
      direction: input
      description: Boolean flag deviation applies for component cssom.
    - name: documented_deviation_honored
      type: bool
      direction: output
      description: Boolean flag documented deviation honored for component cssom.
    - name: insert_rule_called
      type: bool
      direction: input
      description: Boolean flag insert rule called for component cssom.
    - name: invalid_value
      type: bool
      direction: input
      description: Boolean flag invalid value for component cssom.
    - name: origin_clean
      type: bool
      direction: input
      description: Boolean flag origin clean for component cssom.
    - name: security_error_thrown
      type: bool
      direction: output
      description: Boolean flag security error thrown for component cssom.
    - name: set_property_called
      type: bool
      direction: input
      description: Boolean flag set property called for component cssom.
    - name: set_property_ignored
      type: bool
      direction: output
      description: Boolean flag set property ignored for component cssom.
    - name: syntax_error_thrown
      type: bool
      direction: output
      description: Boolean flag syntax error thrown for component cssom.
    - name: box_side_count
      type: int
      direction: input
      description: Count of margin/padding/inset/border-radius side values after whitespace filter (css-backgrounds-3 1-to-4 value syntax).
      range:
        max: 4
        min: 1
    - name: box_arity_class
      type: enum
      direction: input
      description: 'Box shorthand arity class: one, two, three, or four values.'
    - name: four_longhands_assigned
      type: bool
      direction: output
      description: True when expandBox assigns all four physical or logical longhands from a 1-to-4 value list.
    - name: position_token_count
      type: int
      direction: input
      description: Count of background-position tokens in a layer (css-backgrounds-3; more than 4 is rejected).
      range:
        max: 4
        min: 0
    - name: keyframe_offset_percent
      type: real
      direction: input
      description: Keyframe selector percentage offset (css-animations-1; from=0% to=100%; values outside 0-100 throw SyntaxError).
      range:
        max: 100
        min: 0
    - name: font_weight_number
      type: int
      direction: input
      description: Numeric font-weight in the font shorthand (css-fonts-4; 1 through 1000).
      range:
        max: 1000
        min: 1
    - name: shorthand_expanded
      type: bool
      direction: output
      description: True when a box, position, or font shorthand expands to longhands.
    - name: shorthand_rejected
      type: bool
      direction: output
      description: True when a box, position, or font shorthand returns null because arity or numeric domain is outside the grammar.
    - name: keyframe_child_attached
      type: bool
      direction: input
      description: Keyframe child is attached to a CSSKeyframesRule.
    - name: parent_links_set
      type: bool
      direction: output
      description: Keyframe child exposes its enclosing rule and stylesheet while attached.
    - name: counter_descriptor_set
      type: bool
      direction: input
      description: A valid CSSCounterStyleRule descriptor was set.
    - name: serialized_descriptor_current
      type: bool
      direction: output
      description: CSSCounterStyleRule.cssText reflects the associated descriptor state.
    - name: append_rule_called
      type: bool
      direction: input
      description: CSSKeyframesRule.appendRule was called.
    - name: trailing_tokens
      type: bool
      direction: input
      description: The appendRule argument contains non-whitespace tokens after the keyframe rule.
    - name: keyframe_not_appended
      type: bool
      direction: output
      description: An appendRule argument with trailing tokens was not appended.
    - name: keyframe_child_removed
      type: bool
      direction: input
      description: Keyframe child is removed from its CSSKeyframesRule.
    - name: parent_links_cleared
      type: bool
      direction: output
      description: Removed keyframe child exposes null parentRule and parentStyleSheet.
    - name: declaration_block_parsed
      type: bool
      direction: input
      description: 'A declaration block entered parse() (reproducer KI-124 probes width:red, color:10px, animation-timing-function:bogus(), margin-left:solid plus green controls).'
    - name: retained_invalid_declarations
      type: int
      direction: output
      description: 'Quantitative budget - count of declarations whose value fails its property grammar yet stays readable through getPropertyValue(); must be zero per cssom-1 #parse-a-css-declaration-block step 3.1.'
      range:
        min: 0
        max: 0
    - name: grammar_valid_parse_attempted
      type: bool
      direction: input
      description: 'CSSStyleValue.parse receives a value its property grammar accepts (reproducer KI-125 spells stable both-edges, styleset(ss01), 10px hanging, --my-palette plus green controls).'
    - name: valid_value_rejections
      type: int
      direction: output
      description: 'Quantitative budget - count of grammar-valid values CSSStyleValue.parse rejects against registry syntax strings; must be zero per css-typed-om-1 #parse-a-cssstylevalue.'
      range:
        min: 0
        max: 0
    - name: unknown_at_rule_parsed
      type: bool
      direction: input
      description: 'An unknown at-rule carrying a block reaches each parse entry point (component-value-stream path and token-stream parse() path; reproducer KI-126).'
    - name: childrules_path_divergences
      type: int
      direction: output
      description: 'Quantitative budget - count of entry points whose CSSAtRule.childRules stays empty although the retained block holds rules; must be zero for consistent population.'
      range:
        min: 0
        max: 0
    - name: unitless_zero_matches_number_leg
      type: bool
      direction: input
      description: 'Typed CSSUnitValue zero with unit number is stored on border-image-outset or border-image-width, whose dual grammar matches the number leg (reproducer KI-130 with non-zero and px controls).'
    - name: zero_to_px_coercions
      type: int
      direction: output
      description: 'Quantitative budget - count of typed zero reads reified with unit px although the matched grammar leg is number; must be zero per css-typed-om-1 #reify-a-numeric-value steps 2 and 3.'
      range:
        min: 0
        max: 0
    - name: declared_style_map_is_iterated
      type: bool
      direction: input
      description: 'Iteration walks a declared StylePropertyMap whose owning rule mixes standard and custom properties (WPT iterable.tentative.html pins keys A width C transition-duration color B).'
    - name: sorted_order_violations
      type: int
      direction: output
      description: 'Quantitative budget - count of iterated key positions deviating from source declaration order; must be zero per css-typed-om-1 #declared-stylepropertymap slot initialization.'
      range:
        min: 0
        max: 0
    - name: url_image_value_read_back
      type: bool
      direction: input
      description: 'StylePropertyMap get() reads a url() image value across background-image, border-image-source, list-style-image, mask-image, and shape-outside rows (reproducer KI-127).'
    - name: non_opaque_image_value_reads
      type: int
      direction: output
      description: 'Quantitative budget - count of url() reads whose constructor identity or toString tag differs from CSSImageValue; must be zero per css-typed-om-1 #imagevalue-objects.'
      range:
        min: 0
        max: 0
    - name: append_targets_pending_substitution_longhand
      type: bool
      direction: input
      description: 'append() targets a longhand entry holding a var() reference inherited from a shorthand declaration (WPT append.tentative.html transition case; own-text longhand control throws today).'
    - name: missing_typeerror_throws
      type: int
      direction: output
      description: 'Quantitative budget - count of appends over pending-substitution entries that store without throwing TypeError; must be zero per css-typed-om-1 #append-to-a-stylepropertymap step 7.'
      range:
        min: 0
        max: 0
independence:
    declared: true
    reason: SYS cssom pairs (insertRule, setProperty, origin-clean, documented deviation) skip as cross-component INT-backed contracts; no intra-component shared-output pair remains to check.
domain:
    tables:
        - name: box_arity_expansion
          source: "css-backgrounds-3 #propdef-margin; css-backgrounds-3 #propdef-border-radius; css-logical-1 #logical-shorthand-keyword"
          inputs:
            - name: box_arity_class
              type: enum
              values: [one, two, three, four]
          output:
            name: four_longhands_assigned
            type: bool
          rows:
            - {box_arity_class: one, four_longhands_assigned: true}
            - {box_arity_class: two, four_longhands_assigned: true}
            - {box_arity_class: three, four_longhands_assigned: true}
            - {box_arity_class: four, four_longhands_assigned: true}
    mutex:
        - name: shorthand_expand_or_reject
          members:
            - shorthand_expanded
            - shorthand_rejected
          reason: expandBox and related shorthand expanders either assign longhands or return null, never both.
