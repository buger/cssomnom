component: cascade
variables:
    - name: cascaded_style_returned
      type: bool
      direction: output
      description: Boolean flag cascaded style returned for component cascade.
    - name: element_and_rules_supplied
      type: bool
      direction: input
      description: Boolean flag element and rules supplied for component cascade.
    - name: get_computed_style_exported
      type: bool
      direction: output
      description: Boolean flag get computed style exported for component cascade.
    - name: layout_performed
      type: bool
      direction: output
      description: Boolean flag layout performed for component cascade.
    - name: hue_degrees
      type: real
      direction: input
      description: HSL hue in degrees after css-color-4 modulo-360 normalization (color-resolver hslToRgb).
      range:
        max: 360
        min: 0
    - name: hue_sector
      type: enum
      direction: input
      description: css-color-4 HSL-to-RGB 60-degree hue sector after normalization.
    - name: red_from_chroma
      type: bool
      direction: output
      description: True when the HSL-to-RGB red channel is set from chroma C (sectors 0-60 and 300-360).
    - name: green_from_chroma
      type: bool
      direction: output
      description: True when the HSL-to-RGB green channel is set from chroma C (sectors 60-180).
    - name: blue_from_chroma
      type: bool
      direction: output
      description: True when the HSL-to-RGB blue channel is set from chroma C (sectors 180-300).
    - name: hsl_component_count
      type: int
      direction: input
      description: Count of hsl()/hsla() components after slash split (css-color-4 hsl() is 3 or 4 components).
      range:
        max: 4
        min: 3
    - name: hsl_parsed
      type: bool
      direction: output
      description: True when hslToRgb accepts a 3- or 4-component hsl()/hsla() argument list.
    - name: nested_var_name
      type: bool
      direction: input
      description: var() first argument contains a nested substitution that yields a custom property name.
    - name: nested_name_substituted
      type: bool
      direction: output
      description: The nested var() name resolves to the referenced custom property value.
    - name: mixed_case_var_or_env
      type: bool
      direction: input
      description: A custom property value contains mixed-case VAR() or ENV() syntax.
    - name: function_dispatch_case_insensitive
      type: bool
      direction: output
      description: Mixed-case VAR() and ENV() dispatch to their defined substitution algorithms.
    - name: syntactically_valid_env
      type: bool
      direction: input
      description: A value contains env() syntax that matches the environment-variable grammar.
    - name: supports_env_true
      type: bool
      direction: output
      description: CSS.supports accepts a syntactically valid env() value.
    - name: invalid_env_index
      type: bool
      direction: input
      description: An env() value contains an index outside the non-negative integer grammar.
    - name: env_invalid_at_computed_value_time
      type: bool
      direction: output
      description: A syntactically invalid env() function produces an invalid computed value.
independence:
    declared: true
    reason: SYS cascade pairs (cascaded style vs getComputedStyle export) skip as cross-component; no intra-component shared-output pair remains to check.
domain:
    tables:
        - name: hsl_hue_to_rgb
          source: 'css-color-4 #hsl-to-rgb; css-color-4 § 7 #the-hsl-notation'
          inputs:
            - name: hue_sector
              type: enum
              values:
                - h0_60
                - h60_120
                - h120_180
                - h180_240
                - h240_300
                - h300_360
          output:
            name: red_from_chroma
            type: bool
          rows:
            - hue_sector: h0_60
              red_from_chroma: true
            - hue_sector: h60_120
              red_from_chroma: false
            - hue_sector: h120_180
              red_from_chroma: false
            - hue_sector: h180_240
              red_from_chroma: false
            - hue_sector: h240_300
              red_from_chroma: false
            - hue_sector: h300_360
              red_from_chroma: true
    mutex:
        - name: hsl_chroma_channel
          members:
            - red_from_chroma
            - green_from_chroma
            - blue_from_chroma
          reason: css-color-4 HSL-to-RGB assigns chroma C to exactly one of R, G, or B in each 60-degree sector.
