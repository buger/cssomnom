fretish: when comment_descendant_shapes >= 1 the selectors shall always satisfy selector_rules_lost <= 0
description: 'A preserved CSS comment sitting in the descendant-combinator position between two compound selectors must be equivalent to whitespace: the qualified rule parses to exactly one rule whose selector preserves the descendant relationship. css-syntax-3 #serialization requires that preserved comments have no effect on the parsing step; selectors-4 #descendant-combinators defines the descendant combinator as whitespace separating two compound selectors.'
