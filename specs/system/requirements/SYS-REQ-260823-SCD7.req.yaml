component: selectors
rationale: 'Known issue KI-37: SelectorParser.skipWhitespace skips only whitespace tokens, so a comment in the implicit-descendant position makes parse() drop the entire qualified rule (cssRules.length === 0) for shapes like div + comment + x.'
