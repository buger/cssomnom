fretish: when condition_operands_serialized >= 1 the media shall always satisfy round_trip_semantic_flips <= 0
description: 'Serializing a valid media condition to CSSMediaRule.conditionText and re-parsing it must preserve the condition''s evaluability: mediaqueries-4 #mq-syntax requires every and/or operand to be a <media-in-parens>, css-conditional-3 #the-cssconditionrule-interface requires conditionText on getting to return the result of serializing the associated condition, and the CSSSupportsRule-specific conditionText definition inherited by conditional-rule subclasses forbids logical simplifications such as removal of unneeded parentheses, so the returned condition will evaluate to the same result as the specified condition.'
