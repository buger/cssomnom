rationale: 'css-fonts-4 #font-prop allows <<system-font-family-name>> only as a lone alternative, and the #font-prop-desc note (~line 1990) says the keywords are treated as keywords only in initial position; a keyword followed by size/family matches neither grammar alternative. Local WPT css/css-fonts/parsing/font-invalid.html test_invalid_value(''font'', ''menu icon'') confirms the mix is invalid. cssom-1 #parse-a-css-declaration-block step 3.1 drops declarations that fail their grammar. Left informal because modeling needs new cssom variables that cannot be declared while specs/system/variables/cssom.vars.yaml is concurrently owned.'
