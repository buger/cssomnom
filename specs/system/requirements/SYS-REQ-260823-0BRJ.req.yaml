description: 'Parsing a declaration block shall drop a font declaration whose value mixes a system font keyword with size or family components (for example ''font: menu 10px serif'' or ''font: menu icon''): the failing declaration is ignored and getPropertyValue(''font'') returns the empty string, matching the ignore-invalid contract already honored by setProperty and insertRule.'
