fretish: ""
description: 'Unknown at-rules that carry a block shall expose their parsed child rules through CSSAtRule.childRules on every parse entry point. css-syntax-3 #consume-an-at-rule retains unknown at-rules with their block contents. The CSSAtRule class declares the childRules field and its serializer branches on it, and the cascade walker reads it, so every entry point must populate it. cssom-1 leaves child access for unrecognized at-rules unregulated; this requirement pins internal API consistency.'
formalization_strategy: informal
informal_verification:
    method: ""
    evidence: ""
    verified: false
parent: STK-REQ-260821-BQKD
component: cssom
rationale: The component-value-stream parser path populates CSSAtRule.childRules while the token-stream path used by parse() constructs CSSAtRule with the block only. Consumers therefore see populated children or none depending on entry point. postcss issue 8 records the expectation that retained at-rule blocks keep their inner rules reachable.
