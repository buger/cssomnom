description: 'Parsing a qualified rule that contains declarations through the CSS Parser API must expose those declarations as CSSParserDeclaration entries in CSSParserQualifiedRule.body (WICG css-parser-api #parser-values defines body members as the rules declaration list; css-syntax-3 #consume-a-qualified-rule consumes the block contents into declarations). Applies to top-level parseRuleSync output and to qualified rules nested inside at-rules.'
