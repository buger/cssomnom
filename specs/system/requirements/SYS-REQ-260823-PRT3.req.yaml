fretish: when at_rule_with_prelude_serialized the parser_api shall always satisfy prelude_roundtrip_corruptions <= 0
description: 'Serializing a Parser API at-rule and re-parsing the serialization must yield an at-rule with the same name and prelude content (css-syntax-3 #serialization round-trip requirement, Overview.bs ~3706-3713; WICG css-parser-api stringifier). The serialized text must keep a separator between the at-keyword and the prelude so @media screen cannot collapse into an at-rule named mediascreen.'
formalization_strategy: fretish
informal_verification:
    method: ""
    evidence: ""
    verified: false
component: parser_api
rationale: 'Known issue KI-41: CSSParserAtRule.toString joins the prelude with empty separator after the at-keyword and tokensToPrelude strips whitespace tokens, so @media screen{a{b:c}} serializes as @mediascreen{a{}}, which re-parses to an at-rule NAMED mediascreen.'
