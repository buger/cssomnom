component: parser
variables:
    - name: consume_qualified_rule_returns_null
      type: bool
      direction: internal
      description: Boolean flag consume qualified rule returns null for component parser.
    - name: consume_stylesheet_completed
      type: bool
      direction: output
      description: Boolean flag consume stylesheet completed for component parser.
    - name: css_import_rule_constructed
      type: bool
      direction: internal
      description: "True when handleImportRule constructs CSSImportRule from an import URL."
    - name: css_nested_declarations_emitted
      type: bool
      direction: output
      description: Boolean flag css nested declarations emitted for component parser.
    - name: css_text_supplied
      type: bool
      direction: input
      description: Boolean flag css text supplied for component parser.
    - name: external_sheet_fetched
      type: bool
      direction: output
      description: Boolean flag external sheet fetched for component parser.
    - name: flush_decls_runs
      type: bool
      direction: internal
      description: "True when consumeBlockContents flushDecls wraps leftover declarations."
    - name: import_url_present
      type: bool
      direction: input
      description: Boolean flag import url present for component parser.
    - name: invalid_rule_consumed
      type: bool
      direction: internal
      description: Boolean flag invalid rule consumed for component parser.
    - name: nested_declarations_after_nested_rule
      type: bool
      direction: input
      description: Boolean flag nested declarations after nested rule for component parser.
    - name: ordinary_invalid_css
      type: bool
      direction: input
      description: Boolean flag ordinary invalid css for component parser.
    - name: parse_does_not_throw
      type: bool
      direction: output
      description: Boolean flag parse does not throw for component parser.
    - name: qualified_rule_dropped
      type: bool
      direction: output
      description: Boolean flag qualified rule dropped for component parser.
    - name: rule_dropped
      type: bool
      direction: output
      description: Boolean flag rule dropped for component parser.
    - name: stylesheet_returned
      type: bool
      direction: output
      description: Boolean flag stylesheet returned for component parser.
    - name: at_rule_kind
      type: enum
      direction: input
      description: 'At-rule name class after ASCII-case fold: media, unknown, or page-margin.'
    - name: at_rule_case
      type: enum
      direction: input
      description: 'At-keyword spelling case: lowercase or mixed-case ASCII.'
    - name: typed_cssom_rule
      type: bool
      direction: output
      description: True when at-rule dispatch constructs a typed CSSOM subclass (CSSMediaRule or CSSMarginRule).
    - name: unknown_at_rule_fallback
      type: bool
      direction: output
      description: True when an unknown at-rule falls back to CSSAtRule instead of a typed subclass.
domain:
    tables:
        - name: at_rule_dispatch
          source: "css-syntax-3 § 5.5.2 #consume-at-rule; css-values-4 § 4.1 #keywords; cssom-1 CSSMediaRule/CSSMarginRule/CSSAtRule"
          inputs:
            - name: at_rule_kind
              type: enum
              values: [media, unknown, margin]
            - name: at_rule_case
              type: enum
              values: [lower, mixed]
          output:
            name: typed_cssom_rule
            type: bool
          rows:
            - {at_rule_kind: media, at_rule_case: lower, typed_cssom_rule: true}
            - {at_rule_kind: media, at_rule_case: mixed, typed_cssom_rule: true}
            - {at_rule_kind: unknown, at_rule_case: lower, typed_cssom_rule: false}
            - {at_rule_kind: unknown, at_rule_case: mixed, typed_cssom_rule: false}
            - {at_rule_kind: margin, at_rule_case: lower, typed_cssom_rule: true}
            - {at_rule_kind: margin, at_rule_case: mixed, typed_cssom_rule: true}
    mutex:
        - name: at_rule_cssom_class
          members:
            - typed_cssom_rule
            - unknown_at_rule_fallback
          reason: One at-rule dispatch constructs at most one of a typed CSSOM subclass and the CSSAtRule fallback.
independence:
    declared: true
    reason: "SW parser pairs (stylesheet consume, nesting, invalid-rule drop, import construct) skip as cross-component INT-backed contracts; no intra-component shared-output pair remains to check."
